 وحذفه", "text": "لفتح الملف اضغط عليه ضغطة مزدوجة، أو اضغط بزر الفأرة الأيمن عليه واختر فتح (Open). ولحذفه اضغط بزر الفأرة الأيمن واختر حذف (Delete).", "page": 23}, {"title": "المجلدات", "text": "المجلد (Folder) هو مساحة تخزينية على القرص الصلب تحفظ وتنظم فيها ملفاتك وبرامجك. لإنشاء مجلد: اضغط بزر الفأرة الأيمن في مساحة فارغة، ثم جديد (New)، ثم مجلد (Folder)، واكتب اسمًا واضغط Enter.", "page": 24}, {"title": "اسم المجلد", "text": "يفضل أن يصف اسم المجلد محتويات ملفاته. ولتغيير الاسم اضغط بزر الفأرة الأيمن على المجلد واختر إعادة التسمية (Rename). لا تستخدم الرموز / \\ : * ؟ \" < > | في اسم المجلد.", "page": 25}, {"title": "المجلدات الرئيسة والفرعية", "text": "يمكن تنظيم الملفات الكثيرة بإنشاء مجلدات فرعية داخل المجلد الرئيس. المجلد الفرعي هو مجلد داخل مجلد آخر، ويعيدك زر الرجوع (Back) إلى المجلد الرئيس.", "page": 25}, {"title": "نقل المجلد أو نسخه", "text": "للنقل: اضغط بزر الفأرة الأيمن على المجلد واختر قص (Cut)، ثم انتقل إلى الموقع الجديد واختر لصق (Paste). وللنسخ اختر نسخ (Copy) بدلًا من قص.", "page": 26}, {"title": "الفرق بين النسخ والنقل", "text": "النسخ ينشئ نسخة جديدة من الملف مع بقاء الأصل في مكانه. أما النقل فينقل الملف من مكان إلى آخر مع حذفه من المكان الأصلي.", "page": 26}, {"title": "استخدام البرامج: الحاسبة", "text": "لتشغيل الحاسبة اضغط زر بدء (Start)، ومرر القائمة إلى أسفل، ثم اضغط الحاسبة (Calculator). ويمكنك كتابة الأرقام بلوحة المفاتيح عندما يكون مفتاح Num Lock مضغوطًا.", "page": 27}, {"title": "البحث عن مساعدة", "text": "يمكنك فتح تطبيق الحصول على التعليمات (Get Help) من قائمة بدء، ثم تصف مشكلتك وتقرأ الحلول المقترحة وتتبع الخطوات بعناية.", "page": 28}], "terms": [{"ar": "سطح المكتب", "en": "Desktop", "def": "الشاشة الرئيسية لنظام التشغيل، فيها شريط المهام وزر بدء والرموز", "page": 20}, {"ar": "الملف", "en": "File", "def": "بيانات مخزنة في الحاسب، ولكل نوع منها أيقونة", "page": 20}, {"ar": "امتداد الملف", "en": "File Extension", "def": "يأتي بعد نقطة في آخر اسم الملف ويدل على نوعه", "page": 21}, {"ar": "المجلد", "en": "Folder", "def": "مساحة تخزينية تنظم فيها ملفاتك وبرامجك", "page": 24}, {"ar": "المجلد الفرعي", "en": "Subfolder", "def": "مجلد داخل مجلد آخر", "page": 25}, {"ar": "قص", "en": "Cut", "def": "أمر لنقل الملف أو المجلد من مكانه", "page": 26}, {"ar": "نسخ", "en": "Copy", "def": "أمر ينشئ نسخة مع بقاء الأصل", "page": 26}, {"ar": "لصق", "en": "Paste", "def": "أمر يضع المنسوخ أو المقصوص في الموقع الجديد", "page": 26}, {"ar": "إعادة التسمية", "en": "Rename", "def": "أمر لتغيير اسم الملف أو المجلد", "page": 25}, {"ar": "الحاسبة", "en": "Calculator", "def": "برنامج لإجراء العمليات الحسابية", "page": 27}], "match": {"title": "طابق الأمر بوظيفته", "page": 26, "pairs": [["قص (Cut)", "نقل المجلد من مكانه"], ["نسخ (Copy)", "إنشاء نسخة مع بقاء الأصل"], ["لصق (Paste)", "وضع المجلد في الموقع الجديد"], ["إعادة التسمية (Rename)", "تغيير اسم المجلد"]]}, "order": {"title": "رتب خطوات إنشاء مجلد جديد", "page": 24, "steps": ["اضغط بزر الفأرة الأيمن في مساحة فارغة", "اختر جديد (New)", "اختر مجلد (Folder)", "اكتب اسم المجلد", "اضغط Enter"]}, "qs": [{"t": "mc", "q": "ماذا نسمي الشاشة الرئيسية لنظام التشغيل؟", "o": ["سطح المكتب", "سلة المحذوفات", "شريط المهام"], "a": 0, "why": "تسمى الشاشة الرئيسية سطح المكتب (Desktop) (ص20).", "lvl": 1}, {"t": "mc", "q": "ما الذي يدل على نوع الملف؟", "o": ["امتداد الملف", "لون الشاشة", "حجم الفأرة"], "a": 0, "why": "لكل ملف امتداد يشير إلى نوعه (ص21).", "lvl": 1}, {"t": "mc", "q": "كيف تُنشئ مجلدًا جديدًا؟", "o": ["ضغط بزر الفأرة الأيمن ثم جديد ثم مجلد", "فتح سلة المحذوفات", "إغلاق الحاسب"], "a": 0, "why": "جديد (New) ثم مجلد (Folder) (ص24).", "lvl": 1}, {"t": "mc", "q": "أي أمر تستخدمه لنقل مجلد إلى مكان آخر؟", "o": ["قص ثم لصق", "حذف ثم إغلاق", "نسخ فقط"], "a": 0, "why": "قص (Cut) ثم لصق (Paste) (ص26).", "lvl": 1}, {"t": "mc", "q": "ما المجلد الفرعي؟", "o": ["مجلد داخل مجلد آخر", "ملف صوتي", "برنامج للرسم"], "a": 0, "why": "المجلد الفرعي هو مجلد داخل مجلد آخر (ص25).", "lvl": 2}, {"t": "tf", "q": "عند نسخ الملف يبقى الأصل في مكانه.", "a": true, "why": "النسخ ينشئ نسخة جديدة مع بقاء الأصل (ص26).", "lvl": 1}, {"t": "tf", "q": "عند نقل الملف يبقى الأصل في مكانه الأول.", "a": false, "why": "النقل يحذف الملف من مكانه الأصلي (ص26).", "lvl": 1}, {"t": "tf", "q": "يمكن استخدام الرمز * في اسم المجلد.", "a": false, "why": "لا تُستخدم الرموز / \\ : * ؟ \" < > | في اسم المجلد (ص25).", "lvl": 2}, {"t": "fill", "q": "الشاشة الرئيسية لنظام التشغيل تسمى سطح ___.", "a": ["المكتب"], "why": "سطح المكتب (ص20).", "lvl": 2}, {"t": "fill", "q": "المجلد داخل مجلد آخر يسمى مجلدًا ___.", "a": ["فرعيا", "فرعيًا", "فرعي"], "why": "المجلد الفرعي (ص25).", "lvl": 2}, {"t": "fill", "q": "لتغيير اسم المجلد نختار أمر إعادة ___.", "a": ["التسمية"], "why": "إعادة التسمية (Rename) (ص25).", "lvl": 2}], "summary": ["سطح المكتب هو الشاشة الرئيسية لنظام التشغيل", "الملف بيانات مخزنة، وامتداده يدل على نوعه", "المجلد ينظم الملفات، وقد يحتوي مجلدات فرعية", "النسخ يُبقي الأصل، والنقل يحذفه من مكانه الأول"], "challenge": {"text": "تحدي الدرس: افتح «مختبر المهارات» ونفّذ مهام المجلدات كلها: إنشاء ونقل ونسخ وإعادة تسمية وحذف.", "q": {"t": "mc", "q": "تريد نسخة من ملف وتبقي الأصل مكانه. ماذا تستخدم؟", "o": ["نسخ ثم لصق", "قص ثم لصق", "حذف"], "a": 0, "why": "النسخ يُبقي الأصل (ص26).", "lvl": 1}}}, "g4-u1-l3": {"id": "g4-u1-l3", "grade": 4, "pages": "33-36", "lab": "settings", "intro": {"question": "هل تحب أن تجعل شاشة حاسبك بشكلك المفضل؟ ما الذي تود تغييره فيها؟", "goals": ["أغير التاريخ والوقت في الحاسب", "أضبط دقة الشاشة", "أغير خلفية سطح المكتب", "أضبط مستوى صوت الحاسب"]}, "cards": [{"title": "التاريخ والوقت", "text": "يظهر التاريخ والوقت في الجانب الأيسر من شريط المهام. لتغييرهما اضغط بزر الفأرة الأيمن عليهما واختر ضبط التاريخ/الوقت (Adjust date/time)، ثم تغيير (Change)، وحدد التاريخ والوقت واضغط تغيير. ولتغيير المنطقة الزمنية اختر الدولة من قسم المنطقة الزمنية (Time Zone).", "page": 33}, {"title": "إعدادات الشاشة", "text": "دقة الشاشة تحدد وضوح النصوص والصور، ووحدتها البكسل. الشاشة الأعلى دقة تُظهر النصوص والصور بوضوح أكبر، والأقل دقة تُظهرها بحجم أكبر ووضوح أقل.", "page": 34}, {"title": "تغيير دقة الشاشة", "text": "اضغط بزر الفأرة الأيمن على مساحة فارغة من سطح المكتب واختر إعدادات العرض (Display settings)، ثم اضغط السهم بجوار الدقة (Resolution) واختر الدقة الجديدة، ثم اضغط الاحتفاظ بالتغييرات (Keep changes) أو إرجاع (Revert).", "page": 34}, {"title": "تغيير مظهر سطح المكتب", "text": "يمكنك تخصيص سطح المكتب بصورة خلفية تعجبك: اضغط بزر الفأرة الأيمن على مساحة فارغة واختر تخصيص (Personalize)، ثم الخلفية (Background)، واختر الصورة التي تعجبك.", "page": 35}, {"title": "أصوات النظام", "text": "ابحث عن أيقونة مكبر الصوت على الجانب الأيمن من شريط المهام. اضغط عليها بزر الفأرة الأيمن واختر فتح خالط مستوى الصوت (Open Volume Mixer) لضبط مستوى الصوت، ويمكنك سحب الشريط لأعلى أو لأسفل.", "page": 35}], "terms": [{"ar": "شريط المهام", "en": "Taskbar", "def": "الشريط الذي يظهر فيه التاريخ والوقت وأيقونة الصوت", "page": 33}, {"ar": "المنطقة الزمنية", "en": "Time Zone", "def": "تحدد الوقت حسب الدولة التي تختارها", "page": 33}, {"ar": "الدقة", "en": "Resolution", "def": "تحدد وضوح النصوص والصور على الشاشة", "page": 34}, {"ar": "البكسل", "en": "Pixel", "def": "وحدة قياس دقة الشاشة", "page": 34}, {"ar": "الخلفية", "en": "Background", "def": "صورة سطح المكتب التي تختارها", "page": 35}, {"ar": "خالط مستوى الصوت", "en": "Volume Mixer", "def": "نافذة تضبط مستوى صوت الحاسب", "page": 35}], "match": {"title": "طابق الإعداد بما يفعله", "page": 34, "pairs": [["الدقة", "تحدد وضوح النصوص والصور"], ["الخلفية", "صورة سطح المكتب"], ["المنطقة الزمنية", "تحدد الوقت حسب الدولة"], ["خالط مستوى الصوت", "يضبط مستوى الصوت"]]}, "order": {"title": "رتب خطوات تغيير دقة الشاشة", "page": 34, "steps": ["اضغط بزر الفأرة الأيمن على مساحة فارغة من سطح المكتب", "اختر إعدادات العرض (Display settings)", "اضغط السهم بجوار الدقة (Resolution)", "اختر الدقة الجديدة", "اضغط الاحتفاظ بالتغييرات (Keep changes)"]}, "qs": [{"t": "mc", "q": "أين يظهر التاريخ والوقت؟", "o": ["في شريط المهام", "في سلة المحذوفات", "داخل الفأرة"], "a": 0, "why": "يظهران في الجانب الأيسر من شريط المهام (ص33).", "lvl": 1}, {"t": "mc", "q": "ما وحدة قياس دقة الشاشة؟", "o": ["البكسل", "المتر", "اللتر"], "a": 0, "why": "تُقاس الدقة بوحدة البكسل (ص34).", "lvl": 1}, {"t": "mc", "q": "أي أمر نختاره لتغيير الخلفية؟", "o": ["تخصيص ثم الخلفية", "إعادة التسمية", "لصق"], "a": 0, "why": "تخصيص (Personalize) ثم الخلفية (Background) (ص35).", "lvl": 1}, {"t": "mc", "q": "كيف نضبط مستوى الصوت؟", "o": ["بسحب شريط خالط مستوى الصوت", "بتغيير اسم الملف", "بحذف الملف"], "a": 0, "why": "نفتح خالط مستوى الصوت ونحرك الشريط (ص35).", "lvl": 1}, {"t": "mc", "q": "أي دقة تُظهر النصوص والصور بوضوح أكبر؟", "o": ["الدقة الأعلى", "الدقة الأقل", "لا فرق"], "a": 0, "why": "الشاشة الأعلى دقة تُظهر المحتوى بوضوح أكبر (ص34).", "lvl": 2}, {"t": "tf", "q": "يمكن تغيير المنطقة الزمنية في إعدادات التاريخ والوقت.", "a": true, "why": "نختار الدولة من قسم المنطقة الزمنية (ص33).", "lvl": 1}, {"t": "tf", "q": "تحدد دقة الشاشة صوت الحاسب.", "a": false, "why": "الدقة تحدد وضوح النصوص والصور وليس الصوت (ص34).", "lvl": 1}, {"t": "tf", "q": "نستطيع أن نضع صورة نختارها خلفية لسطح المكتب.", "a": true, "why": "من تخصيص ثم الخلفية (ص35).", "lvl": 1}, {"t": "fill", "q": "بعد اختيار الدقة الجديدة نضغط الاحتفاظ ___.", "a": ["بالتغييرات"], "why": "الاحتفاظ بالتغييرات (Keep changes) (ص34).", "lvl": 2}, {"t": "fill", "q": "وحدة قياس الدقة هي ___.", "a": ["البكسل", "بكسل"], "why": "البكسل (ص34).", "lvl": 2}], "summary": ["التاريخ والوقت والمنطقة الزمنية تُضبط من شريط المهام", "دقة الشاشة تحدد وضوح النصوص والصور", "الخلفية تُغيَّر من تخصيص", "مستوى الصوت يُضبط من خالط مستوى الصوت"], "challenge": {"text": "تحدي الدرس: افتح «مختبر المهارات» ونفّذ مهام الإعدادات الأربع.", "q": {"t": "mc", "q": "أردت جعل الصور أوضح على الشاشة. ماذا تغير؟", "o": ["الدقة", "اسم الملف", "مستوى الصوت"], "a": 0, "why": "الدقة الأعلى أوضح (ص34).", "lvl": 1}}}, "g4-u2-l1": {"id": "g4-u2-l1", "grade": 4, "pages": "44-51", "lab": "word", "intro": {"question": "تخيل أنك تريد كتابة اسمك في الحاسب. ما الجهاز الذي ستستخدمه؟", "goals": ["أتعرف على مفاتيح لوحة المفاتيح المهمة", "أفتح برنامج مايكروسوفت وورد", "أكتب أرقامًا وكلمات بالعربية والإنجليزية", "أنشئ سطرًا جديدًا وأبدل لغة الكتابة"]}, "cards": [{"title": "لوحة المفاتيح", "text": "لوحة المفاتيح جهاز تكتب به النصوص والأرقام. من مفاتيحها: مفاتيح الكتابة (الحروف والأرقام والرموز)، والمسافة لإضافة فراغ، وEnter لإنشاء سطر جديد، وCaps Lock لكتابة الحروف الإنجليزية الكبيرة، ومفاتيح الأسهم. وتذكر أن تضع يديك على لوحة المفاتيح بشكل صحيح أثناء الكتابة.", "page": 44}, {"title": "فتح برنامج مايكروسوفت وورد", "text": "لكتابة النصوص نستخدم برنامج معالجة النصوص مثل مايكروسوفت وورد (Microsoft Word). اضغط زر بدء (Start)، ومرر القائمة إلى أسفل، ثم اضغط أيقونة Word، ثم اضغط مستند فارغ (Blank document). تظهر في الصفحة إشارة وامضة تسمى المؤشر، وتشير إلى موضع الكتابة.", "page": 45}, {"title": "اكتب أرقامًا", "text": "اضغط بالفأرة على الصفحة البيضاء مرة واحدة لتبدأ الكتابة، ثم اكتب الأرقام التي تريدها باستخدام لوحة المفاتيح، مثل: 54321.", "page": 46}, {"title": "اكتب باللغة العربية", "text": "يمكنك استخدام لوحة المفاتيح لكتابة الحروف والكلمات والجمل والفقرات باللغة العربية: اضغط بالفأرة على الصفحة البيضاء مرة واحدة، ثم اكتب الحروف التي تريدها، مثل: مرحبا.", "page": 47}, {"title": "اضغط مفتاح Enter لإنشاء سطر جديد", "text": "اضغط مفتاح Enter في نهاية الكلمة أو الجملة لتبدأ بعدها بسطر جديد.", "page": 48}, {"title": "اكتب باللغة الإنجليزية", "text": "للتبديل بين لغة الكتابة العربية والإنجليزية اضغط المفتاحين Alt وShift معًا. تذكر أن تبقي الضغط على Alt أثناء الضغط على Shift.", "page": 49}, {"title": "اتجاه النص", "text": "عند الكتابة بالإنجليزية يحتاج النص إلى التغيير ليبدأ من اليسار إلى اليمين: من تبويب الشريط الرئيس (Home) وفي قسم فقرة (Paragraph) اضغط اتجاه النص من اليسار لليمين (Left-To-Right Text Direction)، ثم بدّل اللغة بـ Alt + Shift واكتب، مثل: hello.", "page": 50}], "terms": [{"ar": "لوحة المفاتيح", "en": "Keyboard", "def": "جهاز نكتب به النصوص والأرقام", "page": 44}, {"ar": "مايكروسوفت وورد", "en": "Microsoft Word", "def": "برنامج لمعالجة النصوص", "page": 45}, {"ar": "المؤشر", "en": "Cursor", "def": "إشارة وامضة تدل غط Delete أو Backspace.", "page": 59}, {"title": "كتابة الحروف الكبيرة بالإنجليزية", "text": "بعض الكلمات تحتوي على حروف كبيرة. اضغط Shift باستمرار ثم اضغط الحرف المطلوب. ويمكنك استخدام Caps Lock لكتابة كل الحروف بشكل كبير، وإعادة الضغط عليه للعودة إلى الكتابة العادية.", "page": 60}, {"title": "استخدام مفتاح العالي (Shift)", "text": "عند كتابة الكلمات العربية التي تحتوي على همزة (أ) تحتاج إلى مفتاح العالي: اضغط Shift باستمرار ثم اضغط حرف H لتكتب الهمزة. وتستخدم Shift أيضًا للفاصلة والنقطة.", "page": 61}], "terms": [{"ar": "Backspace", "en": "Backspace", "def": "يحذف الحرف الذي يسبق المؤشر", "page": 53}, {"ar": "Delete", "en": "Delete", "def": "يحذف الحرف الذي يلي المؤشر", "page": 54}, {"ar": "مفاتيح الأسهم", "en": "Arrow Keys", "def": "تحرك المؤشر في كل الاتجاهات", "page": 56}, {"ar": "تحديد النص", "en": "Select Text", "def": "تعليم جزء من النص لتطبيق تغيير عليه", "page": 57}, {"ar": "Shift", "en": "Shift", "def": "مفتاح العالي للحروف الكبيرة والرموز", "page": 60}, {"ar": "Caps Lock", "en": "Caps Lock", "def": "يجعل الحروف الإنجليزية كبيرة باستمرار", "page": 60}], "match": {"title": "طابق المفتاح بوظيفته", "page": 53, "pairs": [["Backspace", "حذف الحرف الذي يسبق المؤشر"], ["Delete", "حذف الحرف الذي يلي المؤشر"], ["مفاتيح الأسهم", "تحريك المؤشر"], ["Shift", "كتابة الحرف الكبير أو الرمز"]]}, "order": {"title": "رتب خطوات تحديد نص بالفأرة", "page": 57, "steps": ["اكتب النص في سطر جديد", "اضغط بالفأرة على المكان الذي يبدأ منه التحديد", "اضغط زر الفأرة الأيسر واسحب فوق النص", "اترك الفأرة بعد تحديد النص"]}, "qs": [{"t": "mc", "q": "أي مفتاح يحذف الحرف الذي يسبق المؤشر؟", "o": ["Backspace", "Delete", "Enter"], "a": 0, "why": "Backspace يحذف الحرف قبل المؤشر (ص53).", "lvl": 1}, {"t": "mc", "q": "أي مفتاح يحذف الحرف الذي يلي المؤشر؟", "o": ["Delete", "Backspace", "Spacebar"], "a": 0, "why": "Delete يحذف الحرف بعد المؤشر (ص54).", "lvl": 1}, {"t": "mc", "q": "كيف أكتب حرفًا إنجليزيًا كبيرًا مرة واحدة؟", "o": ["Shift مع الحرف", "Alt مع الحرف", "Enter"], "a": 0, "why": "نضغط Shift باستمرار ثم الحرف (ص60).", "lvl": 1}, {"t": "mc", "q": "ماذا تفعل مفاتيح الأسهم؟", "o": ["تحرك المؤشر", "تحذف الملفات", "تطبع الصفحة"], "a": 0, "why": "تحرك المؤشر في كل الاتجاهات (ص56).", "lvl": 1}, {"t": "tf", "q": "بعد الحذف بمفتاح Delete يبقى المؤشر في نفس المكان.", "a": true, "why": "كما في نصيحة ذكية (ص54).", "lvl": 1}, {"t": "tf", "q": "نضغط Shift باستمرار مع الأسهم لتحديد النص بلوحة المفاتيح.", "a": true, "why": "ص58.", "lvl": 1}, {"t": "tf", "q": "مفتاح المسافة يحذف الكلمة.", "a": false, "why": "المسافة تضيف فراغًا بين الكلمات (ص55).", "lvl": 1}, {"t": "fill", "q": "يستخدم مفتاح ___ لحذف الحرف الذي يسبق المؤشر.", "a": ["Backspace"], "why": "ص53.", "lvl": 2}, {"t": "fill", "q": "لكتابة همزة (أ) نضغط Shift مع حرف ___.", "a": ["H", "h"], "why": "الهمزة مع H (ص61).", "lvl": 2}], "summary": ["Backspace يحذف قبل المؤشر وDelete يحذف بعده", "الأسهم تحرك المؤشر وShift معها يحدد النص", "المسافة تفصل بين الكلمات", "Shift للحروف الكبيرة والرموز والهمزة"], "challenge": {"text": "تحدي الدرس: اكتب كلمة في برنامج وورد ثم اضغط Backspace لتحذف آخر حرف.", "q": {"t": "mc", "q": "أخطأت في الحرف الذي كتبته للتو. أي مفتاح تضغط؟", "o": ["Backspace", "Enter", "Caps Lock"], "a": 0, "why": "Backspace (ص53).", "lvl": 1}}}, "g4-u2-l3": {"id": "g4-u2-l3", "grade": 4, "pages": "66-72", "lab": "word", "intro": {"question": "كيف تجعل عنوان مقالك مميزًا وجذابًا؟", "goals": ["أجعل النص غامقًا ومائلًا ومسطرًا", "أغير نوع الخط وحجمه ولونه", "أميز النص وأبحث عنه", "أتراجع عن إجراء وأحفظ عملي"]}, "cards": [{"title": "حان وقت التنسيق", "text": "تتيح لك برامج معالجة النصوص مثل مايكروسوفت وورد تحرير النصوص لتصبح أكثر وضوحًا وجاذبية. لجعل النص غامقًا (Bold) أو مائلًا (Italic) أو مسطرًا (Underline): ظلل النص، ثم من تبويب الشريط الرئيسي (Home) ومجموعة الخط (Font) اضغط الأمر المناسب.", "page": 66}, {"title": "تمييز النص", "text": "يمكنك تمييز بعض الأجزاء في نصك لجعلها بارزة: من مجموعة الخط (Font) اضغط السهم بجانب لون تمييز النص (Text Highlight Color)، واختر اللون. للعودة للوضع الطبيعي اضغط إيقاف (Stop Highlighting).", "page": 67}, {"title": "إنشاء العنوان وتغيير نوع الخط", "text": "يجب أن يكون عنوان المقالة مميزًا ومفهومًا. لتغيير نوع الخط: ظلل النص، ثم اضغط السهم بجانب زر الخط (Font) من مجموعة الخط واختر نوع الخط مثل عربي (Adobe Arabic).", "page": 67}, {"title": "تغيير حجم الخط ولونه", "text": "لتغيير حجم الخط ظلل النص ثم اضغط السهم بجانب حجم الخط (Font size) واختر الحجم. ولتغيير اللون اضغط السهم بجانب لون الخط (Font color) واختر اللون.", "page": 68}, {"title": "البحث عن النص", "text": "إذا كان مستندك كبيرًا وأردت العثور على كلمة بسرعة استخدم خيار البحث (Find): من تبويب الشريط الرئيسي ومجموعة تحرير (Editing) اضغط بحث، ثم اكتب الكلمة. ويمكنك استخدام الاختصار Ctrl + F.", "page": 69}, {"title": "التراجع عن إجراء", "text": "إذا أردت التراجع عن تنسيق قمت به اضغط على زر تراجع (Undo) أو اضغط Ctrl + Z. لا يمكن التراجع عن بعض الإجراءات مثل حفظ الملف.", "page": 70}, {"title": "التكبير والتصغير", "text": "لتغيير حجم النص الظاهر على الشاشة استخدم شريط التكبير والتصغير في أسفل النافذة، واسحب شريط التمرير لليسار للتصغير أو لليمين للتكبير.", "page": 70}, {"title": "حفظ عملك", "text": "عندما تنشئ مستندًا يجب عليك حفظه لتتمكن من الرجوع إليه. اضغط ملف (File) ثم حفظ باسم (Save as)، واختر الموقع (مثل المستندات)، واكتب اسم الملف في مربع اسم الملف (File name)، ثم اضغط حفظ (Save).", "page": 70}, {"title": "فتح ملف", "text": "لفتح ملف محفوظ: من تبويب ملف (File) اضغط فتح (Open) أو اضغط Ctrl + O، ثم استعرض (Browse) إلى الموقع، واختر الملف، ثم اضغط فتح.", "page": 71}], "terms": [{"ar": "غامق", "en": "Bold", "def": "تنسيق يجعل النص سميكًا", "page": 66}, {"ar": "مائل", "en": "Italic", "def": "تنسيق يجعل النص مائلًا", "page": 66}, {"ar": "تسطير", "en": "Underline", "def": "خط تحت النص", "page": 66}, {"ar": "الخط", "en": "Font", "def": "نوع الحروف المستخدمة في النص", "page": 67}, {"ar": "تمييز النص", "en": "Highlight", "def": "تلوين خلفية النص", "page": 67}, {"ar": "بحث", "en": "Find", "def": "للعثور على كلمة في المستند", "page": 69}, {"ar": "تراجع", "en": "Undo", "def": "يلغي آخر تنسيق، واختصاره Ctrl + Z", "page": 70}, {"ar": "حفظ باسم", "en": "Save as", "def": "لحفظ المستند باسم وموقع تختارهما", "page": 70}], "match": {"title": "طابق الاختصار بوظيفته", "page": 69, "pairs": [["Ctrl + F", "البحث عن نص"], ["Ctrl + Z", "التراجع عن إجراء"], ["Ctrl + O", "فتح ملف"], ["Bold", "جعل النص غامقًا"]]}, "order": {"title": "رتب خطوات تغيير نوع الخط", "page": 67, "steps": ["ظلل النص الذي تريد تنسيقه", "اضغط السهم بجانب زر الخط (Font)", "اختر نوع الخط من القائمة", "سيتغير نوع الخط"]}, "qs": [{"t": "mc", "q": "ما الأمر الذي يجعل النص سميكًا؟", "o": ["غامق (Bold)", "مائل", "تسطير"], "a": 0, "why": "غامق (Bold) (ص66).", "lvl": 1}, {"t": "mc", "q": "ماذا نفعل قبل تنسيق النص؟", "o": ["نظلل النص", "نغلق البرنامج", "نطبع المستند"], "a": 0, "why": "نظلل النص الذي نريد تنسيقه (ص66).", "lvl": 1}, {"t": "mc", "q": "أي اختصار يتراجع عن إجراء؟", "o": ["Ctrl + Z", "Ctrl + F", "Ctrl + O"], "a": 0, "why": "Ctrl + Z (ص70).", "lvl": 1}, {"t": "mc", "q": "كيف نغير حجم الخط؟", "o": ["السهم بجانب حجم الخط", "زر الفأرة الأيمن على الشاشة", "مفتاح Delete"], "a": 0, "why": "من حجم الخط (Font size) (ص68).", "lvl": 1}, {"t": "mc", "q": "أي أمر نستخدمه لحفظ المستند لأول مرة؟", "o": ["حفظ باسم (Save as)", "بحث", "تراجع"], "a": 0, "why": "ملف ثم حفظ باسم (ص70).", "lvl": 2}, {"t": "tf", "q": "يمكن تغيير لون الخط من مجموعة الخط.", "a": true, "why": "لون الخط (Font color) (ص68).", "lvl": 1}, {"t": "tf", "q": "نستطيع التراجع عن حفظ الملف بزر تراجع.", "a": false, "why": "لا يمكن التراجع عن بعض الإجراءات مثل حفظ الملف (ص70).", "lvl": 1}, {"t": "tf", "q": "Ctrl + F يفتح البحث.", "a": true, "why": "ص69.", "lvl": 1}, {"t": "fill", "q": "لفتح ملف محفوظ نضغط Ctrl + ___.", "a": ["O", "o"], "why": "Ctrl + O (ص71).", "lvl": 2}, {"t": "fill", "q": "للبحث عن كلمة في المستند نستخدم خيار ___.", "a": ["البحث", "بحث", "Find"], "why": "بحث (Find) (ص69).", "lvl": 2}], "summary": ["غامق ومائل ومسطر من مجموعة الخط", "الخط وحجمه ولونه من تبويب الرئيسية", "Ctrl + F للبحث وCtrl + Z للتراجع", "احفظ عملك بحفظ باسم"], "challenge": {"text": "تحدي الدرس: اكتب عنوانًا في برنامج وورد ثم ظلله واجعله غامقًا ومائلًا ومسطرًا.", "q": {"t": "mc", "q": "أردت إبراز كلمة بخلفية صفراء. ماذا تستخدم؟", "o": ["لون تمييز النص", "البحث", "فتح"], "a": 0, "why": "لون تمييز النص (Text Highlight Color) (ص67).", "lvl": 1}}}, "g4-u2-l4": {"id": "g4-u2-l4", "grade": 4, "pages": "74-79", "lab": "word", "intro": {"question": "كيف تنظم رسالة أو مقالة طويلة بحيث تظهر أجمل وأسهل في القراءة؟", "goals": ["أحاذي النص لليمين والوسط واليسار", "أضيف حدودًا وتظليلًا", "أنشئ قائمة نقطية أو مرقمة", "أدرج رموزًا في المستند"]}, "cards": [{"title": "الفقرة", "text": "الفقرة مجموعة من الجمل تشمل فكرة أو معنى رئيسيًا واحدًا. تستخدم الفقرات في كتابة الرسائل والمقالات، ويمكن تنسيقها بالمحاذاة والمسافة البادئة والحدود والتظليل.", "page": 74}, {"title": "محاذاة النص", "text": "من تبويب الشريط الرئيسي (Home) وفي قسم فقرة (Paragraph) اختر محاذاة النص: لليمين (Ctrl + R)، أو توسيط النص (Ctrl + E)، أو لليسار (Ctrl + L)، أو ملء السطر (Ctrl + J).", "page": 74}, {"title": "الحدود والتظليل", "text": "الحدود والتظليل تجعل النصوص تبدو أفضل وأسهل في القراءة. لتظليل نص: ظلل الفقرة، ثم اضغط السهم بجوار زر تعبئة (Fill) واختر اللون.", "page": 75}, {"title": "إضافة حدود", "text": "لإضافة حد: ظلل الكلمة أو الفقرة، ثم اضغط السهم بجانب زر حدود (Border) واختر نوع الحد، مثل: حد سفلي، حد علوي، بلا حدود، حدود خارجية، حد أيسر، حد أيمن.", "page": 76}, {"title": "التعداد النقطي والترقيم", "text": "لإنشاء قائمة تعداد نقطي: من مجموعة فقرة اضغط السهم بجانب أيقونة التعداد النقطي (Bullets)، واختر الرمز، ثم اكتب كلمة أو عبارة واضغط Enter. ولإنهاء القائمة اضغط Enter مرتين أو Backspace. وقائمة الأرقام تُنشأ بنفس الخطوات من الترقيم.", "page": 77}, {"title": "إدراج الرموز", "text": "لإدراج رمز: اضغط على الموضع الذي تريد إدراج الرمز فيه، ثم من تبويب إدراج (Insert) وفي مجموعة رموز اضغط رمز (Symbol)، ثم اختر الرمز الذي تريد استخدامه.", "page": 78}], "terms": [{"ar": "الفقرة", "en": "Paragraph", "def": "مجموعة من الجمل تشمل فكرة رئيسية واحدة", "page": 74}, {"ar": "المحاذاة", "en": "Alignment", "def": "ترتيب النص لليمين أو الوسط أو اليسار", "page": 74}, {"ar": "التظليل", "en": "Shading", "def": "تلوين خلفية النص أو الفقرة", "page": 75}, {"ar": "الحدود", "en": "Border", "def": "خطوط تحيط بالنص أو بجانبه", "page": 76}, {"ar": "التعداد النقطي", "en": "Bullets", "def": "قائمة تبدأ عناصرها برموز نقطية", "page": 77}, {"ar": "الرموز", "en": "Symbols", "def": "علامات خاصة تدرج من تبويب إدراج", "page": 78}], "match": {"title": "طابق الاختصار بالمحاذاة", "page": 74, "pairs": [["Ctrl + R", "محاذاة لليمين"], ["Ctrl + E", "توسيط النص"], ["Ctrl + L", "محاذاة لليسار"], ["Ctrl + J", "ملء السطر"]]}, "order": {"title": "رتب خطوات إنشاء قائمة تعداد نقطي", "page": 77, "steps": ["اضغط السهم بجانب أيقونة التعداد النقطي (Bullets)", "اضغط رمز التعداد الذي تريده", "اكتب كلمة أو عبارة", "اضغط Enter للعنصر التالي"]}, "qs": [{"t": "mc", "q": "أي اختصار يوسّط النص؟", "o": ["Ctrl + E", "Ctrl + R", "Ctrl + L"], "a": 0, "why": "Ctrl + E يوسط النص (ص74).", "lvl": 1}, {"t": "mc", "q": "ما الفقرة؟", "o": ["مجموعة جمل تشمل فكرة رئيسية", "حرف واحد", "اسم ملف"], "a": 0, "why": "ص74.", "lvl": 1}, {"t": "mc", "q": "من أين نضيف رمزًا للمستند؟", "o": ["تبويب إدراج ثم رمز", "تبويب ملف ثم حذف", "سلة المحذوفات"], "a": 0, "why": "إدراج ثم رموز ثم رمز (ص78).", "lvl": 1}, {"t": "mc", "q": "ما أيقونة القائمة التي تبدأ عناصرها بنقاط؟", "o": ["التعداد النقطي (Bullets)", "التظليل", "البحث"], "a": 0, "why": "ص77.", "lvl": 1}, {"t": "tf", "q": "Ctrl + R يحاذي النص لليمين.", "a": true, "why": "ص74.", "lvl": 1}, {"t": "tf", "q": "التظليل يضع خطوطًا حول النص.", "a": false, "why": "التظليل يلون الخلفية، أما الحدود فتحيط بالنص (ص75).", "lvl": 2}, {"t": "tf", "q": "يمكن أن نضيف حدودًا إلى كلمة أو فقرة.", "a": true, "why": "ص75.", "lvl": 1}, {"t": "fill", "q": "لإنهاء القائمة النقطية نضغط Enter ___ أو Backspace.", "a": ["مرتين"], "why": "ص77.", "lvl": 2}, {"t": "fill", "q": "للتوسيط نضغط Ctrl + ___.", "a": ["E", "e"], "why": "ص74.", "lvl": 2}], "summary": ["المحاذاة: يمين، وسط، يسار، ملء السطر", "الحدود والتظليل تجمّلان الفقرة", "Bullets و Numbering تنشئان قوائم", "الرموز من تبويب إدراج"], "challenge": {"text": "تحدي الدرس: أنشئ في برنامج وورد قائمة نقطية وتوسيطًا لعنوان.", "q": {"t": "mc", "q": "تريد قائمة بعناصر نقطية. ماذا تستخدم؟", "o": ["Bullets", "Find", "Undo"], "a": 0, "why": "Bullets (ص77).", "lvl": 1}}}, "g5-u1-l1": {"id": "g5-u1-l1", "grade": 5, "pages": "15-24", "lab": null, "intro": {"question": "ما الأجهزة التي استخدمتها اليوم: حاسب، هاتف، لوح، ألعاب؟ هل كلها حاسبات؟", "goals": ["أعرّف الحاسب", "أميز أنواع أجهزة الحاسب", "أتعرف أدوات الحاسب التفاعلية", "أعرف استخدام كل أداة"]}, "cards": [{"title": "ما الحاسب؟", "text": "الحاسب هو أحد أنواع الأجهزة الإلكترونية الذي يمكنه اتباع تعليمات محددة لاتخاذ القرارات والقيام بالكثير من الأمور المفيدة، وذلك باستقبال البيانات ومعالجتها وتخزينها وإخراجها.", "page": 15}, {"title": "الحاسب المكتبي (Desktop)", "text": "يستخدم في المكتب والمدرسة والمنزل، ويتكون من عدة أجزاء متصلة هي الشاشة ولوحة المفاتيح والفأرة ووحدة النظام ومكبرات الصوت. من ميزاته إمكانية إزالة الأجزاء القديمة واستبدالها بأخرى جديدة. تنبه: تأكد من توفر الإضاءة الكافية في مكان العمل.", "page": 15}, {"title": "الحاسب المحمول (Laptop)", "text": "جهاز تتسم بالكفاءة وتماثل تقريبًا قوة أجهزة الحاسب المكتبية، ويتميز بخفة الوزن وسهولة الحمل والاستخدام. تحتوي على بطارية داخلية، ويمكن أن تتراوح مدة عملها بين 2 و8 ساعات. ويعتبر النوت بوك أحد أنواعها.", "page": 16}, {"title": "الحاسب اللوحي والهواتف الذكية", "text": "الحاسب اللوحي (Tablet) لا يحتوي على لوحة مفاتيح عادة ويتم إدخال البيانات عن طريق اللمس. أما الهواتف الذكية (Smartphones) فهي بمثابة أجهزة حاسب مصغرة تتيح الاتصال وتصفح الإنترنت وإرسال الرسائل والدردشة.", "page": 16}, {"title": "مشغلات ألعاب الفيديو", "text": "مشغلات ألعاب الفيديو (Game Consoles) أجهزة تتيح لك اللعب بألعاب الفيديو بشكل فردي أو جماعي عبر الإنترنت وتصفح المواقع الإلكترونية. انتبه: خذ استراحة قصيرة على فترات منتظمة أثناء جلوسك على الحاسب.", "page": 16}, {"title": "لوحة اللمس وشاشة اللمس", "text": "لوحة اللمس (Touchpad) تُعد بديلًا للفأرة وتحتوي على سطح خاص يمكنه التعرف على موضع أصابعك. شاشة اللمس (Touchscreen) تعمل باللمس حيث تعمل كوحدة إدخال أيضًا، وتوجد في الهواتف الذكية والحاسبات اللوحية. نصيحة: احمِ الشاشة القابلة للمس بالبلاستيك الواقي من الخدوش.", "page": 17}, {"title": "لوح الرسم وكرة التتبع ولوحة الألعاب", "text": "لوح الرسم الرقمي (Graphic tablet) يتيح رسم الصور يدويًا ويفضله المصممون والرسامون. كرة التتبع (Trackball) تشبه فأرة مقلوبة ذات كرة كبيرة وتستخدم لتحريك المؤشر. لوحة الألعاب (Gamepad) تسمى أيضًا جوي باد (Joypad) أو لوحة التحكم (Control pad).", "page": 18}, {"title": "نينتندو وي وأدوات الواقع الافتراضي", "text": "جهاز التحكم عن بعد نينتندو وي (Wii) يتحكم في اللعبة بإدراك اتجاه الحركة. نظارات الواقع الافتراضي (VR headsets) تعطيك انطباعًا بوجودك في عالم مختلف تمامًا. وقفازات الواقع الافتراضي (VR gloves) تنقل حركات اليد إلى البيئة الافتراضية وتوفر استجابة سريعة ودقيقة.", "page": 19}], "terms": [{"ar": "الحاسب", "en": "Computer", "def": "جهاز إلكتروني يستقبل البيانات ويعالجها ويخزنها ويخرجها", "page": 15}, {"ar": "الحاسب المكتبي", "en": "Desktop Computer", "def": "حاسب يتكون من أجزاء متصلة ويمكن استبدال أجزائه", "page": 15}, {"ar": "الحاسب المحمول", "en": "Laptop", "def": "حاسب خفيف الوزن له بطارية داخلية", "page": 16}, {"ar": "الحاسب اللوحي", "en": "Tablet", "def": "حاسب يعمل باللمس غالبًا بلا لوحة مفاتيح", "page": 16}, {"ar": "لوحة اللمس", "en": "Touchpad", "def": "بديل للفأرة في الحاسب المحمول", "page": 17}, {"ar": "شاشة اللمس", "en": "Touchscreen", "def": "شاشة تعمل كوحدة إدخال باللمس", "page": 17}, {"ar": "لوح الرسم الرقمي", "en": "Graphic tablet", "def": "جهاز لرسم الصور يدويًا", "page": 18}, {"ar": "الواقع الافتراضي", "en": "VR", "def": "محاكاة تعطي انطباعًا بوجودك في عالم آخر", "page": 19}], "match": {"title": "طابق الجهاز بوصفه", "page": 18, "pairs": [["كرة التتبع", "تشبه فأرة مقلوبة"], ["لوح الرسم الرقمي", "يفضله المصممون والرسامون"], ["لوحة الألعاب", "تسمى أيضًا جوي باد"], ["لوحة اللمس", "بديل للفأرة في الحاسب المحمول"]]}, "order": {"title": "رتب أجهزة الحاسب كما وردت في الدرس", "page": 15, "steps": ["الحاسب المكتبي", "الحاسب المحمول", "الحاسب اللوحي", "الهواتف الذكية"]}, "qs": [{"t": "mc", "q": "ما الحاسب؟", "o": ["جهاز إلكتروني يستقبل البيانات ويعالجها ويخزنها ويخرجها", "جهاز للطباعة فقط", "برنامج للرسم"], "a": 0, "why": "ص15.", "lvl": 1}, {"t": "mc", "q": "ما الذي يميز الحاسب المكتبي؟", "o": ["إمكانية استبدال أجزائه القديمة", "البطارية الداخلية", "يعمل باللمس فقط"], "a": 0, "why": "ص15.", "lvl": 1}, {"t": "mc", "q": "تتراوح مدة عمل بطارية الحاسب المحمول بين:", "o": ["2 إلى 8 ساعات", "10 إلى 20 ساعة", "دقيقة إلى ساعة"], "a": 0, "why": "ص16.", "lvl": 1}, {"t": "mc", "q": "أي جهاز يحتوي على لوحة اللمس بدل الفأرة؟", "o": ["الحاسب المحمول", "الحاسب المكتبي", "الطابعة"], "a": 0, "why": "ص17.", "lvl": 1}, {"t": "mc", "q": "أي جهاز يسمى أيضًا جوي باد؟", "o": ["لوحة الألعاب", "كرة التتبع", "لوح الرسم"], "a": 0, "why": "ص18.", "lvl": 1}, {"t": "mc", "q": "ما الأداة التي تنقل حركات اليد إلى بيئة افتراضية؟", "o": ["قفازات الواقع الافتراضي", "كرة التتبع", "لوحة اللمس"], "a": 0, "why": "ص19.", "lvl": 2}, {"t": "tf", "q": "الحاسب اللوحي يحتوي عادة على لوحة مفاتيح.", "a": false, "why": "يتم إدخال البيانات باللمس (ص16).", "lvl": 1}, {"t": "tf", "q": "الهواتف الذكية بمثابة أجهزة حاسب مصغرة.", "a": true, "why": "ص16.", "lvl": 1}, {"t": "tf", "q": "كرة التتبع تشبه فأرة مقلوبة.", "a": true, "why": "ص18.", "lvl": 1}, {"t": "tf", "q": "لا يمكن العثور على لوحات اللمس في أجهزة الحاسب المحمولة.", "a": false, "why": "توجد في الحاسبات المحمولة (ص17).", "lvl": 2}, {"t": "fill", "q": "الجهاز الذي يرسم به المصممون يدويًا يسمى لوح الرسم ___.", "a": ["الرقمي", "الرقمى"], "why": "ص18.", "lvl": 2}, {"t": "fill", "q": "شاشة ___ تعمل كوحدة إدخال باللمس.", "a": ["اللمس"], "why": "ص17.", "lvl": 2}], "summary": ["الحاسب يستقبل البيانات ويعالجها ويخزنها ويخرجها", "أنواع الحاسب: مكتبي، محمول، لوحي، هاتف ذكي، مشغل ألعاب", "أدوات تفاعلية: لوحة اللمس، شاشة اللمس، لوح الرسم، كرة التتبع، لوحة الألعاب، وي، الواقع الافتراضي"], "challenge": {"text": "تحدي الدرس: حدد الجهاز المناسب لكل استخدام.", "q": {"t": "mc", "q": "تريد رسم صورة بالقلم الرقمي. أي جهاز تستخدم؟", "o": ["لوح الرسم الرقمي", "كرة التتبع", "مكبرات الصوت"], "a": 0, "why": "ص18.", "lvl": 1}}}, "g5-u1-l2": {"id": "g5-u1-l2", "grade": 5, "pages": "25-38", "lab": null, "intro": {"question": "ما الذي يوجد داخل صندوق الحاسب ويجعله يعمل؟", "goals": ["أتعرف أجزاء وحدة النظام", "أميز أجهزة التخزين الخارجية", "أصنف أجهزة الإدخال والإخراج", "أفرق بين أنواع الطابعات"]}, "cards": [{"title": "اللوحة الأم والمعالج", "text": "اللوحة الأم (Motherboard) بمثابة المركز الرئيس للحاسب الذي تتصل به جميع الأجزاء الأخرى. وحدة المعالجة المركزية (CPU) بمثابة «العقل» للحاسب، وهي التي تنفذ جميع العمليات؛ فكلما زادت سرعتها زادت البيانات التي يمكن معالجتها في وقت أقصر.", "page": 26}, {"title": "الذاكرة والقرص الصلب ومزود الطاقة", "text": "ذاكرة الوصول العشوائي (RAM) تستخدم لتخزين البيانات التي تحتاجها المعالجة لفترة قصيرة جدًا. القرص الصلب (Hard Disc) هو جهاز التخزين الرئيس لتخزين البرامج والملفات. مزود الطاقة (Power Supply) يزود الحاسب بالطاقة. محرك الأقراص المضغوطة والرقمية (CD & DVD Drive) يقرأ الأقراص.", "page": 26}, {"title": "أجهزة التخزين الخارجية", "text": "1) وحدة الذاكرة الفلاشية: صغيرة الحجم منخفضة السعر وتتوفر بسعات مختلفة. 2) الأقراص المضغوطة (CD) والفيديو الرقمية (DVD). 3) القرص الصلب الخارجي: يسع تخزين الكثير. 4) بطاقات الذاكرة مثل SD وMicroSD.", "page": 27}, {"title": "أجهزة الإدخال", "text": "أجهزة الإدخال تساعد المستخدم على إدخال البيانات: لوحة المفاتيح، الفأرة، الميكروفون، الماسح الضوئي (Scanner)، كاميرا الويب (Web camera)، الكاميرا الرقمية، كاميرا الفيديو.", "page": 28}, {"title": "الكاميرات والميكروفون والماسح", "text": "الميكروفون يحول الصوت إلى بيانات رقمية. الماسح الضوئي يمسح وثيقة ورقية ويحولها إلى مستند رقمي. كاميرا الويب تستخدم في مكالمات الفيديو. الكاميرا الرقمية تلتقط صورًا عالية الدقة وتخزنها على بطاقة ذاكرة. كاميرا الفيديو تلتقط الصور المتحركة.", "page": 29}, {"title": "أجهزة الإخراج", "text": "تعرض أجهزة الإخراج نتائج معالجة البيانات: الشاشة (Monitor) وهي جهاز الإخراج الرئيس، مكبرات الصوت (Speakers)، سماعات الرأس (Headphones).", "page": 32}, {"title": "الطابعات", "text": "الطابعة جهاز إخراج لإنشاء نسخة مطبوعة. الطابعة النافذة للحبر (Inkjet) تستخدم أربعة ألوان حبر. طابعة الليزر (Laser) تستخدم أشعة الليزر وتتميز بالسرعة والجودة. الطابعة ثلاثية الأبعاد (3D printer) تقوم بطباعة مجسمات حقيقية.", "page": 33}], "terms": [{"ar": "اللوحة الأم", "en": "Motherboard", "def": "المركز الرئيس الذي تتصل به أجزاء الحاسب", "page": 26}, {"ar": "وحدة المعالجة المركزية", "en": "CPU", "def": "عقل الحاسب ينفذ العمليات", "page": 26}, {"ar": "ذاكرة الوصول العشوائي", "en": "RAM", "def": "تخزن البيانات مؤقتًا لفترة قصيرة جدًا", "page": 26}, {"ar": "القرص الصلب", "en": "Hard Disc", "def": "جهاز التخزين الرئيس", "page": 26}, {"ar": "مزود الطاقة", "en": "Power Supply", "def": "يزود الحاسب بالطاقة", "page": 26}, {"ar": "الماسح الضوئي", "en": "Scanner", "def": "يحول الورق إلى مستند رقمي", "page": 29}, {"ar": "الشاشة", "en": "Monitor", "def": "جهاز الإخراج الرئيس", "page": 32}, {"ar": "الطابعة ثلاثية الأبعاد", "en": "3D printer", "def": "تطبع مجسمات حقيقية", "page": 33}], "match": {"title": "طابق الجزء بوظيفته", "page": 26, "pairs": [["اللوحة الأم", "المركز الرئيس الذي تتصل به الأجزاء"], ["CPU", "عقل الحاسب"], ["RAM", "تخزين مؤقت للبيانات"], ["مزود الطاقة", "يزود الحاسب بالطاقة"]]}, "order": {"title": "رتب أجهزة التخزين الخارجية كما وردت في الدرس", "page": 27, "steps": ["وحدة الذاكرة الفلاشية", "الأقراص المضغوطة وأقراص الفيديو الرقمية", "القرص الصلب الخارجي", "بطاقات الذاكرة"]}, "qs": [{"t": "mc", "q": "أي جزء هو «عقل» الحاسب؟", "o": ["وحدة المعالجة المركزية", "مزود الطاقة", "الشاشة"], "a": 0, "why": "ص26.", "lvl": 1}, {"t": "mc", "q": "أي جزء يخزن البرامج والملفات بصورة رئيسة؟", "o": ["القرص الصلب", "RAM", "الماسح"], "a": 0, "why": "ص26.", "lvl": 1}, {"t": "mc", "q": "أي جهاز إدخال يحول الوثيقة الورقية إلى مستند رقمي؟", "o": ["الماسح الضوئي", "الطابعة", "السماعات"], "a": 0, "why": "ص29.", "lvl": 1}, {"t": "mc", "q": "جهاز الإخراج الرئيس هو:", "o": ["الشاشة", "الفأرة", "الميكروفون"], "a": 0, "why": "ص32.", "lvl": 1}, {"t": "mc", "q": "أي طابعة تطبع مجسمات حقيقية؟", "o": ["ثلاثية الأبعاد", "الليزر", "النافذة للحبر"], "a": 0, "why": "ص33.", "lvl": 1}, {"t": "mc", "q": "أي طابعة تستخدم أربعة ألوان حبر؟", "o": ["النافذة للحبر", "الليزر فقط", "ثلاثية الأبعاد"], "a": 0, "why": "ص33.", "lvl": 2}, {"t": "tf", "q": "ذاكرة RAM تخزن البيانات تخزينًا دائمًا.", "a": false, "why": "تخزنها لفترة قصيرة جدًا (ص26).", "lvl": 1}, {"t": "tf", "q": "كاميرا الويب من أجهزة الإدخال.", "a": true, "why": "ص29.", "lvl": 1}, {"t": "tf", "q": "مكبرات الصوت من أجهزة الإخراج.", "a": true, "why": "ص32.", "lvl": 1}, {"t": "tf", "q": "بطاقات SD أصغر حجمًا من MicroSD.", "a": false, "why": "MicroSD أصغر حجمًا (ص28).", "lvl": 2}, {"t": "fill", "q": "وحدة المعالجة المركزية اختصارها ___.", "a": ["CPU", "cpu"], "why": "ص26.", "lvl": 2}, {"t": "fill", "q": "الطابعة ___ تتميز بالسرعة والجودة العالية في الطباعة.", "a": ["الليزر", "ليزر"], "why": "ص33.", "lvl": 2}], "summary": ["وحدة النظام: اللوحة الأم، CPU، RAM، القرص الصلب، مزود الطاقة، محرك الأقراص", "تخزين خارجي: فلاشية، CD/DVD، قرص صلب خارجي، بطاقات ذاكرة", "إدخال: مفاتيح، فأرة، ميكروفون، ماسح، كاميرات", "إخراج: شاشة، مكبرات، سماعات، طابعات"], "challenge": {"text": "تحدي الدرس: صنف الجهاز إدخال أم إخراج.", "q": {"t": "mc", "q": "أي مما يلي جهاز إخراج؟", "o": ["الطابعة", "الماسح الضوئي", "الميكروفون"], "a": 0, "why": "ص33.", "lvl": 1}}}, "g5-u1-l3": {"id": "g5-u1-l3", "grade": 5, "pages": "39-47", "lab": "files", "intro": {"question": "كيف تصل بسرعة إلى ملف مهم دون البحث عنه كل مرة؟", "goals": ["أتحقق من حجم الملف", "أنشئ اختصارًا", "أضغط الملفات وأفك ضغطها", "أتعامل مع سلة المحذوفات"]}, "cards": [{"title": "حجم الملف", "text": "يشغل الملف جزءًا من مساحة التخزين على الحاسب، وتسمى هذه المساحة «حجم الملف» ويحسب بوحدة البايت. 1 كيلوبايت هو 1024 بايت. للتحقق من حجم الملف: ابحث عن الملف بالإشارة إليه بالفأرة، ثم تحقق من الحجم في مربع النص.", "page": 39}, {"title": "إنشاء اختصار", "text": "الاختصار رابط على سطح المكتب للوصول السريع للملف أو البرنامج أو المجلد، ويبقى الملف الأصلي في مكانه. الخطوات: ابحث عن الملف، اضغط الفأرة الأيمن عليه، اختر إنشاء اختصار (Create shortcut)، ثم انقل الاختصار إلى سطح المكتب بالسحب والإفلات.", "page": 39}, {"title": "إنشاء اختصار مباشرة على سطح المكتب", "text": "اضغط بالفأرة الأيمن على الملف، اختر إرسال إلى (Send to)، ثم سطح المكتب (إنشاء اختصار) (Desktop (create shortcut)). وإذا رغبت في حذف الاختصار: اضغط الفأرة الأيمن عليه ثم اختر حذف (Delete). حذف الاختصار يلغي الرابط فقط دون التأثير على الملف الأصلي.", "page": 40}, {"title": "الملفات والمجلدات المضغوطة", "text": "قد تشغل الملفات والمجلدات مساحة كبيرة على التخزين، ولذلك يمكن ضغطها لتصغير حجمها وتسهيل إرسالها بالبريد الإلكتروني. تسمى المجلدات المضغوطة في وندوز «zipped folders». لضغط ملف: اضغط الفأرة الأيمن عليه، اختر إرسال إلى (Send to)، ثم Compressed (zipped) folder.", "page": 41}, {"title": "إعادة تسمية المجلد المضغوط", "text": "اضغط الفأرة الأيمن عليه، ثم إعادة التسمية (Rename)، واكتب الاسم ثم اضغط Enter. ويمكن إعادة التسمية أيضًا بتحديده والضغط على F2 من لوحة المفاتيح.", "page": 41}, {"title": "فك الضغط", "text": "لاستخراج ملف: افتح المجلد المضغوط ثم اسحب الملف إلى مكان آخر (قص ولصق). ولفك ضغط جميع الملفات: اضغط الفأرة الأيمن على المجلد المضغوط، اختر استخراج الكل (Extract All)، ثم استعراض (Browse) لتحديد الموقع، ثم استخراج (Extract). تتفاوت درجة ضغط الملفات حسب نوعها.", "page": 42}, {"title": "التخزين السحابي", "text": "التخزين السحابي (Cloud Storage) هو حفظ الملفات عبر الإنترنت بدلًا من حفظها على جهازك، فيمكنك فتحها من أي جهاز وفي أي مكان. من خدماته: جوجل درايف (Google Drive) ووان درايف (OneDrive) وآي كلاود (iCloud).", "page": 44}, {"title": "طريقة عرض قائمة الملفات", "text": "لتغيير عرض الملفات: افتح مستكشف الملفات (File Explorer)، ثم المستندات (Documents)، ثم علامة التبويب عرض (View)، ثم اختر العرض مثل أيقونات كبيرة (Large icons). تتنوع العروض: أيقونات كبيرة جدًا، كبيرة، متوسطة، صغيرة، قائمة، تفاصيل، متجاورة، محتوى. ولعرض تفاصيل أكثر استخدم عرض التفاصيل وحدد الأعمدة.", "page": 44}, {"title": "سلة المحذوفات", "text": "عند حذف ملف أو مجلد من حاسبك فإنه لا يتم حذفه نهائيًا بل يتم نقله إلى سلة المحذوفات (Recycle Bin)، التي تتيح لك استعادته عند حذفه عن طريق الخطأ. لاستعادة عنصر: اضغط عليه بالفأرة الأيمن واختر استعادة (Restore). ولحذف جميع العناصر: اضغط الفأرة الأيمن على السلة واختر إفراغ سلة المحذوفات (Empty Recycle Bin) ثم نعم (Yes).", "page": 46}], "terms": [{"ar": "حجم الملف", "en": "File size", "def": "المساحة التي يشغلها الملف ويقاس بالبايت", "page": 39}, {"ar": "الاختصار", "en": "Shortcut", "def": "رابط للوصول السريع إلى ملف أو برنامج", "page": 39}, {"ar": "المجلد المضغوط", "en": "Zipped folder", "def": "مجلد صغير الحجم يسهل إرساله", "page": 41}, {"ar": "استخراج الكل", "en": "Extract All", "def": "أمر لفك ضغط جميع الملفات", "page": 42}, {"ar": "التخزين السحابي", "en": "Cloud Storage", "def": "حفظ الملفات عبر الإنترنت", "page": 44}, {"ar": "مستكشف الملفات", "en": "File Explorer", "def": "أداة لتصفح الملفات والمجلدات", "page": 44}, {"ar": "سلة المحذوفات", "en": "Recycle Bin", "def": "تحفظ العناصر المحذوفة ويمكن استعادتها", "page": 46}], "match": {"title": "طابق المفهوم بتعريفه", "page": 39, "pairs": [["الاختصار", "رابط للوصول السريع"], ["المجلد المضغوط", "يصغر حجم الملفات"], ["التخزين السحابي", "حفظ الملفات عبر الإنترنت"], ["سلة المحذوفات", "تحتفظ بالعناصر المحذوفة"]]}, "order": {"title": "رتب خطوات ضغط ملف", "page": 41, "steps": ["ابحث عن الملف أو المجلد", "اضغط الفأرة الأيمن عليه", "اختر إرسال إلى (Send to)", "اختر Compressed (zipped) folder"]}, "qs": [{"t": "mc", "q": "ما وحدة قياس حجم الملف؟", "o": ["البايت", "الثانية", "الدرجة"], "a": 0, "why": "ص39.", "lvl": 1}, {"t": "mc", "q": "ما الاختصار؟", "o": ["رابط للوصول السريع للملف", "نسخة من الملف تحل محله", "ملف مضغوط"], "a": 0, "why": "ص39.", "lvl": 1}, {"t": "mc", "q": "ماذا يحدث للملف الأصلي عند حذف اختصاره؟", "o": ["لا يتأثر", "يحذف", "يضغط"], "a": 0, "why": "ص40.", "lvl": 1}, {"t": "mc", "q": "لماذا نضغط الملفات؟", "o": ["لتصغير حجمها وتسهيل إرسالها", "لزيادة حجمها", "لحذفها"], "a": 0, "why": "ص41.", "lvl": 1}, {"t": "mc", "q": "أي مفتاح يُستخدم لإعادة التسمية؟", "o": ["F2", "F5", "Esc"], "a": 0, "why": "ص41.", "lvl": 1}, {"t": "mc", "q": "أين تذهب الملفات المحذوفة أولًا؟", "o": ["سلة المحذوفات", "الإنترنت", "الشاشة"], "a": 0, "why": "ص46.", "lvl": 1}, {"t": "tf", "q": "1 كيلوبايت يساوي 1024 بايت.", "a": true, "why": "ص39.", "lvl": 1}, {"t": "tf", "q": "حذف الاختصار يحذف الملف الأصلي.", "a": false, "why": "يلغي الرابط فقط (ص40).", "lvl": 1}, {"t": "tf", "q": "يمكن فتح الملفات المحفوظة في التخزين السحابي من أي جهاز.", "a": true, "why": "ص44.", "lvl": 1}, {"t": "tf", "q": "الملف المحذوف يزول نهائيًا فورًا.", "a": false, "why": "ينقل أولًا إلى سلة المحذوفات (ص46).", "lvl": 1}, {"t": "fill", "q": "أمر استعادة الملف من سلة المحذوفات اسمه ___.", "a": ["استعادة", "Restore"], "why": "ص46.", "lvl": 2}, {"t": "fill", "q": "المجلد المضغوط يسمى بالإنجليزية ___ folder.", "a": ["zipped", "Zipped", "zip"], "why": "ص41.", "lvl": 2}], "summary": ["حجم الملف يقاس بالبايت", "الاختصار رابط للوصول السريع ولا يحذف الأصل", "الضغط يصغر الحجم وفك الضغط يستخرج الملفات", "التخزين السحابي يحفظ الملفات عبر الإنترنت", "سلة المحذوفات تتيح استعادة المحذوف"], "challenge": {"text": "تحدي الدرس: جرّب في مختبر الملفات إنشاء مجلد ونسخه وحذفه.", "q": {"t": "mc", "q": "حذفت ملفًا بالخطأ. ماذا تفعل؟", "o": ["أستعيده من سلة المحذوفات", "أعيد تشغيل الحاسب", "أحذف السلة"], "a": 0, "why": "ص46.", "lvl": 1}}}, "g5-u2-l1": {"id": "g5-u2-l1", "grade": 5, "pages": "62-68", "lab": null, "intro": {"question": "مقال طويل كله نص فقط… هل سيشدّ القارئ؟ كيف تجعله أجمل؟", "goals": ["أدرج صورة من الإنترنت ومن الحاسب", "أعدل الصور وأنسقها", "أتحكم في التفاف النص حول الصورة", "أدرج الأشكال وأضيف نصًا داخلها"]}, "cards": [{"title": "إدراج صورة من الإنترنت", "text": "اضغط على المكان الذي تريد إدراج الصورة فيه، ثم من تبويب إدراج (Insert) ومن مجموعة رسوم توضيحية (Illustrations) اضغط صور عبر الإنترنت (Online Pictures)، واكتب كلمة أو عبارة في مربع البحث واضغط Enter، ثم حدد إحدى الصور واضغط إدراج (Insert).", "page": 62}, {"title": "حقوق الصور", "text": "صور الإنترنت محمية بحقوق الطبع والنشر. لذلك يجب أن تتأكد من مصادرها وتلتزم بشروط الترخيص (EULA) عند استخدامها.", "page": 62}, {"title": "إدراج صورة من جهاز الحاسب", "text": "حدد الموضع، ثم من تبويب إدراج ومجموعة رسوم توضيحية اضغط صور (Pictures)، فتظهر نافذة إدراج صورة (Insert Picture)، حدد الصورة التي تريدها واضغط إدراج (Insert).", "page": 63}, {"title": "تعديل الصور", "text": "لتنسيق صورة: اضغط على الصورة، ثم اضغط علامة التبويب تنسيق الصورة (Picture Format)، واستخدم الأزرار الموجودة في مجموعة ضبط (Adjust) لتعديل الصورة المحددة.", "page": 63}, {"title": "أدوات تنسيق الصورة", "text": "من مجموعة ضبط: إضافة تأثيرات فنية مختلفة على الصورة. من مجموعة الحجم: اقتصاص جزء محدد من الصورة. من مجموعة أنماط الصور: إضافة حدود أو تغيير شكل الصورة. من مجموعة ترتيب: تحديد الموضع الصحيح وضبط التفاف النص.", "page": 64}, {"title": "التفاف النص (Wrap Text)", "text": "يتحكم التفاف النص في كيفية ظهور النص حول الصورة: سطري مع النص (In Line with Text)، مربع (Square) نص حول الصورة، محكم (Tight)، أعلى وأسفل (Top and Bottom)، خلف النص (Behind Text)، أمام النص (In Front of Text).", "page": 64}, {"title": "إدراج الأشكال", "text": "من تبويب إدراج، مجموعة رسوم توضيحية، اضغط أشكال (Shapes) ثم اختر الشكل. اسحب الشكل في مساحة فارغة لتغيير حجمه وموضعه. لإضافة نص: اضغط الفأرة الأيمن على الشكل واختر إضافة نص (Add Text).", "page": 65}], "terms": [{"ar": "صور عبر الإنترنت", "en": "Online Pictures", "def": "إدراج صورة بالبحث في الإنترنت", "page": 62}, {"ar": "صور", "en": "Pictures", "def": "إدراج صورة من جهاز الحاسب", "page": 63}, {"ar": "تنسيق الصورة", "en": "Picture Format", "def": "تبويب يظهر عند تحديد الصورة", "page": 63}, {"ar": "التفاف النص", "en": "Wrap Text", "def": "تحكم في ظهور النص حول الصورة", "page": 64}, {"ar": "أشكال", "en": "Shapes", "def": "مجموعة أشكال جاهزة يدرجها المستخدم", "page": 65}, {"ar": "ترخيص EULA", "en": "EULA", "def": "اتفاقية ترخيص تحدد شروط استخدام الصور", "page": 62}], "match": {"title": "طابق الخيار بوصفه", "page": 64, "pairs": [["سطري مع النص", "الصورة داخل النص كأنها رمز"], ["مربع", "يضع النص حول الصورة"], ["خلف النص", "الصورة خلف النص"], ["أمام النص", "الصورة أمام النص"]]}, "order": {"title": "رتب خطوات إدراج صورة من جهاز الحاسب", "page": 63, "steps": ["حدد الموضع الذي تريد إدراج الصورة فيه", "من تبويب إدراج اضغط صور (Pictures)", "حدد الصورة من نافذة إدراج صورة", "اضغط إدراج (Insert)"]}, "qs": [{"t": "mc", "q": "من أي تبويب ندرج الصور؟", "o": ["إدراج (Insert)", "عرض", "مراجعة"], "a": 0, "why": "ص62.", "lvl": 1}, {"t": "mc", "q": "ماذا نستخدم لإدراج صورة من الإنترنت؟", "o": ["صور عبر الإنترنت", "أشكال", "حفظ"], "a": 0, "why": "ص62.", "lvl": 1}, {"t": "mc", "q": "أي تبويب يظهر لتعديل الصورة؟", "o": ["تنسيق الصورة", "ملف", "تصميم"], "a": 0, "why": "ص63.", "lvl": 1}, {"t": "mc", "q": "ما وظيفة التفاف النص؟", "o": ["التحكم في ظهور النص حول الصورة", "حذف الصورة", "طباعة الصورة"], "a": 0, "why": "ص64.", "lvl": 1}, {"t": "mc", "q": "أي خيار يضع الصورة خلف النص؟", "o": ["خلف النص", "مربع", "محكم"], "a": 0, "why": "ص64.", "lvl": 1}, {"t": "mc", "q": "كيف نضيف نصًا داخل شكل؟", "o": ["الفأرة الأيمن ثم إضافة نص", "حذف الشكل", "الضغط على Esc"], "a": 0, "why": "ص65.", "lvl": 2}, {"t": "tf", "q": "صور الإنترنت محمية بحقوق الطبع والنشر.", "a": true, "why": "ص62.", "lvl": 1}, {"t": "tf", "q": "نستطيع اقتصاص جزء من الصورة.", "a": true, "why": "من مجموعة الحجم (ص64).", "lvl": 1}, {"t": "tf", "q": "لا يمكن تغيير موضع الصورة بعد إدراجها.", "a": false, "why": "من مجموعة ترتيب (ص64).", "lvl": 1}, {"t": "fill", "q": "الإنجليزية لخيار «مربع» في التفاف النص هي ___.", "a": ["Square", "square"], "why": "ص64.", "lvl": 2}, {"t": "fill", "q": "نضغط زر ___ لإدراج الأشكال.", "a": ["أشكال", "Shapes", "shapes"], "why": "ص65.", "lvl": 2}], "summary": ["الصور تدرج من الإنترنت أو من الحاسب", "تنسيق الصورة: ضبط، حجم، أنماط، ترتيب", "التفاف النص يحدد علاقة الصورة بالنص", "الأشكال يمكن أن تحتوي نصًا"], "challenge": {"text": "تحدي الدرس: اختر خيار التفاف مناسبًا لصورة داخل مقال.", "q": {"t": "mc", "q": "تريد أن يحيط النص بالصورة من الجهات. ماذا تختار؟", "o": ["مربع (Square)", "خلف النص", "سطري مع النص"], "a": 0, "why": "ص64.", "lvl": 1}}}, "g5-u2-l2": {"id": "g5-u2-l2", "grade": 5, "pages": "69-80", "lab": "word", "intro": {"question": "كيف تجعل نصك منظمًا ومريحًا للقراءة؟", "goals": ["أحذف النص المحدد", "أكتب الحروف الكبيرة", "أضبط تباعد الأسطر والأحرف والمسافة البادئة", "أظهر الأحرف غير القابلة للطباعة"]}, "cards": [{"title": "حذف النص المحدد", "text": "يمكنك حذف كلمة أو جملة بتحديدها ثم الضغط على Delete أو Backspace. مفتاح Backspace يحذف الحرف الذي قبل المؤشر، بينما Delete يحذف الحرف الموجود بعد المؤشر.", "page": 69}, {"title": "كتابة الحروف الكبيرة بالإنجليزية", "text": "اضغط Alt + Shift لتغيير اللغة إلى الإنجليزية، ثم Caps Lock لكتابة الأحرف الكبيرة، ويضيء مؤشر LED. اضغط Caps Lock مرة أخرى للعودة إلى الأحرف الصغيرة. مثال: I love Saudi Arabia.", "page": 70}, {"title": "تباعد الأسطر", "text": "لتغيير المسافة بين الأسطر: اضغط بالمؤشر على الفقرة، ثم من مجموعة فقرة (Paragraph) اضغط زر تباعد الأسطر والفقرات (Line Spacing) واختر التباعد من القائمة.", "page": 71}, {"title": "تباعد الأحرف", "text": "تباعد الأحرف هو المسافة بين أحرف الكلمة، ويستخدم لتسهيل القراءة. حدد النص، ثم من الشريط الرئيس مجموعة الخط (Font) اضغط زر التوسيع، ثم من علامة التبويب خيارات متقدمة (Advanced) اختر تباعد (Spacing): موسع (Expanded) أو مكثف (Condensed)، واضبط القيمة في مربع بمقدار (By).", "page": 72}, {"title": "المسافة البادئة للفقرة", "text": "المسافة البادئة تحدد مسافة الفقرة من الجانب الأيمن أو الأيسر. ضع المؤشر في الفقرة، ثم من علامة تبويب الشريط الرئيسي ومجموعة فقرة اضغط زيادة المسافة البادئة (Increase Indent).", "page": 73}, {"title": "نصائح لتنسيق الفقرات", "text": "عند إنشاء فقرة جديدة استمر في الكتابة حتى نهاية الفقرة ولا تضغط Enter بعد كل سطر؛ فالبرنامج ينقل المؤشر تلقائيًا إلى السطر التالي. اضغط Enter عند نهاية الفقرة فقط. وللانتقال إلى سطر جديد دون فقرة جديدة اضغط Shift + Enter.", "page": 74}, {"title": "إظهار وإخفاء الأحرف غير القابلة للطباعة", "text": "من علامة التبويب الرئيسي، مجموعة فقرة (Paragraph)، اضغط إظهار / إخفاء (Show/Hide). تظهر رموز مثل ¶ لنهاية الفقرة، وسهم للـ Tab، ونقطة للمسافة. لا تُطبع هذه الرموز.", "page": 75}], "terms": [{"ar": "تباعد الأسطر", "en": "Line Spacing", "def": "المسافة بين الأسطر داخل الفقرة", "page": 71}, {"ar": "تباعد الأحرف", "en": "Character Spacing", "def": "المسافة بين أحرف الكلمة", "page": 72}, {"ar": "المسافة البادئة", "en": "Indent", "def": "مسافة الفقرة من الجانب", "page": 73}, {"ar": "Caps Lock", "en": "Caps Lock", "def": "يكتب الأحرف الإنجليزية الكبيرة", "page": 70}, {"ar": "إظهار / إخفاء", "en": "Show/Hide", "def": "يعرض الأحرف غير القابلة للطباعة", "page": 75}, {"ar": "¶", "en": "Paragraph mark", "def": "رمز نهاية الفقرة", "page": 75}], "match": {"title": "طابق الرمز بمعناه", "page": 75, "pairs": [["¶", "نهاية الفقرة"], ["نقطة", "مسافة (Space bar)"], ["سهم →", "تبويب (Tab)"], ["سهم ↵", "فاصل أسطر (Shift + Enter)"]]}, "order": {"title": "رتب خطوات تغيير تباعد الأسطر", "page": 71, "steps": ["اضغط بالمؤشر على الفقرة", "من مجموعة فقرة اضغط تباعد الأسطر", "اختر التباعد المناسب من القائمة"]}, "qs": [{"t": "mc", "q": "أي مفتاح يحذف الحرف قبل المؤشر؟", "o": ["Backspace", "Delete", "Tab"], "a": 0, "why": "ص69.", "lvl": 1}, {"t": "mc", "q": "لكتابة أحرف إنجليزية كبيرة باستمرار نضغط:", "o": ["Caps Lock", "Alt", "Ctrl"], "a": 0, "why": "ص70.", "lvl": 1}, {"t": "mc", "q": "ما معنى تباعد الأحرف؟", "o": ["المسافة بين أحرف الكلمة", "المسافة بين الصفحات", "حجم الخط"], "a": 0, "why": "ص72.", "lvl": 1}, {"t": "mc", "q": "متى نضغط Enter عند الكتابة؟", "o": ["في نهاية الفقرة", "بعد كل سطر", "بعد كل كلمة"], "a": 0, "why": "ص74.", "lvl": 1}, {"t": "mc", "q": "أي رمز يدل على نهاية الفقرة؟", "o": ["¶", "→", "•"], "a": 0, "why": "ص75.", "lvl": 1}, {"t": "mc", "q": "أي زر يعرض الأحرف غير القابلة للطباعة؟", "o": ["إظهار / إخفاء", "تراجع", "بحث"], "a": 0, "why": "ص75.", "lvl": 2}, {"t": "tf", "q": "الأحرف غير القابلة للطباعة تُطبع على الورق.", "a": false, "why": "لا تُطبع (ص75).", "lvl": 1}, {"t": "tf", "q": "Shift + Enter ينشئ سطرًا جديدًا دون فقرة جديدة.", "a": true, "why": "ص74.", "lvl": 1}, {"t": "tf", "q": "نضغط Enter بعد كل سطر داخل الفقرة.", "a": false, "why": "ص74.", "lvl": 1}, {"t": "fill", "q": "مفتاح ___ يحذف الحرف الذي بعد المؤشر.", "a": ["Delete", "delete"], "why": "ص69.", "lvl": 2}, {"t": "fill", "q": "لتغيير المسافة بين الأسطر نستخدم زر تباعد ___.", "a": ["الأسطر"], "why": "ص71.", "lvl": 2}], "summary": ["Delete وBackspace يحذفان النص المحدد", "Caps Lock للأحرف الكبيرة", "تباعد الأسطر والأحرف والمسافة البادئة تنظم الفقرة", "Show/Hide يعرض ¶ والمسافات والتبويب"], "challenge": {"text": "تحدي الدرس: حدد الإجراء الصحيح لإنشاء فقرة جديدة.", "q": {"t": "mc", "q": "انتهت الفقرة. ماذا تضغط؟", "o": ["Enter", "Space bar عدة مرات", "Caps Lock"], "a": 0, "why": "ص74.", "lvl": 1}}}, "g5-u2-l3": {"id": "g5-u2-l3", "grade": 5, "pages": "81-89", "lab": null, "intro": {"question": "كيف تعرض الخطوات أو الأفكار في مستند بشكل منظم وجذاب؟", "goals": ["أدرج رسمًا توضيحيًا SmartArt", "أنسق لونه وشكله", "أميز أنواع SmartArt واستخداماتها"]}, "cards": [{"title": "إدراج الرسوم التوضيحية", "text": "في ورد يمكنك إضافة الأشكال والرسوم التوضيحية SmartArt لعرض المعلومات بشكل أوضح. للإدراج: اضغط المكان، ثم من تبويب إدراج (Insert) في مجموعة رسوم توضيحية اضغط SmartArt، ثم من الجزء الأيسر اختر الكل (All)، ثم قائمة الصندوق العمودية (Vertical Box List)، ثم موافق (OK)، ثم اكتب النص في الصناديق.", "page": 81}, {"title": "تنسيق الرسوم التوضيحية", "text": "حدد SmartArt المُدرج، ثم من علامة تبويب تصميم (Design) اضغط على تغيير الألوان (Change Colors) واختر اللون الذي تريده، فيتغير لون القائمة. ويمكنك أيضًا استخدام SmartArt Styles لتغيير الشكل.", "page": 83}, {"title": "أنواع SmartArt: القائمة والعملية", "text": "القائمة (List) تظهر الخطوات أو العناصر غير المتسلسلة (مثال: النقاط الرئيسة). المعالجة/العملية (Process) تعرض خطوات عملية أو جدولًا زمنيًا يسير بعمل معين (مثال: خطوات إنتاج منتج).", "page": 84}, {"title": "أنواع SmartArt: الدائري والهيكلي", "text": "الدائري (Cycle) يمثل تسلسلًا متواصلًا لعدة مراحل أو أحداث تتكرر (مثال: دورة الماء). الهيكلي (Hierarchy) يعرض معلومات متسلسلة بشكل هرمي أو تقرير نظام تنظيمي (مثال: شجرة عائلية).", "page": 84}, {"title": "أنواع SmartArt: العلاقة والمصفوفة والهرمي", "text": "العلاقة (Relationship) للمقارنة بين فكرتين أو عرض العلاقة بينهما. المصفوفة (Matrix) لإظهار العلاقة بين الجزء والكل. الهرمي (Pyramid) لإظهار العلاقات النسبية أو المتداخلة أو الهرمية (مثال: هرم غذائي).", "page": 84}, {"title": "مثال تطبيقي: موازنة (Balance)", "text": "شكل SmartArt من نوع علاقة والمسمى موازنة (Balance) يقارن التأثيرات الإيجابية والسلبية للتقنية. الخطوات: Insert ثم SmartArt ثم علاقة (Relationship) ثم موازنة (Balance) ثم موافق، ثم اكتب النص في مربع (Type your text here).", "page": 85}], "terms": [{"ar": "SmartArt", "en": "SmartArt", "def": "رسوم توضيحية جاهزة لعرض المعلومات", "page": 81}, {"ar": "قائمة", "en": "List", "def": "لعرض خطوات أو عناصر غير متسلسلة", "page": 84}, {"ar": "معالجة", "en": "Process", "def": "لعرض خطوات عملية", "page": 84}, {"ar": "دائري", "en": "Cycle", "def": "لتسلسل متواصل متكرر", "page": 84}, {"ar": "هيكلي", "en": "Hierarchy", "def": "لعرض معلومات بشكل هرمي", "page": 84}, {"ar": "علاقة", "en": "Relationship", "def": "للمقارنة بين فكرتين", "page": 84}, {"ar": "مصفوفة", "en": "Matrix", "def": "لعلاقة الجزء بالكل", "page": 84}, {"ar": "هرمي", "en": "Pyramid", "def": "لعلاقات نسبية أو متداخلة", "page": 84}], "match": {"title": "طابق النوع بمثاله", "page": 84, "pairs": [["دائري", "دورة الماء"], ["هيكلي", "شجرة العائلة"], ["هرمي", "الهرم الغذائي"], ["معالجة", "خطوات إنتاج منتج"]]}, "order": {"title": "رتب خطوات إدراج SmartArt", "page": 81, "steps": ["اضغط المكان المراد", "من تبويب إدراج اضغط SmartArt", "اختر النوع من النافذة ثم موافق", "اكتب النص في الصناديق"]}, "qs": [{"t": "mc", "q": "ما نوع SmartArt المناسب لدورة الماء؟", "o": ["دائري (Cycle)", "قائمة", "مصفوفة"], "a": 0, "why": "ص84.", "lvl": 1}, {"t": "mc", "q": "أي نوع يناسب شجرة العائلة؟", "o": ["هيكلي (Hierarchy)", "دائري", "علاقة"], "a": 0, "why": "ص84.", "lvl": 1}, {"t": "mc", "q": "أي نوع يناسب الهرم الغذائي؟", "o": ["هرمي (Pyramid)", "معالجة", "قائمة"], "a": 0, "why": "ص84.", "lvl": 1}, {"t": "mc", "q": "أي نوع يقارن بين فكرتين؟", "o": ["علاقة (Relationship)", "معالجة", "دائري"], "a": 0, "why": "ص84.", "lvl": 1}, {"t": "mc", "q": "كيف نغير لون SmartArt؟", "o": ["تصميم ثم تغيير الألوان", "ملف ثم حفظ", "مراجعة ثم تدقيق"], "a": 0, "why": "ص83.", "lvl": 1}, {"t": "mc", "q": "أي نوع يعرض خطوات عملية أو جدولًا زمنيًا؟", "o": ["معالجة (Process)", "هيكلي", "مصفوفة"], "a": 0, "why": "ص84.", "lvl": 2}, {"t": "tf", "q": "SmartArt يستخدم لعرض المعلومات بشكل واضح.", "a": true, "why": "ص81.", "lvl": 1}, {"t": "tf", "q": "نوع مصفوفة يوضح علاقة الجزء بالكل.", "a": true, "why": "ص84.", "lvl": 1}, {"t": "tf", "q": "لا يمكن تغيير لون SmartArt بعد إدراجه.", "a": false, "why": "ص83.", "lvl": 1}, {"t": "fill", "q": "نختار من تبويب ___ ثم SmartArt لإدراج رسم توضيحي.", "a": ["إدراج", "Insert"], "why": "ص81.", "lvl": 2}, {"t": "fill", "q": "الشكل المسمى ___ يقارن التأثيرات الإيجابية والسلبية.", "a": ["موازنة", "Balance"], "why": "ص85.", "lvl": 2}], "summary": ["SmartArt يعرض المعلومات بشكل أوضح", "يدرج من تبويب إدراج", "يتغير لونه من تبويب تصميم", "أنواعه: قائمة، معالجة، دائري، هيكلي، علاقة، مصفوفة، هرمي"], "challenge": {"text": "تحدي الدرس: اختر النوع المناسب لكل محتوى.", "q": {"t": "mc", "q": "تريد عرض مراحل نمو النبات المتكررة. أي نوع تختار؟", "o": ["دائري", "قائمة", "مصفوفة"], "a": 0, "why": "ص84.", "lvl": 1}}}, "g5-u2-l4": {"id": "g5-u2-l4", "grade": 5, "pages": "90-96", "lab": null, "intro": {"question": "لماذا تظهر خطوط حمراء وزرقاء تحت بعض الكلمات في وورد؟", "goals": ["أدقق الأخطاء الإملائية والنحوية", "أبحث عن مرادفات", "أطبع مستندًا وأضبط خيارات الطباعة"]}, "cards": [{"title": "التدقيق والتحقق من الأخطاء", "text": "يتحقق وورد تلقائيًا من الأخطاء الإملائية والنحوية وبناء الجملة. السطر الأحمر يعني وجود خطأ إملائي، والسطر الأزرق يعني وجود خطأ نحوي.", "page": 90}, {"title": "خطوات التدقيق", "text": "في علامة التبويب مراجعة (Review)، من مجموعة تدقيق (Proofing) اضغط المحرر (Editor) أو اضغط F7. تظهر الكلمات غير الصحيحة، ثم اضغط التدقيق الإملائي (Spelling) وستظهر اقتراحات وخيارات أخرى.", "page": 90}, {"title": "خيارات التدقيق", "text": "ضع الكلمة الحمراء مكان النص التي تحددها من قائمة الاقتراحات (Suggestions). تجاهل مرة واحدة تتجاهل الكلمة هذه المرة فقط، وتجاهل الكل تتجاهلها في كل المستند. ويمكنك إضافة الكلمات التي تثق بها إلى قاموس البرنامج.", "page": 90}, {"title": "البحث عن المرادفات", "text": "قاموس المرادفات (Thesaurus) يشبه القاموس. من تبويب مراجعة، مجموعة تدقيق، اضغط قاموس المرادفات أو Shift + F7، اكتب الكلمة في المربع، ثم اضغط زر البحث أو Enter، وستظهر قائمة المرادفات. وهناك طريقة أسهل: اضغط بزر الفأرة الأيمن على الكلمة واختر مرادفات (Synonyms).", "page": 91}, {"title": "الطباعة", "text": "لطباعة ملف: من علامة التبويب ملف (File) اضغط طباعة (Print) أو اضغط Ctrl + P. يمكنك معاينة الطباعة على الجانب الأيسر من الشاشة، وتغيير إعدادات الطباعة من الجانب الأيمن.", "page": 92}, {"title": "خيارات الطباعة", "text": "عدد النسخ يحدد بالأسهم أو بكتابة الرقم. الطابعة: اختر الطابعة المتصلة أو طابعة الشبكة (Network Printer). طباعة كافة الصفحات (Print All Pages)، أو طباعة الصفحة الحالية (Print Current Page)، أو الطباعة المخصصة (Custom Print) مثل 1,5,8,11 أو 1-5. واتجاه الصفحة: رأسي (Portrait) أو أفقي (Landscape).", "page": 93}], "terms": [{"ar": "المحرر", "en": "Editor", "def": "أداة التدقيق الإملائي والنحوي", "page": 90}, {"ar": "تدقيق إملائي", "en": "Spelling", "def": "يبحث عن الأخطاء الإملائية", "page": 90}, {"ar": "قاموس المرادفات", "en": "Thesaurus", "def": "يعرض مرادفات الكلمة", "page": 91}, {"ar": "طباعة", "en": "Print", "def": "أمر طباعة المستند Ctrl + P", "page": 92}, {"ar": "رأسي", "en": "Portrait", "def": "اتجاه الصفحة الرأسي", "page": 93}, {"ar": "أفقي", "en": "Landscape", "def": "اتجاه الصفحة الأفقي", "page": 93}], "match": {"title": "طابق الاختصار بوظيفته", "page": 92, "pairs": [["F7", "المحرر والتدقيق"], ["Shift + F7", "قاموس المرادفات"], ["Ctrl + P", "الطباعة"], ["الخط الأحمر", "خطأ إملائي"]]}, "order": {"title": "رتب خطوات طباعة مستند", "page": 92, "steps": ["اضغط ملف (File)", "اضغط طباعة (Print)", "اضبط الإعدادات ومعاينة الطباعة", "اضغط زر الطباعة"]}, "qs": [{"t": "mc", "q": "ماذا يعني الخط الأحمر تحت الكلمة؟", "o": ["خطأ إملائي", "خطأ نحوي", "تنسيق جيد"], "a": 0, "why": "ص90.", "lvl": 1}, {"t": "mc", "q": "ماذا يعني الخط الأزرق؟", "o": ["خطأ نحوي", "خطأ إملائي", "كلمة مميزة"], "a": 0, "why": "ص90.", "lvl": 1}, {"t": "mc", "q": "أي مفتاح يشغل المحرر؟", "o": ["F7", "F2", "Esc"], "a": 0, "why": "ص90.", "lvl": 1}, {"t": "mc", "q": "ما اختصار الطباعة؟", "o": ["Ctrl + P", "Ctrl + Z", "Ctrl + F"], "a": 0, "why": "ص92.", "lvl": 1}, {"t": "mc", "q": "أي خيار يطبع صفحة واحدة فقط؟", "o": ["الصفحة الحالية", "كافة الصفحات", "نسخ"], "a": 0, "why": "ص93.", "lvl": 1}, {"t": "mc", "q": "كيف نطبع الصفحات 1 و5 و8 فقط؟", "o": ["1,5,8", "1-8", "5"], "a": 0, "why": "ص93.", "lvl": 2}, {"t": "tf", "q": "قاموس المرادفات يعرض كلمات بنفس المعنى.", "a": true, "why": "ص91.", "lvl": 1}, {"t": "tf", "q": "لا يمكن معاينة المستند قبل الطباعة.", "a": false, "why": "تظهر المعاينة (ص92).", "lvl": 1}, {"t": "tf", "q": "اتجاه الصفحة يكون رأسيًا أو أفقيًا.", "a": true, "why": "ص93.", "lvl": 1}, {"t": "fill", "q": "نفتح قاموس المرادفات بالاختصار Shift + ___.", "a": ["F7", "f7"], "why": "ص91.", "lvl": 2}, {"t": "fill", "q": "الاتجاه ___ يعني أن الصفحة عمودية بالطول.", "a": ["الرأسي", "رأسي", "Portrait"], "why": "ص93.", "lvl": 2}], "summary": ["الخط الأحمر إملائي والأزرق نحوي", "F7 للتدقيق وShift+F7 للمرادفات", "Ctrl+P للطباعة", "يمكن اختيار الصفحات والاتجاه وعدد النسخ"], "challenge": {"text": "تحدي الدرس: صحح كلمة خاطئة واطبع صفحة واحدة.", "q": {"t": "mc", "q": "وجدت خطًا أحمر تحت كلمة. ماذا تفعل؟", "o": ["أختار تصحيحها من الاقتراحات", "أحذف الصفحة", "أغلق البرنامج"], "a": 0, "why": "ص90.", "lvl": 1}}}, "g5-u3-l1": {"id": "g5-u3-l1", "grade": 5, "pages": "103-131", "lab": null, "intro": {"question": "كيف تنقل صور هاتفك أو كاميرتك إلى الحاسب، وكيف تعدّل مقطعًا صوتيًا؟", "goals": ["أتعرف أجهزة الالتقاط ومنافذ التوصيل", "أنقل البيانات من الماسح والكاميرا", "أعرف وحدات حجم الملفات وامتداداتها", "أحرر الصوت في برنامج أوداسيتي وأصدّره"]}, "cards": [{"title": "أجهزة الالتقاط", "text": "أجهزة الالتقاط تستخدم لالتقاط الأصوات والصور ومقاطع الفيديو ويمكن توصيلها بجهاز الحاسب لحفظ ما تلتقطه كملفات. منها: الهاتف المحمول، والكاميرا الرقمية، والماسح الضوئي (Scanner)، والميكروفون (Microphone).", "page": 103}, {"title": "منافذ التوصيل", "text": "أجهزة الالتقاط تتصل بمنافذ خاصة في الحاسب. منفذ الميكروفون ومكبر الصوت لإدخال وإخراج الصوت. ويمكن توصيل الأجهزة بالحاسب عبر منفذ USB. يُستخدم USB-C في الأجهزة الحديثة، ويستخدم موصل Lightning في أجهزة أبل (آيفون وآيباد). وهناك اتصال لاسلكي بتقنيات البلوتوث (Bluetooth) وNFC وWi-Fi.", "page": 104}, {"title": "نقل البيانات من الماسح الضوئي", "text": "وصّل سلك الماسح بمنفذ USB، وشغّل الماسح، وضع الصورة على الزجاج وأغلق الغطاء. من قائمة بدء اختر Windows Fax and Scan، ثم مسح ضوئي جديد (New Scan)، وحدد نوع الملف مثل JPG، ثم اضغط معاينة (Preview) ثم مسح (Scan)، وأخيرًا احفظ الصورة باسم.", "page": 105}, {"title": "نقل البيانات من الكاميرا", "text": "وصّل سلك الكاميرا بمنفذ USB في الحاسب، وبعد أن يتعرف الحاسب عليها ستظهر نافذة التشغيل التلقائي (Autoplay)، اختر فتح المجلد لعرض الملفات (Open folder to view files)، ثم انسخ الصور أو انقلها إلى المكان الذي تريده.", "page": 108}, {"title": "وحدات قياس حجم الملفات", "text": "الوحدات: بايت (Byte)، كيلوبايت (KB)، ميجابايت (MB)، جيجابايت (GB)، تيرابايت (TB). حجم المستند النصي صغير بضع كيلوبايتات، والصورة قد تأخذ بضعة ميجابايتات، والملف الصوتي عادة بضع ميجابايتات، وملف الفيديو قد يأخذ حيزًا بالميجابايتات أو أكبر بالجيجابايتات.", "page": 109}, {"title": "امتداد أنواع الملفات", "text": "لكل ملف اسم وامتداد، مثل عائلتي.jpg؛ فالامتداد jpg يوضح نوع الملف (صورة). أمثلة: txt ملف نصي، doc/docx مستند، ppt/pptx عرض تقديمي، xls/xlsx جدول بيانات، jpg/png صورة، wav/mp3 صوت، mp4/avi فيديو، pdf كتاب إلكتروني، zip/rar ملف مضغوط.", "page": 110}, {"title": "البدء مع برنامج أوداسيتي", "text": "أوداسيتي (Audacity) برنامج مجاني ومفتوح المصدر لتسجيل وتحرير الصوت الرقمي. لتنزيله: افتح الموقع audacityteam.org/download، واختر Download for Windows، ثم ثبّته (Next ثم Install ثم Finish).", "page": 110}, {"title": "فتح ملف صوتي وأدوات الاستخدام", "text": "لفتح ملف: ملف (File) ثم فتح (Open) واختر الملف. من الأدوات: تشغيل (Play)، إيقاف مؤقت (Pause)، توقف (Stop)، تسجيل (Record)، تراجع (Undo)، كرر (Redo). يمكن تشغيل وإيقاف المقطع بمفتاح المسافة (Space bar).", "page": 116}, {"title": "تحرير الصوت", "text": "حدد جزءًا من الشكل الموجي وشغله. لتغيير حدة الصوت: حدد الجزء ثم Effect ثم Fade In (التلاشي). لتغيير السرعة: Effect ثم Change Speed واضبط المضاعف ثم Preview ثم OK. يمكن حذف الجزء المحدد بالضغط على Delete.", "page": 118}, {"title": "دمج المقاطع الصوتية", "text": "لإضافة أصوات أخرى: ملف ثم استيراد (Import) ثم صوت (Audio)، حدد الملف واضغط فتح (Open). ستظهر موجة جديدة أسفل التسجيل السابق. استخدم شريط Gain لرفع أو خفض مستوى الصوت.", "page": 121}, {"title": "حفظ المشروع وتصديره", "text": "حفظ المشروع: ملف ثم Save Project، وينشأ ملف بامتداد .aup3 لا يمكن تشغيله خارج أوداسيتي. لتصدير ملف صوتي يعمل في أجهزة أخرى: ملف ثم Export ثم Export as MP3، ثم OK، واكتب الاسم واضغط حفظ.", "page": 122}], "terms": [{"ar": "أجهزة الالتقاط", "en": "Capture devices", "def": "أجهزة لالتقاط الصوت والصورة والفيديو", "page": 103}, {"ar": "منفذ USB", "en": "USB port", "def": "منفذ لتوصيل الأجهزة ونقل البيانات", "page": 104}, {"ar": "الماسح الضوئي", "en": "Scanner", "def": "يدخل الصور والوثائق إلى الحاسب", "page": 103}, {"ar": "امتداد الملف", "en": "File extension", "def": "يوضح نوع الملف مثل jpg", "page": 110}, {"ar": "أوداسيتي", "en": "Audacity", "def": "برنامج لتسجيل وتحرير الصوت", "page": 110}, {"ar": "الشكل الموجي", "en": "Waveform", "def": "عرض مرئي للصوت", "page": 115}, {"ar": "تصدير", "en": "Export", "def": "حفظ الملف بصيغة تعمل في أجهزة أخرى مثل MP3", "page": 122}, {"ar": "Fade In", "en": "Fade In", "def": "تأثير يزيد الصوت تدريجيًا", "page": 118}], "match": {"title": "طابق الامتداد بنوع الملف", "page": 110, "pairs": [[".mp3", "ملف صوتي"], [".jpg", "ملف صورة"], [".mp4", "ملف فيديو"], [".docx", "ملف نصي"]]}, "order": {"title": "رتب وحدات حجم الملفات من الأصغر إلى الأكبر", "page": 109, "steps": ["بايت (Byte)", "كيلوبايت (KB)", "ميجابايت (MB)", "جيجابايت (GB)", "تيرابايت (TB)"]}, "qs": [{"t": "mc", "q": "أي جهاز التقاط يسجل المقاطع الصوتية؟", "o": ["الميكروفون", "الماسح الضوئي", "الطابعة"], "a": 0, "why": "ص103.", "lvl": 1}, {"t": "mc", "q": "أي جهاز يدخل الصور والوثائق إلى الحاسب؟", "o": ["الماسح الضوئي", "السماعات", "الشاشة"], "a": 0, "why": "ص103.", "lvl": 1}, {"t": "mc", "q": "أي منفذ نستخدم لتوصيل الكاميرا بالحاسب؟", "o": ["USB", "HDMI فقط", "لا يوجد"], "a": 0, "why": "ص108.", "lvl": 1}, {"t": "mc", "q": "أي وحدة أكبر؟", "o": ["جيجابايت", "كيلوبايت", "ميجابايت"], "a": 0, "why": "ص109.", "lvl": 1}, {"t": "mc", "q": "ماذا يوضح امتداد الملف؟", "o": ["نوع الملف", "لون الملف", "حجم الشاشة"], "a": 0, "why": "ص110.", "lvl": 1}, {"t": "mc", "q": "ما اسم البرنامج المجاني لتحرير الصوت؟", "o": ["أوداسيتي", "وورد", "إكسل"], "a": 0, "why": "ص110.", "lvl": 1}, {"t": "mc", "q": "أي صيغة نصدّر بها ملفًا صوتيًا يعمل على أجهزة أخرى؟", "o": ["MP3", "aup3", "docx"], "a": 0, "why": "ص122.", "lvl": 2}, {"t": "mc", "q": "بماذا نشغل ونوقف المقطع الصوتي بسرعة؟", "o": ["مفتاح المسافة", "Esc", "Delete"], "a": 0, "why": "ص116.", "lvl": 2}, {"t": "tf", "q": "الكيلوبايت أصغر من الميجابايت.", "a": true, "why": "ص109.", "lvl": 1}, {"t": "tf", "q": "ملف مشروع أوداسيتي aup3 يعمل على كل البرامج.", "a": false, "why": "لا يمكن تشغيله إلا في أوداسيتي (ص122).", "lvl": 1}, {"t": "tf", "q": "يمكن حذف جزء من الصوت بتحديده ثم Delete.", "a": true, "why": "ص118.", "lvl": 1}, {"t": "fill", "q": "امتداد ملفات الصور الشائع هو ___.", "a": ["jpg", "JPG", ".jpg", "png"], "why": "ص110.", "lvl": 2}, {"t": "fill", "q": "نختار Export as ___ لتصدير الملف بصيغة MP3.", "a": ["MP3", "mp3"], "why": "ص122.", "lvl": 2}], "summary": ["أجهزة الالتقاط: هاتف، كاميرا، ماسح، ميكروفون", "وحدات الحجم: بايت، KB، MB، GB، TB", "امتداد الملف يوضح نوعه", "أوداسيتي: فتح، تحرير، دمج، حفظ مشروع، تصدير MP3"], "challenge": {"text": "تحدي الدرس: حدد الصيغة المناسبة لمشاركة صوتك.", "q": {"t": "mc", "q": "أردت مشاركة تسجيلك الصوتي مع صديق. ماذا تفعل؟", "o": ["أصدّره بصيغة MP3", "أرسل ملف aup3 فقط", "أحذفه"], "a": 0, "why": "ص122.", "lvl": 1}}}, "g5-u3-l2": {"id": "g5-u3-l2", "grade": 5, "pages": "132-154", "lab": null, "intro": {"question": "هل يجوز أن تنسخ أي صورة من الإنترنت وتضعها في مشروعك؟", "goals": ["أحترم حقوق الملكية", "أبحث عن الصور والفيديو في الإنترنت", "أنشئ فيديو في تطبيق صور مايكروسوفت", "أضيف تأثيرات ونصًا وصوتًا وأحفظ الفيديو"]}, "cards": [{"title": "احترام قوانين حقوق الملكية", "text": "من السهل تنزيل ونسخ المواد المتوفرة على الإنترنت، لكن من المهم مراعاة قوانين حقوق الطبع والنشر. حقوق الطبع والنشر أحد أشكال الحماية: عندما تكتب قصيدة أو ترسم عملًا فنيًا فإنك تملك حقوقه تلقائيًا. يجب الحصول على تصريح أو إذن لاستخدام الصورة من أصحاب حقوق الملكية.", "page": 132}, {"title": "رخصة المشاع الإبداعي", "text": "رخصة المشاع الإبداعي (Creative Commons - CC) تمنح الإذن بإعادة استخدام المصنفات، وفي نتائج بحث جوجل يمكنك تصفية النتائج للعثور على الصور التي تقدم رخصًا لإعادة الاستخدام.", "page": 132}, {"title": "البحث عن الصور", "text": "افتح مايكروسوفت إيدج، واستخدم محرك بحث مثل جوجل، واكتب الكلمة المفتاحية مثل «الرياض» واضغط Enter، ثم اختر صور (Images)، واضغط الأدوات (Tools) لعرض خيارات البحث مثل الحجم (Size) والرخصة.", "page": 133}, {"title": "حفظ الصورة", "text": "اضغط على الصورة بزر الفأرة الأيسر لتراها بحجم أكبر، ثم اضغط بزر الفأرة الأيمن واختر حفظ الصورة باسم (Save picture as). عليك مراجعة متطلبات الترخيص لأي صورة تريد استخدامها. وتختلف شروط الصور المجانية عن شروط الصور التجارية.", "page": 134}, {"title": "البحث عن الفيديو", "text": "اكتب الكلمة المفتاحية في جوجل واضغط Enter، ثم اضغط فيديو (Videos)، فتظهر مواقع تحتوي على مقاطع فيديو، اختر المقطع الذي يعجبك. ويمكن مشاهدة آلاف المقاطع على يوتيوب. من الأدوات يمكن تحديد مدة المقطع.", "page": 135}, {"title": "تطبيق صور مايكروسوفت", "text": "تطبيق صور مايكروسوفت (Microsoft Photos) عارض ومحرر مجاني موجود في ويندوز 10، ويمكن تحرير الصور ومقاطع الفيديو. لفتحه: اضغط بدء (Start)، ومرر القائمة إلى الأسفل، ثم اختر صور (Photos).", "page": 136}, {"title": "إنشاء مقطع فيديو", "text": "في تطبيق الصور اضغط محرر الفيديو (Video Editor)، ثم مشروع فيديو جديد (New video project)، اكتب اسمًا للفيديو واضغط موافق (OK)، ثم إضافة (Add) ثم من هذا الكمبيوتر (From this PC)، حدد الصور بـ Ctrl + A، ثم فتح (Open)، ثم Place in storyboard (وضع في لوحة العمل).", "page": 137}, {"title": "التأثيرات ثلاثية الأبعاد وتأثيرات الحركة", "text": "لإضافة تأثير ثلاثي الأبعاد: حدد الصورة في لوحة العمل (Storyboard)، اضغط تأثيرات ثلاثية الأبعاد (3D effects)، اختر التأثير ثم تم (Done). ولإضافة حركة: اختر الصورة ثم حركة (Motion)، ثم اختر الحركة واضغط تم.", "page": 140}, {"title": "إضافة نص وصوت", "text": "لإضافة نص: في لوحة العمل اضغط نص (Text)، اكتب النص، اختر نمطًا لتنسيقه، ثم تم. لإضافة صوت: اختر صوت مخصص (Custom audio) ثم إضافة ملف صوتي (Add audio file) وحدد الملف ثم فتح ثم تم.", "page": 143}, {"title": "حفظ ومشاركة الفيديو", "text": "لحفظ الفيديو: من شريط القوائم اضغط إنهاء الفيديو (Finish video)، اختر حجمًا متوسطًا (Medium)، ثم تصدير (Export)، واكتب اسم الملف ثم Export. وللمشاركة: مشاهدة المزيد (See more) ثم مشاركة (Share).", "page": 146}], "terms": [{"ar": "حقوق الطبع والنشر", "en": "Copyright", "def": "حماية قانونية لمالك العمل", "page": 132}, {"ar": "المشاع الإبداعي", "en": "Creative Commons", "def": "رخصة تسمح بإعادة استخدام المصنفات", "page": 132}, {"ar": "محرر الفيديو", "en": "Video Editor", "def": "أداة لإنشاء وتحرير الفيديو في تطبيق الصور", "page": 137}, {"ar": "لوحة العمل", "en": "Storyboard", "def": "ترتب فيها الصور والمقاطع", "page": 137}, {"ar": "التأثيرات ثلاثية الأبعاد", "en": "3D effects", "def": "تأثيرات تضاف للمقاطع", "page": 140}, {"ar": "تصدير", "en": "Export", "def": "حفظ الفيديو كملف", "page": 146}], "match": {"title": "طابق الأداة بوظيفتها", "page": 140, "pairs": [["3D effects", "تأثيرات ثلاثية الأبعاد"], ["Motion", "حركة للصورة"], ["Text", "إضافة نص"], ["Custom audio", "إضافة صوت مخصص"]]}, "order": {"title": "رتب خطوات إنشاء فيديو", "page": 137, "steps": ["فتح تطبيق صور", "اضغط محرر الفيديو ثم مشروع فيديو جديد", "أضف الصور واضعها في لوحة العمل", "أضف التأثيرات والنص والصوت", "أنهِ الفيديو ثم صدّره"]}, "qs": [{"t": "mc", "q": "ماذا تحمي حقوق الطبع والنشر؟", "o": ["العمل ومالكه", "الحاسب", "الشاشة"], "a": 0, "why": "ص132.", "lvl": 1}, {"t": "mc", "q": "ماذا تمنح رخصة المشاع الإبداعي؟", "o": ["إذنًا بإعادة استخدام المصنفات", "حذف العمل", "منع المشاهدة"], "a": 0, "why": "ص132.", "lvl": 1}, {"t": "mc", "q": "من أي قسم في جوجل نبحث عن الصور؟", "o": ["صور (Images)", "فيديو", "أخبار"], "a": 0, "why": "ص133.", "lvl": 1}, {"t": "mc", "q": "ما التطبيق المجاني لتحرير الفيديو في ويندوز 10؟", "o": ["مايكروسوفت صور", "أوداسيتي", "وورد"], "a": 0, "why": "ص136.", "lvl": 1}, {"t": "mc", "q": "أين نضع الصور لترتيبها في الفيديو؟", "o": ["لوحة العمل (Storyboard)", "سلة المحذوفات", "الشاشة الرئيسة"], "a": 0, "why": "ص137.", "lvl": 1}, {"t": "mc", "q": "أي أداة تضيف حركة للصورة؟", "o": ["حركة (Motion)", "نص", "تصدير"], "a": 0, "why": "ص142.", "lvl": 2}, {"t": "tf", "q": "يجب مراجعة متطلبات الترخيص قبل استخدام الصورة.", "a": true, "why": "ص134.", "lvl": 1}, {"t": "tf", "q": "يمكن استخدام أي صورة بلا إذن لأنها على الإنترنت.", "a": false, "why": "ص132.", "lvl": 1}, {"t": "tf", "q": "نستطيع إضافة صوت مخصص إلى الفيديو.", "a": true, "why": "ص143.", "lvl": 1}, {"t": "fill", "q": "نختار ___ (Export) لحفظ الفيديو كملف.", "a": ["تصدير", "Export", "export"], "why": "ص146.", "lvl": 2}, {"t": "fill", "q": "نضغط Ctrl + ___ لتحديد جميع الصور في مجلد.", "a": ["A", "a"], "why": "ص137.", "lvl": 2}], "summary": ["احترم حقوق الطبع والنشر وراجع الرخصة", "ابحث عن الصور والفيديو بالكلمات المفتاحية", "محرر الفيديو: لوحة العمل، تأثيرات، حركة، نص، صوت", "أنهِ الفيديو ثم صدّره وشاركه"], "challenge": {"text": "تحدي الدرس: قرر هل يمكنك استخدام صورة وجدتها.", "q": {"t": "mc", "q": "وجدت صورة جميلة للمشروع. ماذا تفعل أولًا؟", "o": ["أراجع رخصتها وحقوقها", "أنسخها فورًا", "أحذفها"], "a": 0, "why": "ص134.", "lvl": 1}}}, "g5-u4-l1": {"id": "g5-u4-l1", "grade": 5, "pages": "162-168", "lab": null, "intro": {"question": "من الذي يخبر الحاسب بما يفعل؟ وكيف نكتب له التعليمات؟", "goals": ["أعرّف البرنامج والخوارزمية", "أرسم مخططًا انسيابيًا", "أتبع خطوات إنشاء برنامج", "أكتب المقطع البرمجي في سكراتش"]}, "cards": [{"title": "ما البرنامج؟", "text": "البرامج هي التي تتحكم في طريقة عمل الأجهزة الإلكترونية. برنامج الحاسب هو مجموعة من التعليمات المكتوبة بإحدى لغات البرمجة ينفذها الحاسب لتحقيق هدف معين. ويطلق على من ينشئ البرنامج مبرمج.", "page": 162}, {"title": "لغة البرمجة", "text": "لغة البرمجة هي لغة كأي لغة عادية، إلا أن فيها قائمة كلمات محدودة وقواعد دقيقة تساعد في كتابة البرنامج. وسكراتش لغة سهلة يمكن للمبتدئين استخدامها لبناء لعبة أو صناعة أفلام كرتون «انميشن» أو قصص تفاعلية.", "page": 162}, {"title": "اتباع التعليمات", "text": "عند تشغيل البرنامج يقرأ الحاسب قائمة الأوامر أو التعليمات ثم ينفذها. لتنفيذ البرنامج بشكل صحيح لابد أن تكون التعليمات واضحة ومحددة.", "page": 163}, {"title": "المخطط الانسيابي", "text": "المخطط الانسيابي (Flowchart) هو مخطط بياني يستخدم لتمثيل الخوارزمية ويعرض الخطوات التي تحتاج إلى اتباعها بالترتيب الصحيح. يُستخدم قبل كتابة المقطع البرمجي لتنظيم الأفكار.", "page": 164}, {"title": "أشكال المخطط الانسيابي", "text": "أشكال المخطط أربعة أنواع: الشكل البيضاوي للإشارة إلى بداية ونهاية التسلسل، المعين لاتخاذ قرار (نعم أو لا)، المستطيل لتنفيذ عملية رياضية أو إعطاء الأوامر، متوازي الأضلاع لاستقبال وعرض البيانات (المدخلات والمخرجات)، والأسهم لربط الأشكال وإظهار الاتجاهات.", "page": 164}, {"title": "خطوات إنشاء برنامج (1): تحليل المشكلة", "text": "قبل أن تبدأ كتابة المقطع البرمجي، عليك أن تفهم المشكلة التي تريد حلها. مثلًا: إذا أردت أن يرسم كائن القطة قمرًا في سماء المدينة ليلًا، فعليك تحديد الخطوات اللازمة.", "page": 165}, {"title": "خطوات إنشاء برنامج (2 و3): الخوارزمية والمخطط", "text": "الخطوة الثانية: إنشاء الخوارزمية، أي كتابة الخطوات الصغيرة اللازمة لحل المشكلة بكلمات بسيطة. الخطوة الثالثة: رسم المخطط الانسيابي ليمثل الخطوات من البداية إلى النهاية.", "page": 165}, {"title": "خطوات إنشاء برنامج (4): كتابة المقطع البرمجي", "text": "الخطوة الرابعة: كتابة المقطع البرمجي في سكراتش باستخدام اللبنات؛ فيتحول المخطط الانسيابي إلى تعليمات برمجية. المقطع البرمجي الذي تستخدمه لحل المشكلة في سكراتش يسمى برنامجك.", "page": 166}], "terms": [{"ar": "برنامج", "en": "Program", "def": "مجموعة تعليمات مكتوبة بلغة برمجة ينفذها الحاسب", "page": 162}, {"ar": "مبرمج", "en": "Programmer", "def": "من ينشئ البرامج", "page": 162}, {"ar": "الخوارزمية", "en": "Algorithm", "def": "خطوات متسلسلة لحل مشكلة", "page": 165}, {"ar": "المخطط الانسيابي", "en": "Flowchart", "def": "مخطط بياني يمثل الخوارزمية", "page": 164}, {"ar": "اللبنات", "en": "Blocks", "def": "أوامر سكراتش", "page": 161}, {"ar": "المقطع البرمجي", "en": "Script", "def": "مجموعة لبنات متصلة", "page": 166}], "match": {"title": "طابق شكل المخطط بوظيفته", "page": 164, "pairs": [["بيضاوي", "بداية ونهاية التسلسل"], ["معين", "اتخاذ قرار"], ["مستطيل", "تنفيذ عملية أو إعطاء أوامر"], ["متوازي أضلاع", "استقبال وعرض البيانات"]]}, "order": {"title": "رتب خطوات إنشاء برنامج", "page": 165, "steps": ["تحليل المشكلة", "إنشاء الخوارزمية", "رسم المخطط الانسيابي", "كتابة المقطع البرمجي"]}, "qs": [{"t": "mc", "q": "ما البرنامج؟", "o": ["مجموعة تعليمات ينفذها الحاسب لتحقيق هدف", "جهاز طباعة", "صورة"], "a": 0, "why": "ص162.", "lvl": 1}, {"t": "mc", "q": "ما اسم من ينشئ البرنامج؟", "o": ["مبرمج", "مصور", "معلم"], "a": 0, "why": "ص162.", "lvl": 1}, {"t": "mc", "q": "ما اسم لغة البرمجة المستخدمة في الوحدة؟", "o": ["سكراتش", "وورد", "أوداسيتي"], "a": 0, "why": "ص162.", "lvl": 1}, {"t": "mc", "q": "أي شكل يستخدم لاتخاذ قرار؟", "o": ["المعين", "المستطيل", "البيضاوي"], "a": 0, "why": "ص164.", "lvl": 1}, {"t": "mc", "q": "ما الخطوة الأولى في إنشاء برنامج؟", "o": ["تحليل المشكلة", "كتابة المقطع البرمجي", "حفظ الملف"], "a": 0, "why": "ص165.", "lvl": 1}, {"t": "mc", "q": "ما المخطط الانسيابي؟", "o": ["مخطط بياني يمثل الخوارزمية", "برنامج رسم", "لعبة"], "a": 0, "why": "ص164.", "lvl": 2}, {"t": "tf", "q": "الخوارزمية خطوات متسلسلة لحل مشكلة.", "a": true, "why": "ص165.", "lvl": 1}, {"t": "tf", "q": "تستطيع أجهزة الحاسب أن تقرر ماذا تفعل من تلقاء نفسها.", "a": false, "why": "تنفذ التعليمات فقط (ص167).", "lvl": 1}, {"t": "tf", "q": "نرسم المخطط الانسيابي قبل كتابة المقطع البرمجي.", "a": true, "why": "ص165.", "lvl": 1}, {"t": "fill", "q": "الشكل ___ في المخطط الانسيابي يدل على البداية والنهاية.", "a": ["البيضاوي", "بيضاوي"], "why": "ص164.", "lvl": 2}, {"t": "fill", "q": "يسمى من ينشئ البرنامج ___.", "a": ["مبرمج", "المبرمج"], "why": "ص162.", "lvl": 2}], "summary": ["البرنامج تعليمات ينفذها الحاسب", "الخوارزمية خطوات متسلسلة", "المخطط الانسيابي له أشكال: بيضاوي، معين، مستطيل، متوازي أضلاع، سهم", "الخطوات: تحليل، خوارزمية، مخطط، مقطع برمجي"], "challenge": {"text": "تحدي الدرس: رتب خطوات حل مشكلة.", "q": {"t": "mc", "q": "قبل أن تكتب المقطع البرمجي، ماذا تفعل؟", "o": ["تفهم المشكلة وتكتب الخوارزمية", "تحفظ الملف", "تغلق البرنامج"], "a": 0, "why": "ص165.", "lvl": 1}}}, "g5-u4-l2": {"id": "g5-u4-l2", "grade": 5, "pages": "170-181", "lab": "scratch", "intro": {"question": "من هي القطة البرتقالية في سكراتش؟ وكيف نضيف كائنات جديدة ونحركها؟", "goals": ["أعرّف الكائن الرسومي", "أحذف الكائنات وأضيفها", "أغير مظاهر الكائن وأحركه", "أكرر الكائن وأضيف مؤثرًا صوتيًا"]}, "cards": [{"title": "ما الكائن الرسومي؟", "text": "الكائن في برنامج سكراتش قد يكون نصًا أو صورة أو رسمًا، ويمكن برمجته لأداء إجراءات معينة في مشروع باستخدام اللبنات. يمكنك تغيير موضع الكائن واسمه وإخفاءه، وتغيير حجمه واتجاهه من منطقة الكائنات.", "page": 170}, {"title": "حذف الكائن", "text": "تبدأ مشروعات سكراتش دائمًا بكائن القطة. لحذف كائن اضغط على أيقونة الحذف، أو اضغط بزر الفأرة الأيمن على الكائن واختر حذف.", "page": 171}, {"title": "إضافة كائن جديد", "text": "هناك أربع طرق لإضافة الكائنات: 1) الاختيار من مكتبة سكراتش. 2) إنشاء كائن فريد خاص بك (رسم). 3) السماح لسكراتش باختيار كائن عشوائي. 4) تحميل صورة من جهازك. لاختيار كائن من المكتبة: اضغط اختيار كائن (Choose a Sprite)، ثم اختر فئة مثل حيوانات (Animals)، ثم اختر Dinosaur4.", "page": 172}, {"title": "مظاهر الكائن", "text": "معظم الكائنات لديها أكثر من مظهر، وتسمى المظاهر (Costumes). للعثور على مظاهر الكائن اضغط علامة تبويب المظاهر. كائن Dinosaur4 له أربعة مظاهر ولكل منها اسم مختلف. تغيير المظاهر بسرعة يجعل الكائن يبدو كأنه يتحرك.", "page": 174}, {"title": "لبنات الهيئة", "text": "لبنة «غيّر المظهر إلى» تغير مظهر الكائن إلى مظهر معين تختاره من القائمة. لبنة «المظهر التالي» تغير مظهر الكائن إلى المظهر التالي في القائمة. وتنتمي هذه اللبنات إلى فئة الهيئة (Looks).", "page": 175}, {"title": "جعل الكائن يتحرك", "text": "يمكنك جعل الكائن يقوم بحركات جديدة من خلال الجمع بين عدة وضعيات. استخدم لبنة «كرر» لتكرار التغيير بين المظاهر مع لبنة «انتظر» لإضافة فاصل زمني قصير حتى ترى كل مظهر قبل أن يتغير.", "page": 176}, {"title": "حركات الكائن", "text": "لتشغيل المقطع عند النقر على العلم الأخضر نستخدم لبنة «عند نقر العلم الأخضر» (when flag clicked)، ولتشغيله عند الضغط على الكائن نفسه نستخدم لبنة «عند نقر هذا الكائن» (when this sprite clicked). كلاهما من فئة الأحداث (Events).", "page": 177}, {"title": "تكرار الكائن", "text": "لتكرار الكائن اضغط عليه بزر الفأرة الأيمن واختر مضاعفة (duplicate)، فيظهر كائن جديد مطابق للكائن الأول. ويمكن تحريك الكائنات باستخدام الفأرة.", "page": 178}, {"title": "إضافة مؤثر صوتي", "text": "افتح مكتبة الكائنات وابحث في الحيوانات عن كائن الديك وأضفه. وغيّر المقطع البرمجي ليبدأ كل مقطع عند نقر العلم الأخضر، وتستخدم لبنة «شغّل الصوت حتى انتهائه». تذكر حفظ المشروع باسم قبل إغلاقه.", "page": 179}], "terms": [{"ar": "الكائن", "en": "Sprite", "def": "نص أو صورة أو رسم يمكن برمجته", "page": 170}, {"ar": "المظهر", "en": "Costume", "def": "شكل يتخذه الكائن", "page": 174}, {"ar": "الهيئة", "en": "Looks", "def": "فئة لبنات تغير مظهر الكائن", "page": 175}, {"ar": "الأحداث", "en": "Events", "def": "فئة لبنات تبدأ المقطع البرمجي", "page": 177}, {"ar": "مضاعفة", "en": "Duplicate", "def": "أمر لعمل نسخة من الكائن", "page": 178}, {"ar": "المنصة", "en": "Stage", "def": "المنطقة التي تظهر فيها الكائنات", "page": 172}], "match": {"title": "طابق اللبنة
