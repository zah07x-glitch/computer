<style>:root{--g:#07A869;--b:#3D7EB9;--t:#0DA9A6;--d:#15445A;--gold:#C1B489;--gray:#C2C1C1;--bg:#f2f7f9;--fg:#15303c;--mut:#5b7480;--card:#ffffff;--line:#dfe8ec;--sh:0 8px 24px rgba(21,68,90,.10);--c:var(--g)}

<h2 class="sec" id="gr">اختر صفّك</h2><div class="cards">`;

else if(V.t==='grade'){const g=CUR['grade'+V.g],c=G[V.g][0];h+=`<button class="back" onclick="go({t:'home'})">← رجوع</button><div class="pagehead" style="--c:${c}"><span class="ic">${G[V.g][1]}</span><h1>${g.name}</h1></div>`;
for(const u of g.units){h+=`<section class="unit" style="--c:${c}"><h2><span class="sem">الفصل ${u.semester}</span>${u.title} <small>(ص${u.page})</small></h2>`;u.lessons.forEach((l,k)=>{const r=!!LES[l.id],d=P.done[l.id]!==undefined;h+=`<button class="row ${r?'':'lock'}" ${r?`onclick="go({t:'lesson',id:'${l.id}'})"`:'disabled'}><span><span class="n">${d?'✓':k+1}</span>${l.title}</span><small>${r?'ص'+l.page+(d?' — '+P.done[l.id]+'%':' ▶'):'🔒 قيد الإعداد'}</small></button>`});h+='</section>'}}
else if(V.t==='me'){h+=`<button class="back" onclick="go({t:'home'})">← رجوع</button><div class="pagehead" style="--c:#15445A"><span class="ic">🏆</span><h1>لوحتي</h1></div><p>المستوى: <b>${LV[Math.min(5,Math.floor(P.xp/100))]}</b> — النقاط: ${P.xp}</p><p>الدروس المكتملة: ${Object.keys(P.done).length}</p>`;
for(const[k,s]of Object.entries(P.done))h+=`<div class="bar"><span>${k}</span><i style="width:${s}%"></i> ${s}%</div>`;
h+=`<div class="acts"><button onclick="exportP()">تصدير التقدم</button><label class="btn">استيراد<input type="file" accept="application/json" hidden onchange="importP(this.files[0])"></label><button onclick="if(confirm('حذف كل التقدم؟')){P.xp=0;P.done={};delete P.last;render()}">مسح التقدم</button></div><p class="note">يُحفظ تقدمك على هذا الجهاز فقط. استخدم التصدير للنقل إلى جهاز آخر.</p>`}
else if(V.t==='lesson'){const d=L.d,S=['التهيئة','تعلّم','جرّب بنفسك','اختبر فهمك','الملخص'];
h+=`<button class="back" onclick="go({t:'grade',g:${d.grade}})">← الدروس</button><div class="lprog"><i style="width:${(L.step+1)*20}%"></i></div><div class="steps">${S.map((s,i)=>`<span class="${i===L.step?'on':i<L.step?'ok':''}">${s}</span>`).join('')}</div>`;
if(L.step===0)h+=`<section class="panel"><h2>${esc(d.intro.question)}</h2><h3>أهداف الدرس</h3><ul>${d.intro.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></section>`;
if(L.step===1)h+='<section>'+d.cards.map((c,i)=>`<article class="tile"><h3>${esc(c.title)} <small>(ص${c.page})</small></h3><p>${esc(c.text)}</p><button onclick="speak(${i})">🔊 اقرأ</button></article>`).join('')+'</section>';
if(L.step===2){const ok=d.match.pairs.filter(([a,b])=>L.mi[a]===b).length;h+=`<section class="panel"><h2>${esc(d.match.title)} <small>(ص${d.match.page})</small></h2>`+d.match.pairs.map(([a,b],i)=>`<div class="pair"><b>${esc(a)}</b><select onchange="pick(L.d.match.pairs[${i}][0],this.value)"><option value="">اختر العمل</option>${L.right.map(r=>`<option ${L.mi[a]===r?'selected':''}>${esc(r)}</option>`).join('')}</select> ${L.mi[a]?(L.mi[a]===b?'✅':'❌ حاول مرة أخرى'):''}</div>`).join('')+(ok===d.match.pairs.length?'<p class="good">أحسنت! أتممت المطابقة 🎉</p>':'')+'</section>'}
if(L.step===3){h+='<section class="panel">';if(L.ci<L.qs.length){const q=L.qs[L.ci];h+=`<h2>سؤال ${L.ci+1} من ${L.qs.length}</h2><p>${esc(q.q)}</p>`+q.o.map((o,i)=>`<button class="opt ${L.pick===null?'':o.ok?'right':L.pick===i?'wrong':''}" ${L.pick!==null?'disabled':''} onclick="L.pick=${i};if(L.qs[L.ci].o[${i}].ok)L.score++;render()">${esc(o.t)}</button>`).join('')+(L.pick!==null?`<p class="why">${esc(q.why)}</p><button class="cta" onclick="L.pick=null;L.ci++;render()">التالي</button>`:'')}
else h+=`<h2>نتيجتك: ${L.score} من ${L.qs.length}</h2>${L.score<L.qs.length?'<p>راجع بطاقات «تعلّم» ثم أعد المحاولة.</p>':''}<button onclick="L.ci=0;L.score=0;L.pick=null;render()">إعادة الاختبار</button>`;h+='</section>'}
if(L.step===4)h+=`<section class="panel"><h2>ملخص الدرس</h2><ul>${d.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p class="tile">${esc(d.challenge)}</p><button class="cta" onclick="finish()">إنهاء الدرس وحفظ التقدم</button></section>`;
h+=`<div class="acts"><button ${L.step===0?'disabled':''} onclick="L.step--;render()">السابق</button><button ${(L.step===4||(L.step===3&&L.ci<L.qs.length))?'disabled':''} onclick="L.step++;render()">التالي</button></div>`}
h+=`</main><footer><p class="sl">تعلّم • طبّق • اكتشف • أبدع</p><p>إعداد وإشراف: أ. عبدالله الزهراني</p><p>الإدارة العامة للتعليم بمنطقة جازان</p></footer>`;document.getElementById('app').innerHTML=h}
render();
</script></body></html>
