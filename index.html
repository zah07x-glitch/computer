<style>:root{--g:#07A869;--b:#3D7EB9;--t:#0DA9A6;--d:#15445A;--gold:#C1B489;--gray:#C2C1C1;--bg:#f2f7f9;--fg:#15303c;--mut:#5b7480;--card:#ffffff;--line:#dfe8ec;--sh:0 8px 24px rgba(21,68,90,.10);--c:var(--g)}

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7}

.tabs button{white-space:nowrap;margin:0;padding:.35rem .8rem;border-radius:99px;font-size:.9rem}.tabs button.on{background:var(--d);color:#fff;border-color:var(--d)}
.sm{padding:.25rem .7rem!important;font-size:.9rem}.fin{font:inherit;padding:.5rem .8rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);margin:.2rem}
.chip{border-radius:99px;padding:.3rem .9rem;margin:.2rem}.chip.on,.chip.ok{background:var(--c,#3D7EB9);color:#fff;border-color:var(--c,#3D7EB9)}.chip.ok{background:var(--g);border-color:var(--g)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem}.tl{display:flex;flex-direction:column;gap:.2rem;align-items:center;padding:1rem;border-radius:18px;margin:0;box-shadow:var(--sh);font-size:1.6rem}.tl b{font-size:1rem}.tl small{font-size:.8rem;color:var(--mut)}

.mind{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:.8rem 0}.mc{background:var(--d);color:#fff;border-radius:50%;padding:1.4rem 1rem;font-weight:700;text-align:center;max-width:140px}.mb{display:flex;flex-wrap:wrap;gap:.4rem;flex:1}.mb span{background:var(--card);border:2px solid var(--t);border-radius:12px;padding:.3rem .7rem}
.lab2{display:grid;gap:1rem;grid-template-columns:1fr}@media(min-width:800px){.lab2{grid-template-columns:300px 1fr}}.tasks li{margin:.4rem 0}.tasks .dn{color:var(--g);font-weight:700}

.files{display:flex;flex-wrap:wrap;gap:.5rem;min-height:120px;padding:.5rem;background:var(--bg);border-radius:12px}.fi{display:flex;flex-direction:column;align-items:center;width:100px;font-size:2rem}.fi span{font-size:.8rem;word-break:break-all}.fi.sel{border-color:var(--b);background:#3D7EB933}
.set{margin:.8rem 0;padding:.6rem;background:var(--bg);border-radius:12px}.deskprev{border-radius:12px;padding:3rem 1rem;color:#fff;text-align:center;font-weight:700;text-shadow:0 1px 4px #0008}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.mg .chip{display:block;width:100%;text-align:right;border-radius:12px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}.mcard{height:80px;margin:0;font-size:.9rem}.mcard.up{background:var(--t);color:#fff}
.wheel{width:200px;height:200px;border-radius:50%;margin:1rem auto .2rem;background:conic-gradient(#07A869 0 60deg,#3D7EB9 0 120deg,#0DA9A6 0 180deg,#C1B489 0 240deg,#15445A 0 300deg,#C2C1C1 0 360deg);transition:transform 1.2s cubic-bezier(.2,.8,.2,1);border:6px solid var(--card);box-shadow:var(--sh)}.ptr{font-size:1.6rem;margin-top:-.2rem}
.ord{display:flex;gap:.4rem;align-items:center;background:var(--bg);margin:.3rem 0;padding:.3rem .6rem;border-radius:10px}.ord span{flex:1}
.chat{background:var(--card);border-radius:18px;padding:1rem;max-height:50vh;overflow:auto;border:1px solid var(--line)}.msg{padding:.5rem .9rem;border-radius:14px;margin:.4rem 0;max-width:90%}.msg.b{background:#0DA9A622}.msg.u{background:#3D7EB933;margin-inline-start:auto}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.6rem}.fcard{min-height:110px;margin:0;flex-direction:column;border-radius:16px;font-weight:700}
.row2{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px dashed var(--line)}.chk{display:block;margin:.3rem 0}.tbl{overflow:auto}
.pt{border-collapse:collapse;width:100%}.pt td,.pt th{border:1px solid #888;padding:.4rem .6rem;text-align:right}
.printdoc{background:#fff;color:#000;padding:1.5rem;max-width:800px;margin:1rem auto}.noprint{text-align:center;padding:.6rem;background:var(--card)}
.cert{border:8px double #C1B489;padding:2rem;text-align:center;font-size:1.2rem}.cert h2{font-size:2.2rem;color:#15445A}
.cls{min-height:100vh;background:linear-gradient(135deg,#15445A,#0DA9A6);color:#fff;padding:1rem;display:flex;flex-direction:column}.clsbar{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}.clsbar button{background:#ffffff22;color:#fff;border-color:#ffffff55}.clsbar span{margin-inline-start:auto}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem}.slide h1{font-size:2.4em}.slide .big,.slide li.big,.slide .big li{font-size:1.5em}.slide .why{color:#15303c;background:#fffbe8}.clsnav{display:flex;justify-content:space-between}
.res{text-align:center}.hero .badge{margin-bottom:.4rem}
html.rm *{animation:none!important;transition:none!important}
@media print{.top,.tabs,footer,.noprint,.conf,.toast{display:none!important}body,body:before{background:#fff!important}.printdoc{box-shadow:none;margin:0;max-width:none}}
@media(max-width:560px){.top button{padding:.25rem .5rem;margin:0;font-size:.85rem}.brand .t{font-size:.8rem}.logo{width:30px;height:30px}}
.wtool{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem}.wg{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;background:var(--bg);padding:.35rem .5rem;border-radius:12px}.wg>b{font-size:.75rem;opacity:.7;margin-inline-end:.3rem}.wb{padding:.3rem .55rem;font-size:.85rem}.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #8888;padding:0;cursor:pointer}.wsm{width:9rem;padding:.25rem .5rem}.wsave{background:#C1B48933;padding:.5rem;border-radius:12px;margin:.4rem 0}

الحاسب؟", "text": "الحاسب جهاز إلكتروني يمكنه اتباع تعليمات محددة واتخاذ القرارات والقيام بأمور مفيدة، مثل كتابة النصوص ورسم الصور وتنسيقها وإرسال البريد الإلكتروني.", "page": 14}, {"title": "الحاسب المكتبي", "text": "للحاسبات أنواع تختلف في الحجم والقدرات، والحاسب المكتبي من أكثرها شيوعًا، وقد تجده في المدرسة أو المنزل. يتكون من أجهزة متصلة ببعضها تمكنه من أداء المهام.", "page": 14}, {"title": "المكونات الرئيسة", "text": "الشاشة (Monitor) • صندوق الحاسب (Computer Case) • الفأرة (Mouse) • لوحة المفاتيح (Keyboard).", "page": 15}, {"title": "الأجهزة الملحقة", "text": "الطابعة (Printer) • الميكروفون (Microphone) • مكبر الصوت (Speakers) • كاميرا الويب (Webcam) • الماسح الضوئي (Scanner) • سماعات الأذن (Headphones) • الكاميرا الرقمية (Digital Camera).", "page": 15}, {"title": "استخدام الأجهزة الملحقة", "text": "الفأرة لتحريك المؤشر، ولوحة المفاتيح لكتابة النص، والشاشة لعرض شاشات البرامج، والطابعة لطباعة صفحة، والماسح الضوئي لمسح المستندات، والميكروفون لتسجيل الصوت، وكاميرا الويب للتواصل المرئي عبر الإنترنت.", "page": 16}, {"title": "الطباعة", "text": "تُوصَّل الطابعة بالحاسب بسلك USB أو بالشبكة اللاسلكية. قبل الطباعة تأكد من أن الحاسب متصل بالطابعة وأن الطابعة تعمل.", "page": 17}], "terms": [{"ar": "الحاسب", "en": "Computer", "def": "جهاز إلكتروني يتبع تعليمات محددة ويتخذ القرارات", "page": 14}, {"ar": "الحاسب المكتبي", "en": "Desktop Computer", "def": "أكثر أنواع الحاسبات شيوعًا، يتكون من أجهزة متصلة ببعضها", "page": 14}, {"ar": "الشاشة", "en": "Monitor", "def": "تعرض شاشات البرامج", "page": 15}, {"ar": "صندوق الحاسب", "en": "Computer Case", "def": "من المكونات الرئيسة للحاسب المكتبي", "page": 15}, {"ar": "الفأرة", "en": "Mouse", "def": "تحرك المؤشر", "page": 15}, {"ar": "لوحة المفاتيح", "en": "Keyboard", "def": "تكتب بها النصوص", "page": 15}, {"ar": "الطابعة", "en": "Printer", "def": "تطبع صفحة على الورق", "page": 15}, {"ar": "الميكروفون", "en": "Microphone", "def": "يسجل الصوت", "page": 15}, {"ar": "مكبر الصوت", "en": "Speakers", "def": "يُستمع به إلى الملفات الصوتية", "page": 15}, {"ar": "كاميرا الويب", "en": "Webcam", "def": "للتواصل المرئي عبر الإنترنت", "page": 15}, {"ar": "الماسح الضوئي", "en": "Scanner", "def": "يمسح المستندات", "page": 15}, {"ar": "الكاميرا الرقمية", "en": "Digital Camera", "def": "تلتقط الصور أو مقاطع الفيديو", "page": 15}], "match": {"title": "طابق الجهاز بعمله", "page": 16, "pairs": [["الطابعة", "طباعة صفحة"], ["الماسح الضوئي", "مسح المستندات"], ["كاميرا الويب", "التواصل المرئي عبر الإنترنت"], ["الميكروفون", "تسجيل الصوت"]]}, "order": null, "qs": [{"t": "mc", "q": "ماذا يستطيع الحاسب أن يفعل؟", "o": ["اتباع تعليمات محددة واتخاذ القرارات", "الطيران في الجو", "الإحساس بالمشاعر"], "a": 0, "why": "الحاسب جهاز إلكتروني يتبع تعليمات محددة ويتخذ القرارات (ص14).", "lvl": 1}, {"t": "mc", "q": "أي مما يلي من المكونات الرئيسة للحاسب المكتبي؟", "o": ["الطابعة", "الشاشة", "الماسح الضوئي"], "a": 1, "why": "المكونات الرئيسة: الشاشة وصندوق الحاسب والفأرة ولوحة المفاتيح (ص15).", "lvl": 1}, {"t": "mc", "q": "أي جهاز من الأجهزة الملحقة؟", "o": ["لوحة المفاتيح", "الفأرة", "كاميرا الويب"], "a": 2, "why": "كاميرا الويب جهاز ملحق، أما الفأرة ولوحة المفاتيح فمن المكونات الرئيسة (ص15).", "lvl": 1}, {"t": "mc", "q": "بماذا تُوصَّل الطابعة بالحاسب؟", "o": ["بسلك USB أو بالشبكة اللاسلكية", "بالماء", "بالهواء فقط"], "a": 0, "why": "تُوصل الطابعة بسلك USB أو بالشبكة اللاسلكية (ص17).", "lvl": 1}, {"t": "tf", "q": "الطابعة من المكونات الرئيسة للحاسب المكتبي.", "a": false, "why": "الطابعة جهاز ملحق، وليست من المكونات الرئيسة (ص15).", "lvl": 1}, {"t": "tf", "q": "يمكن توصيل الطابعة بالحاسب بسلك USB.", "a": true, "why": "هذه إحدى طريقتي التوصيل (ص17).", "lvl": 1}, {"t": "tf", "q": "يستخدم الماسح الضوئي لمسح المستندات.", "a": true, "why": "كما في جدول استخدام الأجهزة الملحقة (ص16).", "lvl": 1}, {"t": "fill", "q": "المكونات الرئيسة هي الشاشة وصندوق الحاسب والفأرة و___.", "a": ["لوحة المفاتيح"], "why": "الرابعة هي لوحة المفاتيح (ص15).", "lvl": 2}, {"t": "fill", "q": "الجهاز الملحق الذي يطبع المستند على الورق يسمى ___.", "a": ["الطابعة", "طابعة"], "why": "الطابعة تطبع النصوص والصور على الورق (ص17).", "lvl": 2}], "summary": ["الحاسب جهاز إلكتروني يتبع التعليمات", "المكونات الرئيسة: الشاشة وصندوق الحاسب والفأرة ولوحة المفاتيح", "الأجهزة الملحقة تزيد ما يستطيع الحاسب فعله", "الطباعة تحتاج توصيل الطابعة وتشغيلها"], "challenge": {"text": "تحدي الدرس: لديك وثيقة ورقية وتريد نسخة رقمية منها. أي جهاز ملحق تستخدم؟", "q": {"t": "mc", "q": "اختر الجهاز المناسب:", "o": ["الماسح الضوئي", "مكبر الصوت", "سماعات الأذن"], "a": 0, "why": "الماسح الضوئي يمسح المستندات (ص16).", "lvl": 1}}}, "g4-u1-l2": {"id": "g4-u1-l2", "grade": 4, "pages": "20-29", "lab": "files", "intro": {"question": "عند تشغيل الحاسب تظهر أمامك رموز كثيرة. هل تعرف الفرق بين الملف والمجلد والبرنامج؟", "goals": ["أتعرف على سطح المكتب وعناصره", "أفرق بين الملف والمجلد وأعرف امتداد الملف", "أنشئ ملفًا ومجلدًا وأغير اسمه", "أنقل المجلد أو أنسخه وأفرق بين النقل والنسخ", "أشغل الحاسبة وأبحث عن مساعدة"]}, "cards": [{"title": "سطح المكتب", "text": "عند بدء تشغيل الحاسب تظهر الشاشة الرئيسية لنظام التشغيل مايكروسوفت ويندوز، وتسمى سطح المكتب (Desktop). تتكون من شريط المهام ومساحة العمل وبعض الرموز وزر بدء.", "page": 20}, {"title": "الملفات", "text": "المهمة الرئيسة للحاسب هي إدارة البيانات، وتسمى البيانات المخزنة في الحاسب ملفات (Files). قد يكون الملف نصًا أو مستندًا أو عرضًا تقديميًا أو صورة، ولكل نوع أيقونة تساعدك على معرفته.", "page": 20}, {"title": "اسم الملف", "text": "من المهم حفظ الملفات بأسماء فريدة وتسميتها بما يناسب محتواها لتسهل العثور عليها. تجنب الأسماء العامة مثل «ملف1».", "page": 21}, {"title": "امتداد الملف", "text": "لكل ملف امتداد يشير إلى نوعه، ويأتي بعد اسم الملف وتفصله عنه نقطة. مثال: ‎.docx‎ لملف وورد.", "page": 21}, {"title": "نقل الملفات", "text": "يمكن نقل الملفات بين الأجهزة بتوصيل بعضها ببعض، أو عبر الشبكة المحلية، أو عبر التخزين السحابي.", "page": 21}, {"title": "إنشاء الملفات", "text": "تُستخدم برامج مختلفة لإنشاء الملفات حسب نوعها. مثلًا يمكنك إنشاء صورة ببرنامج الرسام (Paint) ومستند ببرنامج وورد.", "page": 22}, {"title": "فتح الملف وحذفه", "text": "لفتح الملف اضغط عليه ضغطة مزدوجة، أو اضغط بزر الفأرة الأيمن عليه واختر فتح (Open). ولحذفه اضغط بزر الفأرة الأيمن واختر حذف (Delete).", "page": 23}, {"title": "المجلدات", "text": "المجلد (Folder) هو مساحة تخزينية على القرص الصلب تحفظ وتنظم فيها ملفاتك وبرامجك. لإنشاء مجلد: اضغط بزر الفأرة الأيمن في مساحة فارغة، ثم جديد (New)، ثم مجلد (Folder)، واكتب اسمًا واضغط Enter.", "page": 24}, {"title": "اسم المجلد", "text": "يفضل أن يصف اسم المجلد محتويات ملفاته. ولتغيير الاسم اضغط بزر الفأرة الأيمن على المجلد واختر إعادة التسمية (Rename). لا تستخدم الرموز / \\ : * ؟ \" < > | في اسم المجلد.", "page": 25}, {"title": "المجلدات الرئيسة والفرعية", "text": "يمكن تنظيم الملفات الكثيرة بإنشاء مجلدات فرعية داخل المجلد الرئيس. المجلد الفرعي هو مجلد داخل مجلد آخر، ويعيدك زر الرجوع (Back) إلى المجلد الرئيس.", "page": 25}, {"title": "نقل المجلد أو نسخه", "text": "للنقل: اضغط بزر الفأرة الأيمن على المجلد واختر قص (Cut)، ثم انتقل إلى الموقع الجديد واختر لصق (Paste). وللنسخ اختر نسخ (Copy) بدلًا من قص.", "page": 26}, {"title": "الفرق بين النسخ والنقل", "text": "النسخ ينشئ نسخة جديدة من الملف مع بقاء الأصل في مكانه. أما النقل فينقل الملف من مكان إلى آخر مع حذفه من المكان الأصلي.", "page": 26}, {"title": "استخدام البرامج: الحاسبة", "text": "لتشغيل الحاسبة اضغط زر بدء (Start)، ومرر القائمة إلى أسفل، ثم اضغط الحاسبة (Calculator). ويمكنك كتابة الأرقام بلوحة المفاتيح عندما يكون مفتاح Num Lock مضغوطًا.", "page": 27}, {"title": "البحث عن مساعدة", "text": "يمكنك فتح تطبيق الحصول على التعليمات (Get Help) من قائمة بدء، ثم تصف مشكلتك وتقرأ الحلول المقترحة وتتبع الخطوات بعناية.", "page": 28}], "terms": [{"ar": "سطح المكتب", "en": "Desktop", "def": "الشاشة الرئيسية لنظام التشغيل، فيها شريط المهام وزر بدء والرموز", "page": 20}, {"ar": "الملف", "en": "File", "def": "بيانات مخزنة في الحاسب، ولكل نوع منها أيقونة", "page": 20}, {"ar": "امتداد الملف", "en": "File Extension", "def": "يأتي بعد نقطة في آخر اسم الملف ويدل على نوعه", "page": 21}, {"ar": "المجلد", "en": "Folder", "def": "مساحة تخزينية تنظم فيها ملفاتك وبرامجك", "page": 24}, {"ar": "المجلد الفرعي", "en": "Subfolder", "def": "مجلد داخل مجلد آخر", "page": 25}, {"ar": "قص", "en": "Cut", "def": "أمر لنقل الملف أو المجلد من مكانه", "page": 26}, {"ar": "نسخ", "en": "Copy", "def": "أمر ينشئ نسخة مع بقاء الأصل", "page": 26}, {"ar": "لصق", "en": "Paste", "def": "أمر يضع المنسوخ أو المقصوص في الموقع الجديد", "page": 26}, {"ar": "إعادة التسمية", "en": "Rename", "def": "أمر لتغيير اسم الملف أو المجلد", "page": 25}, {"ar": "الحاسبة", "en": "Calculator", "def": "برنامج لإجراء العمليات الحسابية", "page": 27}], "match": {"title": "طابق الأمر بوظيفته", "page": 26, "pairs": [["قص (Cut)", "نقل المجلد من مكانه"], ["نسخ (Copy)", "إنشاء نسخة مع بقاء الأصل"], ["لصق (Paste)", "وضع المجلد في الموقع الجديد"], ["إعادة التسمية (Rename)", "تغيير اسم المجلد"]]}, "order": {"title": "رتب خطوات إنشاء مجلد جديد", "page": 24, "steps": ["اضغط بزر الفأرة الأيمن في مساحة فارغة", "اختر جديد (New)", "اختر مجلد (Folder)", "اكتب اسم المجلد", "اضغط Enter"]}, "qs": [{"t": "mc", "q": "ماذا نسمي الشاشة الرئيسية لنظام التشغيل؟", "o": ["سطح المكتب", "سلة المحذوفات", "شريط المهام"], "a": 0, "why": "تسمى الشاشة الرئيسية سطح المكتب (Desktop) (ص20).", "lvl": 1}, {"t": "mc", "q": "ما الذي يدل على نوع الملف؟", "o": ["امتداد الملف", "لون الشاشة", "حجم الفأرة"], "a": 0, "why": "لكل ملف امتداد يشير إلى نوعه (ص21).", "lvl": 1}, {"t": "mc", "q": "كيف تُنشئ مجلدًا جديدًا؟", "o": ["ضغط بزر الفأرة الأيمن ثم جديد ثم مجلد", "فتح سلة المحذوفات", "إغلاق الحاسب"], "a": 0, "why": "جديد (New) ثم مجلد (Folder) (ص24).", "lvl": 1}, {"t": "mc", "q": "أي أمر تستخدمه لنقل مجلد إلى مكان آخر؟", "o": ["قص ثم لصق", "حذف ثم إغلاق", "نسخ فقط"], "a": 0, "why": "قص (Cut) ثم لصق (Paste) (ص26).", "lvl": 1}, {"t": "mc", "q": "ما المجلد الفرعي؟", "o": ["مجلد داخل مجلد آخر", "ملف صوتي", "برنامج للرسم"], "a": 0, "why": "المجلد الفرعي هو مجلد داخل مجلد آخر (ص25).", "lvl": 2}, {"t": "tf", "q": "عند نسخ الملف يبقى الأصل في مكانه.", "a": true, "why": "النسخ ينشئ نسخة جديدة مع بقاء الأصل (ص26).", "lvl": 1}, {"t": "tf", "q": "عند نقل الملف يبقى الأصل في مكانه الأول.", "a": false, "why": "النقل يحذف الملف من مكانه الأصلي (ص26).", "lvl": 1}, {"t": "tf", "q": "يمكن استخدام الرمز * في اسم المجلد.", "a": false, "why": "لا تُستخدم الرموز / \\ : * ؟ \" < > | في اسم المجلد (ص25).", "lvl": 2}, {"t": "fill", "q": "الشاشة الرئيسية لنظام التشغيل تسمى سطح ___.", "a": ["المكتب"], "why": "سطح المكتب (ص20).", "lvl": 2}, {"t": "fill", "q": "المجلد داخل مجلد آخر يسمى مجلدًا ___.", "a": ["فرعيا", "فرعيًا", "فرعي"], "why": "المجلد الفرعي (ص25).", "lvl": 2}, {"t": "fill", "q": "لتغيير اسم المجلد نختار أمر إعادة ___.", "a": ["التسمية"], "why": "إعادة التسمية (Rename) (ص25).", "lvl": 2}], "summary": ["سطح المكتب هو الشاشة الرئيسية لنظام التشغيل", "الملف بيانات مخزنة، وامتداده يدل على نوعه", "المجلد ينظم الملفات، وقد يحتوي مجلدات فرعية", "النسخ يُبقي الأصل، والنقل يحذفه من مكانه الأول"], "challenge": {"text": "تحدي الدرس: افتح «مختبر المهارات» ونفّذ مهام المجلدات كلها: إنشاء ونقل ونسخ وإعادة تسمية وحذف.", "q": {"t": "mc", "q": "تريد نسخة من ملف وتبقي الأصل مكانه. ماذا تستخدم؟", "o": ["نسخ ثم لصق", "قص ثم لصق", "حذف"], "a": 0, "why": "النسخ يُبقي الأصل (ص26).", "lvl": 1}}}, "g4-u1-l3": {"id": "g4-u1-l3", "grade": 4, "pages": "33-36", "lab": "settings", "intro": {"question": "هل تحب أن تجعل شاشة حاسبك بشكلك المفضل؟ ما الذي تود تغييره فيها؟", "goals": ["أغير التاريخ والوقت في الحاسب", "أضبط دقة الشاشة", "أغير خلفية سطح المكتب", "أضبط مستوى صوت الحاسب"]}, "cards": [{"title": "التاريخ والوقت", "text": "يظهر التاريخ والوقت في الجانب الأيسر من شريط المهام. لتغييرهما اضغط بزر الفأرة الأيمن عليهما واختر ضبط التاريخ/الوقت (Adjust date/time)، ثم تغيير (Change)، وحدد التاريخ والوقت واضغط تغيير. ولتغيير المنطقة الزمنية اختر الدولة من قسم المنطقة الزمنية (Time Zone).", "page": 33}, {"title": "إعدادات الشاشة", "text": "دقة الشاشة تحدد وضوح النصوص والصور، ووحدتها البكسل. الشاشة الأعلى دقة تُظهر النصوص والصور بوضوح أكبر، والأقل دقة تُظهرها بحجم أكبر ووضوح أقل.", "page": 34}, {"title": "تغيير دقة الشاشة", "text": "اضغط بزر الفأرة الأيمن على مساحة فارغة من سطح المكتب واختر إعدادات العرض (Display settings)، ثم اضغط السهم بجوار الدقة (Resolution) واختر الدقة الجديدة، ثم اضغط الاحتفاظ بالتغييرات (Keep changes) أو إرجاع (Revert).", "page": 34}, {"title": "تغيير مظهر سطح المكتب", "text": "يمكنك تخصيص سطح المكتب بصورة خلفية تعجبك: اضغط بزر الفأرة الأيمن على مساحة فارغة واختر تخصيص (Personalize)، ثم الخلفية (Background)، واختر الصورة التي تعجبك.", "page": 35}, {"title": "أصوات النظام", "text": "ابحث عن أيقونة مكبر الصوت على الجانب الأيمن من شريط المهام. اضغط عليها بزر الفأرة الأيمن واختر فتح خالط مستوى الصوت (Open Volume Mixer) لضبط مستوى الصوت، ويمكنك سحب الشريط لأعلى أو لأسفل.", "page": 35}], "terms": [{"ar": "شريط المهام", "en": "Taskbar", "def": "الشريط الذي يظهر فيه التاريخ والوقت وأيقونة الصوت", "page": 33}, {"ar": "المنطقة الزمنية", "en": "Time Zone", "def": "تحدد الوقت حسب الدولة التي تختارها", "page": 33}, {"ar": "الدقة", "en": "Resolution", "def": "تحدد وضوح النصوص والصور على الشاشة", "page": 34}, {"ar": "البكسل", "en": "Pixel", "def": "وحدة قياس دقة الشاشة", "page": 34}, {"ar": "الخلفية", "en": "Background", "def": "صورة سطح المكتب التي تختارها", "page": 35}, {"ar": "خالط مستوى الصوت", "en": "Volume Mixer", "def": "نافذة تضبط مستوى صوت الحاسب", "page": 35}], "match": {"title": "طابق الإعداد بما يفعله", "page": 34, "pairs": [["الدقة", "تحدد وضوح النصوص والصور"], ["الخلفية", "صورة سطح المكتب"], ["المنطقة الزمنية", "تحدد الوقت حسب الدولة"], ["خالط مستوى الصوت", "يضبط مستوى الصوت"]]}, "order": {"title": "رتب خطوات تغيير دقة الشاشة", "page": 34, "steps": ["اضغط بزر الفأرة الأيمن على مساحة فارغة من سطح المكتب", "اختر إعدادات العرض (Display settings)", "اضغط السهم بجوار الدقة (Resolution)", "اختر الدقة الجديدة", "اضغط الاحتفاظ بالتغييرات (Keep changes)"]}, "qs": [{"t": "mc", "q": "أين يظهر التاريخ والوقت؟", "o": ["في شريط المهام", "في سلة المحذوفات", "داخل الفأرة"], "a": 0, "why": "يظهران في الجانب الأيسر من شريط المهام (ص33).", "lvl": 1}, {"t": "mc", "q": "ما وحدة قياس دقة الشاشة؟", "o": ["البكسل", "المتر", "اللتر"], "a": 0, "why": "تُقاس الدقة بوحدة البكسل (ص34).", "lvl": 1}, {"t": "mc", "q": "أي أمر نختاره لتغيير الخلفية؟", "o": ["تخصيص ثم الخلفية", "إعادة التسمية", "لصق"], "a": 0, "why": "تخصيص (Personalize) ثم الخلفية (Background) (ص35).", "lvl": 1}, {"t": "mc", "q": "كيف نضبط مستوى الصوت؟", "o": ["بسحب شريط خالط مستوى الصوت", "بتغيير اسم الملف", "بحذف الملف"], "a": 0, "why": "نفتح خالط مستوى الصوت ونحرك الشريط (ص35).", "lvl": 1}, {"t": "mc", "q": "أي دقة تُظهر النصوص والصور بوضوح أكبر؟", "o": ["الدقة الأعلى", "الدقة الأقل", "لا فرق"], "a": 0, "why": "الشاشة الأعلى دقة تُظهر المحتوى بوضوح أكبر (ص34).", "lvl": 2}, {"t": "tf", "q": "يمكن تغيير المنطقة الزمنية في إعدادات التاريخ والوقت.", "a": true, "why": "نختار الدولة من قسم المنطقة الزمنية (ص33).", "lvl": 1}, {"t": "tf", "q": "تحدد دقة الشاشة صوت الحاسب.", "a": false, "why": "الدقة تحدد وضوح النصوص والصور وليس الصوت (ص34).", "lvl": 1}, {"t": "tf", "q": "نستطيع أن نضع صورة نختارها خلفية لسطح المكتب.", "a": true, "why": "من تخصيص ثم الخلفية (ص35).", "lvl": 1}, {"t": "fill", "q": "بعد اختيار الدقة الجديدة نضغط الاحتفاظ ___.", "a": ["بالتغييرات"], "why": "الاحتفاظ بالتغييرات (Keep changes) (ص34).", "lvl": 2}, {"t": "fill", "q": "وحدة قياس الدقة هي ___.", "a": ["البكسل", "بكسل"], "why": "البكسل (ص34).", "lvl": 2}], "summary": ["التاريخ والوقت والمنطقة الزمنية تُضبط من شريط المهام", "دقة الشاشة تحدد وضوح النصوص والصور", "الخلفية تُغيَّر من تخصيص", "مستوى الصوت يُضبط من خالط مستوى الصوت"], "challenge": {"text": "تحدي الدرس: افتح «مختبر المهارات» ونفّذ مهام الإعدادات الأربع.", "q": {"t": "mc", "q": "أردت جعل الصور أوضح على الشاشة. ماذا تغير؟", "o": ["الدقة", "اسم الملف", "مستوى الصوت"], "a": 0, "why": "الدقة الأعلى أوضح (ص34).", "lvl": 1}}}, "g4-u2-l1": {"id": "g4-u2-l1", "grade": 4, "pages": "44-51", "lab": "word", "intro": {"question": "تخيل أنك تريد كتابة اسمك في الحاسب. ما الجهاز الذي ستستخدمه؟", "goals": ["أتعرف على مفاتيح لوحة المفاتيح المهمة", "أفتح برنامج مايكروسوفت وورد", "أكتب أرقامًا وكلمات بالعربية والإنجليزية", "أنشئ سطرًا جديدًا وأبدل لغة الكتابة"]}, "cards": [{"title": "لوحة المفاتيح", "text": "لوحة المفاتيح جهاز تكتب به النصوص والأرقام. من مفاتيحها: مفاتيح الكتابة (الحروف والأرقام والرموز)، والمسافة لإضافة فراغ، وEnter لإنشاء سطر جديد، وCaps Lock لكتابة الحروف الإنجليزية الكبيرة، ومفاتيح الأسهم. وتذكر أن تضع يديك على لوحة المفاتيح بشكل صحيح أثناء الكتابة.", "page": 44}, {"title": "فتح برنامج مايكروسوفت وورد", "text": "لكتابة النصوص نستخدم برنامج معالجة النصوص مثل مايكروسوفت وورد (Microsoft Word). اضغط زر بدء (Start)، ومرر القائمة إلى أسفل، ثم اضغط أيقونة Word، ثم اضغط مستند فارغ (Blank document). تظهر في الصفحة إشارة وامضة تسمى المؤشر، وتشير إلى موضع الكتابة.", "page": 45}, {"title": "اكتب أرقامًا", "text": "اضغط بالفأرة على الصفحة البيضاء مرة واحدة لتبدأ الكتابة، ثم اكتب الأرقام التي تريدها باستخدام لوحة المفاتيح، مثل: 54321.", "page": 46}, {"title": "اكتب باللغة العربية", "text": "يمكنك استخدام لوحة المفاتيح لكتابة الحروف والكلمات والجمل والفقرات باللغة العربية: اضغط بالفأرة على الصفحة البيضاء مرة واحدة، ثم اكتب الحروف التي تريدها، مثل: مرحبا.", "page": 47}, {"title": "اضغط مفتاح Enter لإنشاء سطر جديد", "text": "اضغط مفتاح Enter في نهاية الكلمة أو الجملة لتبدأ بعدها بسطر جديد.", "page": 48}, {"title": "اكتب باللغة الإنجليزية", "text": "للتبديل بين لغة الكتابة العربية والإنجليزية اضغط المفتاحين Alt وShift معًا. تذكر أن تبقي الضغط على Alt أثناء الضغط على Shift.", "page": 49}, {"title": "اتجاه النص", "text": "عند الكتابة بالإنجليزية يحتاج النص إلى التغيير ليبدأ من اليسار إلى اليمين: من تبويب الشريط الرئيس (Home) وفي قسم فقرة (Paragraph) اضغط اتجاه النص من اليسار لليمين (Left-To-Right Text Direction)، ثم بدّل اللغة بـ Alt + Shift واكتب، مثل: hello.", "page": 50}], "terms": [{"ar": "لوحة المفاتيح", "en": "Keyboard", "def": "جهاز نكتب به النصوص والأرقام", "page": 44}, {"ar": "مايكروسوفت وورد", "en": "Microsoft Word", "def": "برنامج لمعالجة النصوص", "page": 45}, {"ar": "المؤشر", "en": "Cursor", "def": "إشارة وامضة تدل  "مفتاح Enter (ص48).", "lvl": 2}, {"t": "fill", "q": "الإشارة الوامضة في الصفحة تسمى ___.", "a": ["المؤشر", "مؤشر"], "why": "المؤشر (ص45).", "lvl": 2}], "summary": ["لوحة المفاتيح نكتب بها الحروف والأرقام والرموز", "نفتح وورد من زر بدء ثم نختار مستند فارغ", "Enter ينشئ سطرًا جديدًا", "Alt + Shift يبدلان لغة الكتابة"], "challenge": {"text": "تحدي الدرس: افتح برنامج وورد واكتب «مرحبا» ثم سطرًا جديدًا.", "q": {"t": "mc", "q": "تريد البدء بسطر جديد. ماذا تضغط؟", "o": ["Enter", "Alt", "Caps Lock"], "a": 0, "why": "Enter (ص48).", "lvl": 1}}}, "g4-u2-l2": {"id": "g4-u2-l2", "grade": 4, "pages": "53-63", "lab": "word", "intro": {"question": "أخطأت في كتابة كلمة. كيف تصححها دون إعادة كتابة كل شيء؟", "goals": ["أحذف الحروف بـ Backspace وDelete", "أحرك المؤشر بمفاتيح الأسهم", "أحدد النص بالفأرة وبلوحة المفاتيح", "أكتب الحروف الكبيرة والهمزة والرموز بمفتاح Shift"]}, "cards": [{"title": "استخدام مفتاح Backspace للحذف", "text": "من المعتاد الوقوع في أخطاء أثناء كتابة النص ولا بد من تصحيحها. يستخدم مفتاح Backspace لحذف الحرف الذي يسبق مؤشر الكتابة.", "page": 53}, {"title": "استخدام مفتاح Delete للحذف", "text": "يستخدم مفتاح Delete لحذف الحرف الذي يلي المؤشر. ويظل المؤشر في نفس المكان بعد الحذف، وهذا مفيد إذا أردت إجراء تعديلات على جزء معين من النص.", "page": 54}, {"title": "إضافة مسافة في النص", "text": "مفتاح المسافة (Spacebar) يضيف مسافة فارغة بين الكلمات والجمل.", "page": 55}, {"title": "تحريك المؤشر بمفاتيح الأسهم", "text": "تحرك مفاتيح الأسهم المؤشر في كل الاتجاهات: لأعلى ولأسفل ولليمين ولليسار.", "page": 56}, {"title": "تحديد النص بالفأرة", "text": "اضغط بالفأرة في المكان الذي تريد أن يبدأ منه التحديد، ثم اضغط زر الفأرة الأيسر واسحب في اتجاه النص الذي تريد تحديده، ثم اترك الفأرة.", "page": 57}, {"title": "تحديد النص بلوحة المفاتيح", "text": "ضع المؤشر قرب المكان الذي تريد أن يبدأ منه التحديد، ثم اضغط مفتاح Shift باستمرار مع الضغط على أحد مفاتيح الأسهم، ثم اترك المفاتيح بعد تحديد النص.", "page": 58}, {"title": "حذف النص المحدد", "text": "لحذف كلمة أو جملة كاملة حدد النص ثم اضغط Delete أو Backspace.", "page": 59}, {"title": "كتابة الحروف الكبيرة بالإنجليزية", "text": "بعض الكلمات تحتوي على حروف كبيرة. اضغط Shift باستمرار ثم اضغط الحرف المطلوب. ويمكنك استخدام Caps Lock لكتابة كل الحروف بشكل كبير، وإعادة الضغط عليه للعودة إلى الكتابة العادية.", "page": 60}, {"title": "استخدام مفتاح العالي (Shift)", "text": "عند كتابة الكلمات العربية التي تحتوي على همزة (أ) تحتاج إلى مفتاح العالي: اضغط Shift باستمرار ثم اضغط حرف H لتكتب الهمزة. وتستخدم Shift أيضًا للفاصلة والنقطة.", "page": 61}], "terms": [{"ar": "Backspace", "en": "Backspace", "def": "يحذف الحرف الذي يسبق المؤشر", "page": 53}, {"ar": "Delete", "en": "Delete", "def": "يحذف الحرف الذي يلي المؤشر", "page": 54}, {"ar": "مفاتيح الأسهم", "en": "Arrow Keys", "def": "تحرك المؤشر في كل الاتجاهات", "page": 56}, {"ar": "تحديد النص", "en": "Select Text", "def": "تعليم جزء من النص لتطبيق تغيير عليه", "page": 57}, {"ar": "Shift", "en": "Shift", "def": "مفتاح العالي للحروف الكبيرة والرموز", "page": 60}, {"ar": "Caps Lock", "en": "Caps Lock", "def": "يجعل الحروف الإنجليزية كبيرة باستمرار", "page": 60}], "match": {"title": "طابق المفتاح بوظيفته", "page": 53, "pairs": [["Backspace", "حذف الحرف الذي يسبق المؤشر"], ["Delete", "حذف الحرف الذي يلي المؤشر"], ["مفاتيح الأسهم", "تحريك المؤشر"], ["Shift", "كتابة الحرف الكبير أو الرمز"]]}, "order": {"title": "رتب خطوات تحديد نص بالفأرة", "page": 57, "steps": ["اكتب النص في سطر جديد", "اضغط بالفأرة على المكان الذي يبدأ منه التحديد", "اضغط زر الفأرة الأيسر واسحب فوق النص", "اترك الفأرة بعد تحديد النص"]}, "qs": [{"t": "mc", "q": "أي مفتاح يحذف الحرف الذي يسبق المؤشر؟", "o": ["Backspace", "Delete", "Enter"], "a": 0, "why": "Backspace يحذف الحرف قبل المؤشر (ص53).", "lvl": 1}, {"t": "mc", "q": "أي مفتاح يحذف الحرف الذي يلي المؤشر؟", "o": ["Delete", "Backspace", "Spacebar"], "a": 0, "why": "Delete يحذف الحرف بعد المؤشر (ص54).", "lvl": 1}, {"t": "mc", "q": "كيف أكتب حرفًا إنجليزيًا كبيرًا مرة واحدة؟", "o": ["Shift مع الحرف", "Alt مع الحرف", "Enter"], "a": 0, "why": "نضغط Shift باستمرار ثم الحرف (ص60).", "lvl": 1}, {"t": "mc", "q": "ماذا تفعل مفاتيح الأسهم؟", "o": ["تحرك المؤشر", "تحذف الملفات", "تطبع الصفحة"], "a": 0, "why": "تحرك المؤشر في كل الاتجاهات (ص56).", "lvl": 1}, {"t": "tf", "q": "بعد الحذف بمفتاح Delete يبقى المؤشر في نفس المكان.", "a": true, "why": "كما في نصيحة ذكية (ص54).", "lvl": 1}, {"t": "tf", "q": "نضغط Shift باستمرار مع الأسهم لتحديد النص بلوحة المفاتيح.", "a": true, "why": "ص58.", "lvl": 1}, {"t": "tf", "q": "مفتاح المسافة يحذف الكلمة.", "a": false, "why": "المسافة تضيف فراغًا بين الكلمات (ص55).", "lvl": 1}, {"t": "fill", "q": "يستخدم مفتاح ___ لحذف الحرف الذي يسبق المؤشر.", "a": ["Backspace"], "why": "ص53.", "lvl": 2}, {"t": "fill", "q": "لكتابة همزة (أ) نضغط Shift مع حرف ___.", "a": ["H", "h"], "why": "الهمزة مع H (ص61).", "lvl": 2}], "summary": ["Backspace يحذف قبل المؤشر وDelete يحذف بعده", "الأسهم تحرك المؤشر وShift معها يحدد النص", "المسافة تفصل بين الكلمات", "Shift للحروف الكبيرة والرموز والهمزة"], "challenge": {"text": "تحدي الدرس: اكتب كلمة في برنامج وورد ثم اضغط Backspace لتحذف آخر حرف.", "q": {"t": "mc", "q": "أخطأت في الحرف الذي كتبته للتو. أي مفتاح تضغط؟", "o": ["Backspace", "Enter", "Caps Lock"], "a": 0, "why": "Backspace (ص53).", "lvl": 1}}}, "g4-u2-l3": {"id": "g4-u2-l3", "grade": 4, "pages": "66-72", "lab": "word", "intro": {"question": "كيف تجعل عنوان مقالك مميزًا وجذابًا؟", "goals": ["أجعل النص غامقًا ومائلًا ومسطرًا", "أغير نوع الخط وحجمه ولونه", "أميز النص وأبحث عنه", "أتراجع عن إجراء وأحفظ عملي"]}, "cards": [{"title": "حان وقت التنسيق", "text": "تتيح لك برامج معالجة النصوص مثل مايكروسوفت وورد تحرير النصوص لتصبح أكثر وضوحًا وجاذبية. لجعل النص غامقًا (Bold) أو مائلًا (Italic) أو مسطرًا (Underline): ظلل النص، ثم من تبويب الشريط الرئيسي (Home) ومجموعة الخط (Font) اضغط الأمر المناسب.", "page": 66}, {"title": "تمييز النص", "text": "يمكنك تمييز بعض الأجزاء في نصك لجعلها بارزة: من مجموعة الخط (Font) اضغط السهم بجانب لون تمييز النص (Text Highlight Color)، واختر اللون. للعودة للوضع الطبيعي اضغط إيقاف (Stop Highlighting).", "page": 67}, {"title": "إنشاء العنوان وتغيير نوع الخط", "text": "يجب أن يكون عنوان المقالة مميزًا ومفهومًا. لتغيير نوع الخط: ظلل النص، ثم اضغط السهم بجانب زر الخط (Font) من مجموعة الخط واختر نوع الخط مثل عربي (Adobe Arabic).", "page": 67}, {"title": "تغيير حجم الخط ولونه", "text": "لتغيير حجم الخط ظلل النص ثم اضغط السهم بجانب حجم الخط (Font size) واختر الحجم. ولتغيير اللون اضغط السهم بجانب لون الخط (Font color) واختر اللون.", "page": 68}, {"title": "البحث عن النص", "text": "إذا كان مستندك كبيرًا وأردت العثور على كلمة بسرعة استخدم خيار البحث (Find): من تبويب الشريط الرئيسي ومجموعة تحرير (Editing) اضغط بحث، ثم اكتب الكلمة. ويمكنك استخدام الاختصار Ctrl + F.", "page": 69}, {"title": "التراجع عن إجراء", "text": "إذا أردت التراجع عن تنسيق قمت به اضغط على زر تراجع (Undo) أو اضغط Ctrl + Z. لا يمكن التراجع عن بعض الإجراءات مثل حفظ الملف.", "page": 70}, {"title": "التكبير والتصغير", "text": "لتغيير حجم النص الظاهر على الشاشة استخدم شريط التكبير والتصغير في أسفل النافذة، واسحب شريط التمرير لليسار للتصغير أو لليمين للتكبير.", "page": 70}, {"title": "حفظ عملك", "text": "عندما تنشئ مستندًا يجب عليك حفظه لتتمكن من الرجوع إليه. اضغط ملف (File) ثم حفظ باسم (Save as)، واختر الموقع (مثل المستندات)، واكتب اسم الملف في مربع اسم الملف (File name)، ثم اضغط حفظ (Save).", "page": 70}, {"title": "فتح ملف", "text": "لفتح ملف محفوظ: من تبويب ملف (File) اضغط فتح (Open) أو اضغط Ctrl + O، ثم استعرض (Browse) إلى الموقع، واختر الملف، ثم اضغط فتح.", "page": 71}], "terms": [{"ar": "غامق", "en": "Bold", "def": "تنسيق يجعل النص سميكًا", "page": 66}, {"ar": "مائل", "en": "Italic", "def": "تنسيق يجعل النص مائلًا", "page": 66}, {"ar": "تسطير", "en": "Underline", "def": "خط تحت النص", "page": 66}, {"ar": "الخط", "en": "Font", "def": "نوع الحروف المستخدمة في النص", "page": 67}, {"ar": "تمييز النص", "en": "Highlight", "def": "تلوين خلفية النص", "page": 67}, {"ar": "بحث", "en": "Find", "def": "للعثور على كلمة في المستند", "page": 69}, {"ar": "تراجع", "en": "Undo", "def": "يلغي آخر تنسيق، allenge": {"text": "تحدي الدرس: اكتب عنوانًا في برنامج وورد ثم ظلله واجعله غامقًا ومائلًا ومسطرًا.", "q": {"t": "mc", "q": "أردت إبراز كلمة بخلفية صفراء. ماذا تستخدم؟", "o": ["لون تمييز النص", "البحث", "فتح"], "a": 0, "why": "لون تمييز النص (Text Highlight Color) (ص67).", "lvl": 1}}}, "g4-u2-l4": {"id": "g4-u2-l4", "grade": 4, "pages": "74-79", "lab": "word", "intro": {"question": "كيف تنظم رسالة أو مقالة طويلة بحيث تظهر أجمل وأسهل في القراءة؟", "goals": ["أحاذي النص لليمين والوسط واليسار", "أضيف حدودًا وتظليلًا", "أنشئ قائمة نقطية أو مرقمة", "أدرج رموزًا في المستند"]}, "cards": [{"title": "الفقرة", "text": "الفقرة مجموعة من الجمل تشمل فكرة أو معنى رئيسيًا واحدًا. تستخدم الفقرات في كتابة الرسائل والمقالات، ويمكن تنسيقها بالمحاذاة والمسافة البادئة والحدود والتظليل.", "page": 74}, {"title": "محاذاة النص", "text": "من تبويب الشريط الرئيسي (Home) وفي قسم فقرة (Paragraph) اختر محاذاة النص: لليمين (Ctrl + R)، أو توسيط النص (Ctrl + E)، أو لليسار (Ctrl + L)، أو ملء السطر (Ctrl + J).", "page": 74}, {"title": "الحدود والتظليل", "text": "الحدود والتظليل تجعل النصوص تبدو أفضل وأسهل في القراءة. لتظليل نص: ظلل الفقرة، ثم اضغط السهم بجوار زر تعبئة (Fill) واختر اللون.", "page": 75}, {"title": "إضافة حدود", "text": "لإضافة حد: ظلل الكلمة أو الفقرة، ثم اضغط السهم بجانب زر حدود (Border) واختر نوع الحد، مثل: حد سفلي، حد علوي، بلا حدود، حدود خارجية، حد أيسر، حد أيمن.", "page": 76}, {"title": "التعداد النقطي والترقيم", "text": "لإنشاء قائمة تعداد نقطي: من مجموعة فقرة اضغط السهم بجانب أيقونة التعداد النقطي (Bullets)، واختر الرمز، ثم اكتب كلمة أو عبارة واضغط Enter. ولإنهاء القائمة اضغط Enter مرتين أو Backspace. وقائمة الأرقام تُنشأ بنفس الخطوات من الترقيم.", "page": 77}, {"title": "إدراج الرموز", "text": "لإدراج رمز: اضغط على الموضع الذي تريد إدراج الرمز فيه، ثم من تبويب إدراج (Insert) وفي مجموعة رموز اضغط رمز (Symbol)، ثم اختر الرمز الذي تريد استخدامه.", "page": 78}], "terms": [{"ar": "الفقرة", "en": "Paragraph", "def": "مجموعة من الجمل تشمل فكرة رئيسية واحدة", "page": 74}, {"ar": "المحاذ ر", "الحدود والتظليل تجمّلان الفقرة", "Bullets و Numbering تنشئان قوائم", "الرموز من تبويب إدراج"], "challenge": {"text": "تحدي الدرس: أنشئ في برنامج وورد قائمة نقطية وتوسيطًا لعنوان.", "q": {"t": "mc", "q": "تريد قائمة بعناصر نقطية. ماذا تستخدم؟", "o": ["Bullets", "Find", "Undo"], "a": 0, "why": "Bullets (ص77).", "lvl": 1}}}, "g4-u3-l1": {"id": "g4-u3-l1", "grade": 4, "pages": "88-93", "lab": "web", "intro": {"question": "كيف تصل إلى موقع إلكتروني على الجهة الأخرى من العالم خلال ثوانٍ؟ وما البرنامج الذي يساعدك؟", "goals": ["أعرّف الإنترنت ومتصفح المواقع الإلكترونية", "أفتح المتصفح وأزور موقعًا بكتابة عنوانه", "أعرض معلومات الصفحة بشريط التمرير", "أنتقل إلى صفحات أخرى عبر الروابط التشعبية"]}, "cards": [{"title": "الإنترنت", "text": "الإنترنت هو شبكة عالمية كبيرة تربط بين الكثير من أجهزة الحاسب المختلفة والأجهزة الذكية حول العالم، وتسمح لنا بتبادل المعلومات والتواصل مع الآخرين بسرعة وسهولة. يمكنك زيارة أي موقع إلكتروني أو البحث عن أي معلومة تريدها بسرعة عالية. ولتحقيق ذلك تحتاج إلى برنامج يسمى متصفح المواقع الإلكترونية، وجهاز حاسب آلي، واتصال بالإنترنت.", "page": 88}, {"title": "متصفح المواقع الإلكترونية", "text": "متصفح المواقع الإلكترونية هو برنامج تستخدمه لفتح ومشاهدة الصفحات الموجودة على الإنترنت. من أمثلته: مايكروسوفت إيدج (Microsoft Edge)، وجوجل كروم (Google Chrome)، وأوبرا (Opera)، وسفاري (Safari)، وموزيلا فايرفوكس (Mozilla Firefox). ويمكنك العثور على مايكروسوفت إيدج على جميع أجهزة الحاسب التي تم تثبيت نظام مايكروسوفت ويندوز عليها.", "page": 88}, {"title": "فتح المتصفح", "text": "1) اضغط أيقونة مايكروسوفت إيدج من شريط المهام. 2) يتم فتح الصفحة الرئيسة للمتصفح.", "page": 88}, {"title": "زيارة موقع إلكتروني", "text": "لزيارة موقع إلكتروني يجب عليك معرفة عنوانه الخاص؛ حيث يُعدُّ عنوان الموقع طريقةً سهلةً لتذكره وفتحه. في شريط العنوان اكتب عنوان الصفحة التي تريد فتحها، على سبيل المثال موقع الهيئة الملكية لمدينة الرياض: www.rcrc.gov.sa ثم اضغط Enter.", "page": 89}, {"title": "عرض المعلومات داخل الصفحة", "text": "يمكن عرض محتويات الصفحة بالتمرير إلى أعلى وأسفل باستخدام شريط التمرير.", "page": 90}, {"title": "الانتقال إلى صفحات أخرى مرتبطة", "text": "يمكن الانتقال إلى صفحات أخرى مرتبطة من خلال الضغط على الروابط التشعبية. لاستخدام الروابط التشعبية: 1) اضغط على الرابط التشعبي. 2) ثم تُفتح صفحة جديدة. عند وضع المؤشر على رابط تشعبي يتغير السهم إلى يد صغيرة تشير إلى الرابط.", "page": 90}, {"title": "مواقع تتجدد", "text": "تخضع هذه المواقع للتحديث الدائم، ويظهر تاريخ تحديث للموقع في أسفل الصفحة في أغلب الأحيان.", "page": 90}], "terms": [{"ar": "الإنترنت", "en": "Internet", "def": "شبكة عالمية تربط أجهزة الحاسب والأجهزة الذكية حول العالم", "page": 88}, {"ar": "متصفح المواقع", "en": "Web Browser", "def": "برنامج لفتح ومشاهدة الصفحات على الإنترنت", "page": 88}, {"ar": "شريط العنوان", "en": "Address Bar", "def": "مكان كتابة عنوان الموقع", "page": 89}, {"ar": "الرابط التشعبي", "en": "Hyperlink", "def": "نص أو صورة تنقلك إلى صفحة أخرى عند الضغط عليه", "page": 90}, {"ar": "شريط التمرير", "en": "Scroll Bar", "def": "لعرض محتوى الصفحة إلى أعلى وأسفل", "page": 90}], "match": {"title": "طابق المتصفح باسمه", "page": 88, "pairs": [["Microsoft Edge", "مايكروسوفت إيدج"], ["Google Chrome", "جوجل كروم"], ["Mozilla Firefox", "موزيلا فايرفوكس"], ["Safari", "سفاري"]]}, "order": {"title": "رتب خطوات زيارة موقع إلكتروني", "page": 89, "steps": ["افتح متصفح مايكروسوفت إيدج من شريط المهام", "اكتب عنوان الموقع في شريط العنوان", "اضغط مفتاح Enter", "استخدم شريط التمرير لعرض بقية الصفحة"]}, "qs": [{"t": "mc", "q": "ما الإنترنت؟", "o": ["شبكة عالمية تربط أجهزة الحاسب حول العالم", "برنامج لكتابة النصوص", "جهاز لطباعة الأوراق"], "a": 0, "why": "ص88.", "lvl": 1}, {"t": "mc", "q": "ما البرنامج الذي نستخدمه لفتح المواقع الإلكترونية؟", "o": ["متصفح المواقع", "الحاسبة", "الرسام"], "a": 0, "why": "ص88.", "lvl": 1}, {"t": "mc", "q": "أي مما يأتي متصفح مواقع؟", "o": ["مايكروسوفت إيدج", "مايكروسوفت وورد", "سكراتش"], "a": 0, "why": "ص88.", "lvl": 1}, {"t": "mc", "q": "أين نكتب عنوان الموقع؟", "o": ["شريط العنوان", "شريط المهام", "سطح المكتب"], "a": 0, "why": "ص89.", "lvl": كيف تجد معلومة لا تعرف أين توجد؟", "goals": ["أستخدم أدوات المتصفح", "أعرّف عنوان الموقع (URL)", "أبحث في الإنترنت بمحرك بحث", "أتنقل بين صفحات نتائج البحث"]}, "cards": [{"title": "أدوات المتصفح", "text": "يحتوي المتصفح على بعض الأدوات التي يمكنك استخدامها للتنقل إلى المواقع الإلكترونية المختلفة بسهولة، ويمكن استخدام هذه الأدوات كما يلي: شريط العنوان (Address bar) لكتابة عنوان موقع على الإنترنت. زر تبويب جديد (New Tab) لعرض أكثر من صفحة في نافذة واحدة. زر الصفحة الرئيسة (Home button) للانتقال إلى الصفحة الرئيسة للمتصفح.", "page": 94}, {"title": "أزرار التنقل", "text": "زر التحديث (Refresh) لإعادة تحميل الصفحة. زر إيقاف (Stop) لإلغاء تحميل الصفحة. زر الرجوع (Back) للانتقال إلى الصفحة السابقة. زر التالي (Forward) للانتقال إلى الصفحة التالية.", "page": 94}, {"title": "عنوان الموقع URL", "text": "يسمى عنوان الموقع الإلكتروني محدد موقع الموارد (Uniform Resource Locator - URL)، ويتم تحديد مواقع الإنترنت بواسطته.", "page": 94}, {"title": "البحث في الإنترنت", "text": "بدلًا من حفظ عناوين المواقع الإلكترونية يمكنك استخدام محرك البحث لمساعدتك في إيجاد ما تبحث عنه. أشهر محركات البحث: www.google.com و www.bing.com.", "page": 95}, {"title": "خطوات استخدام محرك البحث", "text": "1) افتح المتصفح ثم افتح محرك بحث مثل بينج (www.bing.com). 2) اكتب كلمة أو عبارة ذات صلة بما تبحث عنه، على سبيل المثال «برنامج الرياض الخضراء». 3) اضغط على أيقونة «بحث» في الشبكة العنكبوتية. 4) تظهر قائمة النتائج على الشاشة، اضغط على النتيجة التي تراها أكثر ملاءمة.", "page": 95}, {"title": "نتائج البحث", "text": "يساعدك محرك البحث في إيجاد المعلومات والصور ومقاطع الفيديو والأخبار. ومن الممكن أن تحتوي نتيجة البحث الإلكترونية على العشرات أو الآلاف من الصفحات، وبالتالي فإن قائمة النتائج تكون في صفحات كثيرة. اختر صفحة رقم (2) للاطلاع على مزيد من النتائج.", "page": 95}, {"title": "الكلمات الرئيسة", "text": "كلما كانت الكلمات التي تكتبها أكثر دقة وتحديدًا، كانت النتائج أقل عددًا وأقرب إلى ما تريد. فعند البحث عن «السلامة» ستظهر نتائج كثيرة، أما عند البحث عن «السلامة المرورية في المملكة العربية السعودية» فستكون النتائج أقل وأدق.", "page": 98}], "terms": [{"ar": "محرك البحث", "en": "Search Engine", "def": "موقع يساعدك على إيجاد المعلومات بكتابة كلمات البحث", "page": 95}, {"ar": "عنوان الموقع", "en": "URL", "def": "محدد موقع الموارد؛ يحدد موقع الصفحة على الإنترنت", "page": 94}, {"ar": "تبويب جديد", "en": "New Tab", "def": "لعرض أكثر من صفحة في نافذة واحدة", "page": 94}, {"ar": "تحديث", "en": "Refresh", "def": "إعادة تحميل الصفحة", "page": 94}, {"ar": "الكلمات الرئيسة", "en": "Keywords", "def": "كلمات دقيقة تساعد على الوصول للمعلومة", "page": 98}], "match": {"title": "طابق الأداة بوظيفتها", "page": 94, "pairs": [["زر الرجوع", "الانتقال إلى الصفحة السابقة"], ["زر التحديث", "إعادة تحميل الصفحة"], ["زر إيقاف", "إلغاء تحميل الصفحة"], ["زر الصفحة الرئيسة", "الانتقال إلى الصفحة الرئيسة للمتصفح"]]}, "order": {"title": "رتب خطوات البحث في الإنترنت", "page": 95, "steps": ["افتح المتصفح ثم محرك البحث بينج", "اكتب كلمة أو عبارة البحث", "اضغط أيقونة البحث", "اضغط على النتيجة الأكثر ملاءمة"]}, "qs": [{"t": "mc", "q": "ما وظيفة زر التحديث (Refresh)؟", "o": ["إعادة تحميل الصفحة", "إغلاق المتصفح", "فتح تبويب جديد"], "a": 0, "why": "ص94.", "lvl": 1}, {"t": "mc", "q": "أي زر نستخدمه لإلغاء تحميل الصفحة؟", "o": ["إيقاف (Stop)", "الرجوع (Back)", "التالي (Forward)"], "a": 0, "why": "ص94.", "lvl": 1}, {"t": "mc", "q": "بماذا نعرض أكثر من صفحة في نافذة واحدة؟", "o": ["زر تبويب جديد", "زر الرجوع", "زر التحديث"], "a": 0, "why": "ص94.", "lvl": 1}, {"t": "mc", "q": "ما معنى URL؟", "o": ["عنوان الموقع الإلكتروني", "برنامج مكافحة الفيروسات", "نوع من الملفات"], "a": 0, "why": "ص94.", "lvl": 1}, {"t": "mc", "q": "أي مما يأتي محرك بحث؟", "o": ["بينج (Bing)", "مايكروسوفت وورد", "الحاسبة"], "a": 0, "why": "ص95.", "lvl": 1}, {"t": "mc", "q": "لماذا نستخدم محرك البحث؟", "o": ["لنجد المعلومات دون حفظ عناوين المواقع", "لنطبع المستندات", "لنرسم الأشكال"], "a": 0, "why": "ص95.", "lvl": 1}, {"t": "mc", "q": "كيف نطّلع على مزيد من النتائج؟", "o": ["باختيار رقم الصفحة (2)", "بإغلاق المتصفح", "بحذف كلمة البحث"], "a": 0, "why": "ص95.", "lvl": 1}, {"t": "mc", "q": "أي بحث تتوقع أن تكون نتائجه أدق؟", "o": ["السلامة المرورية في المملكة العربية السعودية", "السلامة", "مرور"], "a": 0, "why": "ص98.", "lvl": 2}, {"t": "mc", "q": "ما زر الانتقال إلى الصفحة السابقة؟", "o": ["الرجوع", "التحديث", "إيقاف"], "a": 0, "why": "ص94.", "lvl": 1}, {"t": "tf", "q": "يمكن أن تحتوي نتيجة البحث على آلاف الصفحات.", "a": true, "why": "ص95.", "lvl": 1}, {"t": "tf", "q": "يُستخدم محرك البحث لإيجاد المعلومات والصور والفيديو والأخبار.", "a": true, "why": "ص95.", "lvl": 1}, {"t": "tf", "q": "زر الصفحة الرئيسة يغلق الإنترنت.", "a": false, "why": "ينقلنا إلى الصفحة الرئيسة للمتصفح (ص94).", "lvl": 1}, {"t": "tf", "q": "كلما كانت كلمات البحث أدق كانت النتائج أقرب لما نريد.", "a": true, "why": "ص98.", "lvl": 2}, {"t": "fill", "q": "أشهر محركات البحث: جوجل و ___.", "a": ["بينج", "bing", "Bing"], "why": "ص95.", "lvl": 2}, {"t": "fill", "q": "يسمى عنوان الموقع اختصارًا ___.", "a": ["URL", "url", "Url"], "why": "ص94.", "lvl": 2}], "summary": ["أدوات المتصفح: العنوان، تبويب جديد، الرئيسة، تحديث، إيقاف، رجوع، التالي", "عنوان الموقع اسمه URL", "محرك البحث يجد المعلومات بكلمات البحث", "النتائج في صفحات مرقمة", "الكلمات الدقيقة تعطي نتائج أدق"], "challenge": {"text": "تحدي الدرس: ابحث في «متصفح الإنترنت» عن كلمة، ثم افتح صفحة النتائج رقم (2).", "q": {"t": "mc", "q": "ما أول خطوة في البحث بمحرك البحث؟", "o": ["فتح المتصفح ثم محرك البحث", "طباعة الصفحة", "حذف الملفات"], "a": 0, "why": "ص95.", "lvl": 1}}}, "g4-u3-l3": {"id": "g4-u3-l3", "grade": 4, "pages": "100-105", "lab": "web", "intro": {"question": "هل كل ما يظهر على الإنترنت صحيح؟ وهل يحق لك نسخ أي نص أو صورة؟", "goals": ["أميز المعلومات الموثوقة", "أتحقق من حداثة المعلومات", "أنسخ النص بطريقة صحيحة", "أحترم عمل الآخرين وأذكر المصدر"]}, "cards": [{"title": "المعلومات الموثوقة", "text": "هي المعلومات التي تجدها في مواقع رسمية ومعتمدة؛ فالمدارس والوزارات الحكومية والمكتبات تُنشئ مواقع إلكترونية حتى يتمكن الناس من معرفة عملها وأخبارها والتواصل معها.", "page": 100}, {"title": "ليس كل ما على الإنترنت صحيحًا", "text": "ليس كل ما يُعرض على الإنترنت صحيحًا؛ فهناك مواقع تقدم معلومات صحيحة مثل مواقع وزارة التعليم أو الموسوعة العلمية وغيرها من المواقع المعتمدة، كما أن هناك مواقع تقدم معلومات أخرى غير صحيحة، وقد يكتب أشخاص في مواقع عامة معلومات غير صحيحة. لذلك عليك دائمًا أن تفكر قبل أن تثق بما تقرؤه.", "page": 100}, {"title": "ما يجب الانتباه إليه عند البحث", "text": "يجب أخذ الأمور الآتية بعين الاعتبار عند البحث عبر الإنترنت: 1) ابحث في المواقع التي لها عنوان URL ينتهي بـ .gov أو .edu أو .org أو .com (مع التحقق منها). 2) تحقق من تاريخ تحديث المعلومات على الموقع؛ حيث تحتاج إلى معلومات حديثة.", "page": 100}, {"title": "أمثلة لمواقع موثوقة", "text": "المواقع الحكومية تنتهي بـ gov. مثل موقع وزارة الصحة www.moh.gov.sa. ومواقع المؤسسات التعليمية تنتهي بـ edu. مثل www.ien.edu.sa.", "page": 100}, {"title": "تحقق من حداثة المعلومات", "text": "أفضل طريقة للتحقق من حداثة المعلومات في الصفحة هي بالنظر إلى تاريخ آخر تعديل في الموقع. على سبيل المثال يمكنك الانتقال إلى آخر الأخبار لمعرفة الموضوعات الأخيرة.", "page": 101}, {"title": "نسخ المعلومات", "text": "يمكنك نسخ النص من موقع الإنترنت. لنسخ النص ولصقه: 1) ظلّل النص باستخدام الفأرة، واضغط زر الفأرة الأيمن واختر نسخ (Copy). 2) افتح محرر نصوص مثل الدفتر أو مايكروسوفت وورد، واضغط بزر الفأرة الأيمن واختر لصق (Paste). 3) يُلصق النص المنسوخ في مستند مايكروسوفت وورد.", "page": 102}, {"title": "احترام عمل الآخرين", "text": "ليس من الصواب نسخ واستخدام نص أو صور من الإنترنت دون إذن الأشخاص الذين أنشأوها. فإذا حللتَ مشروعًا واستخدمت أحدهم ونسبته لنفسك فهل ترغب في ذلك؟ لأن ذلك يُعدُّ سرقة للملكية الفكرية وتعدّيًا على حقوق الآخرين. وإذا كنت ترغب في استعارة شيء ما فارجع دائمًا إلى الشخص الذي قام بعمله أو اذكر المصدر واطلب الإذن.", "page": 102}], "terms": [{"ar": "المعلومات الموثوقة", "en": "Reliable information", "def": "معلومات من مواقع رسمية ومعتمدة", "page": 100}, {"ar": "نسخ", "en": "Copy", "def": "أخذ نسخة من النص المحدد", "page": 102}, {"ar": "لصق", "en": "Paste", "def": "وضع النص المنسوخ في مستند", "page": 102}, {"ar": "حقوق النشر", "en": "Copyright", "def": "حقوق صاحب العمل الذي أنشأه", "page": 102}, {"ar": "الملكية الفكرية", "en": "Intellectual property", "def": "حق صاحب الفكرة أو العمل", "page": 102}], "match": {"title": "طابق نهاية العنوان بنوع الموقع", "page": 100, "pairs": [[".gov", "المواقع الحكومية"], [".edu", "المؤسسات التعليمية"], ["Copy", "نسخ"], ["Paste", "لصق"]]}, "order": {"title": "رتب خطوات نسخ نص من موقع إلى وورد", "page": 102, "steps": ["ظلّل النص بالفأرة", "اضغط بالزر الأيمن واختر نسخ", "افتح مايكروسوفت وورد", "اضغط بالزر الأيمن واختر لصق", "اكتب اسم المصدر"]}, "qs": [{"t": "mc", "q": "ما المعلومات الموثوقة؟", "o": ["معلومات من مواقع رسمية ومعتمدة", "أي معلومة على الإنترنت", "معلومات كتبها شخص مجهول"], "a": 0, "why": "ص100.", "lvl": 1}, {"t": "mc", "q": "بماذا ينتهي عنوان الموقع الحكومي؟", "o": [".gov", ".edu", ".xyz"], "a": 0, "why": "ص100.", "lvl": 1}, {"t": "mc", "q": "بماذا ينتهي عنوان موقع المؤسسة التعليمية؟", "o": [".edu", ".gov", ".game"], "a": 0, "why": "ص100.", "lvl": 1}, {"t": "mc", "q": "كيف نتحقق من حداثة المعلومات؟", "o": ["بالنظر إلى تاريخ آخر تعديل في الموقع", "بعدد الصور", "بلون الصفحة"], "a": 0, "why": "ص101.", "lvl": 1}, {"t": "mc", "q": "ماذا نختار بعد تظليل النص لننسخه؟", "o": ["نسخ (Copy)", "لصق (Paste)", "حذف"], "a": 0, "why": "ص102.", "lvl": 1}, {"t": "mc", "q": "أين نلصق النص المنسوخ؟", "o": ["في مستند وورد", "في شريط العنوان فقط", "في سلة المحذوفات"], "a": 0, "why": "ص102.", "lvl": 1}, {"t": "mc", "q": "ماذا نفعل إذا أردنا استخدام عمل شخص آخر؟", "o": ["نذكر المصدر ونطلب الإذن", "ننسبه لأنفسنا", "لا نفعل شيئًا"], "a": 0, "why": "ص102.", "lvl": 1}, {"t": "mc", "q": "ما موقع وزارة الصحة الموثوق في الدرس؟", "o": ["www.moh.gov.sa", "www.free-games.com", "www.unknown.xyz"], "a": 0, "why": "ص100.", "lvl": 2}, {"t": "mc", "q": "نسخ عمل الآخرين دون إذن يُعد...", "o": ["سرقة للملكية الفكرية", "مهارة جيدة", "أمرًا مسموحًا دائمًا"], "a": 0, "why": "ص102.", "lvl": 2}, {"t": "tf", "q": "جميع المعلومات الموجودة على الإنترنت صحيحة.", "a": false, "why": "ليس كل ما يُعرض صحيحًا (ص100).", "lvl": 1}, {"t": "tf", "q": "يمكنك دائمًا نسخ أعمال الآخرين دون ذكر المصدر.", "a": false, "why": "ص102.", "lvl": 1}, {"t": "tf", "q": "المعلومات الأحدث تكون عادة أكثر موثوقية.", "a": true, "why": "ص103.", "lvl": 1}, {"t": "tf", "q": "المدارس فقط هي من تنشر عبر الإنترنت.", "a": false, "why": "تنشر أيضًا الوزارات والمكتبات والشركات (ص100).", "lvl": 1}, {"t": "tf", "q": "المعلومات الموثوقة موجودة في المواقع الرسمية والمعتمدة.", "a": true, "why": "ص103.", "lvl": 2}, {"t": "fill", "q": "أفضل طريقة للتحقق من حداثة المعلومات النظر إلى تاريخ آخر ___.", "a": ["تعديل", "تحديث"], "why": "ص101.", "lvl": 2}], "summary": ["الموثوق: من مواقع رسمية ومعتمدة", "gov. حكومي و edu. تعليمي", "نتحقق من تاريخ آخر تحديث", "ننسخ ونلصق بخطوات صحيحة", "نذكر المصدر ونحترم عمل الآخرين"], "challenge": {"text": "تحدي الدرس: افتح «آخر الأخبار» في موقع حكومي بالمتصفح التدريبي، وانسخ فقرة والصقها في المستند مع ذكر المصدر.", "q": {"t": "mc", "q": "أي موقع أولى بالثقة عند البحث عن معلومة صحية؟", "o": ["موقع وزارة الصحة", "موقع مجهول", "إعلان منبثق"], "a": 0, "why": "ص100.", "lvl": 1}}}, "g4-u3-l4": {"id": "g4-u3-l4", "grade": 4, "pages": "107-117", "lab": "web", "intro": {"question": "كيف تحمي نفسك وجهازك على الإنترنت؟ وكيف تتعامل مع الآخرين بأخلاق حميدة؟", "goals": ["أتعرف أخلاقيات التواصل عبر الإنترنت", "أتصرف بحذر مع الغرباء", "أعرّف الفيروسات وأحمي جهازي", "أطبق قواعد السلوك الآمن"]}, "cards": [{"title": "أخلاقيات التواصل عبر الإنترنت", "text": "تستخدم الإنترنت للبحث عن المعلومات، إضافة لكونه أداة للتواصل مع الآخرين في أنحاء العالم. وعليك في تعاملك معهم أن تتصف بالأخلاق الحميدة، وتكون مهذبًا تمامًا كما في الواقع. وهناك قائمة من القواعد السلوكية عند استخدام الإنترنت تسمى «أخلاقيات الإنترنت». عن أنس بن مالك رضي الله عنه عن النبي ﷺ قال: «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه» رواه البخاري ومسلم.", "page": 107}, {"title": "كن حذرًا", "text": "يجب أن تكون حذرًا ومهذبًا عندما تتواصل عبر الرسائل الفورية والبريد الإلكتروني والمدونات، ولا تتحدث إلى أشخاص لا تعرفهم. عندما يهددك أحد عبر الإنترنت بلّغ شخصًا كبيرًا في الأسرة، لا تخف وتردد. اعلم أن أي شخص يستطيع قراءة مشاركاتك ويطلع عليها في غرفة المحادثة، لذا تجنب استخدام لغة غير لائقة في رسائلك.", "page": 107}, {"title": "المعلومات الشخصية", "text": "لا تعطِ أي معلومات شخصية لأشخاص لا تعرفهم، خاصة إذا سألك: ما عمرك؟ أو رقم هاتفك؟ أو عنوانك؟ فلا تتحدث إليه، وأخبر شخصًا كبيرًا في الأسرة على الفور. فالأشخاص الذين لا تعرفهم قد يرغبون أحيانًا في إيذائك. وصاحب المدونة أو غرفة المحادثة قد يمنعك من المشاركة أو الكتابة في حال كنت غير مهذب.", "page": 109}, {"title": "الفيروسات", "text": "يُعد الإنترنت مصدرًا للمعلومات وقد يكون مصدرًا للعديد من المخاطر أيضًا، ومنها الفيروسات. الفيروس برنامج يدخل إلى جهاز الحاسب ويحاول إلحاق الضرر به؛ فقد يحاول حذف الملفات أو سرقة المعلومات الشخصية من جهازك.", "page": 109}, {"title": "برنامج مكافحة الفيروسات", "text": "أهم وسيلة لحماية الحاسب هي تثبيت برنامج مكافحة الفيروسات، والذي يمنع الفيروسات من إلحاق الضرر بجهازك. كما يجب أن تحدّث برنامج مكافحة الفيروسات دائمًا؛ لأن الفيروسات تتجدد باستمرار.", "page": 109}, {"title": "أخلاقيات استخدام برامج التواصل", "text": "يجب أن تكون رسائلك مختصرة. احترم الآخرين وتواصل بإيجابية. لا تجادل ولا تلم أي شخص. قدّم رأيك بوضوح ولا تستخدم عبارات سيئة. قدّم المساعدة لأصدقائك إذا احتاجوا إليها. الاحترام خلق نبيل يجب التحلي به عند التواصل مع الآخرين في الواقع وفي الإنترنت.", "page": 108}, {"title": "غرف الدردشة", "text": "كن حذرًا جدًا عند استخدام الفكاهة والسخرية؛ فأنت تتواصل عبر الإنترنت مع أشخاص يعيشون في جميع أنحاء العالم وثقافاتهم تختلف عن ثقافتك. ودّع أصدقاءك دائمًا عند الانتهاء من الحديث معهم. وعندما يخطئ أحد زملائك إملائيًا أو يسأل سؤالًا بسيطًا، كن لطيفًا ولا تحاول إحراجه أمام الآخرين، ومن الممكن توجيهه بأسلوب مهذب.", "page": 108}, {"title": "مشروع الوحدة", "text": "أنشئ ملفًا للبحث عن معلومات: 1) افتح متصفحًا وانتقل إلى محرك البحث بينج. 2) اعثر على معلومات حول المعالم المفضلة لديك. 3) تأكد من أن المصدر الإلكتروني الذي تستخدمه موثوق. 4) اجمع المعلومات من المصدر وانقلها إلى مستند نصي. 5) أخيرًا احفظ المستند واعرض مشروعك على معلمك.", "page": 114}], "terms": [{"ar": "أخلاقيات الإنترنت", "en": "Netiquette", "def": "قواعد سلوكية عند استخدام الإنترنت", "page": 107}, {"ar": "الفيروس", "en": "Virus", "def": "برنامج يدخل إلى الحاسب ويحاول إلحاق الضرر به", "page": 109}, {"ar": "مكافحة الفيروسات", "en": "Antivirus", "def": "برنامج يحمي الحاسب من الفيروسات", "page": 109}, {"ar": "غرفة الدردشة", "en": "Chat Room", "def": "مكان على الإنترنت للتحدث مع الآخرين", "page": 108}, {"ar": "مدونة", "en": "Blog", "def": "موقع ينشر فيه صاحبه مقالات ومشاركات", "page": 115}, {"ar": "الأمان", "en": "Safety", "def": "حماية نفسك وجهازك", "page": 115}], "match": {"title": "طابق المصطلح بمعناه", "page": 115, "pairs": [["Antivirus", "مكافحة الفيروسات"], ["Safety", "الأمان"], ["Blog", "مدونة"], ["Chat Room", "غرفة الدردشة"]]}, "order": {"title": "رتب مشروع الوحدة: البحث عن معلومات", "page": 114, "steps": ["افتح متصفحًا وانتقل إلى محرك البحث بينج", "اعثر على معلومات حول المعالم المفضلة لديك", "تأكد من أن المصدر موثوق", "انقل المعلومات إلى مستند نصي", "احفظ المستند واعرضه على معلمك"]}, "qs": [{"t": "mc", "q": "ماذا تسمى القواعد السلوكية عند استخدام الإنترنت؟", "o": ["أخلاقيات الإنترنت", "قوانين الألعاب", "إعدادات الشاشة"], "a": 0, "why": "ص107.", "lvl": 1}, {"t": "mc", "q": "ماذا تفعل إذا هددك شخص عبر الإنترنت؟", "o": ["أبلّغ شخصًا كبيرًا في الأسرة", "أرد عليه بغضب", "أعطيه معلوماتي"], "a": 0, "why": "ص107.", "lvl": 1}, {"t": "mc", "q": "ماذا تفعل إذا سألك غريب عن رقم هاتفك؟", "o": ["لا أتحدث إليه وأخبر شخصًا كبيرًا", "أعطيه الرقم", "أرسل له عنواني"], "a": 0, "why": "ص109.", "lvl": 1}, {"t": "mc", "q": "ما الفيروس؟", "o": ["برنامج يدخل الحاسب ويحاول إلحاق الضرر به", "برنامج لرسم الصور", "متصفح مواقع"], "a": 0, "why": "ص109.", "lvl": 1}, {"t": "mc", "q": "ما أهم وسيلة لحماية الحاسب؟", "o": ["برنامج مكافحة الفيروسات", "إطفاء الشاشة", "زيادة الصوت"], "a": 0, "why": "ص109.", "lvl": 1}, {"t": "mc", "q": "لماذا نحدّث برنامج مكافحة الفيروسات؟", "o": ["لأن الفيروسات تتجدد باستمرار", "ليصبح لونه أجمل", "ليعمل الإنترنت أسرع"], "a": 0, "why": "ص109.", "lvl": 2}, {"t": "mc", "q": "أي سلوك مناسب في غرف الدردشة؟", "o": ["احترام ثقافة الآخرين", "السخرية من الآخرين", "إعطاء رقم الهاتف"], "a": 0, "why": "ص108.", "lvl": 1}, {"t": "mc", "q": "عندما يخطئ زميلك إملائيًا في الدردشة ماذا تفعل؟", "o": ["أنصحه بلطف دون إحراجه", "أسخر منه", "أنشر خطأه"], "a": 0, "why": "ص108.", "lvl": 2}, {"t": "tf", "q": "يجب أن تكون رسائلك مختصرة وواضحة.", "a": true, "why": "ص108.", "lvl": 1}, {"t": "tf", "q": "لا بأس بإرسال رقم هاتفك إلى أشخاص لا تعرفهم.", "a": false, "why": "ص109.", "lvl": 1}, {"t": "tf", "q": "يمكنك نشر صورك الشخصية لأي شخص.", "a": false, "why": "ص109.", "lvl": 1}, {"t": "tf", "q": "الاحترام خلق نبيل عند التواصل في الواقع وفي الإنترنت.", "a": true, "why": "ص108.", "lvl": 1}, {"t": "tf", "q": "برنامج مكافحة الفيروسات يمنع الفيروسات من إلحاق الضرر بجهازك.", "a": true, "why": "ص109.", "lvl": 1}, {"t": "fill", "q": "لا تتحدث مع أشخاص لا ___.", "a": ["تعرفهم"], "why": "ص109.", "lvl": 2}, {"t": "fill", "q": "الفيروسات قد تحاول حذف الملفات أو سرقة ___ الشخصية.", "a": ["المعلومات", "معلوماتك"], "why": "ص109.", "lvl": 2}], "summary": ["نتحلى بالأخلاق الحميدة على الإنترنت", "لا نعطي معلوماتنا لمن لا نعرف ونخبر الكبار", "الفيروسات برامج ضارة", "نثبت برنامج مكافحة الفيروسات ونحدّثه", "نحترم الآخرين ونكتب بإيجاز ولطف"], "challenge": {"text": "تحدي الدرس: جرّب «غرفة الدردشة» في المتصفح التدريبي واختر الرد الآمن.", "q": {"t": "mc", "q": "أي جملة تعبر عن قاعدة سلوك صحيحة؟", "o": ["أعبّر عن رأيي بوضوح وبأدب", "أنشر معلوماتي لكل الناس", "ألوم من يخالفني"], "a": 0, "why": "ص108.", "lvl": 1}}}, "g4-u4-l1": {"id": "g4-u4-l1", "grade": 4, "pages": "120-129", "lab": "scratch", "intro": {"question": "كيف تشرح لروبوت طريقة صنع شطيرة جبن؟ وما اللغة التي يفهمها الحاسب؟", "goals": ["أعرّف الخوارزمية والبرمجة", "أتعرف سكراتش وأقسام نافذته", "أميز الكائن والمنصة والخلفية", "أنشئ مشروعًا وأحفظه"]}, "cards": [{"title": "الخوارزمية", "text": "الخوارزمية هي مجموعة التعليمات المتسلسلة خطوة بخطوة، والخاصة بحل مشكلة أو إكمال مهمة معينة. يُعد ترتيب الخطوات أمرًا مهمًا للوصول إلى النتيجة الصحيحة عند تطبيق الخوارزمية، كما يجب تنفيذ هذه الخطوات بترتيبها الصحيح أيضًا.", "page": 120}, {"title": "أمثلة على خوارزميات من حياتنا اليومية", "text": "الوصول إلى الحديقة العامة: الخوارزمية هنا هي اتجاهات الوصول. تركيب لعبة: الخوارزمية هنا هي مجموعة الإرشادات التي تشرح كيفية تركيب اللعبة. صناعة كعكة: الخوارزمية هنا هي وصفة إعداد الكعكة.", "page": 120}, {"title": "البرمجة", "text": "البرمجة هي عملية كتابة أوامر وتعليمات للحاسب لتنفيذ مهام باستخدام لغة برمجة يفهمها. وتعلُّم البرمجة يعني تعلم مهارات عديدة مثل حل المشكلات والتفكير الحاسوبي والتفكير الإبداعي.", "page": 120}, {"title": "مثال: شطيرة الجبن المحمصة", "text": "عند حل مشكلة معينة يجب تقسيم المهمة إلى مجموعة من الخطوات اليسيرة. وصفة الشطيرة: 1) خذ شريحة من الخبز. 2) ضع شريحة من الجبن عليها. 3) ضع شريحة ثانية من الخبز عليها. 4) ضع الشطيرة في محمصة الخبز الكهربائية. 5) انتظر 3 دقائق. 6) أصبحت الشطيرة جاهزة للتقديم. المكونات: شريحتان من الخبز وشريحة واحدة من الجبن.", "page": 121}, {"title": "سكراتش", "text": "سكراتش (Scratch) لغة برمجية مصممة بصورة تجعل من البرمجة سهلة للغاية ومناسبة للمبتدئين. في سكراتش تسمى الأوامر لبنات برمجية، وهي أشكال تشبه الأحجية. كل ما عليك فعله هو سحب اللبنات البرمجية وربط بعضها ببعض لإنشاء مقطعك البرمجي. وتتوافر لغة سكراتش بنسخة عبر الإنترنت (https://scratch.mit.edu) وبنسخة أخرى دون اتصال. تم تطويرها في معهد ماساتشوستس للتكنولوجيا (MIT) وترجمت إلى أكثر من 70 لغة.", "page": 122}, {"title": "العمل عبر الإصدار المتوفر على الإنترنت", "text": "باستخدام إصدار سكراتش عبر الإنترنت يمكنك حفظ مشاريعك والوصول إليها من أي متصفح؛ فكل ما عليك فعله هو إنشاء حساب سكراتش وتسجيل الدخول. ويمكنك مشاركة مشاريعك مع مستخدمي سكراتش الآخرين. وإن لم يتوافر لديك حساب سكراتش يمكنك استخدام المحرر دون حساب.", "page": 123}, {"title": "شريط الأدوات ومنطقة البرمجة", "text": "يحتوي شريط الأدوات الموجود أعلى نافذة البرنامج على قائمة ملف وقائمة تحرير، ويتيح لك اختيار اللغة التي تفضلها. منطقة البرمجة هي المنطقة التي تستطيع إضافة اللبنات البرمجية إليها لتكوّن المقطع البرمجي.", "page": 124}, {"title": "الكائن", "text": "الكائن هو شخصية تنفذ أحداثًا معينة في المشروع؛ أي عنصر برمجي ينفذ أوامر ويتفاعل مع الأحداث. يُعد القط بمثابة الكائن الافتراضي في سكراتش. يمكنك العثور على كائنات مختلفة في مكتبة الكائنات، كما يمكنك تحميل كائنات من حاسبك، ويمكن أن يحتوي مشروع سكراتش على أكثر من كائن.", "page": 124}, {"title": "المنصة", "text": "المنصة هي بمثابة صورة خلفية للمشروع، تعمل المقاطع البرمجية التي تنشئها عليها. يمكن اعتبار الكائنات كالممثلين والمنصة كمسرح إجراء الحركة. العلم الأخضر لبدء تشغيل المقطع البرمجي، وإشارة الإيقاف لإيقاف جميع المقاطع، وزر تكبير الشاشة لعرض المنصة بالحجم الكامل. ويمكنك تغيير موقع الكائن بالضغط عليه وسحبه وإفلاته في أي موقع على المنصة.", "page": 125}, {"title": "الخلفية", "text": "الخلفية هي «المظهر» الخاص بالمنصة، ويمكن تغييرها وتحريرها أو حذفها بالكامل. لتغيير خلفية المنصة: 1) اضغط اختيار خلفية. 2) ستظهر نافذة مكتبة صور الخلفيات. 3) اختر خلفية من المكتبة واضغط عليها. 4) ستتم إضافة الخلفية الجديدة إلى المنصة. 5) اضغط على علامة تبويب الخلفيات لتحريرها. لا بد أن يكون للمنصة خلفية واحدة على الأقل. ويمكنك رسم أو تحميل خلفيتك الخاصة.", "page": 126}, {"title": "حفظ عملك", "text": "في إصدار سكراتش المتوفر عبر الإنترنت يتم حفظ عملك تلقائيًا. وهناك عدة خيارات من قائمة ملف: إنشاء مشروع جديد، حفظ الآن، حفظ نسخة، تحميل مشروع من حاسبك، حفظ المشروع إلى حاسبك.", "page": 128}], "terms": [{"ar": "الخوارزمية", "en": "Algorithm", "def": "خطوات متسلسلة لحل مشكلة أو إكمال مهمة", "page": 120}, {"ar": "البرمجة", "en": "Programming", "def": "كتابة أوامر للحاسب بلغة يفهمها", "page": 120}, {"ar": "اللبنات البرمجية", "en": "Blocks", "def": "أوامر سكراتش على شكل أحجية", "page": 122}, {"ar": "الكائن", "en": "Sprite", "def": "شخصية تنفذ الأوامر؛ الافتراضي القط", "page": 124}, {"ar": "المنصة", "en": "Stage", "def": "مكان عمل المقاطع البرمجية بمثابة المسرح", "page": 125}, {"ar": "الخلفية", "en": "Backdrop", "def": "مظهر المنصة", "page": 126}], "match": {"title": "طابق الجزء بوظيفته في سكراتش", "page": 124, "pairs": [["الكائن", "شخصية تنفذ الأوامر"], ["المنصة", "مسرح عمل المقطع البرمجي"], ["منطقة البرمجة", "نضيف إليها اللبنات"], ["الخلفية", "مظهر المنصة"]]}, "order": {"title": "رتب خطوات تغيير خلفية المنصة", "page": 126, "steps": ["اضغط اختيار خلفية", "تظهر نافذة مكتبة الخلفيات", "اختر خلفية من المكتبة", "تُضاف الخلفية الجديدة إلى المنصة"]}, "qs": [{"t": "mc", "q": "ما الخوارزمية؟", "o": ["خطوات متسلسلة لحل مشكلة", "لعبة إلكترونية", "جهاز إدخال"], "a": 0, "why": "ص120.", "lvl": 1}, {"t": "mc", "q": "أي مثال يمثل خوارزمية؟", "o": ["وصفة إعداد كعكة", "صورة كعكة", "اسم كعكة"], "a": 0, "why": "ص120.", "lvl": 1}, {"t": "mc", "q": "ما البرمجة؟", "o": ["كتابة أوامر للحاسب بلغة يفهمها", "طباعة الصور", "تنظيف الشاشة"], "a": 0, "why": "ص120.", "lvl": 1}, {"t": "mc", "q": "ماذا تسمى الأوامر في سكراتش؟", "o": ["لبنات برمجية", "أيقونات الملفات", "مجلدات"], "a": 0, "why": "ص122.", "lvl": 1}, {"t": "mc", "q": "من طوّر لغة سكراتش؟", "o": ["معهد ماساتشوستس للتكنولوجيا (MIT)", "شركة ألعاب", "وزارة الصحة"], "a": 0, "why": "ص122.", "lvl": 2}, {"t": "mc", "q": "ما الكائن الافتراضي في سكراتش؟", "o": ["القط", "الكلب", "الروبوت"], "a": 0, "why": "ص124.", "lvl": 1}, {"t": "mc", "q": "أين تُضاف اللبنات لتكوين المقطع البرمجي؟", "o": ["منطقة البرمجة", "المنصة", "قائمة ملف"], "a": 0, "why": "ص124.", "lvl": 1}, {"t": "mc", "q": "ماذا تفعل إشارة الإيقاف؟", "o": ["توقف جميع المقاطع البرمجية", "تشغل المقطع", "تحذف الكائن"], "a": 0, "why": "ص125.", "lvl": 1}, {"t": "mc", "q": "ما الذي يشبه «المسرح» في سكراتش؟", "o": ["المنصة", "لوحة اللبنات", "قائمة ملف"], "a": 0, "why": "ص125.", "lvl": 1}, {"t": "mc", "q": "ما أقل عدد من الخلفيات للمنصة؟", "o": ["خلفية واحدة", "خلفيتان", "لا شيء"], "a": 0, "why": "ص126.", "lvl": 2}, {"t": "tf", "q": "ترتيب خطوات الخوارزمية مهم للوصول إلى النتيجة الصحيحة.", "a": true, "why": "ص120.", "lvl": 1}, {"t": "tf", "q": "يحتوي مشروع سكراتش على كائن واحد فقط دائمًا.", "a": false, "why": "يمكن أن يحتوي على أكثر من كائن (ص124).", "lvl": 1}, {"t": "tf", "q": "الخلفية هي مظهر المنصة.", "a": true, "why": "ص126.", "lvl": 1}, {"t": "tf", "q": "يتم حفظ العمل في إصدار الإنترنت من سكراتش تلقائيًا.", "a": true, "why": "ص128.", "lvl": 2}, {"t": "fill", "q": "تسمى الأوامر في سكراتش ___ برمجية.", "a": ["لبنات", "اللبنات"], "why": "ص122.", "lvl": 2}, {"t": "fill", "q": "القط هو الكائن ___ في سكراتش.", "a": ["الافتراضي", "الإفتراضي"], "why": "ص124.", "lvl": 2}], "summary": ["الخوارزمية خطوات متسلسلة لحل مشكلة", "البرمجة كتابة أوامر بلغة يفهمها الحاسب", "سكراتش لبناته أحجية نسحبها ونربطها", "الكائن (القط) يتحرك على المنصة", "نغيّر الخلفية من اختيار خلفية ونحفظ المشروع"], "challenge": {"text": "تحدي الدرس: في «محاكي سكراتش» اختر خلفية «الفضاء» من أزرار الخلفية تحت المنصة.", "q": {"t": "mc", "q": "ما الذي يجعل المسرح في سكراتش بمثابة صورة خلفية للمشروع؟", "o": ["المنصة", "اللبنات", "القائمة"], "a": 0, "why": "ص125.", "lvl": 1}}}, "g4-u4-l2": {"id": "g4-u4-l2", "grade": 4, "pages": "130-140", "lab": "scratch", "intro": {"question": "كيف تجعل القطة تتكلم وتتحرك وتصدر صوتًا بسحب لبنات فقط؟", "goals": ["أتعرف فئات اللبنات وألوانها", "أنشئ مقطعي البرمجي الأول", "أستخدم لبنات: قل، تحرك، استدر، شغل الصوت", "أحرر المقطع وأحذف اللبنات"]}, "cards": [{"title": "لوحة اللبنات", "text": "يطلق على الأوامر في سكراتش اسم اللبنات. يمكن العثور على هذه الأوامر من علامة تبويب المقاطع البرمجية. يمكنك سحب وإفلات هذه اللبنات إلى منطقة البرمجة لإنشاء مقطع برمجي. هناك 9 فئات رئيسة من اللبنات في هذه اللوحة، حيث يكون لكل فئة لون محدد؛ إذن اللبنات التي تنتمي إلى فئة معينة تستخدم أوامر برمجية للقيام بمهام محددة.", "page": 130}, {"title": "اللبنات المستخدمة في هذه الوحدة", "text": "الحركة (أزرق): تحريك الكائنات على المنصة. الهيئة (بنفسجي): تغيير مظهر الكائن. الصوت (أرجواني): تسجيل أو إدراج صوت داخل البرنامج. الأحداث (أصفر): تتحكم في موعد حدوث الأشياء، فمن دون لبنات هذه الفئة لن تكون قادرًا على بدء تشغيل المشروع. التحكم (برتقالي): التحكم في البرنامج.", "page": 130}, {"title": "إنشاء مقطعك البرمجي الأول", "text": "عندما تضغط على العلم الأخضر يبدأ الكائن بتنفيذ ما تمت برمجته ليقوم به. ولتفعيل هذا الأمر يجب أن تضع لبنة عند نقر (العلم الأخضر) على رأس المقطع البرمجي في منطقة البرمجة. يمكنك العثور على هذه اللبنة في فئة لبنات الأحداث.", "page": 131}, {"title": "لبنة التحدث (قل)", "text": "تُعد أسهل أمر يمكن إنشاؤه في سكراتش جعل الكائن يقول شيئًا (يُظهر نصًا) على المنصة. للقيام بذلك فإنك تحتاج إلى وضع لبنة قل في المقطع البرمجي، وتمنح هذه اللبنة الكائن القدرة على إخراج نص معين داخل فقاعة. توجد لبنة قل لمدة 2 ثانية تُظهر النص في فقاعة لمدة ثوانٍ محددة. تجد لبنات قل في فئة الهيئة.", "page": 131}, {"title": "خطوات جعل الكائن يتحدث", "text": "1) اضغط على فئة لبنات الأحداث. 2) اسحب وأفلت لبنة عند نقر (العلم الأخضر) في منطقة البرمجة. 3) اضغط على فئة الهيئة. 4) اسحب وأفلت لبنة قل (السلام عليكم) لمدة 2 ثانية أسفل اللبنة السابقة. 5) اضغط على مربع النص واكتب النص الذي تريد أن يقوله الكائن، مثلًا «مرحبا بكم في سكراتش!». 6) اضبط المدة على 5 ثوانٍ. 7) اضغط على العلم الأخضر لتشغيل المقطع البرمجي. 8) ستظهر الرسالة المكتوبة على المنصة.", "page": 132}, {"title": "تحرير المقطع البرمجي", "text": "يمكنك تحرير أي لبنة بالضغط بالزر الأيمن عليها حيث سيتم عرض 3 خيارات: مضاعفة، إضافة تعليق، حذف اللبنة. ويمكنك حذف أي لبنة برمجية بسحبها وإفلاتها إلى لوحة اللبنات مرة أخرى.", "page": 134}, {"title": "لبنة بدء الحركة (تحرك)", "text": "هناك لبنة أساسية أخرى في سكراتش وهي لبنة الحركة تحرك ( ) خطوة. تجعل هذه اللبنة الكائن يتحرك للأمام بعدد محدد من الخطوات في الاتجاه المقابل له. القيمة الافتراضية لهذه اللبنة هي 10 ويمكنك اختيار أي رقم بدلًا منها. لجعل الكائن يتحرك على المنصة: أضف لبنة عند نقر (العلم الأخضر)، ثم اسحب لبنة تحرك 10 خطوات من فئة الحركة، واضبط الخطوات على 100 ثم اضغط على العلم الأخضر.", "page": 135}, {"title": "دوران الكائن", "text": "يمكنك استخدام لبنة استدر لتعيين استدارة مخصصة للكائن. تقوم لبنة استدر بجعل الكائن يدور بعدد درجات محددة باتجاه عقارب الساعة أو عكسها. القيمة الافتراضية للبنة هي 15 ويمكنك اختيار رقم بدلًا منه. يمكن العثور على لبنات استدر ( ) درجة في فئة لبنات الحركة.", "page": 136}, {"title": "المؤثرات الصوتية", "text": "يمكنك في سكراتش إضافة العديد من المؤثرات الصوتية إلى كائناتك. الصوت الافتراضي في البرنامج هو صوت «مياو». هناك مكتبة أصوات كبيرة يمكنك اختيار صوت آخر من خلالها للقطة، كما يمكنك تحميل أي صوت من حاسبك أو تسجيله. لتشغيل صوت: أضف لبنة عند نقر (العلم الأخضر) من فئة الأحداث، ثم أضف لبنة قل من فئة الهيئة، ثم اضغط فوق فئة الصوت واسحب لبنة شغل الصوت حتى انتهائه إلى منطقة البرمجة.", "page": 137}, {"title": "إضافة صوت جديد", "text": "لإضافة صوت جديد: 1) اضغط على علامة تبويب الأصوات. 2) اضغط على أيقونة اختيار صوت. 3) ستظهر نافذة الأصوات، اختر الذي تريده. 4) سيضاف الصوت المحدد إلى لوحة الأصوات.", "page": 138}], "terms": [{"ar": "اللبنة", "en": "Block", "def": "أمر برمجي في سكراتش", "page": 130}, {"ar": "العلم الأخضر", "en": "Green Flag", "def": "يبدأ تشغيل المقطع البرمجي", "page": 131}, {"ar": "قل", "en": "Say", "def": "لبنة تُظهر نصًا في فقاعة", "page": 131}, {"ar": "تحرك", "en": "Move", "def": "لبنة تحرك الكائن عددًا من الخطوات", "page": 135}, {"ar": "استدر", "en": "Turn", "def": "لبنة تدير الكائن بعدد درجات", "page": 136}, {"ar": "شغل الصوت", "en": "Play Sound", "def": "لبنة تشغل مؤثرًا صوتيًا", "page": 137}], "match": {"title": "طابق الفئة بوظيفتها", "page": 130, "pairs": [["الحركة", "تحريك الكائنات على المنصة"], ["الهيئة", "تغيير مظهر الكائن"], ["الصوت", "تسجيل أو إدراج صوت"], ["الأحداث", "تتحكم في موعد حدوث الأشياء"]]}, "order": {"title": "رتب خطوات جعل الكائن يتحدث", "page": 132, "steps": ["أضف لبنة عند نقر العلم الأخضر من الأحداث", "أضف لبنة قل من فئة الهيئة", "اكتب النص واضبط المدة", "اضغط على العلم الأخضر", "تظهر الرسالة على المنصة"]}, "qs": [{"t": "mc", "q": "كم عدد الفئات الرئيسة للبنات؟", "o": ["9 فئات", "3 فئات", "20 فئة"], "a": 0, "why": "ص130.", "lvl": 1}, {"t": "mc", "q": "أي فئة تحتوي لبنة «عند نقر العلم الأخضر»؟", "o": ["الأحداث", "الحركة", "الصوت"], "a": 0, "why": "ص131.", "lvl": 1}, {"t": "mc", "q": "أي فئة تحتوي لبنة «قل»؟", "o": ["الهيئة", "الحركة", "التحكم"], "a": 0, "why": "ص131.", "lvl": 1}, {"t": "mc", "q": "ما لون فئة الحركة؟", "o": ["أزرق", "أصفر", "برتقالي"], "a": 0, "why": "ص130.", "lvl": 1}, {"t": "mc", "q": "ماذا تفعل لبنة تحرك 10 3) ستضاف فئة القلم مع لبناتها إلى علامة تبويب المقاطع البرمجية.", "page": 147}, {"title": "أداة القلم", "text": "عند استخدام أداة القلم يترك الكائن أثرًا عند انتقاله من مكان إلى آخر عبر المنصة. يمكن للكائن رسم النقاط والخطوط والأشكال وكذلك العديد من الرسومات الأخرى. يمكنك العثور على جميع لبنات القلم في فئة القلم. لبنة أنزل القلم تجعل الكائن يترك أثرًا عند تحركه على المنصة. ولبنة ارفع القلم تجعل الكائن يتوقف عن الرسم.", "page": 148}, {"title": "رسم خط", "text": "لرسم خط: 1) أضف لبنة عند نقر العلم الأخضر من فئة الأحداث. 2) اضغط على فئة لبنات القلم. 3) اسحب لبنة أنزل القلم. 4) اسحب لبنة تحرك 10 خطوات من فئة الحركة واضبط عدد الخطوات على 150. تذكر أن تضغط على العلم الأخضر لتشغيل المقطع البرمجي. ويمكنك استخدام لبنتي ارفع القلم وأنزل القلم بالتتابع لرسم خط متقطع.", "page": 148}, {"title": "لبنة مسح الكل", "text": "تمسح لبنة مسح الكل المنصة بأكملها، بحيث تحذف كل ما رُسم على المنصة. وإذا أعدت تنفيذ الأوامر البرمجية مرة أخرى فإن الرسومات لا تُمسح بصورة تلقائية، ولذلك يُعتبر استخدام اللبنة في بداية المقطع البرمجي مفيدًا.", "page": 149}, {"title": "إضافة الألوان إلى رسوماتك", "text": "يمكنك تغيير لون القلم من خلال لبنتي اجعل لون القلم مساويًا ( ) وغيّر لون القلم بمقدار ( ). أرقام الألوان: أحمر 100، برتقالي 10، أخضر 30، أزرق 60. ويمكن تغيير لون القلم أثناء عمل المقطع البرمجي.", "page": 150}, {"title": "لبنة حجم القلم", "text": "يمكنك تغيير حجم القلم بواسطة لبنة اجعل حجم القلم مساويًا ( )، والقيمة الصغرى 1، وكلما زادت القيمة أصبح القلم أعرض. وتغيّر لبنة غيّر حجم القلم بمقدار الحجم بمقدار محدد.", "page": 151}, {"title": "رسم المربع", "text": "للمربع أربعة أضلاع لذا علينا تكرار لبنتي تحرك واستدر أربع مرات: كرر 4 مرات { تحرك 100 خطوة، استدر 90 درجة }. الاستدارة 90 درجة لأن جميع زوايا المربع قائمة.", "page": 152}, {"title": "رسم المثلث والدائرة", "text": "للمثلث ثلاثة أضلاع لذا نكرر اللبنات ثلاث مرات: كرر 3 مرات { تحرك 100 خطوة، استدر 120 درجة }. الدائرة ليس لها أضلاع، ومع ذلك إذا تم تكرار خطوات صغيرة مع استدارات صغيرة عدة مرات فيمكنك إنشاء شكل هو أقرب ما يكون إلى الدائرة: كرر 36 مرة { تحرك 20 خطوة، استدر 10 درجات }.", "page": 153}, {"title": "لبنة اطبع", "text": "عند استخدام لبنة اطبع ينشئ الكائن نسخة مشابهة له على المنصة. مثال: كرر 20 مرة { تحرك 10 خطوات، اطبع }. ويمكن رسم مثلث بالطباعة: كرر 3 مرات { اطبع، تحرك 200 خطوة، استدر 120 درجة }.", "page": 154}, {"title": "مشروع الوحدة", "text": "أنشئ مشروعًا جديدًا في سكراتش يحتوي على رسوم متحركة صغيرة، وتكون القطة في ملعب كرة سلة تتحرك وترسم وتصدر صوتًا: 1) أضف الخلفية «Basketball 1». 2) أضف المقطع الصوتي «Basketball bounce». 3) ضع القطة في منتصف الدائرة على المنصة. 4) اجعل القطة تتحرك 20 مرة عشر خطوات في كل مرة بحيث تترك خطًا مُنقّطًا أثناء حركتها. 5) شغّل الصوت أثناء تحرك القطة.", "page": 157}], "terms": [{"ar": "مُلحق القلم", "en": "Pen extension", "def": "يضيف فئة لبنات الرسم", "page": 147}, {"ar": "أنزل القلم", "en": "Pen down", "def": "لبنة تجعل الكائن يرسم أثرًا", "page": 148}, {"ar": "ارفع القلم", "en": "Pen up", "def": "لبنة توقف الرسم", "page": 148}, {"ar": "مسح الكل", "en": "Erase all", "def": "لبنة تمسح كل الرسومات", "page": 149}, {"ar": "اطبع", "en": "Stamp", "def": "لبنة تنشئ نسخة من الكائن على المنصة", "page": 154}], "match": {"title": "طابق الشكل بالتكرار والاستدارة", "page": 152, "pairs": [["مربع", "كرر 4 مرات واستدر 90 درجة"], ["مثلث", "كرر 3 مرات واستدر 120 درجة"], ["دائرة تقريبية", "كرر 36 مرة واستدر 10 درجات"], ["خط متقطع", "أنزل القلم ثم ارفعه بالتتابع"]]}, "order": {"title": "رتب خطوات رسم مربع", "page": 152, "steps": ["أضف لبنة عند نقر العلم الأخضر", "أضف مسح الكل وأنزل القلم", "اسحب لبنة كرر واضبطها على 4", "ضع داخلها تحرك 100 خطوة", "ضع داخلها استدر 90 درجة"]}, "qs": [{"t": "mc", "q": "ما الذي نضيفه لنتمكن من الرسم في سكراتش؟", "o": ["مُلحق القلم", "خلفية جديدة", "صوتًا جديدًا"], "a": 0, "why": "ص147.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تجعل الكائن يترك أثرًا عند الحركة؟", "o": ["أنزل القلم", "ارفع القلم", "قل"], "a": 0, "why": "ص148.", "lvl": 1}, {"t": "mc", "q": "أي لبنة توقف الرسم؟", "o": ["ارفع القلم", "أنزل القلم", "اطبع"], "a": 0, "why": "ص148.", "lvl": 1}, {"t": اللوحية. نصيحة: احمِ الشاشة القابلة للمس بالبلاستيك الواقي من الخدوش.", "page": 17}, {"title": "لوح الرسم وكرة التتبع ولوحة الألعاب", "text": "لوح الرسم الرقمي (Graphic tablet) يتيح رسم الصور يدويًا ويفضله المصممون والرسامون. كرة التتبع (Trackball) تشبه فأرة مقلوبة ذات كرة كبيرة وتستخدم لتحريك المؤشر. لوحة الألعاب (Gamepad) تسمى أيضًا جوي باد (Joypad) أو لوحة التحكم (Control pad).", "page": 18}, {"title": "نينتندو وي وأدوات الواقع الافتراضي", "text": "جهاز التحكم عن بعد نينتندو وي (Wii) يتحكم في اللعبة بإدراك اتجاه الحركة. نظارات الواقع الافتراضي (VR headsets) تعطيك انطباعًا بوجودك في عالم مختلف تمامًا. وقفازات الواقع الافتراضي (VR gloves) تنقل حركات اليد إلى البيئة الافتراضية وتوفر استجابة سريعة ودقيقة.", "page": 19}], "terms": [{"ar": "الحاسب", "en": "Computer", "def": "جهاز إلكتروني يستقبل البيانات ويعالجها ويخزنها ويخرجها", "page": 15}, {"ar": "الحاسب المكتبي", "en": "Desktop Computer", "def": "حاسب يتكون من أجزاء متصلة ويمكن استبدال أجزائه", "page": 15}, {"ar": "الحاسب المحمول", "en": "Laptop", "def": "حاسب خفيف الوزن له بطارية داخلية", "page": 16}, {"ar": "الحاسب اللوحي", "en": "Tablet", "def": "حاسب يعمل باللمس غالبًا بلا لوحة مفاتيح", "page": 16}, {"ar": "لوحة اللمس", "en": "Touchpad", "def": "بديل للفأرة في الحاسب المحمول", "page": 17}, {"ar": "شاشة اللمس", "en": "Touchscreen", "def": "شاشة تعمل كوحدة إدخال باللمس", "page": 17}, {"ar": "لوح الرسم الرقمي", "en": "Graphic tablet", "def": "جهاز لرسم الصور يدويًا", "page": 18}, {"ar": "الواقع الافتراضي", "en": "VR", "def": "محاكاة تعطي انطباعًا بوجودك في عالم آخر", "page": 19}], "match": {"title": "طابق الجهاز بوصفه", "page": 18, "pairs": [["كرة التتبع", "تشبه فأرة مقلوبة"], ["لوح الرسم الرقمي", "يفضله المصممون والرسامون"], ["لوحة الألعاب", "تسمى أيضًا جوي باد"], ["لوحة اللمس", "بديل للفأرة في الحاسب المحمول"]]}, "order": {"title": "رتب أجهزة الحاسب كما وردت في الدرس", "page": 15, "steps": ["الحاسب المكتبي", "الحاسب المحمول", "الحاسب اللوحي", "الهواتف الذكية"]}, "qs": [{"t": "mc", "q": "ما الحاسب؟", "o": ["جهاز  "why": "ص18.", "lvl": 1}}}, "g5-u1-l2": {"id": "g5-u1-l2", "grade": 5, "pages": "25-38", "lab": "hw5", "intro": {"question": "ما الذي يوجد داخل صندوق الحاسب ويجعله يعمل؟", "goals": ["أتعرف أجزاء وحدة النظام", "أميز أجهزة التخزين الخارجية", "أصنف أجهزة الإدخال والإخراج", "أفرق بين أنواع الطابعات"]}, "cards": [{"title": "اللوحة الأم والمعالج", "text": "اللوحة الأم (Motherboard) بمثابة المركز الرئيس للحاسب الذي تتصل به جميع الأجزاء الأخرى. وحدة المعالجة المركزية (CPU) بمثابة «العقل» للحاسب، وهي التي تنفذ جميع العمليات؛ فكلما زادت سرعتها زادت البيانات التي يمكن معالجتها في وقت أقصر.", "page": 26}, {"title": "الذاكرة والقرص الصلب ومزود الطاقة", "text": "ذاكرة الوصول العشوائي (RAM) تستخدم لتخزين البيانات التي تحتاجها المعالجة لفترة قصيرة جدًا. القرص الصلب (Hard Disc) هو جهاز التخزين الرئيس لتخزين البرامج والملفات. مزود الطاقة (Power Supply) يزود الحاسب بالطاقة. محرك الأقراص المضغوطة والرقمية (CD & DVD Drive) يقرأ الأقراص.", "page": 26}, {"title": "أجهزة التخزين الخارجية", "text": "1) وحدة الذاكرة الفلاشية: صغيرة الحجم منخفضة السعر وتتوفر بسعات مختلفة. 2) الأقراص المضغوطة (CD) والفيديو الرقمية (DVD). 3) القرص الصلب الخارجي: يسع تخزين الكثير. 4) بطاقات الذاكرة مثل SD وMicroSD.", "page": 27}, {"title": "أجهزة الإدخال", "text": "أجهزة الإدخال تساعد المستخدم على إدخال البيانات: لوحة المفاتيح، الفأرة، الميكروفون، الماسح الضوئي (Scanner)، كاميرا الويب (Web camera)، الكاميرا الرقمية، كاميرا الفيديو.", "page": 28}, {"title": "الكاميرات والميكروفون والماسح", "text": "الميكروفون يحول الصوت إلى بيانات رقمية. الماسح الضوئي يمسح وثيقة ورقية ويحولها إلى مستند رقمي. كاميرا الويب تستخدم في مكالمات الفيديو. الكاميرا الرقمية تلتقط صورًا عالية الدقة وتخزنها على بطاقة ذاكرة. كاميرا الفيديو تلتقط الصور المتحركة.", "page": 29}, {"title": "أجهزة الإخراج", "text": "تعرض أجهزة الإخراج نتائج معالجة البيانات: الشاشة (Monitor) وهي جهاز الإخراج الرئيس، مكبرات الصوت (Speakers)، سماعات الرأس (Headphones).", "page": 32}, {"title": "الطابعات", "text": "الطابعة جهاز إخراج لإنشاء نسخة مطبوعة. الطابعة الناف ، ثم انقل الاختصار إلى سطح المكتب بالسحب والإفلات.", "page": 39}, {"title": "إنشاء اختصار مباشرة على سطح المكتب", "text": "اضغط بالفأرة الأيمن على الملف، اختر إرسال إلى (Send to)، ثم سطح المكتب (إنشاء اختصار) (Desktop (create shortcut)). وإذا رغبت في حذف الاختصار: اضغط الفأرة الأيمن عليه ثم اختر حذف (Delete). حذف الاختصار يلغي الرابط فقط دون التأثير على الملف الأصلي.", "page": 40}, {"title": "الملفات والمجلدات المضغوطة", "text": "قد تشغل الملفات والمجلدات مساحة كبيرة على التخزين، ولذلك يمكن ضغطها لتصغير حجمها وتسهيل إرسالها بالبريد الإلكتروني. تسمى المجلدات المضغوطة في وندوز «zipped folders». لضغط ملف: اضغط الفأرة الأيمن عليه، اختر إرسال إلى (Send to)، ثم Compressed (zipped) folder.", "page": 41}, {"title": "إعادة تسمية المجلد المضغوط", "text": "اضغط الفأرة الأيمن عليه، ثم إعادة التسمية (Rename)، واكتب الاسم ثم اضغط Enter. ويمكن إعادة التسمية أيضًا بتحديده والضغط على F2 من لوحة المفاتيح.", "page": 41}, {"title": "فك الضغط", "text": "لاستخراج ملف: افتح المجلد المضغوط ثم اسحب الملف إلى مكان آخر (قص ولصق). ولفك ضغط جميع الملفات: اضغط الفأرة الأيمن على المجلد المضغوط، اختر استخراج الكل (Extract All)، ثم استعراض (Browse) لتحديد الموقع، ثم استخراج (Extract). تتفاوت درجة ضغط الملفات حسب نوعها.", "page": 42}, {"title": "التخزين السحابي", "text": "التخزين السحابي (Cloud Storage) هو حفظ الملفات عبر الإنترنت بدلًا من حفظها على جهازك، فيمكنك فتحها من أي جهاز وفي أي مكان. من خدماته: جوجل درايف (Google Drive) ووان درايف (OneDrive) وآي كلاود (iCloud).", "page": 44}, {"title": "طريقة عرض قائمة الملفات", "text": "لتغيير عرض الملفات: افتح مستكشف الملفات (File Explorer)، ثم المستندات (Documents)، ثم علامة التبويب عرض (View)، ثم اختر العرض مثل أيقونات كبيرة (Large icons). تتنوع العروض: أيقونات كبيرة جدًا، كبيرة، متوسطة، صغيرة، قائمة، تفاصيل، متجاورة، محتوى. ولعرض تفاصيل أكثر استخدم عرض التفاصيل وحدد الأعمدة.", "page": 44}, {"title": "سلة المحذوفات", "text": "عند حذف ملف أو مجلد من حاسبك فإنه لا يتم حذفه نهائيًا بل يتم نقله إلى سلة المحذوفات (Recycle Bin)، التي تتيح لك استعادته عند حذفه عن طريق الخطأ. لاستعادة عنصر: اضغط عليه بالفأرة الأيمن واختر استعادة (Restore). ولحذف جميع العناصر: اضغط الفأرة الأيمن على السلة واختر إفراغ سلة المحذوفات (Empty Recycle Bin) ثم نعم (Yes).", "page": 46}], "terms": [{"ar": "حجم الملف", "en": "File size", "def": "المساحة التي يشغلها الملف ويقاس بالبايت", "page": 39}, {"ar": "الاختصار", "en": "Shortcut", "def": "رابط للوصول السريع إلى ملف أو برنامج", "page": 39}, {"ar": "المجلد المضغوط", "en": "Zipped folder", "def": "مجلد صغير الحجم يسهل إرساله", "page": 41}, {"ar": "استخراج الكل", "en": "Extract All", "def": "أمر لفك ضغط جميع الملفات", "page": 42}, {"ar": "التخزين السحابي", "en": "Cloud Storage", "def": "حفظ الملفات عبر الإنترنت", "page": 44}, {"ar": "مستكشف الملفات", "en": "File Explorer", "def": "أداة لتصفح الملفات والمجلدات", "page": 44}, {"ar": "سلة المحذوفات", "en": "Recycle Bin", "def": "تحفظ العناصر المحذوفة ويمكن استعادتها", "page": 46}], "match": {"title": "طابق المفهوم بتعريفه", "page": 39, "pairs": [["الاختصار", "رابط للوصول السريع"], ["المجلد المضغوط", "يصغر حجم الملفات"], ["التخزين السحابي", "حفظ الملفات عبر الإنترنت"], ["سلة المحذوفات", "تحتفظ بالعناصر المحذوفة"]]}, "order": {"title": "رتب خطوات ضغط ملف", "page": 41, "steps": ["ابحث عن الملف أو المجلد", "اضغط الفأرة الأيمن عليه", "اختر إرسال إلى (Send to)", "اختر Compressed (zipped) folder"]}, "qs": [{"t": "mc", "q": "ما وحدة قياس حجم الملف؟", "o": ["البايت", "الثانية", "الدرجة"], "a": 0, "why": "ص39.", "lvl": 1}, {"t": "mc", "q": "ما الاختصار؟", "o": ["رابط للوصول السريع للملف", "نسخة من الملف تحل محله", "ملف مضغوط"], "a": 0, "why": "ص39.", "lvl": 1}, {"t": "mc", "q": "ماذا يحدث للملف الأصلي عند حذف اختصاره؟", "o": ["لا يتأثر", "يحذف", "يضغط"], "a": 0, "why": "ص40.", "lvl": 1}, {"t": "mc", "q": "لماذا نضغط الملفات؟", "o": ["لتصغير حجمها وتسهيل إرسالها", "لزيادة حجمها", "لحذفها"], "a": 0, "why": "ص41.", "lvl": 1}, {"t": "mc", "q": "أي مفتاح يُستخدم لإعادة التسمية؟", "o": ["F2", "F5", "Esc"], "a": 0, "why": "ص41.", "lvl": 1}, {"t": "mc", "q": "أين تذهب
