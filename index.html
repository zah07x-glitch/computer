 62}, {"title": "إدراج صورة من جهاز الحاسب", "text": "حدد الموضع، ثم من تبويب إدراج ومجموعة رسوم توضيحية اضغط صور (Pictures)، فتظهر نافذة إدراج صورة (Insert Picture)، حدد الصورة التي تريدها واضغط إدراج (Insert).", "page": 63}, {"title": "تعديل الصور", "text": "لتنسيق صورة: اضغط على الصورة، ثم اضغط علامة التبويب تنسيق الصورة (Picture Format)، واستخدم الأزرار الموجودة في مجموعة ضبط (Adjust) لتعديل الصورة المحددة.", "page": 63}, {"title": "أدوات تنسيق الصورة", "text": "من مجموعة ضبط: إضافة تأثيرات فنية مختلفة على الصورة. من مجموعة الحجم: اقتصاص جزء محدد من الصورة. من مجموعة أنماط الصور: إضافة حدود أو تغيير شكل الصورة. من مجموعة ترتيب: تحديد الموضع الصحيح وضبط التفاف النص.", "page": 64}, {"title": "التفاف النص (Wrap Text)", "text": "يتحكم التفاف النص في كيفية ظهور النص حول الصورة: سطري مع النص (In Line with Text)، مربع (Square) نص حول الصورة، محكم (Tight)، أعلى وأسفل (Top and Bottom)، خلف النص (Behind Text)، أمام النص (In Front of Text).", "page": 64}, {"title": "إدراج الأشكال", "text": "من تبويب إدراج، مجموعة رسوم توضيحية، اضغط أشكال (Shapes) ثم اختر الشكل. اسحب الشكل في مساحة فارغة لتغيير حجمه وموضعه. لإضافة نص: اضغط الفأرة الأيمن على الشكل واختر إضافة نص (Add Text).", "page": 65}], "terms": [{"ar": "صور عبر الإنترنت", "en": "Online Pictures", "def": "إدراج صورة بالبحث في الإنترنت", "page": 62}, {"ar": "صور", "en": "Pictures", "def": "إدراج صورة من جهاز الحاسب", "page": 63}, {"ar": "تنسيق الصورة", "en": "Picture Format", "def": "تبويب يظهر عند تحديد الصورة", "page": 63}, {"ar": "التفاف النص", "en": "Wrap Text", "def": "تحكم في ظهور النص حول الصورة", "page": 64}, {"ar": "أشكال", "en": "Shapes", "def": "مجموعة أشكال جاهزة يدرجها المستخدم", "page": 65}, {"ar": "ترخيص EULA", "en": "EULA", "def": "اتفاقية ترخيص تحدد شروط استخدام الصور", "page": 62}], "match": {"title": "طابق الخيار بوصفه", "page": 64, "pairs": [["سطري مع النص", "الصورة داخل النص كأنها رمز"], ["مربع", "يضع النص حول الصورة"], ["خلف النص", "الصورة خلف النص"], ["أمام النص", "الصورة أمام النص"]]}, "order": {"title": "رتب خطوات إدراج صورة من جهاز الحاسب", "page": 63, "steps": ["حدد الموضع الذي تريد إدراج الصورة فيه", "من تبويب إدراج اضغط صور (Pictures)", "حدد الصورة من نافذة إدراج صورة", "اضغط إدراج (Insert)"]}, "qs": [{"t": "mc", "q": "من أي تبويب ندرج الصور؟", "o": ["إدراج (Insert)", "عرض", "مراجعة"], "a": 0, "why": "ص62.", "lvl": 1}, {"t": "mc", "q": "ماذا نستخدم لإدراج صورة من الإنترنت؟", "o": ["صور عبر الإنترنت", "أشكال", "حفظ"], "a": 0, "why": "ص62.", "lvl": 1}, {"t": "mc", "q": "أي تبويب يظهر لتعديل الصورة؟", "o": ["تنسيق الصورة", "ملف", "تصميم"], "a": 0, "why": "ص63.", "lvl": 1}, {"t": "mc", "q": "ما وظيفة التفاف النص؟", "o": ["التحكم في ظهور النص حول الصورة", "حذف الصورة", "طباعة الصورة"], "a": 0, "why": "ص64.", "lvl": 1}, {"t": "mc", "q": "أي خيار يضع الصورة خلف النص؟", "o": ["خلف النص", "مربع", "محكم"], "a": 0, "why": "ص64.", "lvl": 1}, {"t": "mc", "q": "كيف نضيف نصًا داخل شكل؟", "o": ["الفأرة الأيمن ثم إضافة نص", "حذف الشكل", "الضغط على Esc"], "a": 0, "why": "ص65.", "lvl": 2}, {"t": "tf", "q": "صور الإنترنت محمية بحقوق الطبع والنشر.", "a": true, "why": "ص62.", "lvl": 1}, {"t": "tf", "q": "نستطيع اقتصاص جزء من الصورة.", "a": true, "why": "من مجموعة الحجم (ص64).", "lvl": 1}, {"t": "tf", "q": "لا يمكن تغيير موضع الصورة بعد إدراجها.", "a": false, "why": "من مجموعة ترتيب (ص64).", "lvl": 1}, {"t": "fill", "q": "الإنجليزية لخيار «مربع» في التفاف النص هي ___.", "a": ["Square", "square"], "why": "ص64.", "lvl": 2}, {"t": "fill", "q": "نضغط زر ___ لإدراج الأشكال.", "a": ["أشكال", "Shapes", "shapes"], "why": "ص65.", "lvl": 2}], "summary": ["الصور تدرج من الإنترنت أو من الحاسب", "تنسيق الصورة: ضبط، حجم، أنماط، ترتيب", "التفاف النص يحدد علاقة الصورة بالنص", "الأشكال يمكن أن تحتوي نصًا"], "challenge": {"text": "تحدي الدرس: اختر خيار التفاف مناسبًا لصورة داخل مقال.", "q": {"t": "mc", "q": "تريد أن يحيط النص بالصورة من الجهات. ماذا تختار؟", "o": ["مربع (Square)", "خلف النص", "سطري مع النص"], "a": 0, "why": "ص64.", "lvl": 1}}}, "g5-u2-l2": {"id": "g5-u2-l2", "grade": 5, "pages": "69-80", "lab": "word", "intro": {"question": "كيف تجعل نصك منظمًا ومريحًا للقراءة؟", "goals": ["أحذف النص المحدد", "أكتب الحروف الكبيرة", "أضبط تباعد الأسطر والأحرف والمسافة البادئة", "أظهر الأحرف غير القابلة للطباعة"]}, "cards": [{"title": "حذف النص المحدد", "text": "يمكنك حذف كلمة أو جملة بتحديدها ثم الضغط على Delete أو Backspace. مفتاح Backspace يحذف الحرف الذي قبل المؤشر، بينما Delete يحذف الحرف الموجود بعد المؤشر.", "page": 69}, {"title": "كتابة الحروف الكبيرة بالإنجليزية", "text": "اضغط Alt + Shift لتغيير اللغة إلى الإنجليزية، ثم Caps Lock لكتابة الأحرف الكبيرة، ويضيء مؤشر LED. اضغط Caps Lock مرة أخرى للعودة إلى الأحرف الصغيرة. مثال: I love Saudi Arabia.", "page": 70}, {"title": "تباعد الأسطر", "text": "لتغيير المسافة بين الأسطر: اضغط بالمؤشر على الفقرة، ثم من مجموعة فقرة (Paragraph) اضغط زر تباعد الأسطر والفقرات (Line Spacing) واختر التباعد من القائمة.", "page": 71}, {"title": "تباعد الأحرف", "text": "تباعد الأحرف هو المسافة بين أحرف الكلمة، ويستخدم لتسهيل القراءة. حدد النص، ثم من الشريط الرئيس مجموعة الخط (Font) اضغط زر التوسيع، ثم من علامة التبويب خيارات متقدمة (Advanced) اختر تباعد (Spacing): موسع (Expanded) أو مكثف (Condensed)، واضبط القيمة في مربع بمقدار (By).", "page": 72}, {"title": "المسافة البادئة للفقرة", "text": "المسافة البادئة تحدد مسافة الفقرة من الجانب الأيمن أو الأيسر. ضع المؤشر في الفقرة، ثم من علامة تبويب الشريط الرئيسي ومجموعة فقرة اضغط زيادة المسافة البادئة (Increase Indent).", "page": 73}, {"title": "نصائح لتنسيق الفقرات", "text": "عند إنشاء فقرة جديدة استمر في الكتابة حتى نهاية الفقرة ولا تضغط Enter بعد كل سطر؛ فالبرنامج ينقل المؤشر تلقائيًا إلى السطر التالي. اضغط Enter عند نهاية الفقرة فقط. وللانتقال إلى سطر جديد دون فقرة جديدة اضغط Shift + Enter.", "page": 74}, {"title": "إظهار وإخفاء الأحرف غير القابلة للطباعة", "text": "من علامة التبويب الرئيسي، مجموعة فقرة (Paragraph)، اضغط إظهار / إخفاء (Show/Hide). تظهر رموز مثل ¶ لنهاية الفقرة، وسهم للـ Tab، ونقطة للمسافة. لا تُطبع هذه الرموز.", "page": 75}], "terms": [{"ar": "تباعد الأسطر", "en": "Line Spacing", "def": "المسافة بين الأسطر داخل الفقرة", "page": 71}, {"ar": "تباعد الأحرف", "en": "Character Spacing", "def": "المسافة بين أحرف الكلمة", "page": 72}, {"ar": "المسافة البادئة", "en": "Indent", "def": "مسافة الفقرة من الجانب", "page": 73}, {"ar": "Caps Lock", "en": "Caps Lock", "def": "يكتب الأحرف الإنجليزية الكبيرة", "page": 70}, {"ar": "إظهار / إخفاء", "en": "Show/Hide", "def": "يعرض الأحرف غير القابلة للطباعة", "page": 75}, {"ar": "¶", "en": "Paragraph mark", "def": "رمز نهاية الفقرة", "page": 75}], "match": {"title": "طابق الرمز بمعناه", "page": 75, "pairs": [["¶", "نهاية الفقرة"], ["نقطة", "مسافة (Space bar)"], ["سهم →", "تبويب (Tab)"], ["سهم ↵", "فاصل أسطر (Shift + Enter)"]]}, "order": {"title": "رتب خطوات تغيير تباعد الأسطر", "page": 71, "steps": ["اضغط بالمؤشر على الفقرة", "من مجموعة فقرة اضغط تباعد الأسطر", "اختر التباعد المناسب من القائمة"]}, "qs": [{"t": "mc", "q": "أي مفتاح يحذف الحرف قبل المؤشر؟", "o": ["Backspace", "Delete", "Tab"], "a": 0, "why": "ص69.", "lvl": 1}, {"t": "mc", "q": "لكتابة أحرف إنجليزية كبيرة باستمرار نضغط:", "o": ["Caps Lock", "Alt", "Ctrl"], "a": 0, "why": "ص70.", "lvl": 1}, {"t": "mc", "q": "ما معنى تباعد الأحرف؟", "o": ["المسافة بين أحرف الكلمة", "المسافة بين الصفحات", "حجم الخط"], "a": 0, "why": "ص72.", "lvl": 1}, {"t": "mc", "q": "متى نضغط Enter عند الكتابة؟", "o": ["في نهاية الفقرة", "بعد كل سطر", "بعد كل كلمة"], "a": 0, "why": "ص74.", "lvl": 1}, {"t": "mc", "q": "أي رمز يدل على نهاية الفقرة؟", "o": ["¶", "→", "•"], "a": 0, "why": "ص75.", "lvl": 1}, {"t": "mc", "q": "أي زر يعرض الأحرف غير القابلة للطباعة؟", "o": ["إظهار / إخفاء", "تراجع", "بحث"], "a": 0, "why": "ص75.", "lvl": 2}, {"t": "tf", "q": "الأحرف غير القابلة للطباعة تُطبع على الورق.", "a": false, "why": "لا تُطبع (ص75).", "lvl": 1}, {"t": "tf", "q": "Shift + Enter ينشئ سطرًا جديدًا دون فقرة جديدة.", "a": true, "why": "ص74.", "lvl": 1}, {"t": "tf", "q": "نضغط Enter بعد كل سطر داخل الفقرة.", "a": false, "why": "ص74.", "lvl": 1}, {"t": "fill", "q": "مفتاح ___ يحذف الحرف الذي بعد المؤشر.", "a": ["Delete", "delete"], "why": "ص69.", "lvl": 2}, {"t": "fill", "q": "لتغيير المسافة بين الأسطر نستخدم زر تباعد ___.", "a": ["الأسطر"], "why": "ص71.", "lvl": 2}], "summary": ["Delete وBackspace يحذفان النص المحدد", "Caps Lock للأحرف الكبيرة", "تباعد الأسطر والأحرف والمسافة البادئة تنظم الفقرة", "Show/Hide يعرض ¶ والمسافات والتبويب"], "challenge": {"text": "تحدي الدرس: حدد الإجراء الصحيح لإنشاء فقرة جديدة.", "q": {"t": "mc", "q": "انتهت الفقرة. ماذا تضغط؟", "o": ["Enter", "Space bar عدة مرات", "Caps Lock"], "a": 0, "why": "ص74.", "lvl": 1}}}, "g5-u2-l3": {"id": "g5-u2-l3", "grade": 5, "pages": "81-89", "lab": "word5", "intro": {"question": "كيف تعرض الخطوات أو الأفكار في مستند بشكل منظم وجذاب؟", "goals": ["أدرج رسمًا توضيحيًا SmartArt", "أنسق لونه وشكله", "أميز أنواع SmartArt واستخداماتها"]}, "cards": [{"title": "إدراج الرسوم التوضيحية", "text": "في ورد يمكنك إضافة الأشكال والرسوم التوضيحية SmartArt لعرض المعلومات بشكل أوضح. للإدراج: اضغط المكان، ثم من تبويب إدراج (Insert) في مجموعة رسوم توضيحية اضغط SmartArt، ثم من الجزء الأيسر اختر الكل (All)، ثم قائمة الصندوق العمودية (Vertical Box List)، ثم موافق (OK)، ثم اكتب النص في الصناديق.", "page": 81}, {"title": "تنسيق الرسوم التوضيحية", "text": "حدد SmartArt المُدرج، ثم من علامة تبويب تصميم (Design) اضغط على تغيير الألوان (Change Colors) واختر اللون الذي تريده، فيتغير لون القائمة. ويمكنك أيضًا استخدام SmartArt Styles لتغيير الشكل.", "page": 83}, {"title": "أنواع SmartArt: القائمة والعملية", "text": "القائمة (List) تظهر الخطوات أو العناصر غير المتسلسلة (مثال: النقاط الرئيسة). المعالجة/العملية (Process) تعرض خطوات عملية أو جدولًا زمنيًا يسير بعمل معين (مثال: خطوات إنتاج منتج).", "page": 84}, {"title": "أنواع SmartArt: الدائري والهيكلي", "text": "الدائري (Cycle) يمثل تسلسلًا متواصلًا لعدة مراحل أو أحداث تتكرر (مثال: دورة الماء). الهيكلي (Hierarchy) يعرض معلومات متسلسلة بشكل هرمي أو تقرير نظام تنظيمي (مثال: شجرة عائلية).", "page": 84}, {"title": "أنواع SmartArt: العلاقة والمصفوفة والهرمي", "text": "العلاقة (Relationship) للمقارنة بين فكرتين أو عرض العلاقة بينهما. المصفوفة (Matrix) لإظهار العلاقة بين الجزء والكل. الهرمي (Pyramid) لإظهار العلاقات النسبية أو المتداخلة أو الهرمية (مثال: هرم غذائي).", "page": 84}, {"title": "مثال تطبيقي: موازنة (Balance)", "text": "شكل SmartArt من نوع علاقة والمسمى موازنة (Balance) يقارن التأثيرات الإيجابية والسلبية للتقنية. الخطوات: Insert ثم SmartArt ثم علاقة (Relationship) ثم موازنة (Balance) ثم موافق، ثم اكتب النص في مربع (Type your text here).", "page": 85}], "terms": [{"ar": "SmartArt", "en": "SmartArt", "def": "رسوم توضيحية جاهزة لعرض المعلومات", "page": 81}, {"ar": "قائمة", "en": "List", "def": "لعرض خطوات أو عناصر غير متسلسلة", "page": 84}, {"ar": "معالجة", "en": "Process", "def": "لعرض خطوات عملية", "page": 84}, {"ar": "دائري", "en": "Cycle", "def": "لتسلسل متواصل متكرر", "page": 84}, {"ar": "هيكلي", "en": "Hierarchy", "def": "لعرض معلومات بشكل هرمي", "page": 84}, {"ar": "علاقة", "en": "Relationship", "def": "للمقارنة بين فكرتين", "page": 84}, {"ar": "مصفوفة", "en": "Matrix", "def": "لعلاقة الجزء بالكل", "page": 84}, {"ar": "هرمي", "en": "Pyramid", "def": "لعلاقات نسبية أو متداخلة", "page": 84}], "match": {"title": "طابق النوع بمثاله", "page": 84, "pairs": [["دائري", "دورة الماء"], ["هيكلي", "شجرة العائلة"], ["هرمي", "الهرم الغذائي"], ["معالجة", "خطوات إنتاج منتج"]]}, "order": {"title": "رتب خطوات إدراج SmartArt", "page": 81, "steps": ["اضغط المكان المراد", "من تبويب إدراج اضغط SmartArt", "اختر النوع من النافذة ثم موافق", "اكتب النص في الصناديق"]}, "qs": [{"t": "mc", "q": "ما نوع SmartArt المناسب لدورة الماء؟", "o": ["دائري (Cycle)", "قائمة", "مصفوفة"], "a": 0, "why": "ص84.", "lvl": 1}, {"t": "mc", "q": "أي نوع يناسب شجرة العائلة؟", "o": ["هيكلي (Hierarchy)", "دائري", "علاقة"], "a": 0, "why": "ص84.", "lvl": 1}, {"t": "mc", "q": "أي نوع يناسب الهرم الغذائي؟", "o": ["هرمي (Pyramid)", "معالجة", "قائمة"], "a": 0, "why": "ص84.", "lvl": 1}, {"t": "mc", "q": "أي نوع يقارن بين فكرتين؟", "o": ["علاقة (Relationship)", "معالجة", "دائري"], "a": 0, "why": "ص84.", "lvl": 1}, {"t": "mc", "q": "كيف نغير لون SmartArt؟", "o": ["تصميم ثم تغيير الألوان", "ملف ثم حفظ", "مراجعة ثم تدقيق"], "a": 0, "why": "ص83.", "lvl": 1}, {"t": "mc", "q": "أي نوع يعرض خطوات عملية أو جدولًا زمنيًا؟", "o": ["معالجة (Process)", "هيكلي", "مصفوفة"], "a": 0, "why": "ص84.", "lvl": 2}, {"t": "tf", "q": "SmartArt يستخدم لعرض المعلومات بشكل واضح.", "a": true, "why": "ص81.", "lvl": 1}, {"t": "tf", "q": "نوع مصفوفة يوضح علاقة الجزء بالكل.", "a": true, "why": "ص84.", "lvl": 1}, {"t": "tf", "q": "لا يمكن تغيير لون SmartArt بعد إدراجه.", "a": false, "why": "ص83.", "lvl": 1}, {"t": "fill", "q": "نختار من تبويب ___ ثم SmartArt لإدراج رسم توضيحي.", "a": ["إدراج", "Insert"], "why": "ص81.", "lvl": 2}, {"t": "fill", "q": "الشكل المسمى ___ يقارن التأثيرات الإيجابية والسلبية.", "a": ["موازنة", "Balance"], "why": "ص85.", "lvl": 2}], "summary": ["SmartArt يعرض المعلومات بشكل أوضح", "يدرج من تبويب إدراج", "يتغير لونه من تبويب تصميم", "أنواعه: قائمة، معالجة، دائري، هيكلي، علاقة، مصفوفة، هرمي"], "challenge": {"text": "تحدي الدرس: اختر النوع المناسب لكل محتوى.", "q": {"t": "mc", "q": "تريد عرض مراحل نمو النبات المتكررة. أي نوع تختار؟", "o": ["دائري", "قائمة", "مصفوفة"], "a": 0, "why": "ص84.", "lvl": 1}}}, "g5-u2-l4": {"id": "g5-u2-l4", "grade": 5, "pages": "90-96", "lab": "word5", "intro": {"question": "لماذا تظهر خطوط حمراء وزرقاء تحت بعض الكلمات في وورد؟", "goals": ["أدقق الأخطاء الإملائية والنحوية", "أبحث عن مرادفات", "أطبع مستندًا وأضبط خيارات الطباعة"]}, "cards": [{"title": "التدقيق والتحقق من الأخطاء", "text": "يتحقق وورد تلقائيًا من الأخطاء الإملائية والنحوية وبناء الجملة. السطر الأحمر يعني وجود خطأ إملائي، والسطر الأزرق يعني وجود خطأ نحوي.", "page": 90}, {"title": "خطوات التدقيق", "text": "في علامة التبويب مراجعة (Review)، من مجموعة تدقيق (Proofing) اضغط المحرر (Editor) أو اضغط F7. تظهر الكلمات غير الصحيحة، ثم اضغط التدقيق الإملائي (Spelling) وستظهر اقتراحات وخيارات أخرى.", "page": 90}, {"title": "خيارات التدقيق", "text": "ضع الكلمة الحمراء مكان النص التي تحددها من قائمة الاقتراحات (Suggestions). تجاهل مرة واحدة تتجاهل الكلمة هذه المرة فقط، وتجاهل الكل تتجاهلها في كل المستند. ويمكنك إضافة الكلمات التي تثق بها إلى قاموس البرنامج.", "page": 90}, {"title": "البحث عن المرادفات", "text": "قاموس المرادفات (Thesaurus) يشبه القاموس. من تبويب مراجعة، مجموعة تدقيق، اضغط قاموس المرادفات أو Shift + F7، اكتب الكلمة في المربع، ثم اضغط زر البحث أو Enter، وستظهر قائمة المرادفات. وهناك طريقة أسهل: اضغط بزر الفأرة الأيمن على الكلمة واختر مرادفات (Synonyms).", "page": 91}, {"title": "الطباعة", "text": "لطباعة ملف: من علامة التبويب ملف (File) اضغط طباعة (Print) أو اضغط Ctrl + P. يمكنك معاينة الطباعة على الجانب الأيسر من الشاشة، وتغيير إعدادات الطباعة من الجانب الأيمن.", "page": 92}, {"title": "خيارات الطباعة", "text": "عدد النسخ يحدد بالأسهم أو بكتابة الرقم. الطابعة: اختر الطابعة المتصلة أو طابعة الشبكة (Network Printer). طباعة كافة الصفحات (Print All Pages)، أو طباعة الصفحة الحالية (Print Current Page)، أو الطباعة المخصصة (Custom Print) مثل 1,5,8,11 أو 1-5. واتجاه الصفحة: رأسي (Portrait) أو أفقي (Landscape).", "page": 93}], "terms": [{"ar": "المحرر", "en": "Editor", "def": "أداة التدقيق الإملائي والنحوي", "page": 90}, {"ar": "تدقيق إملائي", "en": "Spelling", "def": "يبحث عن الأخطاء الإملائية", "page": 90}, {"ar": "قاموس المرادفات", "en": "Thesaurus", "def": "يعرض مرادفات الكلمة", "page": 91}, {"ar": "طباعة", "en": "Print", "def": "أمر طباعة المستند Ctrl + P", "page": 92}, {"ar": "رأسي", "en": "Portrait", "def": "اتجاه الصفحة الرأسي", "page": 93}, {"ar": "أفقي", "en": "Landscape", "def": "اتجاه الصفحة الأفقي", "page": 93}], "match": {"title": "طابق الاختصار بوظيفته", "page": 92, "pairs": [["F7", "المحرر والتدقيق"], ["Shift + F7", "قاموس المرادفات"], ["Ctrl + P", "الطباعة"], ["الخط الأحمر", "خطأ إملائي"]]}, "order": {"title": "رتب خطوات طباعة مستند", "page": 92, "steps": ["اضغط ملف (File)", "اضغط طباعة (Print)", "اضبط الإعدادات ومعاينة الطباعة", "اضغط زر الطباعة"]}, "qs": [{"t": "mc", "q": "ماذا يعني الخط الأحمر تحت الكلمة؟", "o": ["خطأ إملائي", "خطأ نحوي", "تنسيق جيد"], "a": 0, "why": "ص90.", "lvl": 1}, {"t": "mc", "q": "ماذا يعني الخط الأزرق؟", "o": ["خطأ نحوي", "خطأ إملائي", "كلمة مميزة"], "a": 0, "why": "ص90.", "lvl": 1}, {"t": "mc", "q": "أي مفتاح يشغل المحرر؟", "o": ["F7", "F2", "Esc"], "a": 0, "why": "ص90.", "lvl": 1}, {"t": "mc", "q": "ما اختصار الطباعة؟", "o": ["Ctrl + P", "Ctrl + Z", "Ctrl + F"], "a": 0, "why": "ص92.", "lvl": 1}, {"t": "mc", "q": "أي خيار يطبع صفحة واحدة فقط؟", "o": ["الصفحة الحالية", "كافة الصفحات", "نسخ"], "a": 0, "why": "ص93.", "lvl": 1}, {"t": "mc", "q": "كيف نطبع الصفحات 1 و5 و8 فقط؟", "o": ["1,5,8", "1-8", "5"], "a": 0, "why": "ص93.", "lvl": 2}, {"t": "tf", "q": "قاموس المرادفات يعرض كلمات بنفس المعنى.", "a": true, "why": "ص91.", "lvl": 1}, {"t": "tf", "q": "لا يمكن معاينة المستند قبل الطباعة.", "a": false, "why": "تظهر المعاينة (ص92).", "lvl": 1}, {"t": "tf", "q": "اتجاه الصفحة يكون رأسيًا أو أفقيًا.", "a": true, "why": "ص93.", "lvl": 1}, {"t": "fill", "q": "نفتح قاموس المرادفات بالاختصار Shift + ___.", "a": ["F7", "f7"], "why": "ص91.", "lvl": 2}, {"t": "fill", "q": "الاتجاه ___ يعني أن الصفحة عمودية بالطول.", "a": ["الرأسي", "رأسي", "Portrait"], "why": "ص93.", "lvl": 2}], "summary": ["الخط الأحمر إملائي والأزرق نحوي", "F7 للتدقيق وShift+F7 للمرادفات", "Ctrl+P للطباعة", "يمكن اختيار الصفحات والاتجاه وعدد النسخ"], "challenge": {"text": "تحدي الدرس: صحح كلمة خاطئة واطبع صفحة واحدة.", "q": {"t": "mc", "q": "وجدت خطًا أحمر تحت كلمة. ماذا تفعل؟", "o": ["أختار تصحيحها من الاقتراحات", "أحذف الصفحة", "أغلق البرنامج"], "a": 0, "why": "ص90.", "lvl": 1}}}, "g5-u3-l1": {"id": "g5-u3-l1", "grade": 5, "pages": "103-131", "lab": "cap5", "intro": {"question": "كيف تنقل صور هاتفك أو كاميرتك إلى الحاسب، وكيف تعدّل مقطعًا صوتيًا؟", "goals": ["أتعرف أجهزة الالتقاط ومنافذ التوصيل", "أنقل البيانات من الماسح والكاميرا", "أعرف وحدات حجم الملفات وامتداداتها", "أحرر الصوت في برنامج أوداسيتي وأصدّره"]}, "cards": [{"title": "أجهزة الالتقاط", "text": "أجهزة الالتقاط تستخدم لالتقاط الأصوات والصور ومقاطع الفيديو ويمكن توصيلها بجهاز الحاسب لحفظ ما تلتقطه كملفات. منها: الهاتف المحمول، والكاميرا الرقمية، والماسح الضوئي (Scanner)، والميكروفون (Microphone).", "page": 103}, {"title": "منافذ التوصيل", "text": "أجهزة الالتقاط تتصل بمنافذ خاصة في الحاسب. منفذ الميكروفون ومكبر الصوت لإدخال وإخراج الصوت. ويمكن توصيل الأجهزة بالحاسب عبر منفذ USB. يُستخدم USB-C في الأجهزة الحديثة، ويستخدم موصل Lightning في أجهزة أبل (آيفون وآيباد). وهناك اتصال لاسلكي بتقنيات البلوتوث (Bluetooth) وNFC وWi-Fi.", "page": 104}, {"title": "نقل البيانات من الماسح الضوئي", "text": "وصّل سلك الماسح بمنفذ USB، وشغّل الماسح، وضع الصورة على الزجاج وأغلق الغطاء. من قائمة بدء اختر Windows Fax and Scan، ثم مسح ضوئي جديد (New Scan)، وحدد نوع الملف مثل JPG، ثم اضغط معاينة (Preview) ثم مسح (Scan)، وأخيرًا احفظ الصورة باسم.", "page": 105}, {"title": "نقل البيانات من الكاميرا", "text": "وصّل سلك الكاميرا بمنفذ USB في الحاسب، وبعد أن يتعرف الحاسب عليها ستظهر نافذة التشغيل التلقائي (Autoplay)، اختر فتح المجلد لعرض الملفات (Open folder to view files)، ثم انسخ الصور أو انقلها إلى المكان الذي تريده.", "page": 108}, {"title": "وحدات قياس حجم الملفات", "text": "الوحدات: بايت (Byte)، كيلوبايت (KB)، ميجابايت (MB)، جيجابايت (GB)، تيرابايت (TB). حجم المستند النصي صغير بضع كيلوبايتات، والصورة قد تأخذ بضعة ميجابايتات، والملف الصوتي عادة بضع ميجابايتات، وملف الفيديو قد يأخذ حيزًا بالميجابايتات أو أكبر بالجيجابايتات.", "page": 109}, {"title": "امتداد أنواع الملفات", "text": "لكل ملف اسم وامتداد، مثل عائلتي.jpg؛ فالامتداد jpg يوضح نوع الملف (صورة). أمثلة: txt ملف نصي، doc/docx مستند، ppt/pptx عرض تقديمي، xls/xlsx جدول بيانات، jpg/png صورة، wav/mp3 صوت، mp4/avi فيديو، pdf كتاب إلكتروني، zip/rar ملف مضغوط.", "page": 110}, {"title": "البدء مع برنامج أوداسيتي", "text": "أوداسيتي (Audacity) برنامج مجاني ومفتوح المصدر لتسجيل وتحرير الصوت الرقمي. لتنزيله: افتح الموقع audacityteam.org/download، واختر Download for Windows، ثم ثبّته (Next ثم Install ثم Finish).", "page": 110}, {"title": "فتح ملف صوتي وأدوات الاستخدام", "text": "لفتح ملف: ملف (File) ثم فتح (Open) واختر الملف. من الأدوات: تشغيل (Play)، إيقاف مؤقت (Pause)، توقف (Stop)، تسجيل (Record)، تراجع (Undo)، كرر (Redo). يمكن تشغيل وإيقاف المقطع بمفتاح المسافة (Space bar).", "page": 116}, {"title": "تحرير الصوت", "text": "حدد جزءًا من الشكل الموجي وشغله. لتغيير حدة الصوت: حدد الجزء ثم Effect ثم Fade In (التلاشي). لتغيير السرعة: Effect ثم Change Speed واضبط المضاعف ثم Preview ثم OK. يمكن حذف الجزء المحدد بالضغط على Delete.", "page": 118}, {"title": "دمج المقاطع الصوتية", "text": "لإضافة أصوات أخرى: ملف ثم استيراد (Import) ثم صوت (Audio)، حدد الملف واضغط فتح (Open). ستظهر موجة جديدة أسفل التسجيل السابق. استخدم شريط Gain لرفع أو خفض مستوى الصوت.", "page": 121}, {"title": "حفظ المشروع وتصديره", "text": "حفظ المشروع: ملف ثم Save Project، وينشأ ملف بامتداد .aup3 لا يمكن تشغيله خارج أوداسيتي. لتصدير ملف صوتي يعمل في أجهزة أخرى: ملف ثم Export ثم Export as MP3، ثم OK، واكتب الاسم واضغط حفظ.", "page": 122}], "terms": [{"ar": "أجهزة الالتقاط", "en": "Capture devices", "def": "أجهزة لالتقاط الصوت والصورة والفيديو", "page": 103}, {"ar": "منفذ USB", "en": "USB port", "def": "منفذ لتوصيل الأجهزة ونقل البيانات", "page": 104}, {"ar": "الماسح الضوئي", "en": "Scanner", "def": "يدخل الصور والوثائق إلى الحاسب", "page": 103}, {"ar": "امتداد الملف", "en": "File extension", "def": "يوضح نوع الملف مثل jpg", "page": 110}, {"ar": "أوداسيتي", "en": "Audacity", "def": "برنامج لتسجيل وتحرير الصوت", "page": 110}, {"ar": "الشكل الموجي", "en": "Waveform", "def": "عرض مرئي للصوت", "page": 115}, {"ar": "تصدير", "en": "Export", "def": "حفظ الملف بصيغة تعمل في أجهزة أخرى مثل MP3", "page": 122}, {"ar": "Fade In", "en": "Fade In", "def": "تأثير يزيد الصوت تدريجيًا", "page": 118}], "match": {"title": "طابق الامتداد بنوع الملف", "page": 110, "pairs": [[".mp3", "ملف صوتي"], [".jpg", "ملف صورة"], [".mp4", "ملف فيديو"], [".docx", "ملف نصي"]]}, "order": {"title": "رتب وحدات حجم الملفات من الأصغر إلى الأكبر", "page": 109, "steps": ["بايت (Byte)", "كيلوبايت (KB)", "ميجابايت (MB)", "جيجابايت (GB)", "تيرابايت (TB)"]}, "qs": [{"t": "mc", "q": "أي جهاز التقاط يسجل المقاطع الصوتية؟", "o": ["الميكروفون", "الماسح الضوئي", "الطابعة"], "a": 0, "why": "ص103.", "lvl": 1}, {"t": "mc", "q": "أي جهاز يدخل الصور والوثائق إلى الحاسب؟", "o": ["الماسح الضوئي", "السماعات", "الشاشة"], "a": 0, "why": "ص103.", "lvl": 1}, {"t": "mc", "q": "أي منفذ نستخدم لتوصيل الكاميرا بالحاسب؟", "o": ["USB", "HDMI فقط", "لا يوجد"], "a": 0, "why": "ص108.", "lvl": 1}, {"t": "mc", "q": "أي وحدة أكبر؟", "o": ["جيجابايت", "كيلوبايت", "ميجابايت"], "a": 0, "why": "ص109.", "lvl": 1}, {"t": "mc", "q": "ماذا يوضح امتداد الملف؟", "o": ["نوع الملف", "لون الملف", "حجم الشاشة"], "a": 0, "why": "ص110.", "lvl": 1}, {"t": "mc", "q": "ما اسم البرنامج المجاني لتحرير الصوت؟", "o": ["أوداسيتي", "وورد", "إكسل"], "a": 0, "why": "ص110.", "lvl": 1}, {"t": "mc", "q": "أي صيغة نصدّر بها ملفًا صوتيًا يعمل على أجهزة أخرى؟", "o": ["MP3", "aup3", "docx"], "a": 0, "why": "ص122.", "lvl": 2}, {"t": "mc", "q": "بماذا نشغل ونوقف المقطع الصوتي بسرعة؟", "o": ["مفتاح المسافة", "Esc", "Delete"], "a": 0, "why": "ص116.", "lvl": 2}, {"t": "tf", "q": "الكيلوبايت أصغر من الميجابايت.", "a": true, "why": "ص109.", "lvl": 1}, {"t": "tf", "q": "ملف مشروع أوداسيتي aup3 يعمل على كل البرامج.", "a": false, "why": "لا يمكن تشغيله إلا في أوداسيتي (ص122).", "lvl": 1}, {"t": "tf", "q": "يمكن حذف جزء من الصوت بتحديده ثم Delete.", "a": true, "why": "ص118.", "lvl": 1}, {"t": "fill", "q": "امتداد ملفات الصور الشائع هو ___.", "a": ["jpg", "JPG", ".jpg", "png"], "why": "ص110.", "lvl": 2}, {"t": "fill", "q": "نختار Export as ___ لتصدير الملف بصيغة MP3.", "a": ["MP3", "mp3"], "why": "ص122.", "lvl": 2}], "summary": ["أجهزة الالتقاط: هاتف، كاميرا، ماسح، ميكروفون", "وحدات الحجم: بايت، KB، MB، GB، TB", "امتداد الملف يوضح نوعه", "أوداسيتي: فتح، تحرير، دمج، حفظ مشروع، تصدير MP3"], "challenge": {"text": "تحدي الدرس: حدد الصيغة المناسبة لمشاركة صوتك.", "q": {"t": "mc", "q": "أردت مشاركة تسجيلك الصوتي مع صديق. ماذا تفعل؟", "o": ["أصدّره بصيغة MP3", "أرسل ملف aup3 فقط", "أحذفه"], "a": 0, "why": "ص122.", "lvl": 1}}}, "g5-u3-l2": {"id": "g5-u3-l2", "grade": 5, "pages": "132-154", "lab": "vid5", "intro": {"question": "هل يجوز أن تنسخ أي صورة من الإنترنت وتضعها في مشروعك؟", "goals": ["أحترم حقوق الملكية", "أبحث عن الصور والفيديو في الإنترنت", "أنشئ فيديو في تطبيق صور مايكروسوفت", "أضيف تأثيرات ونصًا وصوتًا وأحفظ الفيديو"]}, "cards": [{"title": "احترام قوانين حقوق الملكية", "text": "من السهل تنزيل ونسخ المواد المتوفرة على الإنترنت، لكن من المهم مراعاة قوانين حقوق الطبع والنشر. حقوق الطبع والنشر أحد أشكال الحماية: عندما تكتب قصيدة أو ترسم عملًا فنيًا فإنك تملك حقوقه تلقائيًا. يجب الحصول على تصريح أو إذن لاستخدام الصورة من أصحاب حقوق الملكية.", "page": 132}, {"title": "رخصة المشاع الإبداعي", "text": "رخصة المشاع الإبداعي (Creative Commons - CC) تمنح الإذن بإعادة استخدام المصنفات، وفي نتائج بحث جوجل يمكنك تصفية النتائج للعثور على الصور التي تقدم رخصًا لإعادة الاستخدام.", "page": 132}, {"title": "البحث عن الصور", "text": "افتح مايكروسوفت إيدج، واستخدم محرك بحث مثل جوجل، واكتب الكلمة المفتاحية مثل «الرياض» واضغط Enter، ثم اختر صور (Images)، واضغط الأدوات (Tools) لعرض خيارات البحث مثل الحجم (Size) والرخصة.", "page": 133}, {"title": "حفظ الصورة", "text": "اضغط على الصورة بزر الفأرة الأيسر لتراها بحجم أكبر، ثم اضغط بزر الفأرة الأيمن واختر حفظ الصورة باسم (Save picture as). عليك مراجعة متطلبات الترخيص لأي صورة تريد استخدامها. وتختلف شروط الصور المجانية عن شروط الصور التجارية.", "page": 134}, {"title": "البحث عن الفيديو", "text": "اكتب الكلمة المفتاحية في جوجل واضغط Enter، ثم اضغط فيديو (Videos)، فتظهر مواقع تحتوي على مقاطع فيديو، اختر المقطع الذي يعجبك. ويمكن مشاهدة آلاف المقاطع على يوتيوب. من الأدوات يمكن تحديد مدة المقطع.", "page": 135}, {"title": "تطبيق صور مايكروسوفت", "text": "تطبيق صور مايكروسوفت (Microsoft Photos) عارض ومحرر مجاني موجود في ويندوز 10، ويمكن تحرير الصور ومقاطع الفيديو. لفتحه: اضغط بدء (Start)، ومرر القائمة إلى الأسفل، ثم اختر صور (Photos).", "page": 136}, {"title": "إنشاء مقطع فيديو", "text": "في تطبيق الصور اضغط محرر الفيديو (Video Editor)، ثم مشروع فيديو جديد (New video project)، اكتب اسمًا للفيديو واضغط موافق (OK)، ثم إضافة (Add) ثم من هذا الكمبيوتر (From this PC)، حدد الصور بـ Ctrl + A، ثم فتح (Open)، ثم Place in storyboard (وضع في لوحة العمل).", "page": 137}, {"title": "التأثيرات ثلاثية الأبعاد وتأثيرات الحركة", "text": "لإضافة تأثير ثلاثي الأبعاد: حدد الصورة في لوحة العمل (Storyboard)، اضغط تأثيرات ثلاثية الأبعاد (3D effects)، اختر التأثير ثم تم (Done). ولإضافة حركة: اختر الصورة ثم حركة (Motion)، ثم اختر الحركة واضغط تم.", "page": 140}, {"title": "إضافة نص وصوت", "text": "لإضافة نص: في لوحة العمل اضغط نص (Text)، اكتب النص، اختر نمطًا لتنسيقه، ثم تم. لإضافة صوت: اختر صوت مخصص (Custom audio) ثم إضافة ملف صوتي (Add audio file) وحدد الملف ثم فتح ثم تم.", "page": 143}, {"title": "حفظ ومشاركة الفيديو", "text": "لحفظ الفيديو: من شريط القوائم اضغط إنهاء الفيديو (Finish video)، اختر حجمًا متوسطًا (Medium)، ثم تصدير (Export)، واكتب اسم الملف ثم Export. وللمشاركة: مشاهدة المزيد (See more) ثم مشاركة (Share).", "page": 146}], "terms": [{"ar": "حقوق الطبع والنشر", "en": "Copyright", "def": "حماية قانونية لمالك العمل", "page": 132}, {"ar": "المشاع الإبداعي", "en": "Creative Commons", "def": "رخصة تسمح بإعادة استخدام المصنفات", "page": 132}, {"ar": "محرر الفيديو", "en": "Video Editor", "def": "أداة لإنشاء وتحرير الفيديو في تطبيق الصور", "page": 137}, {"ar": "لوحة العمل", "en": "Storyboard", "def": "ترتب فيها الصور والمقاطع", "page": 137}, {"ar": "التأثيرات ثلاثية الأبعاد", "en": "3D effects", "def": "تأثيرات تضاف للمقاطع", "page": 140}, {"ar": "تصدير", "en": "Export", "def": "حفظ الفيديو كملف", "page": 146}], "match": {"title": "طابق الأداة بوظيفتها", "page": 140, "pairs": [["3D effects", "تأثيرات ثلاثية الأبعاد"], ["Motion", "حركة للصورة"], ["Text", "إضافة نص"], ["Custom audio", "إضافة صوت مخصص"]]}, "order": {"title": "رتب خطوات إنشاء فيديو", "page": 137, "steps": ["فتح تطبيق صور", "اضغط محرر الفيديو ثم مشروع فيديو جديد", "أضف الصور واضعها في لوحة العمل", "أضف التأثيرات والنص والصوت", "أنهِ الفيديو ثم صدّره"]}, "qs": [{"t": "mc", "q": "ماذا تحمي حقوق الطبع والنشر؟", "o": ["العمل ومالكه", "الحاسب", "الشاشة"], "a": 0, "why": "ص132.", "lvl": 1}, {"t": "mc", "q": "ماذا تمنح رخصة المشاع الإبداعي؟", "o": ["إذنًا بإعادة استخدام المصنفات", "حذف العمل", "منع المشاهدة"], "a": 0, "why": "ص132.", "lvl": 1}, {"t": "mc", "q": "من أي قسم في جوجل نبحث عن الصور؟", "o": ["صور (Images)", "فيديو", "أخبار"], "a": 0, "why": "ص133.", "lvl": 1}, {"t": "mc", "q": "ما التطبيق المجاني لتحرير الفيديو في ويندوز 10؟", "o": ["مايكروسوفت صور", "أوداسيتي", "وورد"], "a": 0, "why": "ص136.", "lvl": 1}, {"t": "mc", "q": "أين نضع الصور لترتيبها في الفيديو؟", "o": ["لوحة العمل (Storyboard)", "سلة المحذوفات", "الشاشة الرئيسة"], "a": 0, "why": "ص137.", "lvl": 1}, {"t": "mc", "q": "أي أداة تضيف حركة للصورة؟", "o": ["حركة (Motion)", "نص", "تصدير"], "a": 0, "why": "ص142.", "lvl": 2}, {"t": "tf", "q": "يجب مراجعة متطلبات الترخيص قبل استخدام الصورة.", "a": true, "why": "ص134.", "lvl": 1}, {"t": "tf", "q": "يمكن استخدام أي صورة بلا إذن لأنها على الإنترنت.", "a": false, "why": "ص132.", "lvl": 1}, {"t": "tf", "q": "نستطيع إضافة صوت مخصص إلى الفيديو.", "a": true, "why": "ص143.", "lvl": 1}, {"t": "fill", "q": "نختار ___ (Export) لحفظ الفيديو كملف.", "a": ["تصدير", "Export", "export"], "why": "ص146.", "lvl": 2}, {"t": "fill", "q": "نضغط Ctrl + ___ لتحديد جميع الصور في مجلد.", "a": ["A", "a"], "why": "ص137.", "lvl": 2}], "summary": ["احترم حقوق الطبع والنشر وراجع الرخصة", "ابحث عن الصور والفيديو بالكلمات المفتاحية", "محرر الفيديو: لوحة العمل، تأثيرات، حركة، نص، صوت", "أنهِ الفيديو ثم صدّره وشاركه"], "challenge": {"text": "تحدي الدرس: قرر هل يمكنك استخدام صورة وجدتها.", "q": {"t": "mc", "q": "وجدت صورة جميلة للمشروع. ماذا تفعل أولًا؟", "o": ["أراجع رخصتها وحقوقها", "أنسخها فورًا", "أحذفها"], "a": 0, "why": "ص134.", "lvl": 1}}}, "g5-u4-l1": {"id": "g5-u4-l1", "grade": 5, "pages": "162-168", "lab": "flow5", "intro": {"question": "من الذي يخبر الحاسب بما يفعل؟ وكيف نكتب له التعليمات؟", "goals": ["أعرّف البرنامج والخوارزمية", "أرسم مخططًا انسيابيًا", "أتبع خطوات إنشاء برنامج", "أكتب المقطع البرمجي في سكراتش"]}, "cards": [{"title": "ما البرنامج؟", "text": "البرامج هي التي تتحكم في طريقة عمل الأجهزة الإلكترونية. برنامج الحاسب هو مجموعة من التعليمات المكتوبة بإحدى لغات البرمجة ينفذها الحاسب لتحقيق هدف معين. ويطلق على من ينشئ البرنامج مبرمج.", "page": 162}, {"title": "لغة البرمجة", "text": "لغة البرمجة هي لغة كأي لغة عادية، إلا أن فيها قائمة كلمات محدودة وقواعد دقيقة تساعد في كتابة البرنامج. وسكراتش لغة سهلة يمكن للمبتدئين استخدامها لبناء لعبة أو صناعة أفلام كرتون «انميشن» أو قصص تفاعلية.", "page": 162}, {"title": "اتباع التعليمات", "text": "عند تشغيل البرنامج يقرأ الحاسب قائمة الأوامر أو التعليمات ثم ينفذها. لتنفيذ البرنامج بشكل صحيح لابد أن تكون التعليمات واضحة ومحددة.", "page": 163}, {"title": "المخطط الانسيابي", "text": "المخطط الانسيابي (Flowchart) هو مخطط بياني يستخدم لتمثيل الخوارزمية ويعرض الخطوات التي تحتاج إلى اتباعها بالترتيب الصحيح. يُستخدم قبل كتابة المقطع البرمجي لتنظيم الأفكار.", "page": 164}, {"title": "أشكال المخطط الانسيابي", "text": "أشكال المخطط أربعة أنواع: الشكل البيضاوي للإشارة إلى بداية ونهاية التسلسل، المعين لاتخاذ قرار (نعم أو لا)، المستطيل لتنفيذ عملية رياضية أو إعطاء الأوامر، متوازي الأضلاع لاستقبال وعرض البيانات (المدخلات والمخرجات)، والأسهم لربط الأشكال وإظهار الاتجاهات.", "page": 164}, {"title": "خطوات إنشاء برنامج (1): تحليل المشكلة", "text": "قبل أن تبدأ كتابة المقطع البرمجي، عليك أن تفهم المشكلة التي تريد حلها. مثلًا: إذا أردت أن يرسم كائن القطة قمرًا في سماء المدينة ليلًا، فعليك تحديد الخطوات اللازمة.", "page": 165}, {"title": "خطوات إنشاء برنامج (2 و3): الخوارزمية والمخطط", "text": "الخطوة الثانية: إنشاء الخوارزمية، أي كتابة الخطوات الصغيرة اللازمة لحل المشكلة بكلمات بسيطة. الخطوة الثالثة: رسم المخطط الانسيابي ليمثل الخطوات من البداية إلى النهاية.", "page": 165}, {"title": "خطوات إنشاء برنامج (4): كتابة المقطع البرمجي", "text": "الخطوة الرابعة: كتابة المقطع البرمجي في سكراتش باستخدام اللبنات؛ فيتحول المخطط الانسيابي إلى تعليمات برمجية. المقطع البرمجي الذي تستخدمه لحل المشكلة في سكراتش يسمى برنامجك.", "page": 166}], "terms": [{"ar": "برنامج", "en": "Program", "def": "مجموعة تعليمات مكتوبة بلغة برمجة ينفذها الحاسب", "page": 162}, {"ar": "مبرمج", "en": "Programmer", "def": "من ينشئ البرامج", "page": 162}, {"ar": "الخوارزمية", "en": "Algorithm", "def": "خطوات متسلسلة لحل مشكلة", "page": 165}, {"ar": "المخطط الانسيابي", "en": "Flowchart", "def": "مخطط بياني يمثل الخوارزمية", "page": 164}, {"ar": "اللبنات", "en": "Blocks", "def": "أوامر سكراتش", "page": 161}, {"ar": "المقطع البرمجي", "en": "Script", "def": "مجموعة لبنات متصلة", "page": 166}], "match": {"title": "طابق شكل المخطط بوظيفته", "page": 164, "pairs": [["بيضاوي", "بداية ونهاية التسلسل"], ["معين", "اتخاذ قرار"], ["مستطيل", "تنفيذ عملية أو إعطاء أوامر"], ["متوازي أضلاع", "استقبال وعرض البيانات"]]}, "order": {"title": "رتب خطوات إنشاء برنامج", "page": 165, "steps": ["تحليل المشكلة", "إنشاء الخوارزمية", "رسم المخطط الانسيابي", "كتابة المقطع البرمجي"]}, "qs": [{"t": "mc", "q": "ما البرنامج؟", "o": ["مجموعة تعليمات ينفذها الحاسب لتحقيق هدف", "جهاز طباعة", "صورة"], "a": 0, "why": "ص162.", "lvl": 1}, {"t": "mc", "q": "ما اسم من ينشئ البرنامج؟", "o": ["مبرمج", "مصور", "معلم"], "a": 0, "why": "ص162.", "lvl": 1}, {"t": "mc", "q": "ما اسم لغة البرمجة المستخدمة في الوحدة؟", "o": ["سكراتش", "وورد", "أوداسيتي"], "a": 0, "why": "ص162.", "lvl": 1}, {"t": "mc", "q": "أي شكل يستخدم لاتخاذ قرار؟", "o": ["المعين", "المستطيل", "البيضاوي"], "a": 0, "why": "ص164.", "lvl": 1}, {"t": "mc", "q": "ما الخطوة الأولى في إنشاء برنامج؟", "o": ["تحليل المشكلة", "كتابة المقطع البرمجي", "حفظ الملف"], "a": 0, "why": "ص165.", "lvl": 1}, {"t": "mc", "q": "ما المخطط الانسيابي؟", "o": ["مخطط بياني يمثل الخوارزمية", "برنامج رسم", "لعبة"], "a": 0, "why": "ص164.", "lvl": 2}, {"t": "tf", "q": "الخوارزمية خطوات متسلسلة لحل مشكلة.", "a": true, "why": "ص165.", "lvl": 1}, {"t": "tf", "q": "تستطيع أجهزة الحاسب أن تقرر ماذا تفعل من تلقاء نفسها.", "a": false, "why": "تنفذ التعليمات فقط (ص167).", "lvl": 1}, {"t": "tf", "q": "نرسم المخطط الانسيابي قبل كتابة المقطع البرمجي.", "a": true, "why": "ص165.", "lvl": 1}, {"t": "fill", "q": "الشكل ___ في المخطط الانسيابي يدل على البداية والنهاية.", "a": ["البيضاوي", "بيضاوي"], "why": "ص164.", "lvl": 2}, {"t": "fill", "q": "يسمى من ينشئ البرنامج ___.", "a": ["مبرمج", "المبرمج"], "why": "ص162.", "lvl": 2}], "summary": ["البرنامج تعليمات ينفذها الحاسب", "الخوارزمية خطوات متسلسلة", "المخطط الانسيابي له أشكال: بيضاوي، معين، مستطيل، متوازي أضلاع، سهم", "الخطوات: تحليل، خوارزمية، مخطط، مقطع برمجي"], "challenge": {"text": "تحدي الدرس: رتب خطوات حل مشكلة.", "q": {"t": "mc", "q": "قبل أن تكتب المقطع البرمجي، ماذا تفعل؟", "o": ["تفهم المشكلة وتكتب الخوارزمية", "تحفظ الملف", "تغلق البرنامج"], "a": 0, "why": "ص165.", "lvl": 1}}}, "g5-u4-l2": {"id": "g5-u4-l2", "grade": 5, "pages": "170-181", "lab": "scratch", "intro": {"question": "من هي القطة البرتقالية في سكراتش؟ وكيف نضيف كائنات جديدة ونحركها؟", "goals": ["أعرّف الكائن الرسومي", "أحذف الكائنات وأضيفها", "أغير مظاهر الكائن وأحركه", "أكرر الكائن وأضيف مؤثرًا صوتيًا"]}, "cards": [{"title": "ما الكائن الرسومي؟", "text": "الكائن في برنامج سكراتش قد يكون نصًا أو صورة أو رسمًا، ويمكن برمجته لأداء إجراءات معينة في مشروع باستخدام اللبنات. يمكنك تغيير موضع الكائن واسمه وإخفاءه، وتغيير حجمه واتجاهه من منطقة الكائنات.", "page": 170}, {"title": "حذف الكائن", "text": "تبدأ مشروعات سكراتش دائمًا بكائن القطة. لحذف كائن اضغط على أيقونة الحذف، أو اضغط بزر الفأرة الأيمن على الكائن واختر حذف.", "page": 171}, {"title": "إضافة كائن جديد", "text": "هناك أربع طرق لإضافة الكائنات: 1) الاختيار من مكتبة سكراتش. 2) إنشاء كائن فريد خاص بك (رسم). 3) السماح لسكراتش باختيار كائن عشوائي. 4) تحميل صورة من جهازك. لاختيار كائن من المكتبة: اضغط اختيار كائن (Choose a Sprite)، ثم اختر فئة مثل حيوانات (Animals)، ثم اختر Dinosaur4.", "page": 172}, {"title": "مظاهر الكائن", "text": "معظم الكائنات لديها أكثر من مظهر، وتسمى المظاهر (Costumes). للعثور على مظاهر الكائن اضغط علامة تبويب المظاهر. كائن Dinosaur4 له أربعة مظاهر ولكل منها اسم مختلف. تغيير المظاهر بسرعة يجعل الكائن يبدو كأنه يتحرك.", "page": 174}, {"title": "لبنات الهيئة", "text": "لبنة «غيّر المظهر إلى» تغير مظهر الكائن إلى مظهر معين تختاره من القائمة. لبنة «المظهر التالي» تغير مظهر الكائن إلى المظهر التالي في القائمة. وتنتمي هذه اللبنات إلى فئة الهيئة (Looks).", "page": 175}, {"title": "جعل الكائن يتحرك", "text": "يمكنك جعل الكائن يقوم بحركات جديدة من خلال الجمع بين عدة وضعيات. استخدم لبنة «كرر» لتكرار التغيير بين المظاهر مع لبنة «انتظر» لإضافة فاصل زمني قصير حتى ترى كل مظهر قبل أن يتغير.", "page": 176}, {"title": "حركات الكائن", "text": "لتشغيل المقطع عند النقر على العلم الأخضر نستخدم لبنة «عند نقر العلم الأخضر» (when flag clicked)، ولتشغيله عند الضغط على الكائن نفسه نستخدم لبنة «عند نقر هذا الكائن» (when this sprite clicked). كلاهما من فئة الأحداث (Events).", "page": 177}, {"title": "تكرار الكائن", "text": "لتكرار الكائن اضغط عليه بزر الفأرة الأيمن واختر مضاعفة (duplicate)، فيظهر كائن جديد مطابق للكائن الأول. ويمكن تحريك الكائنات باستخدام الفأرة.", "page": 178}, {"title": "إضافة مؤثر صوتي", "text": "افتح مكتبة الكائنات وابحث في الحيوانات عن كائن الديك وأضفه. وغيّر المقطع البرمجي ليبدأ كل مقطع عند نقر العلم الأخضر، وتستخدم لبنة «شغّل الصوت حتى انتهائه». تذكر حفظ المشروع باسم قبل إغلاقه.", "page": 179}], "terms": [{"ar": "الكائن", "en": "Sprite", "def": "نص أو صورة أو رسم يمكن برمجته", "page": 170}, {"ar": "المظهر", "en": "Costume", "def": "شكل يتخذه الكائن", "page": 174}, {"ar": "الهيئة", "en": "Looks", "def": "فئة لبنات تغير مظهر الكائن", "page": 175}, {"ar": "الأحداث", "en": "Events", "def": "فئة لبنات تبدأ المقطع البرمجي", "page": 177}, {"ar": "مضاعفة", "en": "Duplicate", "def": "أمر لعمل نسخة من الكائن", "page": 178}, {"ar": "المنصة", "en": "Stage", "def": "المنطقة التي تظهر فيها الكائنات", "page": 172}], "match": {"title": "طابق اللبنة بوظيفتها", "page": 175, "pairs": [["غيّر المظهر إلى", "تغيير المظهر إلى مظهر محدد"], ["المظهر التالي", "الانتقال إلى المظهر التالي"], ["عند نقر العلم الأخضر", "بدء المقطع البرمجي"], ["شغّل الصوت", "تشغيل مؤثر صوتي"]]}, "order": {"title": "رتب خطوات إضافة كائن من المكتبة", "page": 172, "steps": ["اضغط اختيار كائن (Choose a Sprite)", "اختر الفئة مثل حيوانات", "اختر الكائن المطلوب", "يظهر الكائن على المنصة"]}, "qs": [{"t": "mc", "q": "ما الكائن في سكراتش؟", "o": ["نص أو صورة أو رسم يمكن برمجته", "لبنة", "موسيقى فقط"], "a": 0, "why": "ص170.", "lvl": 1}, {"t": "mc", "q": "كم طريقة لإضافة كائن جديد؟", "o": ["أربع طرق", "طريقة واحدة", "طريقتان"], "a": 0, "why": "ص172.", "lvl": 1}, {"t": "mc", "q": "ماذا تسمى أشكال الكائن المختلفة؟", "o": ["مظاهر", "خلفيات", "أصوات"], "a": 0, "why": "ص174.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تغير المظهر إلى المظهر التالي؟", "o": ["المظهر التالي", "كرر", "انتظر"], "a": 0, "why": "ص175.", "lvl": 1}, {"t": "mc", "q": "أي فئة تحتوي لبنة «عند نقر العلم الأخضر»؟", "o": ["الأحداث", "الصوت", "الحركة"], "a": 0, "why": "ص177.", "lvl": 1}, {"t": "mc", "q": "أي أمر ننفذه لعمل نسخة من الكائن؟", "o": ["مضاعفة (duplicate)", "حذف", "تصدير"], "a": 0, "why": "ص178.", "lvl": 1}, {"t": "mc", "q": "لماذا نستخدم لبنة انتظر بين المظاهر؟", "o": ["لنرى كل مظهر قبل أن يتغير", "لحذف الكائن", "للحفظ"], "a": 0, "why": "ص176.", "lvl": 2}, {"t": "tf", "q": "يبدأ كل مشروع جديد في سكراتش بكائن القطة.", "a": true, "why": "ص171.", "lvl": 1}, {"t": "tf", "q": "يمكن حذف كائن بالضغط على بزر الفأرة الأيمن عليه.", "a": true, "why": "ص171.", "lvl": 1}, {"t": "tf", "q": "لا يمكن إضافة أكثر من كائن واحد في المشروع.", "a": false, "why": "يمكنك إضافة أكثر من كائن (ص173).", "lvl": 1}, {"t": "tf", "q": "لبنة «عند نقر هذا الكائن» تشغل المقطع عند الضغط على الكائن.", "a": true, "why": "ص177.", "lvl": 1}, {"t": "fill", "q": "تسمى المظاهر بالإنجليزية ___.", "a": ["Costumes", "costumes", "Costume"], "why": "ص174.", "lvl": 2}, {"t": "fill", "q": "نضغط بزر الفأرة ___ على الكائن لنختار مضاعفة.", "a": ["الأيمن", "الايمن"], "why": "ص178.", "lvl": 2}], "summary": ["الكائن نص أو صورة أو رسم", "نحذف الكائنات ونضيفها من أربع طرق", "المظاهر تجعل الكائن يتحرك", "الأحداث تبدأ المقطع البرمجي", "المضاعفة تنسخ الكائن"], "challenge": {"text": "تحدي الدرس: اختر لبنة تجعل الديناصور يتحرك عند النقر.", "q": {"t": "mc", "q": "تريد أن يتحرك الكائن عند الضغط عليه. أي لبنة تبدأ بها؟", "o": ["عند نقر هذا الكائن", "انتظر", "اربط"], "a": 0, "why": "ص177.", "lvl": 1}}}, "g5-u4-l3": {"id": "g5-u4-l3", "grade": 5, "pages": "182-192", "lab": "scratch5", "intro": {"question": "هل يمكن للكائن أن يسألك سؤالًا ويرد حسب إجابتك؟", "goals": ["أستخدم لبنتي اسأل وأجب", "أستخدم لبنة اربط", "أفهم الشروط والمعاملات الشرطية", "أستخدم لبنة إذا ثم"]}, "cards": [{"title": "لبنات اسأل وأجب", "text": "تعد لبنات «اسأل ( ) وانتظر» (ask and wait) ولبنة «الإجابة» (answer) من فئة الاستشعار (Sensing)، وهي لبنات تُستخدم دائمًا معًا. لبنة اسأل تعرض سؤالًا في مربع إدخال بأسفل المنصة، ثم تُخزّن الإجابة في لبنة الإجابة.", "page": 182}, {"title": "لبنة اربط", "text": "لبنة «اربط» (Join) هي إحدى لبنات المعاملات (Operators) ذات اللون الأخضر، وتستخدم لربط الكلمات أو الأرقام أو القيم في سلسلة. يمكنك كتابة النص أو القيمة التي تريد إظهارها في المربعات البيضاء. تذكر ترك مسافة بعد النص داخل المربع حتى لا تلتصق الكلمات.", "page": 183}, {"title": "إجراء محادثة مع الكائن", "text": "لإجراء محادثة: أضف «عند نقر العلم الأخضر»، ثم «اسأل ( ) وانتظر» واكتب «ما اسمك؟»، ثم «قل ( ) لمدة ( ) ثانية» من الهيئة، ثم «اربط»، واكتب «السلام عليكم» في المربع الأول، وضع لبنة «الإجابة» في الثاني.", "page": 183}, {"title": "الشروط", "text": "يعد اتخاذ القرارات في الحياة أمرًا مهمًا. تُستخدم الشروط في البرمجة للتحقق من القيم واتخاذ القرار بناءً على ما إذا كان الشرط محققًا أم لا.", "page": 185}, {"title": "المعاملات الشرطية في سكراتش", "text": "تستخدم لمقارنة القيم أثناء كتابة الجمل الشرطية. ثلاث لبنات: «أكبر من» (greater than، >)، «أصغر من» (less than، <)، «يساوي» (equal to، =). فإذا تحقق الشرط تكون النتيجة صحيحة وإلا تكون خطأ.", "page": 185}, {"title": "كيف تعمل لبنة إذا ثم الشرطية", "text": "تسمح الجمل الشرطية بالتحكم في سير المقطع البرمجي. لبنة «إذا ( ) ثم» (if then) من فئة التحكم (Control) تتحقق أولًا من الشرط؛ إذا كان الشرط متحققًا تنفذ الأوامر الموجودة بالداخل، وإذا لم يتحقق تتجاهلها.", "page": 186}, {"title": "جرب بنفسك: صباح الخير أيها العالم", "text": "المقطع يسأل عن الساعة ويتحقق هل هي قبل 12 ليقول «صباح الخير أيها العالم». الخطوات: عند نقر العلم الأخضر ثم اسأل «كم الساعة؟» وانتظر، ثم «إذا (الإجابة < 12) ثم»، وداخلها قل «صباح الخير أيها العالم» لمدة 4 ثوان.", "page": 187}, {"title": "قرارات متعددة", "text": "يمكن استخدام أكثر من لبنة إذا ثم؛ مثل: اسأل «ما درجة الحرارة في الخارج؟»، إذا كانت الإجابة أكبر من 20 قل «إنه دافئ»، وإذا كانت أصغر من 45 قل «إنه حار».", "page": 191}], "terms": [{"ar": "اسأل وانتظر", "en": "Ask and wait", "def": "لبنة تعرض سؤالًا وتنتظر الإجابة", "page": 182}, {"ar": "الإجابة", "en": "Answer", "def": "لبنة تخزن ما كتبه المستخدم", "page": 182}, {"ar": "اربط", "en": "Join", "def": "لبنة تربط كلمات أو قيمًا", "page": 183}, {"ar": "الشرط", "en": "Condition", "def": "تحقق من قيمة لاتخاذ قرار", "page": 185}, {"ar": "إذا ثم", "en": "If then", "def": "لبنة تنفذ الأوامر إذا تحقق الشرط", "page": 186}, {"ar": "الاستشعار", "en": "Sensing", "def": "فئة لبنات تحس بالمحيط والإدخال", "page": 182}], "match": {"title": "طابق اللبنة بوظيفتها", "page": 185, "pairs": [["أكبر من", "هل القيمة الأولى أكبر؟"], ["أصغر من", "هل القيمة الأولى أصغر؟"], ["يساوي", "هل القيمتان متساويتان؟"], ["إذا ثم", "تنفيذ الأوامر إذا تحقق الشرط"]]}, "order": {"title": "رتب لبنات المحادثة", "page": 183, "steps": ["عند نقر العلم الأخضر", "اسأل ما اسمك؟ وانتظر", "قل (اربط السلام عليكم + الإجابة)"]}, "qs": [{"t": "mc", "q": "من أي فئة لبنتا اسأل والإجابة؟", "o": ["الاستشعار", "الحركة", "الصوت"], "a": 0, "why": "ص182.", "lvl": 1}, {"t": "mc", "q": "أين تخزن الإجابة؟", "o": ["في لبنة الإجابة", "في الكائن", "في المظهر"], "a": 0, "why": "ص182.", "lvl": 1}, {"t": "mc", "q": "ما وظيفة لبنة اربط؟", "o": ["ربط الكلمات والقيم في سلسلة", "حذف الكائن", "تشغيل الصوت"], "a": 0, "why": "ص183.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تقارن القيمتين وتعيد صحيح أو خطأ؟", "o": ["المعاملات الشرطية", "انتظر", "المظهر التالي"], "a": 0, "why": "ص185.", "lvl": 1}, {"t": "mc", "q": "من أي فئة لبنة إذا ثم؟", "o": ["التحكم", "الاستشعار", "الصوت"], "a": 0, "why": "ص186.", "lvl": 1}, {"t": "mc", "q": "ماذا تفعل لبنة إذا ثم إن لم يتحقق الشرط؟", "o": ["تتجاهل الأوامر الداخلية", "تحذف الكائن", "تنفذ الأوامر"], "a": 0, "why": "ص186.", "lvl": 2}, {"t": "tf", "q": "لبنة الإجابة تخزن آخر ما كتبه المستخدم.", "a": true, "why": "ص182.", "lvl": 1}, {"t": "tf", "q": "لبنة «أكبر من» تُرجع صحيحًا إذا كانت القيمة الأولى أكبر.", "a": true, "why": "ص185.", "lvl": 1}, {"t": "tf", "q": "نكتب لبنة إذا ثم من فئة الحركة.", "a": false, "why": "من فئة التحكم (ص186).", "lvl": 1}, {"t": "tf", "q": "نترك مسافة بعد النص في لبنة اربط حتى لا تلتصق الكلمات.", "a": true, "why": "ص183.", "lvl": 2}, {"t": "fill", "q": "لبنة ___ تربط كلمتين معًا في سكراتش.", "a": ["اربط", "Join", "join"], "why": "ص183.", "lvl": 2}, {"t": "fill", "q": "الرمز > يعني ___ من.", "a": ["أكبر", "اكبر"], "why": "ص185.", "lvl": 2}], "summary": ["اسأل وانتظر ثم الإجابة", "اربط تدمج الكلمات", "الشرط: أكبر من، أصغر من، يساوي", "إذا ثم تنفذ الأوامر عند تحقق الشرط"], "challenge": {"text": "تحدي الدرس: قرر ماذا يقول الكائن حسب الإجابة.", "q": {"t": "mc", "q": "الإجابة 8 والشرط (الإجابة < 12). ماذا يحدث؟", "o": ["يتحقق الشرط وتنفذ الأوامر", "لا يتحقق", "يحذف الكائن"], "a": 0, "why": "ص187.", "lvl": 1}}}, "g5-u4-l4": {"id": "g5-u4-l4", "grade": 5, "pages": "193-206", "lab": "scratch", "intro": {"question": "كيف تجعل كائنًا يتحرك باستمرار ويرتد عن الحافة ويتحرك بمفاتيح لوحة المفاتيح؟", "goals": ["أستخدم لبنة كرر باستمرار", "أستخدم ارتد إذا كنت عند الحافة", "أحدد الاتجاه بلبنة اتجه نحو الاتجاه", "أتحكم بالكائن بلوحة المفاتيح", "أضبط نمط الدوران"]}, "cards": [{"title": "لبنات التكرار في سكراتش", "text": "يمكن تكرار تنفيذ الأوامر بدلًا من إعادة كتابتها. من أنواع التكرار: كرر ( ) مرة (repeat)، وكرر باستمرار (forever)، وكرر حتى (repeat until). ولبنات التكرار من فئة التحكم البرتقالية.", "page": 193}, {"title": "لبنة كرر باستمرار", "text": "في لبنة كرر باستمرار (forever) تُنفَّذ الأوامر الموجودة بداخلها في تكرار لا نهاية له، ولا يوجد بعدها لبنات لأن هذه اللبنة لا تحتوي على نتوء في الأسفل. لإيقافها اضغط علامة التوقف الحمراء (stop sign) أو استخدم لبنة أوقف (stop).", "page": 193}, {"title": "مثال: حركة باستمرار", "text": "اجعل القطة تتحرك 10 خطوات باستمرار ولا تتوقف عن الحركة إلا إذا ضغطت على علامة التوقف أو إذا خرجت من المنصة.", "page": 194}, {"title": "لبنة ارتد إذا كنت عند الحافة", "text": "من فئة الحركة (Motion)، تفحص هذه اللبنة هل لمس الكائن حدود الشاشة، وعندما يلمسها يرتد في الاتجاه المعاكس ويستكمل حركته. أضفها داخل كرر باستمرار حتى تعيد القطة الحركة عند كل حافة.", "page": 195}, {"title": "لبنة اتجه نحو الاتجاه", "text": "لبنة «اتجه نحو الاتجاه ( )» (point in direction) من فئة الحركة، توجه الكائن في اتجاه معين. القيمة الافتراضية لها 90 درجة، ويمكن اختيار قيمة من 0-360 أو من -180 إلى 180. المقادير: 0 لأعلى، 90 لليمين، 180 لأسفل، -90 لليسار.", "page": 196}, {"title": "لبنة مفتاح ( ) مضغوط؟", "text": "لبنة «مفتاح ( ) مضغوط؟» (key pressed?) من فئة الاستشعار، تتحقق مما إذا تم الضغط على مفتاح معين في لوحة المفاتيح؛ فتعطي النتيجة «صحيحة» إذا تم ضغط المفتاح و«خطأ» إذا لم يتم ضغطه. المفتاح الافتراضي هو المسافة.", "page": 198}, {"title": "التحكم بالأسهم", "text": "لتحريك الكائن يمينًا: إذا مفتاح السهم الأيمن مضغوط ← اتجه نحو الاتجاه 90 ← تحرك 10 خطوات. وبالمثل لليسار نستخدم -90. ولأعلى 0 ولأسفل 180، مع وضع كل شرط داخل كرر باستمرار.", "page": 199}, {"title": "لبنة اجعل نمط الدوران", "text": "لبنة «اجعل نمط الدوران ( )» (set rotation style) من فئة الحركة، وفيها ثلاثة أنماط: «في جميع الاتجاهات» (all around)، و«يسار - يمين» (left-right) يعكس الكائن فقط عند التحرك لليمين أو اليسار، و«لا تدور» (don't rotate) فلا يدور الكائن إطلاقًا.", "page": 201}], "terms": [{"ar": "كرر باستمرار", "en": "Forever", "def": "تكرار الأوامر دون نهاية", "page": 193}, {"ar": "ارتد إذا كنت عند الحافة", "en": "If on edge, bounce", "def": "ارتداد الكائن عن حافة المنصة", "page": 195}, {"ar": "اتجه نحو الاتجاه", "en": "Point in direction", "def": "تحديد زاوية اتجاه الكائن", "page": 196}, {"ar": "مفتاح مضغوط؟", "en": "Key pressed?", "def": "تحقق من الضغط على مفتاح", "page": 198}, {"ar": "نمط الدوران", "en": "Rotation style", "def": "طريقة دوران الكائن", "page": 201}, {"ar": "التحكم", "en": "Control", "def": "فئة البنات البرتقالية للتكرار والشروط", "page": 193}], "match": {"title": "طابق الزاوية بالاتجاه", "page": 196, "pairs": [["0", "لأعلى"], ["90", "لليمين"], ["180", "لأسفل"], ["-90", "لليسار"]]}, "order": {"title": "رتب لبنات حركة الكائن يمينًا", "page": 199, "steps": ["عند نقر العلم الأخضر", "كرر باستمرار", "إذا مفتاح السهم الأيمن مضغوط", "اتجه نحو الاتجاه 90 ثم تحرك 10 خطوات"]}, "qs": [{"t": "mc", "q": "ماذا تفعل لبنة كرر باستمرار؟", "o": ["تكرر الأوامر بلا نهاية", "تنفذ الأوامر مرة", "تحذف الكائن"], "a": 0, "why": "ص193.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تجعل الكائن يرتد عند حافة المنصة؟", "o": ["ارتد إذا كنت عند الحافة", "انتظر", "قل"], "a": 0, "why": "ص195.", "lvl": 1}, {"t": "mc", "q": "ما الزاوية التي تجعل الكائن يتجه لأعلى؟", "o": ["0", "90", "180"], "a": 0, "why": "ص196.", "lvl": 1}, {"t": "mc", "q": "ما الزاوية الافتراضية للبنة اتجه؟", "o": ["90", "0", "180"], "a": 0, "why": "ص196.", "lvl": 1}, {"t": "mc", "q": "من أي فئة لبنة مفتاح مضغوط؟", "o": ["الاستشعار", "الصوت", "الهيئة"], "a": 0, "why": "ص198.", "lvl": 1}, {"t": "mc", "q": "أي نمط دوران لا يجعل الكائن يدور إطلاقًا؟", "o": ["لا تدور", "في جميع الاتجاهات", "يسار - يمين"], "a": 0, "why": "ص201.", "lvl": 2}, {"t": "mc", "q": "كيف نوقف لبنة كرر باستمرار؟", "o": ["علامة التوقف الحمراء", "الحفظ", "الحذف"], "a": 0, "why": "ص193.", "lvl": 2}, {"t": "tf", "q": "لبنة كرر باستمرار لا تحتوي على نتوء في الأسفل.", "a": true, "why": "ص193.", "lvl": 1}, {"t": "tf", "q": "لبنة ارتد إذا كنت عند الحافة من فئة التحكم.", "a": false, "why": "من فئة الحركة (ص195).", "lvl": 1}, {"t": "tf", "q": "لبنة مفتاح مضغوط تعطي صحيحًا إذا ضغط المفتاح.", "a": true, "why": "ص198.", "lvl": 1}, {"t": "fill", "q": "الزاوية ___ تجعل الكائن يتجه لأسفل.", "a": ["180"], "why": "ص196.", "lvl": 2}, {"t": "fill", "q": "نمط الدوران «يسار - يمين» بالإنجليزية left-___.", "a": ["right", "Right"], "why": "ص201.", "lvl": 2}], "summary": ["كرر باستمرار تكرر الأوامر بلا نهاية", "ارتد عند الحافة من فئة الحركة", "الاتجاه بالدرجات: 0 أعلى، 90 يمين، 180 أسفل، -90 يسار", "مفتاح مضغوط للتحكم باللوحة", "نمط الدوران: جميع الاتجاهات، يسار-يمين، لا تدور"], "challenge": {"text": "تحدي الدرس: اجعل الكرة تتحرك بمفاتيح الأسهم.", "q": {"t": "mc", "q": "تريد تحريك الكائن لأعلى بالسهم. أي اتجاه تستخدم؟", "o": ["0", "90", "180"], "a": 0, "why": "ص196.", "lvl": 1}}}, "g5-u4-l5": {"id": "g5-u4-l5", "grade": 5, "pages": "207-216", "lab": "scratch", "intro": {"question": "كيف يتحدث كائنان مع بعضهما في الرسوم المتحركة؟", "goals": ["أفهم الأحداث في سكراتش", "أستخدم لبنتي بث وعندما أتلقى", "أعرف الرسم المتحرك وإرشاداته", "أنشئ حوارًا بين كائنين برسالة بث"]}, "cards": [{"title": "الأحداث في سكراتش", "text": "يتلقى الحاسب إشارة عند تحريك الفأرة أو الضغط على أحد مفاتيح لوحة المفاتيح، ويسمى هذا بالحدث. ويمكن لبرامج سكراتش توجيه الحاسب للقيام بعمل معين بناءً على أي حدث، ومن الأحداث المهمة رسائل البث والاستقبال من خلال لبنات البث (Broadcast).", "page": 207}, {"title": "رسائل البث والاستقبال", "text": "البث هو رسالة يتم إرسالها من خلال برنامج سكراتش لتنشيط المقاطع البرمجية عبر لبنة الأحداث (Event) المطابقة. يتم إرسال رسائل البث من خلال لبنات «بث» (Broadcast)، ويتم تلقيها عبر لبنة «عندما أتلقى ( )» (when I receive).", "page": 207}, {"title": "لبنات البث الثلاث", "text": "«عندما أتلقى»: يتم تفعيل اللبنة وتنفيذ باقي المقطع البرمجي بمجرد استلام الرسالة. «بث»: ترسل رسالة إلى المقاطع البرمجية الأخرى ليتم تنفيذ الأمر. «بث وانتظر»: ترسل الرسالة وتوقف مقطعها مؤقتًا حتى تكتمل المقاطع الخاصة بلبنة عندما أتلقى.", "page": 207}, {"title": "ما هو الرسم المتحرك؟", "text": "الرسم المتحرك هو وسيط ديناميكي يعالج الصور أو الكائنات لتظهر كصور متحركة، وعادة يتحقق عبر سلسلة سريعة من الصور المتسلسلة التي تختلف قليلًا. تعتبر عمليات البث مفيدة في الألعاب والرسوم المتحركة.", "page": 208}, {"title": "إرشادات الرسوم المتحركة", "text": "1) تعكس الخلفية والكائنات مفهوم الرسوم المتحركة. 2) تعكس مظاهر الكائنات مشاعرها وسلوكها. 3) يكون الحوار واقعيًا وممتعًا. 4) تنقل الرسائل بدقة. 5) تخصيص وقت كافٍ لفاعلية كلام الكائنات حتى يتمكن الجمهور من قراءتها. 6) تعتبر الحركة الطبيعية جزءًا مهمًا من الرسوم المتحركة.", "page": 208}, {"title": "مشروع رسوم متحركة في الفضاء", "text": "أنشئ مشروعًا جديدًا وأطلق عليه «رسوم متحركة في الفضاء»، واحذف كائن القطة وأضف خلفية Space City 1 والكائنين Pico Walking وNano. اختر Pico Walking لأنه يتضمن مظاهر تحاكي المشي، وNano لأن مظاهره تعكس مجموعة متنوعة من المشاعر.", "page": 209}, {"title": "بدء الحوار بين كائنين", "text": "لإنشاء حوار نستخدم لبنة «اسأل ( ) وانتظر». لكن هنا يتحاور كائنان عن طريق بث الرسائل. الكائن Pico Walking يبدأ بالمشي ثم يقول «السلام عليكم، لماذا أراك حزينًا؟» ويستخدم لبنة «بث رسالة 1 وانتظر».", "page": 210}, {"title": "رد الكائن Nano", "text": "للكائن Nano: من فئة الأحداث أضف «عندما أتلقى الرسالة 1» ثم من الهيئة لبنة «قل ( ) لمدة ( ) ثانية» واكتب «أريد الذهاب في رحلة لاستكشاف الفضاء لكن لا أحد يريد أن يرافقني». ويمكنك إنشاء رسالة جديدة بالضغط على «رسالة جديدة» وكتابة اسمها.", "page": 211}], "terms": [{"ar": "الحدث", "en": "Event", "def": "إشارة يتلقاها الحاسب مثل نقر الفأرة", "page": 207}, {"ar": "بث", "en": "Broadcast", "def": "إرسال رسالة إلى المقاطع البرمجية", "page": 207}, {"ar": "عندما أتلقى", "en": "When I receive", "def": "لبنة تبدأ مقطعًا عند استقبال رسالة", "page": 207}, {"ar": "بث وانتظر", "en": "Broadcast and wait", "def": "يرسل الرسالة وينتظر انتهاء المقاطع", "page": 207}, {"ar": "الرسم المتحرك", "en": "Animation", "def": "صور متتالية تظهر كأنها تتحرك", "page": 208}], "match": {"title": "طابق اللبنة بوظيفتها", "page": 207, "pairs": [["بث", "إرسال رسالة"], ["عندما أتلقى", "بدء مقطع عند الاستقبال"], ["بث وانتظر", "إرسال ثم انتظار الانتهاء"], ["عند نقر العلم الأخضر", "بدء المشروع"]]}, "order": {"title": "رتب خطوات إنشاء رسالة بث", "page": 212, "steps": ["اضغط فئة الأحداث", "اضغط بث واختر رسالة جديدة", "اكتب اسم الرسالة", "اضغط موافق"]}, "qs": [{"t": "mc", "q": "ما الحدث؟", "o": ["إشارة يتلقاها الحاسب مثل نقر الفأرة", "جهاز", "ملف"], "a": 0, "why": "ص207.", "lvl": 1}, {"t": "mc", "q": "أي لبنة ترسل رسالة إلى المقاطع الأخرى؟", "o": ["بث", "عندما أتلقى", "انتظر"], "a": 0, "why": "ص207.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تبدأ مقطعًا عند وصول رسالة؟", "o": ["عندما أتلقى", "بث", "قل"], "a": 0, "why": "ص207.", "lvl": 1}, {"t": "mc", "q": "ماذا تفعل لبنة بث وانتظر؟", "o": ["ترسل الرسالة وتنتظر اكتمال المقاطع الأخرى", "تحذف الكائن", "تغير الخلفية"], "a": 0, "why": "ص207.", "lvl": 1}, {"t": "mc", "q": "ما الرسم المتحرك؟", "o": ["سلسلة سريعة من الصور المتتابعة", "نص مكتوب فقط", "صورة ثابتة"], "a": 0, "why": "ص208.", "lvl": 1}, {"t": "mc", "q": "لماذا اخترنا Pico Walking؟", "o": ["لأن مظاهره تحاكي المشي", "لأنه كبير", "لأنه بلا مظاهر"], "a": 0, "why": "ص209.", "lvl": 2}, {"t": "tf", "q": "رسائل البث مفيدة في الألعاب والرسوم المتحركة.", "a": true, "why": "ص208.", "lvl": 1}, {"t": "tf", "q": "لبنة عندما أتلقى تُرسل الرسالة.", "a": false, "why": "تستقبلها (ص207).", "lvl": 1}, {"t": "tf", "q": "يجب أن تكون الحركة طبيعية في الرسوم المتحركة.", "a": true, "why": "ص208.", "lvl": 1}, {"t": "fill", "q": "لبنة ___ ترسل رسالة إلى الكائنات الأخرى.", "a": ["بث", "Broadcast", "broadcast"], "why": "ص207.", "lvl": 2}, {"t": "fill", "q": "نختار «رسالة ___» لإنشاء رسالة بث جديدة.", "a": ["جديدة"], "why": "ص212.", "lvl": 2}], "summary": ["الحدث إشارة يتلقاها الحاسب", "بث وعندما أتلقى تنسقان بين الكائنات", "الرسم المتحرك صور متتابعة", "أنشأنا حوارًا بين كائنين برسالة بث"], "challenge": {"text": "تحدي الدرس: اجعل كائنين يتبادلان الحديث.", "q": {"t": "mc", "q": "تريد أن يرد الكائن الثاني بعد كلام الأول. ماذا تستخدم؟", "o": ["بث وعندما أتلقى", "كرر باستمرار فقط", "اتجه نحو الاتجاه"], "a": 0, "why": "ص207.", "lvl": 1}}}, "g5-u4-l6": {"id": "g5-u4-l6", "grade": 5, "pages": "217-224", "lab": "scratch", "intro": {"question": "كيف يعرف الكائن أنه لمس لونًا أو لمس مؤشر الفأرة؟", "goals": ["أتعرف لبنات الاستشعار", "أستخدم لبنة ملامس لـ", "أستخدم لبنة ملامس للون", "أتحقق من ملامسة مؤشر الفأرة"]}, "cards": [{"title": "لبنات الاستشعار", "text": "يوفر سكراتش لبنات استشعار يمكنك التحقق بها: هل الكائن يلامس شيئًا ما في المنصة؟ مثل الكائنات الأخرى أو مؤشر الفأرة أو حافة الشاشة أو لونًا محددًا. إذا كان الكائن يلامس الكائن المحدد فإن اللبنة تعود بالنتيجة صحيحة وإلا فإنها ترجع خطأ. ويمكن العثور عليها في فئة الاستشعار (Sensing).", "page": 217}, {"title": "لبنة ملامس لـ", "text": "لبنة «ملامس لـ ( )؟» (touching) تتحقق مما إذا كان الكائن يلامس مؤشر الفأرة أو حافة الشاشة أو كائنًا آخر.", "page": 217}, {"title": "لبنة ملامس للون", "text": "لبنة «ملامس للون ( )؟» (touching color) تتحقق مما إذا كان الكائن يلامس لونًا محددًا. ولبنة «اللون ( ) ملامس للون ( )؟» (color is touching) تتحقق مما إذا كان لون الكائن يلامس لونًا آخر.", "page": 217}, {"title": "ملامسة اللون: مقطع القطة والبالون", "text": "لإنشاء مقطع باستخدام لبنات الملامسة: «عند نقر العلم الأخضر» ثم «كرر باستمرار» ثم «تحرك 5 خطوات» ثم «إذا» من التحكم، ثم «ملامس لـ Balloon1؟» من الاستشعار، ثم «قل لمسته لمدة 2 ثانية» من الهيئة.", "page": 218}, {"title": "طرق متعددة للحصول على النتيجة نفسها", "text": "في البرمجة يمكنك الحصول على نفس النتيجة بطرق مختلفة. فالقطة تتحرك وعندما تلمس البالون تقول «لقد لمسته». والمقاطع البرمجية السابقة لها نفس النتيجة بطرق مختلفة.", "page": 220}, {"title": "التحقق من ملامسة مؤشر الفأرة", "text": "يمكن استخدام لبنات الملامسة لتتحقق من ملامسة الكائن لمؤشر الفأرة. ستنشئ لعبة تحاول فيها لمس كائن Gobo بمؤشر الفأرة؛ وفي كل مرة يلامس فيها مؤشر الفأرة الكائن Gobo ينتقل إلى موضع مختلف. تحتاج أولًا إلى إنشاء مشروع جديد وإضافة خلفية.", "page": 221}, {"title": "لبنة اذهب إلى", "text": "لبنة «اذهب إلى ( )» (go to) من لبنات الحركة، تعين للكائن موضع الكائن المحدد، ويمكن أن يكون الموضع هو موضع مؤشر الفأرة، أو موضعًا عشوائيًا أو كائنًا آخر موجودًا بالمنصة. كل مرة يلامس فيها المؤشر الكائن، ينتقل الكائن إلى موضع عشوائي.", "page": 222}, {"title": "Gobo يتكلم ويتبع الحركة", "text": "في بداية المقطع سيقول Gobo عبارة «استخدم الفأرة للإمساك بي» لمدة 2 ثانية. ثم نغيّر مظاهر الكائن بلبنة «غيّر المظهر إلى». ولجعل Gobo يتبع مؤشر الفأرة نضع «اذهب إلى مؤشر الفأرة» داخل إذا ملامس لمؤشر الفأرة.", "page": 222}], "terms": [{"ar": "الاستشعار", "en": "Sensing", "def": "فئة لبنات الاستشعار", "page": 217}, {"ar": "ملامس لـ", "en": "Touching", "def": "هل يلامس الكائن شيئًا؟", "page": 217}, {"ar": "ملامس للون", "en": "Touching color", "def": "هل يلامس الكائن لونًا محددًا؟", "page": 217}, {"ar": "اذهب إلى", "en": "Go to", "def": "ينقل الكائن إلى موضع محدد", "page": 222}, {"ar": "مؤشر الفأرة", "en": "Mouse pointer", "def": "سهم الفأرة على الشاشة", "page": 221}], "match": {"title": "طابق اللبنة بوظيفتها", "page": 217, "pairs": [["ملامس لـ", "هل يلامس الكائن الفأرة أو الحافة أو كائنًا؟"], ["ملامس للون", "هل يلامس الكائن لونًا محددًا؟"], ["اذهب إلى", "نقل الكائن إلى موضع"], ["إذا ثم", "تنفيذ الأوامر عند تحقق الشرط"]]}, "order": {"title": "رتب لبنات مقطع ملامسة البالون", "page": 218, "steps": ["عند نقر العلم الأخضر", "كرر باستمرار", "تحرك 5 خطوات", "إذا ملامس لـ Balloon1 فقل لمسته"]}, "qs": [{"t": "mc", "q": "من أي فئة لبنات الملامسة؟", "o": ["الاستشعار", "الصوت", "الحركة"], "a": 0, "why": "ص217.", "lvl": 1}, {"t": "mc", "q": "ماذا تتحقق لبنة ملامس لـ؟", "o": ["ملامسة الكائن لشيء ما", "لون الخلفية فقط", "اسم الكائن"], "a": 0, "why": "ص217.", "lvl": 1}, {"t": "mc", "q": "ماذا تتحقق لبنة ملامس للون؟", "o": ["ملامسة لون محدد", "حجم الكائن", "الصوت"], "a": 0, "why": "ص217.", "lvl": 1}, {"t": "mc", "q": "ماذا تعيد لبنة الاستشعار إذا لم تتحقق الملامسة؟", "o": ["خطأ", "صحيحة", "كلاهما"], "a": 0, "why": "ص217.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تنقل Gobo إلى موضع عشوائي؟", "o": ["اذهب إلى", "قل", "انتظر"], "a": 0, "why": "ص222.", "lvl": 1}, {"t": "mc", "q": "لبنة اذهب إلى من أي فئة؟", "o": ["الحركة", "الصوت", "الأحداث"], "a": 0, "why": "ص222.", "lvl": 2}, {"t": "tf", "q": "يمكن الحصول على النتيجة نفسها بطرق برمجية مختلفة.", "a": true, "why": "ص220.", "lvl": 1}, {"t": "tf", "q": "لبنة الملامسة تتحقق من كائن واحد فقط ولا تتحقق من الألوان.", "a": false, "why": "ص217.", "lvl": 1}, {"t": "tf", "q": "كل مرة يلامس مؤشر الفأرة Gobo ينتقل إلى موضع جديد.", "a": true, "why": "ص222.", "lvl": 1}, {"t": "fill", "q": "لبنة ___ لـ تتحقق من الملامسة.", "a": ["ملامس", "Touching", "touching"], "why": "ص217.", "lvl": 2}, {"t": "fill", "q": "نضع لبنة ملامس لـ داخل لبنة ___ ثم.", "a": ["إذا", "اذا"], "why": "ص218.", "lvl": 2}], "summary": ["لبنات الاستشعار تتحقق من الملامسة", "ملامس لـ للكائنات والحافة والفأرة", "ملامس للون يتحقق من لون", "اذهب إلى تنقل الكائن"], "challenge": {"text": "تحدي الدرس: اجعل الكائن يقول شيئًا عند لمس لون.", "q": {"t": "mc", "q": "تريد أن تتحقق القطة من لمس لون البالون. أي لبنة تستخدم؟", "o": ["ملامس للون", "انتظر", "كرر"], "a": 0, "why": "ص217.", "lvl": 1}}}, "g6-u1-l1": {"id": "g6-u1-l1", "grade": 6, "pages": "12-34", "lab": null, "intro": {"question": "كيف يصمم المهندسون المباني والسيارات قبل بنائها فعلًا؟", "goals": ["أفرّق بين الشكل ثنائي الأبعاد وثلاثي الأبعاد", "أتعرف تطبيقات النمذجة ثلاثية الأبعاد", "أتعرف واجهة برنامج تينكركاد وأنشئ حسابًا", "أضيف الأشكال وأغير حجمها وخصائصها"]}, "cards": [{"title": "ما النمذجة ثلاثية الأبعاد؟", "text": "النمذجة ثنائية الأبعاد (2D Modeling) هي إنشاء تمثيل ثنائي الأبعاد لشكل أو مشهد، وتتضمن إنشاء صور مسطحة. أما النمذجة ثلاثية الأبعاد (3D Modeling) فهي تقنية رائعة تتيح لك إنشاء وتصميم أشكال افتراضية ثلاثية الأبعاد.", "page": 12}, {"title": "تطبيقات النمذجة ثلاثية الأبعاد", "text": "تستخدم النمذجة ثلاثية الأبعاد في التصاميم المعمارية للمباني والمنشآت مثل ناطحات السحاب والجسور والملاعب، وفي تصميم المنتجات للتصنيع مثل السيارات والأجهزة المنزلية والأجهزة الطبية، وفي بيئات وتجارب الواقع الافتراضي.", "page": 12}, {"title": "الشكل ثنائي الأبعاد", "text": "الشكل ثنائي الأبعاد هو شكل مُسطّح ذو بُعدين، وهما الطول والعرض. يمكنك استخدام برنامج للرسومات مثل الرسام لرسم أشكال ثنائية الأبعاد. المربعات والمثلثات والدوائر من الأمثلة الشائعة عليها، ويُمثّل المربع في نظام إحداثيات ثنائي الأبعاد بالمحورين X (عرض المربع) وY (طول المربع).", "page": 13}, {"title": "الشكل ثلاثي الأبعاد", "text": "الشكل ثلاثي الأبعاد هو شكل ذو ثلاثة أبعاد: الطول والعرض والارتفاع. تعد المكعبات والأهرامات والأقماع والأشكال الكروية من أمثلته. ويمثل المكعب في نظام إحداثيات ثلاثي الأبعاد بالمحاور X (عرض المكعب) وY (طول المكعب) وZ (ارتفاع المكعب).", "page": 14}, {"title": "التحويل من ثنائي إلى ثلاثي الأبعاد", "text": "إذا أخذت قطعة من الورق ورسمت مربعًا، فهذا شكل ثنائي الأبعاد. وإذا أضفت بُعدًا ثالثًا (الارتفاع) إلى المربع فيصبح صندوقًا (مكعبًا)، وهو شكل ثلاثي الأبعاد. وبالمثل يتحول الدائرة إلى كرة أو أسطوانة.", "page": 15}, {"title": "برنامج تينكركاد", "text": "أوتوديسك تينكركاد (Tinkercad) برنامج مجاني ثلاثي الأبعاد يعمل في المتصفح، يسمح لك بإنشاء وتعديل التصاميم ثلاثية الأبعاد بسهولة. من قوائمه: Gallery المعرض، Projects المشروعات، Classrooms الفصول الدراسية، Resources الموارد. ولتسجيل الدخول Log in ولإنشاء حساب Sign up.", "page": 15}, {"title": "إنشاء حساب في تينكركاد", "text": "انتقل إلى tinkercad.com واضغط Sign Up، ثم Start Tinkering واختر Create a personal account، ويمكنك التسجيل بالبريد الإلكتروني أو بحسابات جوجل أو أبل أو مايكروسوفت أو فيس بوك. اختر المملكة العربية السعودية وأدخل تاريخ الميلاد، ثم اضغط NEXT ثم وافق على الشروط ثم Continue.", "page": 16}, {"title": "إنشاء تصميم ثلاثي الأبعاد", "text": "التصاميم ثلاثية الأبعاد هي التمثيل الرقمي للأشكال ثلاثية الأبعاد. لإنشاء تصميم: اختر Designs (التصميمات)، ثم اضغط Create (+جديد)، ثم حدد 3D Design (تصميم ثلاثي الأبعاد).", "page": 17}, {"title": "مساحة العمل", "text": "مساحة العمل (Workplane) هي سطح مستو ثنائي الأبعاد يمكنك إنشاء الأشكال ومعالجتها داخله، وتعد أساس العمل في التصميم. من عناصر الواجهة: View Controls (أدوات التحكم بالعرض)، Grid Options (خيارات تخطيط الشبكة)، Shape Tools (أدوات الشكل)، Editing Tools (أدوات التحرير)، Model editing tools (أدوات تحرير النموذج). يمكنك تغيير اسم المشروع بالضغط عليه.", "page": 18}, {"title": "أدوات تحرير النموذج وأدوات التحرير", "text": "من أدوات تحرير النموذج: أداة المراقبة، وأداة تجميع (Group) لمعالجة عدة أشكال كشكل واحد، وأداة فك التجميع، وأداة المحاذاة (Align)، وأداة المرآة لإنشاء صورة معكوسة. ومن أدوات التحرير: النسخ، واللصق، والنسخ والمضاعفة (Duplicate and Repeat)، والحذف، والتراجع والإعادة.", "page": 20}, {"title": "إضافة الأشكال", "text": "إضافة الأشكال من أكثر الأشياء شيوعًا في تينكركاد. من الشكل (Shapes) اختر فئة Basic Shapes (الأشكال الأساسية)، واسحب صندوقًا إلى مساحة العمل. وللتكبير اضغط على إشارة + في أدوات التحكم في العرض. يمكن استخدام Fit all in view لاحتواء كل الأشكال داخل منطقة العرض.", "page": 21}, {"title": "تغيير خصائص الشكل", "text": "من صندوق الخصائص: Solid (صلب) يجعل الشكل صلبًا، وHole (مُفرغ) يضيف فجوات. Radius نصف قطر الزوايا، وSteps عدد الأجزاء المكونة للجوانب، وLength يحدد الطول على المحور X، وWidth العرض على المحور Y، وHeight الارتفاع على المحور Z.", "page": 22}, {"title": "تغيير حجم الشكل", "text": "تتيح لك المقابض تغيير حجم الشكل: المقابض على الحواف تغير طول الشكل على محور معين، والمقابض في الزوايا تغير الحجم بشكل متناسب، والمقابض الصغيرة أعلى الشكل تغير الارتفاع. وحدة القياس الافتراضية هي الملّيمتر. ويمكن تغيير الطول من 20.00 إلى 40.00 بالضغط على المقبض ثم كتابة القيمة.", "page": 23}, {"title": "تحريك الشكل على امتداد المحور Z", "text": "تغيير موضع الشكل على المحور Z يعني رفعه لأعلى أو لأسفل. أضف شكل السقف (Roof) من أدوات الشكل، ثم اضغط على المقبض الأسود في الجزء العلوي واسحبه لأعلى بمقدار 20 ملم. وتحرك السقف أيضًا على المحور Y.", "page": 25}], "terms": [{"ar": "النمذجة ثلاثية الأبعاد", "en": "3D Modeling", "def": "إنشاء أشكال افتراضية ثلاثية الأبعاد", "page": 12}, {"ar": "الشكل ثنائي الأبعاد", "en": "2D Shape", "def": "شكل مسطح له طول وعرض", "page": 13}, {"ar": "الشكل ثلاثي الأبعاد", "en": "3D Shape", "def": "شكل له طول وعرض وارتفاع", "page": 14}, {"ar": "تينكركاد", "en": "Tinkercad", "def": "برنامج مجاني للتصميم ثلاثي الأبعاد", "page": 15}, {"ar": "مساحة العمل", "en": "Workplane", "def": "سطح مستو يبنى عليه التصميم", "page": 18}, {"ar": "المحور Z", "en": "Z axis", "def": "يمثل الارتفاع", "page": 14}, {"ar": "صلب", "en": "Solid", "def": "يجعل الشكل جسمًا صلبًا", "page": 22}, {"ar": "مُفرغ", "en": "Hole", "def": "يزيل جزءًا من الأشكال الصلبة", "page": 22}], "match": {"title": "طابق المحور بما يمثله", "page": 14, "pairs": [["المحور X", "العرض"], ["المحور Y", "الطول"], ["المحور Z", "الارتفاع"], ["مساحة العمل", "Workplane"]]}, "order": {"title": "رتب خطوات إنشاء تصميم ثلاثي الأبعاد جديد", "page": 17, "steps": ["اختر Designs (التصميمات)", "اضغط Create (+جديد)", "حدد 3D Design (تصميم ثلاثي الأبعاد)", "ظهرت مساحة العمل"]}, "qs": [{"t": "mc", "q": "كم بعدًا للشكل ثلاثي الأبعاد؟", "o": ["ثلاثة", "اثنان", "واحد"], "a": 0, "why": "ص14.", "lvl": 1}, {"t": "mc", "q": "أي مما يلي شكل ثلاثي الأبعاد؟", "o": ["المكعب", "المربع", "المثلث المرسوم على الورق"], "a": 0, "why": "ص14.", "lvl": 1}, {"t": "mc", "q": "ماذا يمثل المحور Z؟", "o": ["الارتفاع", "العرض", "الطول"], "a": 0, "why": "ص14.", "lvl": 1}, {"t": "mc", "q": "ما اسم البرنامج المجاني الذي نصمم به الأشكال ثلاثية الأبعاد؟", "o": ["تينكركاد", "وورد", "أوداسيتي"], "a": 0, "why": "ص15.", "lvl": 1}, {"t": "mc", "q": "أي خيار نضبطه لجعل الشكل مفرغًا؟", "o": ["Hole", "Solid", "Steps"], "a": 0, "why": "ص22.", "lvl": 1}, {"t": "mc", "q": "ما وحدة القياس الافتراضية في تينكركاد؟", "o": ["الملّيمتر", "المتر", "الكيلومتر"], "a": 0, "why": "ص23.", "lvl": 1}, {"t": "mc", "q": "ما مساحة العمل؟", "o": ["سطح مستو تبنى عليه الأشكال", "لوحة المفاتيح", "برنامج الرسم"], "a": 0, "why": "ص18.", "lvl": 2}, {"t": "tf", "q": "يتحول المربع إلى مكعب عند إضافة بُعد الارتفاع.", "a": true, "why": "ص15.", "lvl": 1}, {"t": "tf", "q": "تينكركاد يتطلب شراء برنامج.", "a": false, "why": "برنامج مجاني (ص15).", "lvl": 1}, {"t": "tf", "q": "المقابض في الزوايا تغير حجم الشكل بشكل متناسب.", "a": true, "why": "ص23.", "lvl": 1}, {"t": "tf", "q": "الدائرة شكل ثلاثي الأبعاد.", "a": false, "why": "الدائرة ثنائية الأبعاد (ص13).", "lvl": 2}, {"t": "fill", "q": "الشكل ثنائي الأبعاد له طول و___.", "a": ["عرض", "العرض"], "why": "ص13.", "lvl": 2}, {"t": "fill", "q": "نختار ___ لتجميع الأشكال كوحدة واحدة.", "a": ["Group", "group", "تجميع"], "why": "ص20.", "lvl": 2}], "summary": ["ثنائي الأبعاد: طول وعرض (X وY). ثلاثي الأبعاد: طول وعرض وارتفاع (X وY وZ)", "تينكركاد برنامج مجاني للتصميم ثلاثي الأبعاد", "مساحة العمل وأدوات الشكل والتحرير", "الأشكال تضاف بالسحب وتتغير أحجامها بالمقابض والخصائص"], "challenge": {"text": "تحدي الدرس: حدد البعد المناسب.", "q": {"t": "mc", "q": "تريد زيادة ارتفاع الصندوق. أي محور تغير؟", "o": ["Z", "X", "Y"], "a": 0, "why": "ص14.", "lvl": 1}}}, "g6-u1-l2": {"id": "g6-u1-l2", "grade": 6, "pages": "36-53", "lab": null, "intro": {"question": "كيف تبني حامل أقلام من أشكال بسيطة (أسطوانة وصندوق ووتد) في تينكركاد؟", "goals": ["أضيف الأشكال وأحرك وأضاعف وأدوّر", "أستخدم الأشكال الصلبة والمفرغة", "أحاذي الأشكال وأجمّعها", "أغير لون النموذج وأدمج الأشكال"]}, "cards": [{"title": "حامل المستلزمات المكتبية", "text": "في هذا الدرس ستنشئ شكلًا مفيدًا باستخدام قاعدة حامل مستلزمات مكتبية لتنظيم أقلام الرصاص والأوراق المربعة والأشياء الصغيرة. ستستخدم الأشكال الأساسية المختلفة وتجمعها معًا. وفي النهاية ستعرف الخطوات التي يجب اتباعها لدمج الأشكال.", "page": 36}, {"title": "الأشكال المستخدمة", "text": "ستستخدم ثلاثة أشكال أساسية: أسطوانتان، وصندوق واحد، وسقف واحد. وستستخدم أسطوانة (Cylinder) لإنشاء قاعدة حامل المستلزمات المكتبية.", "page": 37}, {"title": "إنشاء القاعدة", "text": "من أدوات الشكل Shape tools حدد الأسطوانة Cylinder واضغط على مساحة العمل. حدد المقبض الأبيض لتغيير الطول والعرض: اضغط على الصندوق الخاص بالطول واكتب 100.00 مم، وبالعرض 100.00 مم. ثم حدد المقبض الأبيض بالارتفاع واكتب 2.00 مم.", "page": 37}, {"title": "إنشاء حامل الأقلام", "text": "أضف أسطوانة جديدة: الطول والعرض 40.00 مم، والارتفاع 80.00 مم. ثم اسحب المقبض لأعلى بمقدار 2.00 مم لتضعها فوق القاعدة التي سمكها 2.00 مم.", "page": 38}, {"title": "الأشكال الصلبة والمفرغة", "text": "الجسم الصلب هو جسم ذو سطح صلب ويشغل مساحة محددة ويشبه الصخرة الصلبة. أما الجسم المفرغ فهو جسم يتم إزالته من جسم صلب لإنشاء فراغ أو فتحة بداخله، وهو أشبه بثقب أو تجويف. تستخدم الأشكال المفرغة لإنشاء تجاويف أو فراغات داخل جسم صلب.", "page": 41}, {"title": "تكرار أسطوانة حامل الأقلام", "text": "من أدوات التحرير اضغط Duplicate and repeat (مضاعفة وتكرار)، ثم من لوحة الخصائص اضغط Change to hole (تغيير إلى مُفرغ). حدد المقبض الأيمن السفلي واجعل الطول والعرض 38.00 مم لإنشاء تجويف داخل الأسطوانة.", "page": 42}, {"title": "المحاذاة", "text": "يقصد بمحاذاة الأشكال ترتيب شكلين أو أكثر ووضعهما بطريقة معينة، أفقيًا أو رأسيًا، وإلى اليسار أو اليمين أو الوسط، وإلى الأعلى أو الأسفل. ويتم تنفيذ ذلك باستخدام أداة المحاذاة (Align) من أدوات تحرير النموذج.", "page": 43}, {"title": "تغيير طريقة عرض الشكل (فيوكيوب)", "text": "يمكنك تغيير طريقة عرض الشكل ثلاثي الأبعاد بسهولة باستخدام أداة فيوكيوب (ViewCube)، حيث تشير الأسهم إلى أعلى وأسفل ويسار ويمين. تظهر فيوكيوب اتجاه عرض الكاميرا. يمكن استخدام زر الفأرة الأيمن لتدوير عرض الكاميرا وزر عجلة التمرير للتنقل في مساحة العمل.", "page": 45}, {"title": "إضافة صندوق وتجويفه", "text": "من أدوات الشكل حدد صندوق Box واضغط على مساحة العمل. اضبط الطول والعرض 40.00 مم والارتفاع 30.00 مم، ثم ارفعه بمقدار 2.00 مم. ولتجويف الصندوق: من Duplicate and repeat ثم Change to hole واجعل الطول والعرض 38.00 مم.", "page": 46}, {"title": "إضافة الوتد (Wedge)", "text": "لتصميم الحامل الثالث الخاص بأكواب المشروبات أضف وتد Wedge من أدوات الشكل، واضبط الطول 30.00 مم، ثم ارفع الشكل بمقدار 2.00 مم. ولاستدارة الوتد 180 درجة اكتب 180 ثم Enter.", "page": 49}, {"title": "محاذاة الوتدين وتجميعهما", "text": "ستحاذي الوتدين الصلب والمفرغ ثم تجمعهما لإنشاء تجويف: حدد كلا الوتدين، من Align اختر محاذاة المحور X ثم Y في المنتصف، ثم اضغط Group (تجميع) من أدوات تحرير النموذج.", "page": 51}, {"title": "تغيير اللون ودمج الأشكال", "text": "لتغيير اللون: حدد الأشكال الأربعة، من لوحة الخصائص اضغط Change color واختر Make solid، ثم من فئة Preset اختر اللون الأزرق. دمج الأشكال: حرك الأشكال لتتداخل بالطريقة التي تريد دمجها بها، ثم حدد أحدها واضغط Shift على الأشكال الأخرى، ثم اضغط Group (تجميع). وبمجرد الدمج يمكن تعديل الشكل كعنصر واحد.", "page": 52}], "terms": [{"ar": "أسطوانة", "en": "Cylinder", "def": "شكل أساسي مستخدم لقاعدة الحامل", "page": 37}, {"ar": "صندوق", "en": "Box", "def": "شكل أساسي مكعبي", "page": 46}, {"ar": "وتد", "en": "Wedge", "def": "شكل أساسي مائل", "page": 49}, {"ar": "سقف", "en": "Roof", "def": "شكل أساسي ثلاثي", "page": 23}, {"ar": "محاذاة", "en": "Align", "def": "ترتيب الأشكال بالنسبة لبعضها", "page": 43}, {"ar": "تجميع", "en": "Group", "def": "دمج الأشكال كشكل واحد", "page": 52}, {"ar": "فيوكيوب", "en": "ViewCube", "def": "أداة لتغيير اتجاه عرض الكاميرا", "page": 45}, {"ar": "نسخ ومضاعفة", "en": "Duplicate and Repeat", "def": "أداة لإنشاء نسخ من الشكل", "page": 42}], "match": {"title": "طابق الأداة بوظيفتها", "page": 43, "pairs": [["Align", "محاذاة الأشكال"], ["Group", "تجميع الأشكال في شكل واحد"], ["Duplicate and Repeat", "نسخ ومضاعفة الشكل"], ["ViewCube", "تغيير اتجاه عرض الكاميرا"]]}, "order": {"title": "رتب مراحل بناء حامل المستلزمات", "page": 37, "steps": ["إنشاء القاعدة بأسطوانة", "إنشاء حامل الأقلام وتجويفه", "إضافة الصندوق وتجويفه", "إضافة الوتد وتجويفه", "تغيير اللون ودمج الأشكال"]}, "qs": [{"t": "mc", "q": "أي أداة نستخدمها لنسخ الشكل ومضاعفته؟", "o": ["Duplicate and Repeat", "Align", "ViewCube"], "a": 0, "why": "ص42.", "lvl": 1}, {"t": "mc", "q": "أي شكل نستخدمه لإنشاء قاعدة حامل المستلزمات؟", "o": ["أسطوانة", "وتد", "سقف"], "a": 0, "why": "ص37.", "lvl": 1}, {"t": "mc", "q": "ما الشكل الذي يزيل جزءًا من الأشكال الصلبة؟", "o": ["الشكل المفرغ", "الشكل الصلب", "الشكل العادي"], "a": 0, "why": "ص41.", "lvl": 1}, {"t": "mc", "q": "أي أداة نستخدمها لترتيب شكلين على محور؟", "o": ["Align", "Hole", "Solid"], "a": 0, "why": "ص43.", "lvl": 1}, {"t": "mc", "q": "أي أداة تغير اتجاه عرض الكاميرا؟", "o": ["ViewCube", "Group", "Mirror"], "a": 0, "why": "ص45.", "lvl": 1}, {"t": "mc", "q": "كيف ندمج عدة أشكال في شكل واحد؟", "o": ["Group (تجميع)", "Hole", "Align"], "a": 0, "why": "ص52.", "lvl": 1}, {"t": "mc", "q": "كم ارتفاع القاعدة الأسطوانية في المشروع؟", "o": ["2.00 مم", "100 مم", "80 مم"], "a": 0, "why": "ص37.", "lvl": 2}, {"t": "tf", "q": "الشكل المفرغ يستخدم لإنشاء تجاويف داخل الأشكال الصلبة.", "a": true, "why": "ص41.", "lvl": 1}, {"t": "tf", "q": "لا يمكن تدوير الشكل في تينكركاد.", "a": false, "why": "يمكن تدويره بالسهم المزدوج (ص31).", "lvl": 1}, {"t": "tf", "q": "بعد التجميع يمكن تعديل الشكل المدمج كعنصر واحد.", "a": true, "why": "ص52.", "lvl": 1}, {"t": "tf", "q": "أداة المحاذاة تغير لون الشكل.", "a": false, "why": "تحاذي الأشكال (ص43).", "lvl": 2}, {"t": "fill", "q": "نضغط على ___ (Group) لدمج الأشكال المحددة.", "a": ["تجميع", "Group", "group"], "why": "ص52.", "lvl": 2}, {"t": "fill", "q": "الشكل المسمى Wedge في تينكركاد يسمى ___.", "a": ["وتد", "الوتد"], "why": "ص49.", "lvl": 2}], "summary": ["الأشكال الصلبة تبني المجسم والمفرغة تصنع التجاويف", "Align لمحاذاة الأشكال وGroup للتجميع", "ViewCube لتغيير اتجاه العرض", "نسخ ومضاعفة، تدوير، تغيير اللون"], "challenge": {"text": "تحدي الدرس: كيف تصنع تجويفًا داخل صندوق؟", "q": {"t": "mc", "q": "تريد تجويفًا داخل الصندوق. ماذا تفعل؟", "o": ["أضيف شكلًا مفرغًا داخله وأجمّعه", "أحذف الصندوق", "أغير لونه فقط"], "a": 0, "why": "ص41.", "lvl": 1}}}, "g6-u2-l1": {"id": "g6-u2-l1", "grade": 6, "pages": "61-78", "lab": "sheet", "intro": {"question": "هل يحسب إكسل 2+3*4 كما نحسبها من اليسار؟ وماذا يحدث لو أضفنا أقواسًا؟", "goals": ["أتعرف العمليات الحسابية في إكسل ورموزها", "أطبق أولوية تنفيذ العمليات", "أستخدم الأقواس والأسس والنسب المئوية", "أحسب السعر الإجمالي بمعادلة وأنسخها بمقبض التعبئة"]}, "cards": [{"title": "العمليات الحسابية في إكسل", "text": "في برنامج مايكروسوفت إكسل يمكنك تخزين وعرض ومعالجة البيانات بشكل منظم على شكل صفوف وأعمدة. العمليات الحسابية ورموزها: الجمع +، الطرح -، الضرب *، القسمة /، والرفع إلى الأس ^. تنفذ العمليات الحسابية في إكسل من اليسار إلى اليمين.", "page": 61}, {"title": "أولوية تنفيذ العمليات الحسابية", "text": "يتم ترتيب الأولويات لتنفيذ العمليات الحسابية على جهاز الحاسب من خلال قواعد أولوية التشغيل من اليسار إلى اليمين وفق الترتيب الآتي: 1) تنفيذ العمليات بين الأقواس. 2) تنفيذ عمليات الأسس. 3) تنفيذ عمليات الضرب والقسمة بالترتيب من اليسار إلى اليمين. 4) تنفيذ عمليات الجمع والطرح بالترتيب من اليسار إلى اليمين.", "page": 61}, {"title": "تنفيذ المعادلات في إكسل", "text": "لحساب المعادلة 5*2+12-3/2+20: اكتب النص «العملية الحسابية دون أقواس» في الخلية A1 ثم اكتب في A2 المعادلة =5*2+12-3/2+20 واضغط Ctrl + Enter لإجراء العملية الحسابية وإخراج الناتج في الخلية نفسها. يجب أن يكون الناتج 40.5. وفي حال لم يوضع علامة = فسيتم التعامل مع المعادلة كنص ولن يتم إجراء العملية الحسابية.", "page": 62}, {"title": "خطوات حل المعادلة بالتفصيل", "text": "1) تنفيذ الضرب والقسمة بالترتيب من اليسار إلى اليمين: 5*2=10 و3/2=1.5. 2) إجراء الجمع والطرح بالترتيب من اليسار إلى اليمين: 10+12-1.5+20=40.5.", "page": 63}, {"title": "استخدام الأقواس", "text": "تستخدم الأقواس لتغيير أولوية العمليات الحسابية، حيث يتم حساب الصيغة الحسابية التي بين قوسين أولًا. فمثلًا 5+2*3 ناتجها 11 لأن الضرب يتم أولًا، أما (5+2)*3 فناتجها 21 لأن الجمع بين القوسين ينفذ أولًا. ولعمل المعادلة بأقواس: =(5*2)+(12-3)/(2+20) والناتج 10.409 مقربًا إلى ثلاث منازل عشرية.", "page": 64}, {"title": "مثال: حساب الفاتورة", "text": "السعر الإجمالي = (سعر المنتج - الخصم) * الكمية. نكتب في الخلية E3 المعادلة =(B3-C3)*D3 ثم Ctrl + Enter. ثم نستخدم مقبض التعبئة (+) لنسخ الصيغة من الخلية E3 إلى E9 فيحسب السعر الإجمالي لكل منتج.", "page": 67}, {"title": "استخدام الأسس", "text": "يعبر الأس لرقم عن عدد مرات استخدام الرقم في عملية الضرب. مثل 2×2×2 تكتب 2³ حيث 2 هي الأساس و3 هي الأس. للحصول على رمز الأس (^) اضغط Shift + 6. مثال: =(4+3)^2*6/(5-2)-8 والناتج 90. والأسس لها أولوية أعلى من الضرب والجمع والقسمة والطرح.", "page": 70}, {"title": "استخدام النسب المئوية", "text": "النسبة المئوية طريقة للتعبير عن رقم في صورة كسر من 100، ويشار إليها بالرمز %. مثال: إذا كان العدد الإجمالي للتفاح 100 وكان عدد التفاحات 20 فالنسبة 20% (20/100 × 100%). للحصول على رمز % اضغط Shift + 5. وإذا كتبت =10*25% فالناتج 2.5. ولتنسيق الخلية كنسبة مئوية اضغط نمط النسبة المئوية (Percent Style) من الشريط الرئيسي.", "page": 72}, {"title": "خطوات حساب الصيغة بالأقواس والأسس", "text": "الصيغة =(4+3)^2*6/(5-2)-8: 1) العملية داخل الأقواس: 4+3=7 و5-2=3. 2) رفع الناتج لأس 2: 7^2=49. 3) اضرب في 6: 294. 4) قسّم على 3: 98. 5) اطرح 8: 90. وإذا لم تتبع ترتيب العمليات فقد ينتهي بك الأمر بنتيجة غير صحيحة.", "page": 71}], "terms": [{"ar": "معادلة", "en": "Formula", "def": "عملية حسابية تبدأ بعلامة =", "page": 62}, {"ar": "الأقواس", "en": "Parentheses", "def": "تغير أولوية العمليات", "page": 64}, {"ar": "الأس", "en": "Exponent", "def": "عدد مرات ضرب الرقم في نفسه ^", "page": 70}, {"ar": "النسبة المئوية", "en": "Percentage", "def": "كسر من 100 ويرمز له %", "page": 72}, {"ar": "مقبض التعبئة", "en": "Fill handle", "def": "لنسخ الصيغة إلى خلايا مجاورة", "page": 67}, {"ar": "أولوية العمليات", "en": "Order of operations", "def": "ترتيب تنفيذ العمليات الحسابية", "page": 61}, {"ar": "Ctrl + Enter", "en": "Ctrl + Enter", "def": "تنفيذ العملية وإبقاء الخلية محددة", "page": 62}], "match": {"title": "طابق الرمز بالعملية", "page": 61, "pairs": [["+", "الجمع"], ["-", "الطرح"], ["*", "الضرب"], ["^", "الرفع إلى الأس"]]}, "order": {"title": "رتب أولوية تنفيذ العمليات الحسابية", "page": 61, "steps": ["العمليات بين الأقواس", "عمليات الأسس", "الضرب والقسمة من اليسار إلى اليمين", "الجمع والطرح من اليسار إلى اليمين"]}, "qs": [{"t": "mc", "q": "بماذا تبدأ المعادلة في إكسل؟", "o": ["علامة =", "علامة +", "علامة #"], "a": 0, "why": "ص62.", "lvl": 1}, {"t": "mc", "q": "ما رمز عملية الضرب في إكسل؟", "o": ["*", "x", "/"], "a": 0, "why": "ص61.", "lvl": 1}, {"t": "mc", "q": "أي عملية تنفذ أولًا؟", "o": ["التي بين الأقواس", "الجمع", "الطرح"], "a": 0, "why": "ص61.", "lvl": 1}, {"t": "mc", "q": "ما ناتج 5+2*3؟", "o": ["11", "21", "10"], "a": 0, "why": "ص64.", "lvl": 1}, {"t": "mc", "q": "ما ناتج (5+2)*3؟", "o": ["21", "11", "13"], "a": 0, "why": "ص64.", "lvl": 1}, {"t": "mc", "q": "كيف نحصل على رمز ^؟", "o": ["Shift + 6", "Shift + 5", "Ctrl + 6"], "a": 0, "why": "ص70.", "lvl": 1}, {"t": "mc", "q": "ما ناتج =10*25%؟", "o": ["2.5", "25", "250"], "a": 0, "why": "ص72.", "lvl": 1}, {"t": "mc", "q": "بماذا ننسخ المعادلة إلى الخلايا المجاورة؟", "o": ["مقبض التعبئة
