", "Delete", "Alt"], "a": 0, "why": "ص67.", "lvl": 2}, {"t": "tf", "q": "تنفذ العمليات الحسابية في إكسل من اليسار إلى اليمين.", "a": true, "why": "ص61.", "lvl": 1}, {"t": "tf", "q": "إذا نسينا علامة = فسيحسب إكسل المعادلة.", "a": false, "why": "يعاملها كنص (ص63).", "lvl": 1}, {"t": "tf", "q": "للأسس أولوية أعلى من الضرب.", "a": true, "why": "ص70.", "lvl": 1}, {"t": "tf", "q": "الضرب والقسمة ينفذان بعد الجمع والطرح.", "a": false, "why": "ينفذان قبلهما (ص61).", "lvl": 2}, {"t": "fill", "q": "رمز النسبة المئوية هو ___.", "a": ["%"], "why": "ص72.", "lvl": 2}, {"t": "fill", "q": "ناتج =(4+3)^2*6/(5-2)-8 هو ___.", "a": ["90"], "why": "ص71.", "lvl": 3}], "summary": ["المعادلة تبدأ بـ = والرموز: + - * / ^", "الأولوية: أقواس، أسس، ضرب وقسمة، جمع وطرح", "الأقواس تغير الأولوية", "مقبض التعبئة ينسخ الصيغة", "النسبة المئوية % بـ Shift + 5"], "challenge": {"text": "تحدي الدرس: احسب بدون إكسل ثم تحقق.", "q": {"t": "mc", "q": "ما ناتج 2+3*4؟", "o": ["14", "20", "24"], "a": 0, "why": "ص61.", "lvl": 1}}}, "g6-u2-l2": {"id": "g6-u2-l2", "grade": 6, "pages": "79-92", "lab": "sheet", "intro": {"question": "لماذا نعرض الأرقام في رسم بدل جدول؟ وأي مخطط نختار؟", "goals": ["أعرّف المخططات البيانية وأنواعها", "أختار المخطط المناسب للبيانات", "أنشئ مخططًا عموديًا ودائريًا مجوفًا", "أضيف تسميات البيانات وأضبط الطباعة"]}, "cards": [{"title": "المخططات البيانية", "text": "المخططات البيانية هي تمثيلات رسومية للبيانات تساعد على تحليل المعلومات المعقدة وتسهل فهمها، وتساعد في اتخاذ القرار.", "page": 79}, {"title": "أنواع المخططات البيانية", "text": "هناك أنواع مختلفة من المخططات، كل منها مصمم لعرض البيانات بطريقة معينة: المخططات العمودية، والمخططات الشريطية، والمخططات الخطية، والمخططات الدائرية، والمخططات الدائرية المجوفة. يعتمد اختيار المخطط على نوع البيانات المقدمة والرسالة التي يجب نقلها.", "page": 79}, {"title": "المخطط العمودي", "text": "المخطط العمودي هو تمثيل تخطيطي للبيانات يستخدم أشرطة عمودية لإظهار المقارنات بين الفئات. يتوافق ارتفاع كل شريط مع قيمة البيانات التي يمثلها.", "page": 79}, {"title": "المخطط الخطي", "text": "المخطط الخطي هو تمثيل تخطيطي للبيانات التي تعرض المعلومات كسلسلة من نقاط البيانات المتصلة بواسطة مقاطع الخط المستقيم، ويستخدم بشكل شائع لإظهار الاتجاهات بمرور الوقت. إنها أداة بسيطة وفعالة لتصور البيانات المستمرة.", "page": 80}, {"title": "المخطط الدائري", "text": "المخطط الدائري هو مخطط يمثل البيانات كشرائح من دائرة، حيث تتناسب كل شريحة مع الكمية التي تمثلها. يستخدم بشكل شائع لإظهار النسب المئوية أو النسب التقريبية للفئات المختلفة في مجموعة البيانات.", "page": 80}, {"title": "المخطط الدائري المجوف", "text": "المخطط الدائري المجوف هو مخطط دائري به فجوة في الوسط، ويستخدم لتمثيل البيانات التي يتم تمثيلها على شكل نسب مئوية. الحلقة الخارجية مقسمة إلى شرائح تتوافق مع الفئات المختلفة لنقاط البيانات. يمكن استخدامه عندما تكون البيانات عبارة عن مجموعة كاملة من الفئات، أو لمقارنة الأجزاء بالكل.", "page": 81}, {"title": "إدراج مخطط عمودي", "text": "حدد البيانات التي تريد استخدامها، مثلًا من الخلية A1 إلى D9. من علامة التبويب إدراج (Insert) ومن مجموعة المخططات (Charts) اضغط على إدراج مخطط عمودي أو شريطي (Insert Column or Bar Chart)، ثم من فئة عمود ثنائي الأبعاد (2-D Column) اضغط عمود مخطط متفاوت المسافات (Clustered Column). وسيظهر المخطط.", "page": 82}, {"title": "إدراج مخطط دائري مجوف", "text": "باستخدام مايكروسوفت إكسل يمكنك تحويل بياناتك بسرعة إلى مخطط دائري مجوف. حدد البيانات التي تريد استخدامها، ومن علامة التبويب إدراج اضغط على إدراج مخطط دائري أو دائري مجوف (Insert Pie or Doughnut Chart)، ثم من الفئة دائري مجوف (Doughnut) اضغط على دائري مجوف (Doughnut). سيظهر المخطط. تذكر أن شريط إكسل متغير، وعلامة تبويب تصميم المخطط تظهر عند تحديد المخطط.", "page": 83}, {"title": "تسميات البيانات", "text": "يمكن أن تساعد إضافة تسميات البيانات في المخطط الدائري المجوف في جعل بياناتك أكثر وضوحًا وإفادة وسهولة في الفهم. حدد المخطط، ومن تصميم المخطط (Chart Design) ومجموعة تخطيطات المخطط (Chart Layouts) اضغط إضافة عنصر المخطط (Add Chart Element)، ثم تسميات البيانات (Data Labels)، ثم إظهار (Show).", "page": 85}, {"title": "اتجاه الصفحة", "text": "إذا كان عدد الأعمدة كبيرًا في صفحتك فإنه من الأفضل تعيين اتجاه الصفحة ليكون أفقيًا بحيث يكون العرض أكبر من الطول. من علامة تبويب تخطيط الصفحة (Page Layout) ومن مجموعة إعداد الصفحة (Page Setup) اضغط الاتجاه (Orientation)، ثم اختر عموديًا (Vertically) أو أفقيًا (Horizontally).", "page": 86}, {"title": "طباعة أوراق عملك: الهوامش", "text": "الهوامش (Margins) هي المساحة البيضاء الفارغة حول المنطقة المطبوعة من صفحتك. لضبطها: من تخطيط الصفحة ومجموعة إعدادات الصفحة اضغط الهوامش، ثم هوامش مخصصة (Custom Margins)، وحدد الهوامش العلوي والسفلي والأيمن والأيسر، واختر توسيط في الصفحة (Center on page) أفقيًا وعموديًا ثم موافق (OK).", "page": 87}, {"title": "طباعة جدول بيانات", "text": "لطباعة الجدول: من قائمة ملف (File) أو اضغط Ctrl + P، ثم اضغط طباعة (Print)، وتأكد من إعدادات ورقة العمل بشكل صحيح ثم اضغط Print. ويمكن طباعة أجزاء محددة من ورقة العمل.", "page": 88}], "terms": [{"ar": "المخطط البياني", "en": "Chart", "def": "تمثيل رسومي للبيانات", "page": 79}, {"ar": "المخطط العمودي", "en": "Column chart", "def": "أشرطة عمودية لمقارنة الفئات", "page": 79}, {"ar": "المخطط الخطي", "en": "Line chart", "def": "يظهر الاتجاهات بمرور الوقت", "page": 80}, {"ar": "المخطط الدائري", "en": "Pie chart", "def": "شرائح تمثل النسب", "page": 80}, {"ar": "الدائري المجوف", "en": "Doughnut chart", "def": "مخطط دائري بفجوة في الوسط", "page": 81}, {"ar": "تسميات البيانات", "en": "Data labels", "def": "توضح قيم أجزاء المخطط", "page": 85}, {"ar": "الهوامش", "en": "Margins", "def": "المساحة الفارغة حول المنطقة المطبوعة", "page": 87}, {"ar": "الاتجاه", "en": "Orientation", "def": "أفقي أو عمودي للصفحة", "page": 86}], "match": {"title": "طابق المخطط باستخدامه", "page": 79, "pairs": [["العمودي", "مقارنة بين الفئات"], ["الخطي", "اتجاه التغير مع الزمن"], ["الدائري", "نسب الأجزاء من الكل"], ["الدائري المجوف", "نسب مئوية بحلقة خارجية"]]}, "order": {"title": "رتب خطوات إدراج مخطط عمودي", "page": 82, "steps": ["حدد البيانات التي تريد استخدامها", "من إدراج اضغط إدراج مخطط عمودي أو شريطي", "اختر عمود مخطط متفاوت المسافات", "ظهر المخطط"]}, "qs": [{"t": "mc", "q": "ما المخطط البياني؟", "o": ["تمثيل رسومي للبيانات", "جدول فقط", "برنامج رسم"], "a": 0, "why": "ص79.", "lvl": 1}, {"t": "mc", "q": "أي مخطط يظهر الاتجاهات بمرور الوقت؟", "o": ["الخطي", "الدائري", "الدائري المجوف"], "a": 0, "why": "ص80.", "lvl": 1}, {"t": "mc", "q": "أي مخطط يظهر النسب كشرائح؟", "o": ["الدائري", "العمودي", "الخطي"], "a": 0, "why": "ص80.", "lvl": 1}, {"t": "mc", "q": "أي مخطط يستخدم أشرطة عمودية للمقارنة؟", "o": ["العمودي", "الدائري", "الخطي"], "a": 0, "why": "ص79.", "lvl": 1}, {"t": "mc", "q": "من أي علامة تبويب ندرج المخططات؟", "o": ["إدراج", "عرض", "ملف"], "a": 0, "why": "ص82.", "lvl": 1}, {"t": "mc", "q": "ماذا تضيف تسميات البيانات؟", "o": ["قيم أو أسماء توضح المخطط", "لون الخلفية", "ملف"], "a": 0, "why": "ص85.", "lvl": 1}, {"t": "mc", "q": "متى نختار اتجاه الصفحة أفقيًا؟", "o": ["إذا كان عدد الأعمدة كبيرًا", "إذا كانت الصفحة فارغة", "دائمًا"], "a": 0, "why": "ص86.", "lvl": 2}, {"t": "tf", "q": "يعتمد اختيار المخطط على نوع البيانات والرسالة المراد نقلها.", "a": true, "why": "ص79.", "lvl": 1}, {"t": "tf", "q": "الدائري المجوف يحتوي فجوة في الوسط.", "a": true, "why": "ص81.", "lvl": 1}, {"t": "tf", "q": "الهوامش هي المساحة المطبوعة فقط.", "a": false, "why": "هي المساحة الفارغة حولها (ص87).", "lvl": 1}, {"t": "tf", "q": "نستخدم Ctrl + P للطباعة.", "a": true, "why": "ص88.", "lvl": 2}, {"t": "fill", "q": "المخطط ___ يمثل البيانات كشرائح من دائرة.", "a": ["الدائري", "دائري"], "why": "ص80.", "lvl": 2}, {"t": "fill", "q": "نضغط ___ + P لفتح الطباعة.", "a": ["Ctrl", "ctrl"], "why": "ص88.", "lvl": 2}], "summary": ["المخطط يوضح البيانات ويسهل القرار", "عمودي للمقارنة، خطي للزمن، دائري للنسب", "تسميات البيانات توضح المخطط", "الاتجاه والهوامش قبل الطباعة"], "challenge": {"text": "تحدي الدرس: اختر المخطط المناسب.", "q": {"t": "mc", "q": "تريد عرض تطور درجاتك خلال الفصل. أي مخطط تختار؟", "o": ["الخطي", "الدائري", "لا شيء"], "a": 0, "why": "ص80.", "lvl": 1}}}, "g6-u3-l1": {"id": "g6-u3-l1", "grade": 6, "pages": "96-107", "lab": "db", "intro": {"question": "ما الفرق بين كلمة «شاشة» وعبارة «الجهاز: شاشة، الكمية: 4»؟ وكيف نرتب آلاف المعلومات في مكان واحد؟", "goals": ["أفرّق بين البيانات والمعلومات", "أميز أنواع البيانات: عددية وأبجدية وأبجدية عددية", "أعرّف قاعدة البيانات والجدول والسجل والحقل", "أطبق ذلك على جدول بيانات الطلاب"]}, "cards": [{"title": "هل تذكر؟ دوال إكسل", "text": "وظائف مايكروسوفت إكسل: دالة المجموع (Sum) تعطي مجموع القيم في الخلايا المحددة. دالة المتوسط (Average) تعطي متوسط عدد نطاق من الخلايا. دالة الحد الأدنى (Min) ترجع أدنى قيمة في نطاق من الأرقام. دالة الحد الأقصى (Max) ترجع أعلى قيمة في نطاق من الأرقام. وتُعد ميزة التعبئة التلقائية (Autofill) أداة مفيدة لنسخ الصيغ أو الوظائف بسرعة وكفاءة.", "page": 96}, {"title": "البيانات والمعلومات", "text": "البيانات حقائق وأرقام أولية، في حين أن المعلومات هي البيانات التي تم تنظيمها وتفسيرها ومعالجتها لتعطي معنى. تعريف البيانات: هي الحقائق الأولية الموجودة حولك بشكلها الخارجي الظاهر، مثل: السواك، المكعب، 1727م / 1139هـ. تعريف المعلومات: هي المعاني والمعارف التي يدركها الإنسان، مثل: «المكعب هو أكبر داون تاون عالمي في الرياض» و«1139هـ هو عام تأسيس الدولة السعودية الأولى».", "page": 97}, {"title": "مقارنة بين البيانات والمعلومات", "text": "المفهوم: البيانات حقائق أولية موجودة حولك قد تكون أرقامًا أو حروفًا أو رموزًا ولا تعطي معنى وهي منفردة، والمعلومات هي النتائج المفيدة الناتجة عن معالجة وتنظيم البيانات. الفهم والترابط: البيانات من الصعب فهمها لأنها غير مترابطة، والمعلومات من السهل فهمها لأنها مترابطة. التنظيم: البيانات غير منظمة والمعلومات منظمة. مدخلات/مخرجات: البيانات هي مدخلات للجهاز الحاسب، والمعلومات هي المخرجات الناتجة عن معالجة جهاز الحاسب للبيانات.", "page": 97}, {"title": "مثال: جمع بيانات الأجهزة", "text": "عندما تجمع بيانات عن أجهزة معامل الحاسب لإعادة تدويرها ستحتاج إلى إنشاء جدول لتنظيم تلك البيانات والوصول إلى معلومات مفيدة عن الأجهزة. القيم مثل «شاشة» و«8/03/2022» و«4» و«13» بيانات منفردة لا تعطي معنى. وبعد تنظيمها وربطها تصبح معلومات: الجهاز: شاشة، تاريخ التسجيل: 8/03/2022، الكمية: 4، الوزن (بالكيلوجرام): 13.", "page": 98}, {"title": "«المعلومات» و«البيانات» عند الناس", "text": "الأشخاص الذين يستخدمون أجهزة الحاسب غالبًا ما يستخدمون كلمتي «معلومات» و«بيانات» بنفس المعنى، في حين أعطى علماء الحاسب في السبعينات معنى جديدًا لهاتين الكلمتين: «فالبيانات» هي المعلومات التي لم يتم التحقق منها، بينما «المعلومات» هي البيانات التي تم التحقق منها ويمكن الوثوق بها.", "page": 98}, {"title": "أنواع البيانات: عددية وأبجدية", "text": "عادةً ما تكون البيانات على شكل نصوص وأرقام ورموز، وفي بعض الأحيان قد تكون على شكل صور ومقاطع فيديو وأصوات. البيانات العددية: تحتوي على حقائق عددية يمكن قياسها، مثل: 50، 6.25، -10، 0003756. ومن أمثلتها عدد الأشخاص الذين زاروا المتحف العام خلال العام، وهذا النوع من البيانات كل خانة منه تتكون من أرقام من 0 إلى 9. البيانات الأبجدية: تتكون من جميع الحروف الأبجدية والفراغات التي تستخدم للفصل بين الكلمات، مثل: أحمد علي، أحمر، رسالة قصيرة، المملكة العربية السعودية. ويمكن أن تُستخدم لتمثيل اسم دولة مثلًا.", "page": 99}, {"title": "البيانات الأبجدية العددية", "text": "يتضمن هذا النوع من البيانات جميع الحروف الأبجدية والأرقام والرموز الخاصة مثل # $ % .. إلخ. مثل: رقم 10-أ، 23 سبتمبر 2022، 16-إف، 08:30 م. على سبيل المثال يمكن أن تستخدم البيانات الأبجدية العددية لتمثيل الوقت أو التاريخ أو العنوان الوطني لمنزلك.", "page": 99}, {"title": "قاعدة البيانات", "text": "قاعدة البيانات هي مجموعة من البيانات الأولية التي يمكن تغييرها وفرزها والبحث عنها بسرعة لإظهار معلومات مفصّلة حول شيء محدد. يمكنك استخدام برامج قواعد البيانات لإدارة قواعد البيانات الإلكترونية. ومن الأمثلة عليها دفتر العناوين الإلكتروني الذي يمكن أن يتضمن معلومات عن آلاف الأشخاص. تحتوي قاعدة البيانات على جدول أو أكثر. على سبيل المثال قد تحتوي قاعدة بيانات المدرسة على جدول بمعلومات الطلبة وجدول آخر بمعلومات المعلمين.", "page": 100}, {"title": "الجدول", "text": "يشبه جدول قاعدة البيانات حاوية مرئية تحتوي على معلومات ذات صلة مثل الأسماء أو العناوين أو التقديرات، وتنظمها في صفوف (أفقية) وأعمدة (عمودية)، مما يسهل عملية البحث عنها وتحليل بياناتها للحصول على المعلومات.", "page": 100}, {"title": "السجل", "text": "سجل قاعدة البيانات هو مجموعة كاملة من المعلومات التي تشير إلى كيان معين مثل شخص أو منتج أو معاملة مخزنة في قاعدة بيانات. بالنسبة لقاعدة بيانات دفتر العناوين يحتوي السجل على خصائص مثل: الاسم والعنوان الوطني ورقم الهاتف والبريد الإلكتروني.", "page": 100}, {"title": "الحقل", "text": "يُطلق الحقل على كل خلية تحتوي على نوع واحد من البيانات ضمن سجل في جدول البيانات. في قاعدة بيانات دفتر العناوين يحتوي كل سجل على أربعة حقول: 1) الاسم 2) العنوان الوطني 3) رقم الهاتف 4) البريد الإلكتروني.", "page": 100}], "terms": [{"ar": "البيانات", "en": "Data", "def": "حقائق وأرقام أولية لا تعطي معنى وهي منفردة", "page": 97}, {"ar": "المعلومات", "en": "Information", "def": "بيانات تم تنظيمها ومعالجتها لتعطي معنى", "page": 97}, {"ar": "البيانات العددية", "en": "Numerical Data", "def": "أرقام يمكن قياسها", "page": 99}, {"ar": "البيانات الأبجدية", "en": "Alphabetic Data", "def": "حروف أبجدية وفراغات", "page": 99}, {"ar": "البيانات الأبجدية العددية", "en": "Alphanumeric Data", "def": "حروف وأرقام ورموز", "page": 99}, {"ar": "قاعدة البيانات", "en": "Database", "def": "مجموعة بيانات يمكن فرزها والبحث عنها", "page": 100}, {"ar": "الجدول", "en": "Table", "def": "حاوية بيانات في صفوف وأعمدة", "page": 100}, {"ar": "السجل", "en": "Record", "def": "مجموعة كاملة من المعلومات عن كيان معين", "page": 100}, {"ar": "الحقل", "en": "Field", "def": "خلية تحتوي نوعًا واحدًا من البيانات ضمن سجل", "page": 100}], "match": {"title": "طابق نوع البيانات بمثاله", "page": 99, "pairs": [["بيانات عددية", "6.25"], ["بيانات أبجدية", "المملكة العربية السعودية"], ["بيانات أبجدية عددية", "رقم 10-أ"], ["حقل", "رقم الهاتف"]]}, "order": {"title": "رتب مكونات قاعدة البيانات من الأكبر إلى الأصغر", "page": 100, "steps": ["قاعدة البيانات", "الجدول", "السجل", "الحقل"]}, "qs": [{"t": "mc", "q": "ما البيانات؟", "o": ["حقائق وأرقام أولية لا تعطي معنى وهي منفردة", "نتائج مفيدة منظمة", "أجهزة الحاسب"], "a": 0, "why": "ص97.", "lvl": 1}, {"t": "mc", "q": "ما المعلومات؟", "o": ["بيانات تم تنظيمها وتفسيرها لتعطي معنى", "أرقام عشوائية", "رموز بلا معنى"], "a": 0, "why": "ص97.", "lvl": 1}, {"t": "mc", "q": "البيانات بالنسبة للحاسب هي...", "o": ["مدخلات", "مخرجات", "برامج"], "a": 0, "why": "ص97.", "lvl": 1}, {"t": "mc", "q": "أي مما يأتي بيانات عددية؟", "o": ["6.25", "أحمر", "رقم 10-أ"], "a": 0, "why": "ص99.", "lvl": 1}, {"t": "mc", "q": "أي مما يأتي بيانات أبجدية؟", "o": ["المملكة العربية السعودية", "50", "08:30 م"], "a": 0, "why": "ص99.", "lvl": 1}, {"t": "mc", "q": "أي مما يأتي بيانات أبجدية عددية؟", "o": ["23 سبتمبر 2022", "أحمد", "-10"], "a": 0, "why": "ص99.", "lvl": 1}, {"t": "mc", "q": "ما قاعدة البيانات؟", "o": ["مجموعة بيانات يمكن فرزها والبحث عنها بسرعة", "برنامج للرسم", "جهاز إدخال"], "a": 0, "why": "ص100.", "lvl": 1}, {"t": "mc", "q": "كيف ينظم الجدول المعلومات؟", "o": ["في صفوف أفقية وأعمدة عمودية", "في دوائر", "في صور"], "a": 0, "why": "ص100.", "lvl": 1}, {"t": "mc", "q": "ما السجل؟", "o": ["مجموعة كاملة من المعلومات عن كيان معين", "خلية واحدة", "اسم الجدول"], "a": 0, "why": "ص100.", "lvl": 1}, {"t": "mc", "q": "ما الحقل؟", "o": ["خلية تحتوي نوعًا واحدًا من البيانات ضمن سجل", "جدول كامل", "ملف"], "a": 0, "why": "ص100.", "lvl": 1}, {"t": "mc", "q": "كم حقلًا في سجل دفتر العناوين في الدرس؟", "o": ["4 حقول", "2", "10"], "a": 0, "why": "ص100.", "lvl": 2}, {"t": "mc", "q": "ماذا يمثل العمود في جدول قاعدة البيانات؟", "o": ["حقلًا", "سجلًا", "قاعدة بيانات"], "a": 0, "why": "ص100.", "lvl": 2}, {"t": "tf", "q": "المعلومات من السهل فهمها لأنها مترابطة.", "a": true, "why": "ص97.", "lvl": 1}, {"t": "tf", "q": "البيانات منظمة دائمًا.", "a": false, "why": "البيانات غير منظمة (ص97).", "lvl": 1}, {"t": "tf", "q": "يمكن أن تحتوي قاعدة البيانات على أكثر من جدول.", "a": true, "why": "ص100.", "lvl": 1}, {"t": "tf", "q": "الصف في الجدول يمثل سجلًا.", "a": true, "why": "ص100.", "lvl": 2}, {"t": "fill", "q": "البيانات التي تتكون من حروف وفراغات تسمى بيانات ___.", "a": ["أبجدية"], "why": "ص99.", "lvl": 2}, {"t": "fill", "q": "كل خلية تحتوي نوعًا واحدًا من البيانات تسمى ___.", "a": ["حقل", "حقلا", "الحقل"], "why": "ص100.", "lvl": 2}], "summary": ["البيانات حقائق أولية والمعلومات بيانات منظمة لها معنى", "أنواع البيانات: عددية وأبجدية وأبجدية عددية", "قاعدة البيانات تحتوي جدولًا أو أكثر", "الجدول صفوف وأعمدة", "السجل صف كامل عن كيان، والحقل خلية فيه"], "challenge": {"text": "تحدي الدرس: افتح «قواعد البيانات» في المختبر وحدد سجلًا واحدًا ثم سجلين متجاورين.", "q": {"t": "mc", "q": "في جدول طلاب الصف السادس، ماذا يمثل اسم الطالب «أحمد» وحده؟", "o": ["حقلًا", "سجلًا", "جدولًا"], "a": 0, "why": "ص100.", "lvl": 1}}}, "g6-u3-l2": {"id": "g6-u3-l2", "grade": 6, "pages": "108-117", "lab": "db", "intro": {"question": "كيف نحوّل معلومات طلاب الفصل إلى قاعدة بيانات منظمة نستطيع البحث فيها بسرعة؟", "goals": ["أنشئ حقول قاعدة البيانات في إكسل", "أضيف سجلات جديدة", "أنسّق البيانات كجدول", "أحدد السجلات المتجاورة وغير المتجاورة"]}, "cards": [{"title": "خطوات إنشاء قاعدة بيانات", "text": "لإنشاء قاعدة البيانات الخاصة بك يجب عليك تحديد نوع المعلومات التي تريد تضمينها، ثم فكر في الخصائص التي ترغب في جمعها لكل سجل وامنحها عنوانًا أو اسم حقل. يمكنك استخدام برنامج مايكروسوفت إكسل لإنشاء جدول لقاعدة البيانات الخاصة بك بطريقة سهلة للغاية. ومن برامج قواعد البيانات الشائعة الأخرى: مايكروسوفت أكسس (Microsoft Access)، وفايل ميكر (FileMaker)، وليبر أوفيس بيس (LibreOffice Base)، وأوفيس دبي (Office DB).", "page": 108}, {"title": "إنشاء حقول قاعدة البيانات", "text": "لإنشاء حقول قاعدة البيانات: 1) افتح برنامج مايكروسوفت إكسل. 2) في جدول البيانات الفارغ الذي يظهر اكتب أسماء حقول قاعدة البيانات في الخلايا المختلفة (من A1 إلى G1): الاسم، اسم العائلة، الصف، رقم الفصل، العنوان الوطني، تاريخ الميلاد (هـ)، تاريخ الميلاد (م). 3) حدد الصف بأكمله بالضغط على رقم الصف. 4) اضغط على زر غامق (Bold) لجعل العناوين بارزة.", "page": 108}, {"title": "نصيحة: موضوع واحد لكل قاعدة", "text": "يجب أن تتعلق جميع المعلومات الموجودة في قاعدة البيانات بنفس الموضوع حيث إنه لا يمكن أن يكون لديك معلومات مختلفة في نفس قاعدة البيانات. فعلى سبيل المثال الحصول على معلومات حول الرياضة لا يناسب قاعدة بيانات خاصة بالحيوانات.", "page": 108}, {"title": "إضافة سجلات قاعدة البيانات", "text": "يشير السجل في مايكروسوفت إكسل إلى صف واحد من البيانات في جدول أو قاعدة بيانات، كما يحتوي الجدول عادة على معلومات حول عنصر معين مثل عميل أو طلب أو معاملة. ويمثل كل عمود في الجدول حقلًا أو سمة مختلفة للسجل، مثل الاسم أو العنوان أو التاريخ أو المبلغ.", "page": 109}, {"title": "خطوات إضافة سجل", "text": "لإضافة سجل في قاعدة البيانات: 1) اضغط على الخلية A2. 2) اكتب اسم الطالب كما في الجدول أدناه ثم اضغط على Tab. 3) استمر في كتابة بيانات السجل الأول في كل خلية من الصف 2 بناءً على أسماء حقول قاعدة البيانات. 4) تابع بكتابة بيانات كل سجل في صف منفصل، بناءً على الجدول.", "page": 109}, {"title": "تنسيق كجدول", "text": "بعد أن أصبحت معلومات قاعدة البيانات جاهزة، نسّقها بأسلوب من اختيارك لجعل برنامج إكسل يعرف أنها جدول بيانات: 1) حدد خلايا الجدول من A1 إلى G11. 2) من علامة تبويب الشريط الرئيسي (Home) ومن مجموعة أنماط (Styles) اضغط على «التنسيق كجدول» (Format as Table). 3) اختر النمط الذي تريده، على سبيل المثال أخضر، نمط جدول فاتح 14. 4) من نافذة إنشاء جدول (Create Table) اختر «يحتوي الجدول على رؤوس» (My table has headers). 5) اضغط على «موافق» (OK). 6) يحتوي الجدول الخاص بك على نمط جديد ويعرف البرنامج أن العناوين هي عناوين الحقول.", "page": 110}, {"title": "فائدة التنسيق كجدول", "text": "تؤدي ميزة «التنسيق كجدول» إلى إضافة وظائف الفرز والتصفية، وتوفر تسميات لقاعدة البيانات كأسماء للأعمدة ووصفية لكل عمود. تعمل رؤوس الجدول في إكسل كأسماء لقاعدة البيانات، وتوفر تسميات وصفية لكل عمود في قاعدة البيانات. وإذا كنت ترغب في إضافة بيانات طالب آخر فيمكنك ببساطة بدء كتابة المعلومات الجديدة في أول صف فارغ أسفل البيانات.", "page": 110}, {"title": "تحديد السجلات في قاعدة البيانات", "text": "في قاعدة بيانات مايكروسوفت إكسل يمكنك تنفيذ إجراءات متنوعة على السجلات مثل حذفها أو نسخها أو نقلها إلى موقع آخر داخل ورقة العمل، ولذلك من الضروري معرفة كيفية تحديد السجلات في قاعدة البيانات.", "page": 112}, {"title": "تحديد سجل واحد وسجلات متجاورة", "text": "لتحديد سجل: اضغط على رقم الصف الذي يحتوي على السجل، على سبيل المثال الصف 2، فيؤدي ذلك إلى تمييز الصف بأكمله. لتحديد السجلات المتجاورة: اضغط على رقم الصف الأول، ثم اضغط باستمرار على مفتاح Shift من لوحة المفاتيح، ثم اضغط على رقم الصف الأخير، فيتم تحديد جميع السجلات الموجودة بينهما.", "page": 112}, {"title": "تحديد السجلات غير المتجاورة", "text": "لتحديد السجلات غير المتجاورة: اضغط على رقم الصف الذي يحتوي على السجل الذي تريد تحديده، على سبيل المثال الصف 2. ثم اضغط باستمرار على مفتاح Ctrl من لوحة المفاتيح، ثم اضغط على رقم الصف الذي يحتوي على السجل الذي تريد تحديده أيضًا، على سبيل المثال الصف 4. وبمجرد تحديد السجلات التي تريدها يمكنك نسخها أو قصها أو حذفها حسب الحاجة.", "page": 113}], "terms": [{"ar": "الحقل", "en": "Field", "def": "عمود يمثل خاصية للسجل", "page": 109}, {"ar": "السجل", "en": "Record", "def": "صف كامل من البيانات", "page": 109}, {"ar": "رأس", "en": "Header", "def": "اسم الحقل أعلى العمود", "page": 110}, {"ar": "تنسيق كجدول", "en": "Format as Table", "def": "ميزة تحول البيانات لجدول بيانات في إكسل", "page": 110}, {"ar": "نمط", "en": "Style", "def": "تنسيق جاهز للجدول", "page": 110}], "match": {"title": "طابق الإجراء بالوصف", "page": 117, "pairs": [["إدراج أسماء الحقول", "كتابة أسماء حقول البيانات في الصف الأول"], ["إضافة سجل", "إدخال صف جديد في جدول البيانات"], ["تنسيق كجدول", "تنظيم البيانات بشكل سهل القراءة"], ["تحديد سجل أو أكثر", "تمييز صف أو أكثر في الجدول"]]}, "order": {"title": "رتب خطوات إنشاء قاعدة بيانات في إكسل", "page": 108, "steps": ["افتح مايكروسوفت إكسل", "اكتب أسماء الحقول في الصف الأول", "اضغط Bold لتمييز العناوين", "أضف السجلات في الصفوف التالية", "نسّق البيانات كجدول"]}, "qs": [{"t": "mc", "q": "بماذا نبدأ عند إنشاء قاعدة بيانات؟", "o": ["تحديد نوع المعلومات والحقول", "طباعة الجدول", "حذف الصفوف"], "a": 0, "why": "ص108.", "lvl": 1}, {"t": "mc", "q": "أين نكتب أسماء الحقول؟", "o": ["في الصف الأول", "في الصف الأخير", "في اسم الملف"], "a": 0, "why": "ص108.", "lvl": 1}, {"t": "mc", "q": "ما الذي يمثله كل عمود في الجدول؟", "o": ["حقلًا", "سجلًا", "قاعدة بيانات"], "a": 0, "why": "ص109.", "lvl": 1}, {"t": "mc", "q": "ما الذي يمثله كل صف من البيانات؟", "o": ["سجلًا", "حقلًا", "نمطًا"], "a": 0, "why": "ص109.", "lvl": 1}, {"t": "mc", "q": "أي مفتاح ننتقل به إلى الخلية التالية أثناء إدخال السجل؟", "o": ["Tab", "Esc", "Delete"], "a": 0, "why": "ص109.", "lvl": 2}, {"t": "mc", "q": "ماذا يضيف «التنسيق كجدول»؟", "o": ["وظائف الفرز والتصفية", "صورًا", "أصواتًا"], "a": 0, "why": "ص110.", "lvl": 1}, {"t": "mc", "q": "أي خيار نختاره في نافذة إنشاء جدول لتُعرف العناوين؟", "o": ["يحتوي الجدول على رؤوس", "موافق فقط", "إلغاء الأمر"], "a": 0, "why": "ص110.", "lvl": 2}, {"t": "mc", "q": "كيف نحدد سجلًا واحدًا؟", "o": ["بالضغط على رقم صفه", "بالضغط على اسم الملف", "بإغلاق إكسل"], "a": 0, "why": "ص112.", "lvl": 1}, {"t": "mc", "q": "أي مفتاح نستخدمه لتحديد سجلات متجاورة؟", "o": ["Shift", "Ctrl", "Alt"], "a": 0, "why": "ص112.", "lvl": 1}, {"t": "mc", "q": "أي مفتاح نستخدمه لتحديد سجلات غير متجاورة؟", "o": ["Ctrl", "Shift", "Tab"], "a": 0, "why": "ص113.", "lvl": 1}, {"t": "mc", "q": "أين نكتب بيانات طالب جديد بعد تنسيق الجدول؟", "o": ["في أول صف فارغ أسفل البيانات", "في أول عمود", "في اسم الملف"], "a": 0, "why": "ص110.", "lvl": 2}, {"t": "tf", "q": "يجب أن تتعلق جميع معلومات قاعدة البيانات بنفس الموضوع.", "a": true, "why": "ص108.", "lvl": 1}, {"t": "tf", "q": "يمكن أن تحتوي قاعدة بيانات الحيوانات على معلومات عن الرياضة.", "a": false, "why": "ص108.", "lvl": 1}, {"t": "tf", "q": "رؤوس الجدول تعمل كأسماء للحقول.", "a": true, "why": "ص110.", "lvl": 1}, {"t": "tf", "q": "يمكن نسخ السجلات المحددة أو قصها أو حذفها.", "a": true, "why": "ص113.", "lvl": 2}, {"t": "fill", "q": "نكتب أسماء الحقول في الخلايا من A1 إلى ___.", "a": ["G1", "g1"], "why": "ص108.", "lvl": 2}, {"t": "fill", "q": "لتحديد سجلات متجاورة نستخدم مفتاح ___.", "a": ["Shift", "shift"], "why": "ص112.", "lvl": 2}], "summary": ["نحدد المعلومات ونكتب أسماء الحقول في الصف الأول", "كل صف سجل وكل عمود حقل", "Tab للانتقال بين الخلايا", "التنسيق كجدول يضيف الفرز والتصفية", "Shift للمتجاورة وCtrl لغير المتجاورة"], "challenge": {"text": "تحدي الدرس: نسّق الجدول في المحاكي كجدول، وأضف سجلًا جديدًا.", "q": {"t": "mc", "q": "ما الذي يجعل إكسل يتعرف على العناوين كأسماء حقول؟", "o": ["خيار يحتوي الجدول على رؤوس", "حجم الخط", "لون الخلفية"], "a": 0, "why": "ص110.", "lvl": 1}}}, "g6-u3-l3": {"id": "g6-u3-l3", "grade": 6, "pages": "118-129", "lab": "db", "intro": {"question": "كيف تجد الطالب الذي اسمه يبدأ بحرف الألف بين مئات السجلات؟ وكيف تعرض طلاب فصل واحد فقط؟", "goals": ["أفرز البيانات تصاعديًا وتنازليًا", "أصفّي السجلات وفق معيار محدد", "أزيل التصفية", "أفرّق بين الفرز والتصفية"]}, "cards": [{"title": "فرز البيانات وتصفيتها", "text": "يعد فرز البيانات وتصفيتها في مايكروسوفت إكسل مهمة أساسية لإدارة الصفوف أو الأعمدة في ورقة العمل بناءً على معايير محددة، وتتضمن إعادة ترتيب الصفوف أو الأعمدة وفق الترتيب الرقمي أو الأبجدي أو الترتيب الزمني، ومن ثم تحديد سجلات معينة. سواء كنت تتعامل مع مجموعة صغيرة أو كبيرة من البيانات يمكن أن يساعدك فرز البيانات وتصفيتها على فهم بياناتك وتنظيمها بشكل أفضل والوصول إلى المعلومات التي تريدها بسهولة واتخاذ قرارات مؤثرة.", "page": 118}, {"title": "فرز البيانات: أساليبه", "text": "أساليب فرز البيانات وفق أنواعها: النصوص من (أ إلى ي) أو (ي إلى أ)، أو من (A إلى Z) أو (Z إلى A). الأرقام من (الأصغر إلى الأكبر) أو من (الأكبر إلى الأصغر). التواريخ والأوقات (من الأقدم إلى الأحدث) أو من (الأحدث إلى الأقدم).", "page": 118}, {"title": "أمر الفرز", "text": "يستخدم أمر الفرز (Sort) لترتيب البيانات في نطاق من الخلايا أو جدول حسب معيار محدد. هناك نوعان من الفرز في مايكروسوفت إكسل: 1) الفرز التصاعدي: يرتب البيانات من أصغر قيمة إلى أكبرها (للأرقام) أو بترتيب أبجدي (للنص) بناءً على العمود أو الصف المحدد. 2) الفرز التنازلي: يرتب البيانات من الأكبر إلى الأصغر (للأرقام) أو بترتيب أبجدي عكسي (للنص) بناءً على العمود أو الصف المحدد.", "page": 119}, {"title": "ترتيب بياناتك أبجديًا", "text": "لترتيب بياناتك أبجديًا: بمجرد تطبيق الأمر «التنسيق كجدول» (Format as Table) يظهر سهم تلقائيًا بجوار رأس كل عمود. 1) اضغط على السهم بجوار عنوان عمود «الاسم». 2) اضغط على «الفرز من أ إلى ي» (Sort A to Z) لفرز بيانات الجدول أبجديًا. 3) سيتغير سهم عمود «الاسم». 4) جميع البيانات في الجدول ستتغير مواضعها وتُفرز بناءً على القيم الموجودة في عمود «الاسم» ليعرض الجدول بالترتيب الأبجدي.", "page": 119}, {"title": "الفرز بحسب الأرقام", "text": "لفرز الجدول بناءً على الأرقام، مثل رقم الفصل، اضغط على السهم بجوار عنوان العمود «رقم الفصل»، ثم اختر «الفرز من الأكبر إلى الأصغر» أو «الفرز من الأصغر إلى الأكبر». ويمكن اختيار تحديد الكل (Select All) لإظهار جميع الصفوف كما كانت سابقًا. جرّب بنفسك فرز الجدول بناءً على عمود الاسم في ترتيب أبجدي تنازلي (Descending Alphabetical Order).", "page": 120}, {"title": "تصفية البيانات", "text": "يستخدم أمر التصفية (Filter) لعرض مجموعة محددة من بيانات الجدول. فمثلًا إذا أردت أن تعرض فقط أسماء طلبة فصل محدد، اختر رقم الفصل من قائمة التصفية. لعرض صفوف محددة: 1) اضغط على السهم بجوار عنوان عمود «رقم الفصل». 2) حدد رقم الفصل الذي تريد عرضه، على سبيل المثال 1. 3) ثم اضغط «موافق» (OK). 4) لقد طبقت الآن معامل تصفية على جدول البيانات بناءً على محتوى الحقول في عمود «رقم الفصل». 5) كذلك سيتغير السهم الموجود في عنوان العمود ليعرض الجدول بعد تصفيته بمعيار معين.", "page": 120}, {"title": "لن تُحذف بقية الصفوف", "text": "عند التصفية لن تُحذف بقية الصفوف بل سيتم إخفاؤها وتبقى في الجدول لكنها لن تُعرض.", "page": 121}, {"title": "إزالة التصفية", "text": "لإزالة معامل التصفية الذي طُبّق على الجدول: 1) اضغط على السهم بجوار عنوان العمود الذي تريد إزالة التصفية منه، على سبيل المثال «رقم الفصل». 2) اضغط على «إلغاء تطبيق عامل التصفية من (رقم الفصل)» (Clear Filter From). 3) تمت إزالة معامل التصفية من الجدول.", "page": 122}, {"title": "معلومة: أين أجد الفرز والتصفية؟", "text": "لتطبيق الفرز أو التصفية في أي مكان داخل جدول البيانات: حدّد أي صف أو عمود أو خلية، ومن علامة التبويب الشريط الرئيسي (Home) ومن قسم تحرير (Editing) اضغط على فرز وتصفية (Sort & Filter).", "page": 122}, {"title": "مشروع الوحدة", "text": "شكّل مع زملائك مجموعتين لإنشاء قواعد بيانات مختلفة: المجموعة الأولى تجمع معلومات حول الحيوانات وتصنيف جدول قاعدة البيانات حسب البيئة التي تعيش فيها. المجموعة الثانية تجمع معلومات حول الخضار والفواكه وتفرز جدول قاعدة البيانات حسب نوعها. حددوا خصائص موضوعكم واستخدموها كحقول ثم اجمعوا المعلومات عنها. بعد ذلك ستطلب من المجموعة الأولى العثور على معلومات حول أحد الحيوانات من المجموعة الثانية وبالعكس عبر التصفية. أخيرًا ستبدل المجموعتان أوراق العمل لتكرار العملية.", "page": 126}], "terms": [{"ar": "الفرز", "en": "Sort", "def": "ترتيب البيانات بترتيب محدد بناء على معيار", "page": 119}, {"ar": "التصفية", "en": "Filter", "def": "عرض سجلات تحقق معيارًا وإخفاء الباقي", "page": 120}, {"ar": "الفرز التصاعدي", "en": "Ascending", "def": "من الأصغر إلى الأكبر أو من أ إلى ي", "page": 119}, {"ar": "الفرز التنازلي", "en": "Descending", "def": "من الأكبر إلى الأصغر أو من ي إلى أ", "page": 119}, {"ar": "ترتيب أبجدي", "en": "Alphabetical Order", "def": "ترتيب النصوص حسب الحروف", "page": 119}], "match": {"title": "طابق المصطلح بتعريفه", "page": 126, "pairs": [["الفرز", "عملية ترتيب البيانات بترتيب محدد بناء على معايير"], ["التصفية", "عرض مجموعة فرعية من البيانات تحقق شروطًا"], ["الفرز التصاعدي", "من أصغر قيمة إلى أكبرها"], ["الفرز التنازلي", "من الأكبر إلى الأصغر"]]}, "order": {"title": "رتب خطوات تصفية الجدول لعرض الفصل 1", "page": 120, "steps": ["اضغط السهم بجوار عنوان عمود رقم الفصل", "حدد رقم الفصل 1", "اضغط موافق", "يعرض الجدول الفصل 1 فقط"]}, "qs": [{"t": "mc", "q": "ما الفرق بين الفرز والتصفية؟", "o": ["الفرز يعيد ترتيب البيانات والتصفية تعرض بعضها فقط", "هما شيء واحد", "الفرز يحذف الصفوف"], "a": 0, "why": "ص118.", "lvl": 1}, {"t": "mc", "q": "ما الفرز التصاعدي للنصوص؟", "o": ["من أ إلى ي", "من ي إلى أ", "عشوائي"], "a": 0, "why": "ص119.", "lvl": 1}, {"t": "mc", "q": "ما الفرز التصاعدي للأرقام؟", "o": ["من الأصغر إلى الأكبر", "من الأكبر إلى الأصغر", "دون ترتيب"], "a": 0, "why": "ص119.", "lvl": 1}, {"t": "mc", "q": "ما الفرز التنازلي للأرقام؟", "o": ["من الأكبر إلى الأصغر", "من الأصغر إلى الأكبر", "عشوائي"], "a": 0, "why": "ص119.", "lvl": 2}, {"t": "mc", "q": "من أين نفرز عمود «الاسم»؟", "o": ["السهم بجوار عنوان العمود", "قائمة ملف فقط", "شريط المهام"], "a": 0, "why": "ص119.", "lvl": 1}, {"t": "mc", "q": "أي أمر نستخدمه لعرض سجلات الفصل 1 فقط؟", "o": ["التصفية", "الحذف", "الطباعة"], "a": 0, "why": "ص120.", "lvl": 1}, {"t": "mc", "q": "ماذا يحدث لبقية الصفوف عند التصفية؟", "o": ["تُخفى ولا تُحذف", "تُحذف نهائيًا", "تتحول لأرقام"], "a": 0, "why": "ص121.", "lvl": 1}, {"t": "mc", "q": "كيف نزيل التصفية عن عمود؟", "o": ["إلغاء تطبيق عامل التصفية من العمود", "حذف الجدول", "إغلاق الملف"], "a": 0, "why": "ص122.", "lvl": 1}, {"t": "mc", "q": "أين نجد «فرز وتصفية» في الشريط الرئيسي؟", "o": ["قسم تحرير", "قسم الخط", "قسم المحاذاة"], "a": 0, "why": "ص122.", "lvl": 2}, {"t": "mc", "q": "كيف تُرتب التواريخ في الفرز؟", "o": ["من الأقدم إلى الأحدث أو العكس", "لا يمكن ترتيبها", "بحسب لون الخلية"], "a": 0, "why": "ص118.", "lvl": 2}, {"t": "tf", "q": "تُحذف الصفوف غير المطابقة عند التصفية.", "a": false, "why": "تُخفى فقط (ص121).", "lvl": 1}, {"t": "tf", "q": "الفرز يعيد ترتيب الصفوف دون حذف أي بيانات.", "a": true, "why": "ص118.", "lvl": 1}, {"t": "tf", "q": "يمكن فرز الأرقام والنصوص والتواريخ.", "a": true, "why": "ص118.", "lvl": 1}, {"t": "tf", "q": "الفرز والتصفية يساعدان على اتخاذ قرارات مؤثرة.", "a": true, "why": "ص118.", "lvl": 2}, {"t": "fill", "q": "أمر ___ يعرض مجموعة محددة من بيانات الجدول.", "a": ["التصفية", "تصفية", "الفلترة"], "why": "ص120.", "lvl": 2}, {"t": "fill", "q": "الفرز من ي إلى أ يسمى فرزًا ___.", "a": ["تنازليًا", "تنازلي", "تنازليا"], "why": "ص119.", "lvl": 2}], "summary": ["الفرز ترتيب والتصفية عرض مجموعة محددة", "تصاعدي: أصغر لأكبر أو أ إلى ي، وتنازلي العكس", "نستخدم السهم بجوار عنوان العمود", "التصفية تخفي ولا تحذف", "نزيل التصفية بإلغاء تطبيق عامل التصفية"], "challenge": {"text": "تحدي الدرس: في المحاكي افرز الأسماء تصاعديًا ثم تنازليًا، ثم صفِّ الفصل 1 وأزل التصفية.", "q": {"t": "mc", "q": "أردت عرض طلاب الفصل 2 فقط. ماذا تستخدم؟", "o": ["التصفية على عمود رقم الفصل", "الفرز التنازلي", "حذف بقية الصفوف"], "a": 0, "why": "ص120.", "lvl": 1}}}, "g6-u4-l1": {"id": "g6-u4-l1", "grade": 6, "pages": "134-141", "lab": "scratch6", "intro": {"question": "كيف تجعل الحاسب يكرر أوامر حتى يتحقق شرط معين دون أن تعرف عدد مرات التكرار؟", "goals": ["أفرق بين كرر وكرر باستمرار وكرر حتى", "أستخدم لبنة كرر حتى مع شرط", "أبرمج لعبة المتاهة بتحريك الدجاجة وجمع البيض", "أكتب خوارزمية تتحقق من كلمة المرور"]}, "cards": [{"title": "أنواع التكرار", "text": "تعلمت سابقًا أن جهاز الحاسب ينفذ اللبنة عدة مرات بثلاثة أنواع من الحلقات: كرر (repeat) وكرر باستمرار (repeat forever) وكرر حتى (repeat until). يسمح لك التكرار بتنفيذ نفس الأوامر مرارًا وتكرارًا.", "page": 134}, {"title": "لبنة كرر حتى", "text": "لبنة كرر حتى (repeat until) هي إحدى لبنات فئة التحكم (Control). تسمح لك بتكرار مجموعة لبنات حتى يتم الإجراء المطلوب. بعد سحب اللبنة إلى منطقة البرمجة النصية تحتاج إلى تحديد الشرط الذي سيوقف الحلقة. ستستمر الحلقة في تكرار مجموعة الإجراءات داخل اللبنة حتى يتحقق الشرط.", "page": 134}, {"title": "كيف تعمل؟", "text": "يتم استخدام لبنة كرر حتى لاستيفاء شرط معين دون معرفة عدد مرات التكرار، ويتوقف التكرار عندما يصبح الشرط صحيحًا. يجب وضع اللبنات التي تريد تكرارها داخل لبنة كرر حتى.", "page": 134}, {"title": "مثال: القطة والحافة", "text": "لإنشاء مقطع برمجي يجعل القطة تتحرك 10 خطوات في كل تكرار حتى تصل إلى الحافة ثم تقول «هذه هي الحافة»: 1) من الأحداث أضف «عند نقر العلم الأخضر». 2) من التحكم أضف «كرر حتى». 3) من الاستشعار أضف «ملامس لـ الحافة؟» داخل شرط كرر حتى. 4) من الحركة أضف «تحرك 10 خطوة» داخل التكرار. 5) من الهيئة أضف «قل هذه هي الحافة لمدة 2 ثانية» بعد التكرار.", "page": 134}, {"title": "خوارزمية كلمة المرور", "text": "يريد المبرمج التحقق من إدخال المستخدم لكلمة المرور الصحيحة، مثلًا «Scratch». الخطوات: 1) يسأل المستخدم عن كلمة المرور الخاصة به. 2) يتحقق من الشرط: إذا كان الشرط خطأ يبدأ التكرار وينفذ اللبنات داخل الحلقة وهي: يطلب إدخال كلمة المرور مرة أخرى. 3) عندما يصبح الشرط صحيحًا يتوقف التكرار ويتم تنفيذ اللبنة الموجودة بعد لبنة كرر حتى وتقول «لقد قمت بتسجيل الدخول».", "page": 136}, {"title": "لعبة المتاهة", "text": "يمكن استخدام كرر حتى في تصميم لعبة المتاهة، حيث تتحرك الدجاجة عبر المتاهة وتجمع البيض الموجود في طريقها حتى تصل إلى مخرج. الكائنات: دجاجة (Hen) وبيضة (Egg) وعاء (Bowl). 1) ارسم خلفية المتاهة من تبويب الخلفيات في قسم المنصة. 2) احذف كائن القطة وأضف الكائنات. 3) اكتب المقطع البرمجي.", "page": 137}, {"title": "تحريك الدجاجة", "text": "لتحريك الدجاجة تستخدم لبنة كرر حتى ولبنة ملامس لـ مع اختيار الكائن Bowl كشرط. داخل الحلقة أربع لبنات إذا: السهم العلوي → اتجه نحو الاتجاه 0، السهم السفلي → 180، السهم الأيمن → 90، السهم الأيسر → -90، ثم تحرك 10 خطوات لكل منها.", "page": 139}, {"title": "تجنب الحوائط", "text": "يجب على الدجاجة تجنب الحوائط، فعندما تلامس لون الحائط فإنها تتحرك 5 خطوات للخلف. لتنفذ الدجاجة ذلك استخدم لبنة ملامس للون ( ). أداة انتقاء اللون (Color Picker) تستخدم لتحديد لون على أي صورة مفتوحة على شاشتك.", "page": 139}, {"title": "لنطبق معًا", "text": "تدريب 1: إيقاف حركة الكائن باستخدام لوحة المفاتيح. تدريب 2: تغيير المقطع ليوقف الكائن حركته عند الضغط على الحرف s. تدريب 3: تحريك الكائن بشكل متكرر 30 درجة حتى تضغط أي مفتاح. تدريب 4: خوارزمية ومقطع يجعل الكائن يتوقف عند الضغط على زر الفأرة. تدريب 5: كائن يتحرك حتى يلمس كرة القدم.", "page": 140}], "terms": [{"ar": "كرر", "en": "Repeat", "def": "تكرار مجموعة لبنات عددًا محددًا من المرات", "page": 134}, {"ar": "كرر باستمرار", "en": "Repeat Forever", "def": "تكرار اللبنات دون توقف", "page": 134}, {"ar": "كرر حتى", "en": "Repeat Until", "def": "تكرار اللبنات حتى يصبح الشرط صحيحًا", "page": 134}, {"ar": "ملامس لـ", "en": "Touching", "def": "لبنة استشعار تتحقق من ملامسة كائن أو لون أو حافة", "page": 139}, {"ar": "انتقاء اللون", "en": "Color Picker", "def": "أداة لتحديد لون من أي صورة على الشاشة", "page": 139}], "match": {"title": "طابق اللبنة بوظيفتها", "page": 134, "pairs": [["كرر حتى", "تكرار حتى يتحقق الشرط"], ["كرر باستمرار", "تكرار دون توقف"], ["ملامس لـ", "تتحقق من ملامسة كائن أو حافة"], ["تحرك 10 خطوة", "تحريك الكائن للأمام"]]}, "order": {"title": "رتب لبنات مقطع القطة والحافة", "page": 134, "steps": ["عند نقر العلم الأخضر", "كرر حتى ملامس للحافة؟", "تحرك 10 خطوة", "قل هذه هي الحافة لمدة 2 ثانية"]}, "qs": [{"t": "mc", "q": "في أي فئة توجد لبنة كرر حتى؟", "o": ["التحكم", "الحركة", "الصوت"], "a": 0, "why": "ص134.", "lvl": 1}, {"t": "mc", "q": "متى يتوقف التكرار في لبنة كرر حتى؟", "o": ["عندما يصبح الشرط صحيحًا", "عندما يصبح الشرط خطأ", "بعد 10 مرات دائمًا"], "a": 0, "why": "ص134.", "lvl": 1}, {"t": "mc", "q": "متى نستخدم كرر حتى؟", "o": ["لتكرار أوامر دون معرفة عدد مرات التكرار", "لتغيير الخلفية", "لإضافة صوت"], "a": 0, "why": "ص134.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تستخدم لاختبار ملامسة الحافة؟", "o": ["ملامس لـ", "تحرك", "اسأل"], "a": 0, "why": "ص134.", "lvl": 1}, {"t": "mc", "q": "من أي فئة اللبنة «ملامس لـ»؟", "o": ["الاستشعار", "الحركة", "الهيئة"], "a": 0, "why": "ص134.", "lvl": 2}, {"t": "mc", "q": "ماذا يحدث عند صحة الشرط في خوارزمية كلمة المرور؟", "o": ["يتوقف التكرار ويقول لقد قمت بتسجيل الدخول", "يتكرر السؤال", "يغلق البرنامج"], "a": 0, "why": "ص136.", "lvl": 1}, {"t": "mc", "q": "ما كائنات لعبة المتاهة؟", "o": ["دجاجة وبيضة ووعاء", "قطة وكرة وشجرة", "طائرة ونجمة وسحابة"], "a": 0, "why": "ص137.", "lvl": 1}, {"t": "mc", "q": "أي اتجاه يعطيه السهم العلوي للدجاجة؟", "o": ["0", "90", "180"], "a": 0, "why": "ص139.", "lvl": 1}, {"t": "mc", "q": "أي اتجاه يعطيه السهم السفلي؟", "o": ["180", "-90", "90"], "a": 0, "why": "ص139.", "lvl": 2}, {"t": "mc", "q": "ماذا تفعل الدجاجة عند ملامسة لون الحائط؟", "o": ["تتحرك 5 خطوات للخلف", "تتوقف نهائيًا", "تقول مرحبًا"], "a": 0, "why": "ص139.", "lvl": 1}, {"t": "mc", "q": "ما أداة انتقاء اللون؟", "o": ["أداة تحدد لونًا من أي صورة على الشاشة", "لبنة حركة", "كائن"], "a": 0, "why": "ص139.", "lvl": 2}, {"t": "tf", "q": "كرر حتى تحتاج إلى شرط يوقف الحلقة.", "a": true, "why": "ص134.", "lvl": 1}, {"t": "tf", "q": "يجب وضع اللبنات المراد تكرارها خارج لبنة كرر حتى.", "a": false, "why": "توضع داخلها (ص134).", "lvl": 1}, {"t": "tf", "q": "الاتجاه -90 يجعل الدجاجة تتجه لليسار.", "a": true, "why": "ص139.", "lvl": 2}, {"t": "fill", "q": "الحلقة التي تكرر حتى يتحقق شرط تسمى كرر ___.", "a": ["حتى"], "why": "ص134.", "lvl": 2}, {"t": "fill", "q": "الاتجاه الذي يجعل الدجاجة تتجه لليمين هو ___.", "a": ["90"], "why": "ص139.", "lvl": 2}], "summary": ["أنواع التكرار: كرر، كرر باستمرار، كرر حتى", "كرر حتى تتوقف عندما يصبح الشرط صحيحًا", "ملامس لـ من فئة الاستشعار", "في المتاهة: أربع إذا للأسهم وملامس لـ للون الحائط"], "challenge": {"text": "تحدي الدرس: في «سكراتش: المتغيرات والقرارات» استخدم «كرر حتى» مع «تحرك» حتى يصبح الموضع س أكبر من 100.", "q": {"t": "mc", "q": "تريد تكرار الحركة حتى تلمس الحافة دون معرفة عدد الخطوات. ماذا تستخدم؟", "o": ["كرر حتى", "كرر 10 مرات", "قل"], "a": 0, "why": "ص134.", "lvl": 1}}}, "g6-u4-l2": {"id": "g6-u4-l2", "grade": 6, "pages": "142-152", "lab": "scratch6", "intro": {"question": "كيف تخزن الحاسب الأرقام والأسماء أثناء تشغيل البرنامج؟ وكيف تعدّ البيض الذي جمعته الدجاجة؟", "goals": ["أستخدم المعاملات الحسابية في سكراتش", "أنشئ متغيرات وأسميها بالشروط الصحيحة", "أجري عمليات حسابية على المتغيرات", "أستخدم المتغير كعداد بلبنة غيّر"]}, "cards": [{"title": "المعاملات الحسابية", "text": "يمكنك استخدام سكراتش لتنفيذ أي نوع من العمليات الحسابية مثل: الجمع والطرح والضرب والقسمة. تُستخدم المعاملات (Operators) لإجراء الحسابات، وعلامة الجمع (+) هي المعامل الذي يمثل عملية الجمع. يمكن العثور على لبنات المعاملات الرياضية في فئة المعاملات (Operators).", "page": 142}, {"title": "الرموز في البرمجة", "text": "تُستخدم الرموز لتمثيل العمليات الحسابية: الجمع +، الطرح -، الضرب *، القسمة /. تُكتب العمليات الحسابية في البرمجة بطريقة مختلفة عن كتابتها الرياضية: 2+4 و2-4 و2*4 و2/4.", "page": 143}, {"title": "إجراء عملية الجمع", "text": "1) أضف لبنة «عند نقر العلم الأخضر» من فئة الأحداث. 2) أضف لبنة «قل ... لمدة 2 ثانية» من فئة الهيئة. 3) اسحب لبنة الجمع وضعها داخل لبنة قل. 4) اكتب الأرقام التي تريد جمعها.", "page": 143}, {"title": "المتغيرات في سكراتش", "text": "يشير اسم المتغير إلى مكان محدد في ذاكرة جهاز الحاسب ويستخدم لتخزين البيانات أثناء تنفيذ المقطع البرمجي. كل متغير له اسم فريد وقيمة. يحتوي سكراتش على متغير يسمى «my variable» ويمكنك العثور على اللبنات الخاصة بالمتغيرات في فئة (Variables).", "page": 144}, {"title": "أنواع المتغيرات", "text": "المتغيرات الرقمية (أرقام) مثل classA = 20 و classB = 18. المتغيرات النصية (سلاسل نصية) مثل MyName = Khaled و EmailAddress. المتغيرات في سكراتش تنتمي إلى الكائن الذي تم إنشاؤها فيه، ويمكن أن تخزن أي نوع من البيانات مثل الأرقام أو سلاسل النصوص (Strings).", "page": 145}, {"title": "شروط تسمية المتغير", "text": "يجب تعيين قيمة المتغير عند إنشائه. يمكن أن تحتوي أسماء المتغيرات في سكراتش على أحرف وأرقام وشرطة سفلية (underscore). يجب أن يكون اسم المتغير فريدًا. يجب أن يكون اسم المتغير سهل التذكر وله معنى يدل على محتواه. يوصى بتسمية المتغيرات باللغة الإنجليزية لتتوافق مع مشاريع سكراتش الأخرى.", "page": 145}, {"title": "إنشاء متغير", "text": "لإنشاء متغير اسمه counter: 1) اضغط على فئة المتغيرات (Variables). 2) اضغط على إنشاء متغير (Make a Variable). 3) ستظهر نافذة متغير جديد. 4) اكتب اسم المتغير counter. 5) اضغط على موافق (OK). 6) حدد المربع بجوار المتغير لتظهر قيمته على المسرح.", "page": 146}, {"title": "تهيئة المتغير وتعديله", "text": "عندما تريد تعيين قيمة محددة إلى متغير يمكنك استخدام لبنة اجعل ( ) مساويًا ( ) (set to). ولتعديل المتغير: اضغط بزر الفأرة الأيمن على المتغير ثم اختر إعادة تسمية المتغير (Rename variable) أو حذف المتغير (Delete the variable).", "page": 147}, {"title": "العمليات الحسابية بالمتغيرات", "text": "في المثال، يطلب المقطع البرمجي من المستخدم إدخال رقمين ويخزن كل رقم في متغير (x و y)، وتخزن نتيجة عملية الجمع في متغير sum. الإجابة (answer) تحمل ما يكتبه المستخدم. يختبر المقطع بإدخال أرقام مختلفة في كل مرة، وفي النهاية يقول الكائن النتيجة.", "page": 148}, {"title": "المتغير كعداد ولبنة غيّر", "text": "في كل مرة تلمس الدجاجة بيضة يجب أن تتغير قيمة المتغير بمقدار 1، لذلك ستستخدم لبنة غيّر (change). تزيد لبنة غيّر قيمة المتغير بمقدار محدد: غيّر counter بمقدار 1 في كل مرة تلمس فيها الدجاجة بيضة. يجب إخفاء البيضة عند لمس الدجاجة لها باستخدام لبنتي أظهر (show) واخف (hide) من فئة الهيئة.", "page": 150}], "terms": [{"ar": "المعامل", "en": "Operator", "def": "رمز يمثل إجراءً محددًا مثل + و -", "page": 142}, {"ar": "المتغير", "en": "Variable", "def": "مكان في الذاكرة له اسم وقيمة لتخزين البيانات", "page": 144}, {"ar": "القيمة", "en": "Value", "def": "المحتوى المخزن في المتغير", "page": 144}, {"ar": "السلسلة النصية", "en": "String", "def": "نص يخزن في متغير", "page": 145}, {"ar": "اجعل ... مساويًا", "en": "Set to", "def": "لبنة تعين قيمة محددة لمتغير", "page": 147}, {"ar": "غيّر", "en": "Change", "def": "لبنة تزيد قيمة المتغير بمقدار محدد", "page": 150}], "match": {"title": "طابق المعامل برمزه", "page": 143, "pairs": [["الجمع", "+"], ["الطرح", "-"], ["الضرب", "*"], ["القسمة", "/"]]}, "order": {"title": "رتب خطوات إنشاء متغير counter", "page": 146, "steps": ["اضغط فئة المتغيرات", "اضغط إنشاء متغير", "اكتب الاسم counter", "اضغط موافق"]}, "qs": [{"t": "mc", "q": "كيف تكتب عملية الضرب 2×4 في البرمجة؟", "o": ["2*4", "2x4", "2^4"], "a": 0, "why": "ص143.", "lvl": 1}, {"t": "mc", "q": "كيف تكتب القسمة 2÷4 في البرمجة؟", "o": ["2/4", "2÷4", "2:4"], "a": 0, "why": "ص143.", "lvl": 2}, {"t": "mc", "q": "في أي فئة توجد لبنات المعاملات الحسابية؟", "o": ["المعاملات (Operators)", "الحركة", "الصوت"], "a": 0, "why": "ص142.", "lvl": 1}, {"t": "mc", "q": "ما المتغير؟", "o": ["مكان في ذاكرة الحاسب له اسم وقيمة", "لبنة حركة", "كائن جديد"], "a": 0, "why": "ص144.", "lvl": 1}, {"t": "mc", "q": "ماذا يتكون كل متغير؟", "o": ["اسم وقيمة", "لون وحجم", "صوت وصورة"], "a": 0, "why": "ص144.", "lvl": 1}, {"t": "mc", "q": "أي مما يأتي اسم متغير مناسب؟", "o": ["counter", "سعر زجاجة الحليب!", "5 5"], "a": 0, "why": "ص145.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تعين قيمة محددة لمتغير؟", "o": ["اجعل ( ) مساويًا ( )", "غيّر", "اسأل"], "a": 0, "why": "ص147.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تزيد قيمة المتغير بمقدار محدد؟", "o": ["غيّر", "اجعل", "أظهر"], "a": 0, "why": "ص150.", "lvl": 1}, {"t": "mc", "q": "ما الذي تحمله «الإجابة» (answer)؟", "o": ["ما يكتبه المستخدم", "قيمة counter", "اسم الكائن"], "a": 0, "why": "ص148.", "lvl": 1}, {"t": "mc", "q": "لماذا نستخدم المتغير counter في لعبة الدجاجة؟", "o": ["لعدّ البيض الذي جمعته", "لتغيير الخلفية", "لتشغيل الصوت"], "a": 0, "why": "ص150.", "lvl": 1}, {"t": "mc", "q": "ماذا نفعل بالبيضة عند لمس الدجاجة لها؟", "o": ["نخفيها بلبنة اخف", "نحذف الدجاجة", "نكرر السؤال"], "a": 0, "why": "ص148.", "lvl": 2}, {"t": "tf", "q": "يجب أن يكون اسم المتغير فريدًا.", "a": true, "why": "ص145.", "lvl": 1}, {"t": "tf", "q": "المتغير يمكن أن يخزن نصًا أو رقمًا.", "a": true, "why": "ص145.", "lvl": 1}, {"t": "tf", "q": "يمكن أن يحتوي اسم المتغير على شرطة سفلية.", "a": true, "why": "ص145.", "lvl": 2}, {"t": "fill", "q": "رمز عملية الجمع في البرمجة هو ___.", "a": ["+"], "why": "ص143.", "lvl": 2}, {"t": "fill", "q": "لبنة ___ تزيد قيمة المتغير بمقدار محدد.", "a": ["غيّر", "غير"], "why": "ص150.", "lvl": 2}], "summary": ["المعاملات: + - * /", "المتغير له اسم وقيمة", "نكتب اسم المتغير فريدًا ومعبرًا", "اجعل لتعيين قيمة وغيّر لزيادتها", "العداد متغير نزيده بمقدار 1 كل مرة"], "challenge": {"text": "تحدي الدرس: في المحاكي اجعل «النقاط» مساوية 5، ثم كرر 4 مرات «غيّر العداد بمقدار 1» لتصبح قيمة العداد 4.", "q": {"t": "mc", "q": "بدأ العداد بالقيمة 0 ثم نُفذت لبنة «غيّر العداد بمقدار 1» ثلاث مرات. كم قيمته؟", "o": ["3", "1", "0"], "a": 0, "why": "ص150.", "lvl": 1}}}, "g6-u4-l3": {"id": "g6-u4-l3", "grade": 6, "pages": "153-159", "lab": "scratch6", "intro": {"question": "كيف يختار البرنامج بين أمرين حسب شرط معين، مثل أن يقول «نجحت» أو «حاول مرة أخرى»؟", "goals": ["أفهم أهمية اتخاذ القرار في البرمجة", "أستخدم لبنة إذا وإلا", "أنشئ مقطعًا يتخذ قرارًا حسب الإجابة", "أستخدم العداد في شرط تجميع البيض"]}, "cards": [{"title": "اتخاذ القرار", "text": "في برمجة جهاز الحاسب يؤدي صنع القرار دورًا مهمًا تمامًا كما هو الحال في الحياة الواقعية، حيث تتوفر خيارات مختلفة بناءً على ظروف مختلفة. مثلًا إذا كان الجو باردًا في الخارج فستختار ارتداء معطفك. في سكراتش يرتبط تحديد خيار واتخاذ قرار ارتباطًا وثيقًا بلبنات تُنفذ حسب الشرط.", "page": 153}, {"title": "لبنة إذا ( ) وإلا", "text": "عندما يكون عليك اتخاذ قرار وترغب في تحديد ما يحدث سواء كان الشرط صحيحًا أو خطأ يمكنك استخدام لبنة إذا ( ) وإلا (if then else). إذا كان الشرط صحيحًا يتم تنفيذ اللبنات الموجودة تحت إذا (if)، وإذا كان خطأ فيتم تنفيذ اللبنات الموجودة أسفل إلا (else). تجدها في فئة التحكم (Control).", "page": 153}, {"title": "مثال: نتيجة الطالب", "text": "إذا كانت نتيجة الطالب أقل من 50 فعليه المحاولة وكتابة النتيجة مرة أخرى، وفي الحالة الأخرى يجتاز الاختبار. استخدام لبنة إذا ( ) ثم وحدها يعطي نتيجة مختلفة عن لبنة إذا ( ) وإلا في بعض المقاطع.", "page": 153}, {"title": "مقطع يتخذ قرارًا", "text": "أنشئ مقطعًا برمجيًا: يسأل الكائن «هل تريدني أن ألتفت يمينًا أم يسارًا؟» وينتظر الإجابة. إذا كانت الإجابة = يمين فإنه إذا ضغط المفتاح m يستدير الكائن 15 درجة باتجاه الساعة، وإلا (وإلا) إذا ضغط المفتاح w يلتفت الكائن 15 درجة إلى اليسار. قبل تشغيل المقطع غيّر لغة لوحة المفاتيح إلى الإنجليزية.", "page": 154}, {"title": "جرب بنفسك", "text": "في الدرس السابق أنشأت متغيرًا يحصي عدد البيض الذي جمعته الدجاجة، ويوجد في اللعبة 4 بيضات. ستضيف لبنة التحكم الجديدة: إذا جمعت الدجاجة كل البيض ولمست الوعاء تظهر رسالة «أحسنت، يمكنك وضع البيض في الوعاء»، وإلا ستظهر رسالة «حاول مرة أخرى». الشرط: counter = 4.", "page": 154}, {"title": "لنطبق معًا", "text": "تدريب 1: اكتب مقطعًا يعرض الرقم الأكبر من رقمين يدخلهما المستخدم، باستخدام x و y وشرط y < x. تدريب 2: عدّل المقطع باستخدام لبنة إذا ( ). تدريب 3: متغيرات: فكر في أسماء متغيرات لسعر زجاجة الحليب ودرجة الطالب وعدد أفراد الأسرة وإجمالي قيمة الفاتورة. تدريب 4: اكتب خوارزمية ومقطعًا يحسب عمرك (سنة الميلاد والسنة الحالية).", "page": 157}], "terms": [{"ar": "اتخاذ القرار", "en": "Decision Making", "def": "اختيار إجراء حسب تحقق شرط", "page": 153}, {"ar": "إذا ( ) وإلا", "en": "If Else", "def": "لبنة تنفذ مجموعة لبنات إن صح الشرط وأخرى إن كان خطأ", "page": 153}, {"ar": "الشرط", "en": "Condition", "def": "عبارة تكون صحيحة أو خطأ", "page": 153}, {"ar": "الإجابة", "en": "Answer", "def": "قيمة تخزن ما يكتبه المستخدم", "page": 154}], "match": {"title": "طابق الجزء بوظيفته في إذا وإلا", "page": 153, "pairs": [["إذا", "تنفذ لبناتها إذا كان الشرط صحيحًا"], ["وإلا", "تنفذ لبناتها إذا كان الشرط خطأ"], ["الشرط", "عبارة صحيحة أو خطأ"], ["الإجابة", " المنصة. يكون مركز المنصة هو (0,0) وهو موقع القطة. لكل كائن موقعه الخاص على الشاشة.", "page": 162}, {"title": "معنى x و y", "text": "x: تشير القيمة x إلى موقع الكائن أفقيًا على طول المحور، وبزيادة هذه القيمة أو إنقاصها يتحرك الكائن يمينًا أو يسارًا. y: تشير القيمة y إلى موقع الكائن رأسيًا على طول المحور، وبزيادة القيمة أو إنقاصها يتحرك الكائن لأعلى أو لأسفل. مثال: إذا كان موضع الكائن (5,4) فهذا يعني أن x=5 و y=4.", "page": 162}, {"title": "لبنات الإحداثيات", "text": "اذهب إلى (موضع عشوائي): تنقل الكائن إلى موقع عشوائي. اذهب إلى الموضع س: ( ) ص: ( ): تنقل الكائن إلى الإحداثيات المحددة. انزلق خلال ( ) ثانية إلى الموضع س: ( ) ص: ( ): تجعل الكائن يتحرك بسلاسة إلى موقع محدد في عدد من الثواني. غيّر الموضع س بمقدار ( ): تغير x، غيّر الموضع ص بمقدار ( ): تغير y. اجعل الموضع س مساويًا ( ) و اجعل الموضع ص مساويًا ( ): تعين الإحداثي. لبنتا الموضع س والموضع ص تمثلان القيمتين الحاليتين.", "page": 163}, {"title": "تحريك الكائن", "text": "يمكنك تحريك الكائن إلى أي موضع على المنصة باستخدام لبنات تغيير الإحداثيات ومنها: لبنة اذهب إلى الموضع س ص أو لبنة انزلق خلال ثانية إلى س ص. لاحظ الفرق بين المقطعين: الأول ينقل الكائن فورًا بعد الانتظار، والثاني ينزلق بسلاسة.", "page": 164}, {"title": "الرسوم التوضيحية", "text": "الرسم التوضيحي (pictograph) هو رسم تخطيطي مكون من صور لأشياء مختلفة تُستخدم لتمثيل معلومات مختلفة. هذا النوع من المخططات مفيد عندما تحتاج إلى مقارنة بين قيم مختلفة لشيء واحد. لإنشاء رسم توضيحي: ارسم المحور والجدول، ثم ضع الكائن بجانب كل قيمة على المحور وطباعة العدد الصحيح للأشكال.", "page": 165}, {"title": "لوحة المفاتيح", "text": "هناك طريقتان للتحكم الكامل في حركة الكائن باستخدام لوحة المفاتيح. الأولى: استخدام لبنة عند ضغط مفتاح (when key pressed) من فئة الأحداث. الثانية: استخدام لبنة المفتاح مضغوط؟ (key pressed?) من فئة الاستشعار. لبنة عند ضغط مفتاح تنفذ المقطع البرمجي عند الضغط على المفتاح المحدد، وتفيد في الألعاب. اختر المفتاح من القائمة: السهم العلوي والسفلي والأيمن والأيسر وغيرها.", "page": 166}, {"title": "مقطعان لتحريك الكائن", "text": "المقطع الأول: أربع لبنات عند ضغط مفتاح، كل منها يغير x أو y بمقدار 5 أو -5. المقطع الثاني: لبنة المفتاح مضغوط؟ داخل كرر باستمرار مع أربع لبنات إذا، وهذا الأسلوب أسرع ويعطي إحساسًا بالحركة المستمرة. اللبنة تتحقق باستمرار فيتحرك الكائن بشكل أسرع.", "page": 167}, {"title": "لنطبق معًا", "text": "تدريب 1: حدد الجملة الصحيحة والخطأ (مثلًا: إذا كانت إحداثيات الكائن x و y تساويان صفرًا فهو في مركز المنصة). تدريب 2: صل اللبنة بالوصف: اذهب إلى (-22،-15). تدريب 3: نفذ المقطع ثلاث مرات مع ملاحظة إحداثيات الكائن في كل مرة. تدريب 4: ضعت الكائنات في إحداثيات خطأ، اكتب مقطعًا لنقل كرة السلة (-50،-20) وكرة البيسبول (-20،80) إلى الموقع الصحيح. تدريب 5: التحكم في كائن باستخدام لوحة المفاتيح بأسهم أو مفاتيح مختلفة.", "page": 168}], "terms": [{"ar": "نظام الإحداثيات", "en": "Coordinate System", "def": "نظام أرقام لتحديد موضع نقطة في مساحة", "page": 161}, {"ar": "المحور", "en": "Axis", "def": "الخط الذي تقاس عليه الإحداثيات", "page": 161}, {"ar": "نقطة الأصل", "en": "Origin", "def": "نقطة تقاطع المحورين وقيمتها (0,0)", "page": 161}, {"ar": "البكسل", "en": "Pixel", "def": "نقطة صغيرة تتكون منها المنصة", "page": 162}, {"ar": "الرسم التوضيحي", "en": "Pictograph", "def": "رسم بالصور يقارن بين القيم", "page": 165}, {"ar": "لوحة المفاتيح", "en": "Keyboard", "def": "أداة إدخال للتحكم في الكائن", "page": 166}], "match": {"title": "طابق المحور بوظيفته", "page": 162, "pairs": [["المحور x", "الموضع الأفقي يمينًا أو يسارًا"], ["المحور y", "الموضع الرأسي أعلى أو أسفل"], ["(0,0)", "مركز المنصة"], ["اذهب إلى موضع عشوائي", "ينقل الكائن لمكان عشوائي"]]}, "order": {"title": "رتب خطوات تحريك كائن بالسهم الأيمن", "page": 166, "steps": ["اختر لبنة عند ضغط مفتاح", "اختر السهم الأيمن", "أضف غيّر الموضع س بمقدار 10", "اضغط السهم الأيمن لتجرب"]}, "qs": [{"t": "mc", "q": "ما إحداثيات مركز المنصة في سكراتش؟", "o": ["(0,0)", "(1,1)", "(240,180)"], "a": 0, "why": "ص162.", "lvl": 1}, {"t": "mc", "q": "أي محور يحدد الموضع الأفقي؟", "o": ["x", "y", "z"], "a": 0, "why": "ص162.", "lvl": 1}, {"t": "mc", "q": "أي محور يحدد الموضع الرأسي؟", "o": ["y lse: ليس A صحيح، A أو B خطأ، A و B خطأ. A=True,B=False: A و B خطأ، A أو B صحيح، ليس A خطأ. A=False,B=True: A و B خطأ، A أو B صحيح. A=True,B=True: A و B صحيح، A أو B صحيح، ليس A خطأ.", "page": 173}, {"title": "مثال: معامل و", "text": "تستدير القطة فقط إذا تم الضغط على كلا المفتاحين. في هذا المثال تغير القطة ألوانها ويتوقف عن تغيير الألوان إذا ضغطت على مفتاحي السهم العلوي والمسافة في نفس الوقت. يجب أن يكون كلا الشرطين (A و B) صحيحين لتشغيل المقطع البرمجي داخل المساحة الأولى، وإذا كان أحدهما خطأ فسيتم تشغيل المقطع في المساحة الثانية.", "page": 174}, {"title": "مثال: معامل أو", "text": "تستدير القطة إذا تم الضغط على أحد المفاتيح. يجب أن يكون شرط واحد (A أو B) صحيحًا لتشغيل المقطع البرمجي داخل المساحة الأولى، وإذا كان كلاهما خطأ فسيتم تشغيل المقطع في المساحة الثانية.", "page": 174}, {"title": "مثال: معامل ليس", "text": "لن تتغير القطة طالما لم يتم الضغط على الزر. في هذا المثال يستدير الكائن عند الضغط على مفتاح السهم العلوي وتتوقف القطة عن الدوران وتبدأ بتغيير الألوان عندما تضغط عليه. يجب أن يكون الشرط (A) خطأ لتشغيل المقطع البرمجي داخل المساحة الأولى.", "page": 174}, {"title": "لبنات الانتظار", "text": "لبنة انتظر ( ) ثانية (wait secs): تنتظر اللبنة عددًا محددًا من الثواني ثم تستمر اللبنة التالية. لبنة انتظر حتى ( ) (wait until): تحتاج في بعض الحالات إلى إيقاف المقطع البرمجي والانتظار حتى حدوث حدث ما محدد. يمكنك استخدام لبنة انتظر حتى ( ) التي توقف المقطع البرمجي مؤقتًا حتى يتحقق الشرط المحدد.", "page": 175}, {"title": "انتظر حتى والفرق", "text": "في المثال تريد أن تجعل الكائن ينتظر حتى يلمس مؤشر الفأرة، وعندما يلمس مؤشر الفأرة القطة فإنه سيظهر ويتحرك 30 خطوة. لاحظ الفرق بين لبنة انتظر ( ) ثانية ولبنة انتظر حتى ( ): مربع لبنة انتظر ( ) ثانية بيضاوي الشكل لأن المدخل يكون قيم، ولكن مربع انتظر حتى ( ) المدخل يكون عبارة عن مضمر لأن المدخل يكون شرطًا فقط.", "page": 176}], "terms": [{"ar": "المعاملات الحسابية", "en": "Arithmetic Operators", "def": "لبنات الجمع والطرح والضرب والقسمة", "page": 172}, {"ar": "المعاملات الشرطية", "en": "Conditional Operators", "def": "معاملات المقا "text": "لإعداد المنصة: 1) احذف كائن القطة. 2) أضف الكائن المركبة الفضائية (Rocketship). 3) غيّر حجم الكائن إلى 70 واتجاهه إلى 180 درجة. 4) أضف الخلفية السماء الزرقاء Blue Sky 2. 5) ضعها كخلفية للمنصة.", "page": 180}, {"title": "حركة المركبة الفضائية", "text": "للتحكم في المركبة الفضائية من خلال لوحة المفاتيح عليك إنشاء مقطعين برمجيين باستخدام لبنة عند ضغط مفتاح. عند الضغط على مفتاح السهم العلوي يتحرك الكائن لأعلى وعند الضغط على السهم السفلي يتحرك لأسفل. يتغير الكائن عندما يظهر عند ضغط أحد هذه المفاتيح لتجعل الحركة تبدو أكثر واقعية. نصيحة: لتحريك الكائن لأعلى أو لأسفل تحتاج إلى تغيير قيمة الإحداثي ص.", "page": 180}, {"title": "تقنيات الرسوم المتحركة", "text": "الرسوم المتحركة هي تقنية تعالج الصور وتجعل الأشياء الثابتة تظهر وكأنها متحركة، وتحقق الإيحاء بالحركة من خلال سلسلة سريعة من الصور المتسلسلة التي تختلف اختلافًا طفيفًا بينها. ستستخدم هذه التقنية لكي تظهر المركبة الفضائية وكأنها تطير فوق المدينة، وذلك بتحريك الخلفية. أضفت سابقًا السماء الزرقاء كخلفية؛ والآن أضف الكائن السحب (Clouds) والمباني (Buildings) من مكتبة سكراتش.", "page": 182}, {"title": "الكائن السحب", "text": "اضبط أولًا المحور y على قيمة عالية ليرتفع كائن السحب ثم أرسله إلى الجانب الأيمن من المنصة بتقليل قيمة المحور x لتتحرك السحب إلى الجانب الأيسر للمنصة. غيّر أيضًا المظهر كل مرة ليظهر شكل مختلف للسحب. المقطع: اجعل الموضع ص مساويًا 120، كرر باستمرار: اجعل الموضع س مساويًا 250، المظهر التالي، كرر 115 مرة: غيّر الموضع س بمقدار -5.", "page": 182}, {"title": "الكائن المباني", "text": "اضبط حجم المباني أسفل المنصة غير مرئية بالكامل ثم أرسلها إلى الجانب الأيمن، وتتحرك المباني على المحور x من الجانب الأيمن إلى الجانب الأيسر للمنصة. المقطع: اجعل الموضع ص مساويًا -40، كرر باستمرار: اجعل الموضع س مساويًا 250، المظهر التالي، كرر 125 مرة: غيّر الموضع س بمقدار -4.", "page": 182}, {"title": "إنشاء متغير النقاط", "text": "لإنشاء متغير النقاط (points): 1) انتقل إلى فئة لبنات المتغيرات (Variables). 2) اضغط على إنشاء متغير (Make a Variable). 3) سمّ المتغير points. 4) اضغط موافق. 5) حدد المربع بجوار المتغير points لتنظهر قيمته على المنصة.", "page": 184}, {"title": "برمجة المركبة الفضائية", "text": "عند الضغط على العلم الأخضر يضبط المقطع النقاط عدد النقاط على 5. ثم يضع المركبة الفضائية على الجانب الأيسر من المنصة ويغير الخلفية إلى Blue Sky 2. ثم يبدأ صوت يشير إلى أن اللعبة قد بدأت. تتحقق اللعبة من لمس الغيوم والمباني: إذا لمست المركبة سحابة أو مبنى فإنها تفقد نقطة واحدة ويصدر صوت (laser). بعد الانتهاء من المقطع عند وصول النقاط إلى 0 تتوقف كل المقاطع بلبنة أوقف الكل (stop all). يصبح لون المركبة مختلفًا وتظهر رسالة نهاية اللعبة.", "page": 183}, {"title": "كسب النقاط: الكائن النجمة", "text": "يجب ألا يخسر اللاعبون النقاط في اللعبة وذلك لكي يكونوا من الفائزين، كما عليهم أيضًا كسب النقاط كما في معظم الألعاب. ستضيف النجمة (Star): ابحث عن الكائن النجمة في مكتبة سكراتش، حيث يتحرك من الجانب الأيمن إلى الأيسر. في كل مرة سيظهر على المنصة وبارتفاع مختلف لا يعرف اللاعب أين موقعه بالتحديد. إذا لمست المركبة الفضائية النجمة فإنها تختفي وتبدأ في التحرك مرة أخرى حتى تنتهي اللعبة.", "page": 186}, {"title": "معلومة: مستوى الصعوبة", "text": "عادة ما تظهر الكائنات التي تمنح نقاطًا للاعب بشكل أقل من تلك التي تجعله يخسر نقطة. لاحظ أنها تتحرك بشكل أسرع. لترفع مستوى صعوبة اللعبة غيّر الرقم الذي يغير قيمة المحور x.", "page": 186}, {"title": "لنطبق معًا", "text": "تدريب 1: المعاملات في سكراتش. أكمل الفراغات: إذا كانت قيمة العمر (age) أكبر من أو تساوي 18 اكتب «يمكنك التقدم بطلب للحصول على رخصة قيادة السيارة». تدريب 2: إنشاء لعبة: طائر يطير وتتحكم فيه بلوحة المفاتيح، ستستخدم الأسهم لتجنب المعوقات مثل الأشجار والبالونات. عند بدء اللعبة ستمتلك 5 نقاط، ثم تخسر نقطة كلما لمس الطائر شجرة أو بالونًا. تدريب 3: كتابة خوارزمية لبرنامج يسأل: هل السماء تمطر؟ تدريب 4: تابع لعبة المركبة: أضف عدادًا للنقاط.", "page": 188}, {"title": "مشروع الوحدة: الغوص وصيد الأسماك", "text": "أنشئ مشروعًا جديدًا في سكراتش، حدد الكائنات: الغواص (Diver1) والمفتاح (Key) والسمكة (Fish) وقنديل البحر (Jellyfish). برمج الغواص ليتحرك حول المنصة باستخدام لوحة المفاتيح. أنشئ مقاطع برمجية للسمكة وقنديل البحر لتتحرك من الجانب الأيمن إلى الأيسر. أضف مقاطع لتكسب نقاطًا عندما يمسك الغواص بمفتاح ويفقدها عندما يلمس سمكة أو قنديل بحر. اكتمل المشروع، شغّل المقطع واختبره.", "page": 191}], "terms": [{"ar": "الرسوم المتحركة", "en": "Animation Techniques", "def": "تقنية تجعل الصور الثابتة تبدو متحركة بسلسلة صور متتابعة", "page": 182}, {"ar": "النقاط", "en": "Points", "def": "متغير يعد ما يكسبه اللاعب أو يخسره", "page": 184}, {"ar": "اللعبة", "en": "Game", "def": "برنامج تفاعلي له شخصية ونقاط وقواعد", "page": 180}, {"ar": "أوقف الكل", "en": "Stop All", "def": "لبنة توقف جميع المقاطع", "page": 183}, {"ar": "النجمة", "en": "Star", "def": "كائن يكسب اللاعب نقطة عند لمسه", "page": 186}], "match": {"title": "طابق الكائن بدوره في اللعبة", "page": 180, "pairs": [["المركبة الفضائية", "الشخصية الرئيسية التي يتحكم بها اللاعب"], ["السحب والمباني", "عقبات تخسر المركبة نقاطًا عند لمسها"], ["النجمة", "تكسب المركبة نقاطًا عند لمسها"], ["points", "متغير يخزن نقاط اللاعب"]]}, "order": {"title": "رتب خطوات إعداد منصة المركبة", "page": 180, "steps": ["احذف كائن القطة", "أضف الكائن المركبة الفضائية", "غيّر الحجم إلى 70 والاتجاه إلى 180", "أضف الخلفية السماء الزرقاء 2"]}, "qs": [{"t": "mc", "q": "ما الشخصية الرئيسية في لعبة المركبة؟", "o": ["المركبة الفضائية", "القطة", "الدجاجة"], "a": 0, "why": "ص180.", "lvl": 1}, {"t": "mc", "q": "بماذا يتحكم اللاعب بالمركبة؟", "o": ["لوحة المفاتيح (السهمان العلوي والسفلي)", "الصوت", "لا يتحكم"], "a": 0, "why": "ص180.", "lvl": 1}, {"t": "mc", "q": "ما نقاط البداية في اللعبة؟", "o": ["5", "0", "100"], "a": 0, "why": "ص183.", "lvl": 1}, {"t": "mc", "q": "ماذا يحدث عند لمس المركبة سحابة أو مبنى؟", "o": ["تخسر نقطة", "تكسب نقطة", "لا شيء"], "a": 0, "why": "ص183.", "lvl": 1}, {"t": "mc", "q": "ماذا يحدث عند لمس المركبة النجمة؟", "o": ["تكسب نقاطًا وتختفي النجمة", "تخسر نقطة", "تتوقف اللعبة"], "a": 0, "why": "ص186.", "lvl": 1}, {"t": "mc", "q": "كيف نحرك المركبة لأعلى؟", "o": ["نغير قيمة الإحداثي ص بقيمة موجبة", "نغير الاتجاه", "نغير الخلفية"], "a": 0, "why": "ص180.", "lvl": 1}, {"t": "mc", "q": "ما الرسوم المتحركة function bank(f){const r=[];for(const l of Object.values(LES)){if(f&&!f(l))continue;l.qs.forEach((q,i)=>r.push(Object.assign({id:l.id+':'+i,lesson:l.id},q)));if(l.challenge&&l.challenge.q)r.push(Object.assign({id:l.id+':c',lesson:l.id},l.challenge.q))}return r}
function prep(q){const c=Object.assign({},q);if(q.t==='mc')c.opts=sh(q.o.map((t,i)=>({t,ok:i===q.a})));return c}
function isRight(q,a){if(a===undefined||a===null||a==='')return false;if(q.t==='mc')return q.opts[a]&&q.opts[a].ok;if(q.t==='tf')return a===q.a;return q.a.some(x=>norm(x)===norm(a))}
function ansText(q){return q.t==='mc'?q.opts.find(o=>o.ok).t:q.t==='tf'?(q.a?'صح':'خطأ'):q.a[0]}
function qHTML(q,i,st){const a=st.ans[i],shown=st.mode==='practice'?st.chk[i]:st.done,r=shown&&isRight(q,a);let h=`<div class="qcard ${shown?(r?'qok':'qno'):''}"><b>${i+1}.</b> ${esc(q.q)}`;

if(q.t==='fill')h+=`<div><input class="fin" data-c="fill" data-p="${i}" value="${esc(a||'')}" ${shown?'disabled':''} placeholder="اكتب الإجابة"></div>`;
if(st.mode==='practice'&&!st.chk[i])h+=`<button class="cta sm" data-a="chk" data-p="${i}">تحقق</button>`;
if(shown)h+=`<p class="why">${r?'✅ أحسنت! ':'❌ الإجابة الصحيحة: <b>'+esc(ansText(q))+'</b>. '}${esc(q.why||'')}</p>`;return h+'</div>'}
function startQuiz(title,qs,o){o=o||{};X={title,key:o.key||title,qs:qs.map(prep),ans:[],chk:[],done:false,mode:o.mode||'exam',limit:o.limit||0,t0:Date.now(),back:o.back||{t:'home'},res:null};V={t:'quiz'};render();scrollTo(0,0);if(X.limit)tick()}
let TM=null;function tick(){clearInterval(TM);TM=setInterval(()=>{const e=$('#qt');if(!X||X.done||V.t!=='quiz'){clearInterval(TM);return}const left=X.limit-Math.floor((Date.now()-X.t0)/1000);if(left<=0){clearInterval(TM);submitQuiz()}else if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')},500)}
function submitQuiz(){if(!X||X.done)return;X.done=true;clearInterval(TM);let ok=0;const weak={};X.qs.forEach((q,i)=>{const r=isRight(q,X.ans[i]);if(r)ok++;const a=P.acc[q.lesson]||{r:0,t:0};a.t++;if(r)a.r++;P.acc[q.lesson]=a;if(!r)weak[q.lesson]=1});const pct=Math.round(ok/X.qs.length*100);
const gain=addXP('q:'+X.key,Math.round(pct/5));P.attempts.push({d:today(),title:X.title,key:X.key,ok,n:X.qs.length,pct});P.attempts=P.attempts.slice(-100);if(/^daily/.test(X.key))P.daily[today()]=pct;touch();if(pct===100)badge('perfect');if(/شامل|الصف|الوحدة/.test(X.title)&&pct>=70)badge('exam');checkBadges();save();X.res={ok,pct,gain,weak:Object.keys(weak)};if(pct>=80){confetti();beep(880,.2)}render();scrollTo(0,0)}
function quizHTML(){const st=X;let h=`<button class="back" data-a="go" data-p='${JSON.stringify(st.back)}'>← رجوع</button><div class="pagehead" style="--c:#3D7EB9"><span class="ic">📝</span><h1>${esc(st.title)}</h1></div>`;

if(r.weak.length)h+=`<p>📌 يحتاج مراجعة: ${r.weak.map(x=>`<button class="chip" data-a="go" data-p='{"t":"lesson","id":"${x}"}'>${esc(info(x).l.title)} (ص${LES[x].pages})</button>`).join(' ')}</p>`;

if(st.mode==='exam'&&!st.done)h+=`<button class="cta" data-a="submit">تسليم الاختبار</button>`;
if(st.mode==='practice'&&!st.done)h+=`<button class="cta" data-a="submit">إنهاء وعرض النتيجة</button>`;return h}
function retake(){const k=X.key,t=X.title,m=X.mode,lim=X.limit,b=X.back,ls=[...new Set(X.qs.map(q=>q.lesson))];const pool=bank(l=>ls.includes(l.id));startQuiz(t,sh(pool).slice(0,X.qs.length),{key:k,mode:m,limit:lim,back:b})}

function lessonHTML(){const d=L.d,inf=info(d.id);let h=`<button class="back" data-a="go" data-p='{"t":"grade","g":${d.grade}}'>← الدروس</button><div class="pagehead" style="--c:${G[d.grade][0]}"><span class="ic">${G[d.grade][1]}</span><div><h1>${esc(inf.l.title)}</h1><small>${esc(inf.u.title)} — ص${d.pages}</small></div></div><div class="lprog"><i style="width:${(L.step+1)/ST.length*100}%"></i></div><div class="steps">${ST.map((s,i)=>`<span class="${i===L.step?'on':i<L.step?'ok':''}">${s}</span>`).join('')}</div>`;

function finishLesson(){const d=L.d,n=L.chk.filter(Boolean).length;let ok=0;L.qs.forEach((q,i)=>{if(L.chk[i]&&isRight(q,L.ans[i]))ok++;const a=P.acc[d.id]||{r:0,t:0};if(L.chk[i]){a.t++;if(isRight(q,L.ans[i]))a.r++}P.acc[d.id]=a});const cok=L.chs&&L.chs.chk[0]&&isRight(L.ch,L.chs.ans[0]);if(n<L.qs.length){toast('أكمل أسئلة «اختبر فهمك» أولًا (الخطوة 5)');L.step=4;render();return}

function terms(g){return lessonsOf(g).flatMap(l=>l.terms.map(t=>Object.assign({l:l.id},t)))}
function startGame(k,g,lv){GM={k,g,lv:lv||1,s:0,i:0,t0:Date.now(),over:false};const d=GM;const n=[0,4,6,8][d.lv];

if(k==='memory'){const t=sh(terms(g)).slice(0,n);d.cards=sh(t.flatMap((x,i)=>[{k:i,v:x.ar},{k:i,v:x.en}]));d.open=[];d.got={};d.moves=0}
if(k==='order'){const o=lessonsOf(g).filter(l=>l.order);d.seq=sh(o)[0];d.cur=sh(d.seq.order.steps.map((s,i)=>({s,i})));d.msg=''}
if(k==='spot'){const q=bank(l=>l.grade===g).filter(x=>x.t==='tf');const f=sh(q.filter(x=>!x.a))[0],t=sh(q.filter(x=>x.a)).slice(0,3);d.opts=sh([f,...t]);d.f=f;d.pick=null}
if(k==='time'){d.qs=sh(bank(l=>l.grade===g).filter(x=>x.t!=='fill')).map(prep);d.limit=[0,90,60,45][d.lv];d.ans=null}
if(k==='wheel'){d.sp=0;d.q=null;d.ans=null;d.pool=sh(bank(l=>l.grade===g).filter(x=>x.t!=='fill'))}
if(k==='time')setTimeout(gameTick,300);V={t:'game',k,g,lv:d.lv};render();scrollTo(0,0)}
function gameTick(){if(!GM||GM.k!=='time'||GM.over||V.t!=='game')return;const left=GM.limit-Math.floor((Date.now()-GM.t0)/1000);const e=$('#gt');if(e)e.textContent=left;if(left<=0){endGame(GM.s)}else setTimeout(gameTick,500)}
function endGame(score){GM.over=true;GM.final=score;const day=today();P.games++;const key=GM.k+GM.lv;if(P.gday[key]!==day){P.gday[key]=day;const x=Math.min(15,Math.max(1,score));P.xp+=x;GM.xp=x}touch();checkBadges();save();if(score>0){confetti();beep(880)}render()}

/* ---------- library / companion / teacher ---------- */
function kb(g){const r=[];for(const l of lessonsOf(g)){const t=info(l.id).l.title;l.cards.forEach(c=>r.push({l:l.id,lt:t,title:c.title,text:c.text,page:c.page,tx:norm(c.title+' '+c.text)}));l.terms.forEach(c=>r.push({l:l.id,lt:t,title:c.ar+' ('+c.en+')',text:c.def,page:c.page,tx:norm(c.ar+' '+c.en+' '+c.def)}))}return r}
const SW=new Set(['ما','ماذا','هو','هي','في','من','على','الى','عن','كيف','هل','لماذا','ان','او','ثم','هذا','هذه','لي','اشرح','اشرحلي','وضح','يعني']);
const tok=s=>norm(s).split(/[^\p{L}\p{N}]+/u).map(w=>w.replace(/^ال/,'')).filter(w=>w.length>1&&!SW.has(w));
function search(q,g){const T=tok(q);if(!T.length)return[];return kb(g).map(e=>{let s=0;const et=tok(e.title+' '+e.text);T.forEach(w=>{if(et.some(x=>x===w))s+=2;else if(et.some(x=>x.includes(w)||w.includes(x)))s+=1;if(tok(e.title).some(x=>x===w))s+=2});return{e,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.e)}

function wrender(){const p=$('#wpage');if(!p||!LAB||LAB.id!=='web')return;const u=LAB.hist[LAB.idx];p.innerHTML=wpageHTML(u);p.scrollTop=0;const i=$('#wurl');if(i)i.value=u==='home'?'':wdec(u);const b=$('#wbk'),f=$('#wfw');if(b)b.disabled=LAB.idx<=0;if(f)f.disabled=LAB.idx>=LAB.hist.length-1}
function wchk(){labCheck();wtasks()}
function wvisit(u,how){const F=LAB.flags,host=u.split('/')[0];if(how==='typed'&&u==='www.rcrc.gov.sa')F.rcrc=true;if(how==='link')F.link=true;if(u.startsWith('www.bing.com/search')){F.search=true;const m=/&p=(\d+)/.exec(u);if(m&&+m[1]>=2)F.page2=true}if(/\.(gov|edu)\.sa$/.test(host))F.trusted=true;if(/\.gov\.sa\/news$/.test(u))F.fresh=true;if(u==='home'&&LAB.hist.length>1&&how==='home')F.home=true;wchk()}
function wnorm(u){u=u.trim().replace(/^https?:\/\//i,'').replace(/\/+$/,'');return /^[\x00-\x7f]*$/.test(u)?u.toLowerCase():u}
function wgo(u,how){u=wnorm(u);if(u===''||u==='home')u='home';else if(!/[./]/.test(u)||/\s/.test(u))u='www.bing.com/search?q='+encodeURIComponent(u)+'&p=1';LAB.hist=LAB.hist.slice(0,LAB.idx+1);LAB.hist.push(u);LAB.idx++;wrender();wvisit(u,how)}
Object.assign(A,{wback:()=>{if(LAB.idx>0){LAB.idx--;LAB.flags.back=true;wrender();wchk()}},wfwd:()=>{if(LAB.idx<LAB.hist.length-1){LAB.idx++;LAB.flags.fwd=true;wrender();wchk()}},wref:()=>{const p=$('#wpage');if(p)p.innerHTML='<p class="note" style="padding:1rem">⏳ جارٍ التحميل…</p>';LAB.flags.refresh=true;setTimeout(()=>{wrender();wchk()},350)},wstop:()=>toast('⛔ تم إيقاف تحميل الصفحة'),whome:()=>wgo('home','home'),
wsearch:()=>{const q=($('#wq')||{}).value||'';if(!q.trim()){toast('اكتب كلمة للبحث أولًا');return}wgo(q.trim().includes('.')?q.trim().replace(/\./g,' '):q.trim(),'search')},
wchat:p=>{LAB.chat=p;if(p==='b')LAB.flags.safe=true;wrender();wchk()},
wsel:()=>{const e=$('#wpage .wp');if(!e){toast('لا يوجد نص في هذه الصفحة');return}const r=document.createRange();r.selectNodeContents(e);const g=getSelection();g.removeAllRanges();g.addRange(r)},
wcopy:()=>{const g=getSelection(),t=g.toString().trim(),p=$('#wpage');if(!t||!p||!g.anchorNode||!p.contains(g.anchorNode)){toast('حدّد نصًا من الصفحة أولًا');return}LAB.clip=t;LAB.flags.copy=true;toast('📄 تم نسخ النص');wchk()},
wpaste:()=>{if(!LAB.clip){toast('انسخ نصًا من الصفحة أولًا');return}const n=$('#wnote');n.value+=(n.value?'\n':'')+LAB.clip;LAB.note=n.value;LAB.flags.paste=true;wcite()}});
function wcite(){const n=$('#wnote');if(n){LAB.note=n.value;if(LAB.flags.paste&&/www\.|https?:|\.sa|\.com|\.org/i.test(n.value)&&n.value.length>40)LAB.flags.cite=true}wchk()}
document.addEventListener('keydown',e=>{if(!(V.t==='lab'&&LAB&&LAB.id==='web'))return;if(e.key==='Enter'&&e.target.id==='wurl'){e.preventDefault();wgo(e.target.value,'typed')}if(e.key==='Enter'&&e.target.id==='wq'){e.preventDefault();A.wsearch()}});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-w]');if(t&&V.t==='lab'&&LAB&&LAB.id==='web'){e.preventDefault();wgo(t.dataset.w,'link')}});
document.addEventListener('input',e=>{if(e.target.id==='wnote'&&V.t==='lab'&&LAB&&LAB.id==='web')wcite()});
document.addEventListener('copy',()=>{if(!(V.t==='lab'&&LAB&&LAB.id==='web'))return;const g=getSelection(),p=$('#wpage'),t=g.toString().trim();if(t&&p&&g.anchorNode&&p.contains(g.anchorNode)){LAB.clip=t;LAB.flags.copy=true;wchk()}});
document.addEventListener('scroll',e=>{if(LAB&&LAB.id==='web'&&V.t==='lab'&&e.target&&e.target.id==='wpage'&&e.target.scrollTop>30&&!LAB.flags.scroll){LAB.flags.scroll=true;wchk()}},true);

function dbView(){let r=LAB.rows.filter(x=>Object.entries(LAB.filt).every(([c,v])=>v.includes(x.v[+c])));if(LAB.sort){const c=LAB.sort.c,d=LAB.sort.d==='a'?1:-1,num=DBNUMC.includes(c);r=[...r].sort((a,b)=>d*(num?(+a.v[c])-(+b.v[c]):a.v[c].localeCompare(b.v[c],'ar')))}return r}
function dbTable(){const v=dbView(),f=LAB.fmt;return `<table class="dbt ${f?'fm':''}"><tr><th></th>${DBF.map((n,c)=>`<th>${n}${f?` <button type="button" class="dbarr ${LAB.sort&&LAB.sort.c===c?'on':''} ${LAB.filt[c]?'flt':''}" data-a="dbm" data-p="${c}" aria-label="قائمة ${n}">${LAB.filt[c]?'⏷':'▾'}${LAB.sort&&LAB.sort.c===c?(LAB.sort.d==='a'?'↑':'↓'):''}</button>`:''}</th>`).join('')}</tr>${v.map((r,i)=>`<tr class="${LAB.sel.includes(r.id)?'sel':''}"><th class="dbn" data-dr="${r.id}" title="اضغط لتحديد السجل">${LAB.rows.indexOf(r)+2}</th>${r.v.map(x=>`<td dir="auto">${esc(x)}</td>`).join('')}</tr>`).join('')}</table>${v.length?'':'<p class="note">لا توجد سجلات مطابقة.</p>'}<small class="note">عدد السجلات المعروضة: ${v.length} من ${LAB.rows.length}</small>`}
function dbMenu(){const c=LAB.menu;if(c===null)return '';const num=DBNUMC.includes(c),vals=[...new Set(LAB.rows.map(r=>r.v[c]))].sort((a,b)=>num?a-b:a.localeCompare(b,'ar')),cur=LAB.filt[c]||vals;return `<div class="dbmenu"><b>${DBF[c]}</b><button type="button" class="sm" data-a="dbs" data-p="${c}|a">${num?'فرز من الأصغر إلى الأكبر':'فرز من أ إلى ي'}</button><button type="button" class="sm" data-a="dbs" data-p="${c}|d">${num?'فرز من الأكبر إلى الأصغر':'فرز من ي إلى أ'}</button><button type="button" class="sm" data-a="dbclr" data-p="${c}">إزالة التصفية من «${DBF[c]}»</button><div class="dbvals">${vals.map(x=>`<label><input type="checkbox" class="dbck" value="${esc(x)}" ${cur.includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}</div><button type="button" class="cta sm" data-a="dbok" data-p="${c}">موافق</button> <button type="button" class="sm" data-a="dbx">إلغاء الأمر</button></div>`}
function dbHTML(){return `<div class="wg" style="margin-bottom:.5rem"><button type="button" class="sm" data-a="dbfmt" ${LAB.fmt?'disabled':''}>🎨 تنسيق كجدول</button><b>تحديد السجلات</b>${[['one','فردي'],['rng','نطاق (Shift)'],['multi','متعدد (Ctrl)']].map(([k,n])=>`<button type="button" class="chip ${LAB.mode===k?'on':''}" data-a="dbmode" data-p="${k}">${n}</button>`).join('')}</div><div class="sgw" id="dbt">${dbTable()}</div><div id="dbm">${dbMenu()}</div><h4>➕ إضافة سجل جديد</h4><div class="dbadd">${DBF.map((n,c)=>`<input class="fin dbin" data-c="${c}" placeholder="${n}" aria-label="${n}" dir="auto">`).join('')}<button type="button" class="cta sm" data-a="dbadd">إضافة السجل</button></div>`}
function dbr(){const t=$('#dbt'),m=$('#dbm');if(t)t.innerHTML=dbTable();if(m)m.innerHTML=dbMenu();const b=$('[data-a=dbfmt]');if(b)b.disabled=LAB.fmt;$$('[data-a=dbmode]').forEach(x=>x.classList.toggle('on',x.dataset.p===LAB.mode));labCheck();wtasks()}
function dbSelect(id,e){const v=dbView().map(r=>r.id),mode=(e&&e.shiftKey)?'rng':(e&&(e.ctrlKey||e.metaKey))?'multi':LAB.mode;if(mode==='rng'&&LAB.anchor!==null&&v.includes(LAB.anchor)){const a=v.indexOf(LAB.anchor),b=v.indexOf(id);LAB.sel=v.slice(Math.min(a,b),Math.max(a,b)+1)}else if(mode==='multi'){LAB.sel=LAB.sel.includes(id)?LAB.sel.filter(x=>x!==id):[...LAB.sel,id];LAB.anchor=id}else{LAB.sel=[id];LAB.anchor=id}
const F=LAB.flags,pos=LAB.sel.map(x=>v.indexOf(x)).sort((a,b)=>a-b);if(LAB.sel.length===1)F.one=true;if(pos.length>=2){const cont=pos.every((p,i)=>i===0||p===pos[i-1]+1);if(cont)F.rng=true;else F.multi=true}dbr()}

dbclr:p=>{if(LAB.filt[+p]){delete LAB.filt[+p];if(LAB.flags.f1)LAB.flags.cl=true}LAB.menu=null;dbr()},
