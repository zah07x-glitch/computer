بوظيفتها", "page": 175, "pairs": [["غيّر المظهر إلى", "تغيير المظهر إلى مظهر محدد"], ["المظهر التالي", "الانتقال إلى المظهر التالي"], ["عند نقر العلم الأخضر", "بدء المقطع البرمجي"], ["شغّل الصوت", "تشغيل مؤثر صوتي"]]}, "order": {"title": "رتب خطوات إضافة كائن من المكتبة", "page": 172, "steps": ["اضغط اختيار كائن (Choose a Sprite)", "اختر الفئة مثل حيوانات", "اختر الكائن المطلوب", "يظهر الكائن على المنصة"]}, "qs": [{"t": "mc", "q": "ما الكائن في سكراتش؟", "o": ["نص أو صورة أو رسم يمكن برمجته", "لبنة", "موسيقى فقط"], "a": 0, "why": "ص170.", "lvl": 1}, {"t": "mc", "q": "كم طريقة لإضافة كائن جديد؟", "o": ["أربع طرق", "طريقة واحدة", "طريقتان"], "a": 0, "why": "ص172.", "lvl": 1}, {"t": "mc", "q": "ماذا تسمى أشكال الكائن المختلفة؟", "o": ["مظاهر", "خلفيات", "أصوات"], "a": 0, "why": "ص174.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تغير المظهر إلى المظهر التالي؟", "o": ["المظهر التالي", "كرر", "انتظر"], "a": 0, "why": "ص175.", "lvl": 1}, {"t": "mc", "q": "أي فئة تحتوي لبنة «عند نقر العلم الأخضر»؟", "o": ["الأحداث", "الصوت", "الحركة"], "a": 0, "why": "ص177.", "lvl": 1}, {"t": "mc", "q": "أي أمر ننفذه لعمل نسخة من الكائن؟", "o": ["مضاعفة (duplicate)", "حذف", "تصدير"], "a": 0, "why": "ص178.", "lvl": 1}, {"t": "mc", "q": "لماذا نستخدم لبنة انتظر بين المظاهر؟", "o": ["لنرى كل مظهر قبل أن يتغير", "لحذف الكائن", "للحفظ"], "a": 0, "why": "ص176.", "lvl": 2}, {"t": "tf", "q": "يبدأ كل مشروع جديد في سكراتش بكائن القطة.", "a": true, "why": "ص171.", "lvl": 1}, {"t": "tf", "q": "يمكن حذف كائن بالضغط على بزر الفأرة الأيمن عليه.", "a": true, "why": "ص171.", "lvl": 1}, {"t": "tf", "q": "لا يمكن إضافة أكثر من كائن واحد في المشروع.", "a": false, "why": "يمكنك إضافة أكثر من كائن (ص173).", "lvl": 1}, {"t": "tf", "q": "لبنة «عند نقر هذا الكائن» تشغل المقطع عند الضغط على الكائن.", "a": true, "why": "ص177.", "lvl": 1}, {"t": "fill", "q": "تسمى المظاهر بالإنجليزية ___.", "a": ["Costumes", "costumes", "Costume"], "why": "ص174.", "lvl": 2}, {"t": "fill", "q": "نضغط بزر الفأرة ___ على الكائن لنختار مضاعفة.", "a": ["الأيمن", "الايمن"], "why": "ص178.", "lvl": 2}], "summary": ["الكائن نص أو صورة أو رسم", "نحذف الكائنات ونضيفها من أربع طرق", "المظاهر تجعل الكائن يتحرك", "الأحداث تبدأ المقطع البرمجي", "المضاعفة تنسخ الكائن"], "challenge": {"text": "تحدي الدرس: اختر لبنة تجعل الديناصور يتحرك عند النقر.", "q": {"t": "mc", "q": "تريد أن يتحرك الكائن عند الضغط عليه. أي لبنة تبدأ بها؟", "o": ["عند نقر هذا الكائن", "انتظر", "اربط"], "a": 0, "why": "ص177.", "lvl": 1}}}, "g5-u4-l3": {"id": "g5-u4-l3", "grade": 5, "pages": "182-192", "lab": null, "intro": {"question": "هل يمكن للكائن أن يسألك سؤالًا ويرد حسب إجابتك؟", "goals": ["أستخدم لبنتي اسأل وأجب", "أستخدم لبنة اربط", "أفهم الشروط والمعاملات الشرطية", "أستخدم لبنة إذا ثم"]}, "cards": [{"title": "لبنات اسأل وأجب", "text": "تعد لبنات «اسأل ( ) وانتظر» (ask and wait) ولبنة «الإجابة» (answer) من فئة الاستشعار (Sensing)، وهي لبنات تُستخدم دائمًا معًا. لبنة اسأل تعرض سؤالًا في مربع إدخال بأسفل المنصة، ثم تُخزّن الإجابة في لبنة الإجابة.", "page": 182}, {"title": "لبنة اربط", "text": "لبنة «اربط» (Join) هي إحدى لبنات المعاملات (Operators) ذات اللون الأخضر، وتستخدم لربط الكلمات أو الأرقام أو القيم في سلسلة. يمكنك كتابة النص أو القيمة التي تريد إظهارها في المربعات البيضاء. تذكر ترك مسافة بعد النص داخل المربع حتى لا تلتصق الكلمات.", "page": 183}, {"title": "إجراء محادثة مع الكائن", "text": "لإجراء محادثة: أضف «عند نقر العلم الأخضر»، ثم «اسأل ( ) وانتظر» واكتب «ما اسمك؟»، ثم «قل ( ) لمدة ( ) ثانية» من الهيئة، ثم «اربط»، واكتب «السلام عليكم» في المربع الأول، وضع لبنة «الإجابة» في الثاني.", "page": 183}, {"title": "الشروط", "text": "يعد اتخاذ القرارات في الحياة أمرًا مهمًا. تُستخدم الشروط في البرمجة للتحقق من القيم واتخاذ القرار بناءً على ما إذا كان الشرط محققًا أم لا.", "page": 185}, {"title": "المعاملات الشرطية في سكراتش", "text": "تستخدم لمقارنة القيم أثناء كتابة الجمل الشرطية. ثلاث لبنات: «أكبر من» (greater than، >)، «أصغر من» (less than، <)، «يساوي» (equal to، =). فإذا تحقق الشرط تكون النتيجة صحيحة وإلا تكون خطأ.", "page": 185}, {"title": "كيف تعمل لبنة إذا ثم الشرطية", "text": "تسمح الجمل الشرطية بالتحكم في سير المقطع البرمجي. لبنة «إذا ( ) ثم» (if then) من فئة التحكم (Control) تتحقق أولًا من الشرط؛ إذا كان الشرط متحققًا تنفذ الأوامر الموجودة بالداخل، وإذا لم يتحقق تتجاهلها.", "page": 186}, {"title": "جرب بنفسك: صباح الخير أيها العالم", "text": "المقطع يسأل عن الساعة ويتحقق هل هي قبل 12 ليقول «صباح الخير أيها العالم». الخطوات: عند نقر العلم الأخضر ثم اسأل «كم الساعة؟» وانتظر، ثم «إذا (الإجابة < 12) ثم»، وداخلها قل «صباح الخير أيها العالم» لمدة 4 ثوان.", "page": 187}, {"title": "قرارات متعددة", "text": "يمكن استخدام أكثر من لبنة إذا ثم؛ مثل: اسأل «ما درجة الحرارة في الخارج؟»، إذا كانت الإجابة أكبر من 20 قل «إنه دافئ»، وإذا كانت أصغر من 45 قل «إنه حار».", "page": 191}], "terms": [{"ar": "اسأل وانتظر", "en": "Ask and wait", "def": "لبنة تعرض سؤالًا وتنتظر الإجابة", "page": 182}, {"ar": "الإجابة", "en": "Answer", "def": "لبنة تخزن ما كتبه المستخدم", "page": 182}, {"ar": "اربط", "en": "Join", "def": "لبنة تربط كلمات أو قيمًا", "page": 183}, {"ar": "الشرط", "en": "Condition", "def": "تحقق من قيمة لاتخاذ قرار", "page": 185}, {"ar": "إذا ثم", "en": "If then", "def": "لبنة تنفذ الأوامر إذا تحقق الشرط", "page": 186}, {"ar": "الاستشعار", "en": "Sensing", "def": "فئة لبنات تحس بالمحيط والإدخال", "page": 182}], "match": {"title": "طابق اللبنة بوظيفتها", "page": 185, "pairs": [["أكبر من", "هل القيمة الأولى أكبر؟"], ["أصغر من", "هل القيمة الأولى أصغر؟"], ["يساوي", "هل القيمتان متساويتان؟"], ["إذا ثم", "تنفيذ الأوامر إذا تحقق الشرط"]]}, "order": {"title": "رتب لبنات المحادثة", "page": 183, "steps": ["عند نقر العلم الأخضر", "اسأل ما اسمك؟ وانتظر", "قل (اربط السلام عليكم + الإجابة)"]}, "qs": [{"t": "mc", "q": "من أي فئة لبنتا اسأل والإجابة؟", "o": ["الاستشعار", "الحركة", "الصوت"], "a": 0, "why": "ص182.", "lvl": 1}, {"t": "mc", "q": "أين تخزن الإجابة؟", "o": ["في لبنة الإجابة", "في الكائن", "في المظهر"], "a": 0, "why": "ص182.", "lvl": 1}, {"t": "mc", "q": "ما وظيفة لبنة اربط؟", "o": ["ربط الكلمات والقيم في سلسلة", "حذف الكائن", "تشغيل الصوت"], "a": 0, "why": "ص183.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تقارن القيمتين وتعيد صحيح أو خطأ؟", "o": ["المعاملات الشرطية", "انتظر", "المظهر التالي"], "a": 0, "why": "ص185.", "lvl": 1}, {"t": "mc", "q": "من أي فئة لبنة إذا ثم؟", "o": ["التحكم", "الاستشعار", "الصوت"], "a": 0, "why": "ص186.", "lvl": 1}, {"t": "mc", "q": "ماذا تفعل لبنة إذا ثم إن لم يتحقق الشرط؟", "o": ["تتجاهل الأوامر الداخلية", "تحذف الكائن", "تنفذ الأوامر"], "a": 0, "why": "ص186.", "lvl": 2}, {"t": "tf", "q": "لبنة الإجابة تخزن آخر ما كتبه المستخدم.", "a": true, "why": "ص182.", "lvl": 1}, {"t": "tf", "q": "لبنة «أكبر من» تُرجع صحيحًا إذا كانت القيمة الأولى أكبر.", "a": true, "why": "ص185.", "lvl": 1}, {"t": "tf", "q": "نكتب لبنة إذا ثم من فئة الحركة.", "a": false, "why": "من فئة التحكم (ص186).", "lvl": 1}, {"t": "tf", "q": "نترك مسافة بعد النص في لبنة اربط حتى لا تلتصق الكلمات.", "a": true, "why": "ص183.", "lvl": 2}, {"t": "fill", "q": "لبنة ___ تربط كلمتين معًا في سكراتش.", "a": ["اربط", "Join", "join"], "why": "ص183.", "lvl": 2}, {"t": "fill", "q": "الرمز > يعني ___ من.", "a": ["أكبر", "اكبر"], "why": "ص185.", "lvl": 2}], "summary": ["اسأل وانتظر ثم الإجابة", "اربط تدمج الكلمات", "الشرط: أكبر من، أصغر من، يساوي", "إذا ثم تنفذ الأوامر عند تحقق الشرط"], "challenge": {"text": "تحدي الدرس: قرر ماذا يقول الكائن حسب الإجابة.", "q": {"t": "mc", "q": "الإجابة 8 والشرط (الإجابة < 12). ماذا يحدث؟", "o": ["يتحقق الشرط وتنفذ الأوامر", "لا يتحقق", "يحذف الكائن"], "a": 0, "why": "ص187.", "lvl": 1}}}, "g5-u4-l4": {"id": "g5-u4-l4", "grade": 5, "pages": "193-206", "lab": "scratch", "intro": {"question": "كيف تجعل كائنًا يتحرك باستمرار ويرتد عن الحافة ويتحرك بمفاتيح لوحة المفاتيح؟", "goals": ["أستخدم لبنة كرر باستمرار", "أستخدم ارتد إذا كنت عند الحافة", "أحدد الاتجاه بلبنة اتجه نحو الاتجاه", "أتحكم بالكائن بلوحة المفاتيح", "أضبط نمط الدوران"]}, "cards": [{"title": "لبنات التكرار في سكراتش", "text": "يمكن تكرار تنفيذ الأوامر بدلًا من إعادة كتابتها. من أنواع التكرار: كرر ( ) مرة (repeat)، وكرر باستمرار (forever)، وكرر حتى (repeat until). ولبنات التكرار من فئة التحكم البرتقالية.", "page": 193}, {"title": "لبنة كرر باستمرار", "text": "في لبنة كرر باستمرار (forever) تُنفَّذ الأوامر الموجودة بداخلها في تكرار لا نهاية له، ولا يوجد بعدها لبنات لأن هذه اللبنة لا تحتوي على نتوء في الأسفل. لإيقافها اضغط علامة التوقف الحمراء (stop sign) أو استخدم لبنة أوقف (stop).", "page": 193}, {"title": "مثال: حركة باستمرار", "text": "اجعل القطة تتحرك 10 خطوات باستمرار ولا تتوقف عن الحركة إلا إذا ضغطت على علامة التوقف أو إذا خرجت من المنصة.", "page": 194}, {"title": "لبنة ارتد إذا كنت عند الحافة", "text": "من فئة الحركة (Motion)، تفحص هذه اللبنة هل لمس الكائن حدود الشاشة، وعندما يلمسها يرتد في الاتجاه المعاكس ويستكمل حركته. أضفها داخل كرر باستمرار حتى تعيد القطة الحركة عند كل حافة.", "page": 195}, {"title": "لبنة اتجه نحو الاتجاه", "text": "لبنة «اتجه نحو الاتجاه ( )» (point in direction) من فئة الحركة، توجه الكائن في اتجاه معين. القيمة الافتراضية لها 90 درجة، ويمكن اختيار قيمة من 0-360 أو من -180 إلى 180. المقادير: 0 لأعلى، 90 لليمين، 180 لأسفل، -90 لليسار.", "page": 196}, {"title": "لبنة مفتاح ( ) مضغوط؟", "text": "لبنة «مفتاح ( ) مضغوط؟» (key pressed?) من فئة الاستشعار، تتحقق مما إذا تم الضغط على مفتاح معين في لوحة المفاتيح؛ فتعطي النتيجة «صحيحة» إذا تم ضغط المفتاح و«خطأ» إذا لم يتم ضغطه. المفتاح الافتراضي هو المسافة.", "page": 198}, {"title": "التحكم بالأسهم", "text": "لتحريك الكائن يمينًا: إذا مفتاح السهم الأيمن مضغوط ← اتجه نحو الاتجاه 90 ← تحرك 10 خطوات. وبالمثل لليسار نستخدم -90. ولأعلى 0 ولأسفل 180، مع وضع كل شرط داخل كرر باستمرار.", "page": 199}, {"title": "لبنة اجعل نمط الدوران", "text": "لبنة «اجعل نمط الدوران ( )» (set rotation style) من فئة الحركة، وفيها ثلاثة أنماط: «في جميع الاتجاهات» (all around)، و«يسار - يمين» (left-right) يعكس الكائن فقط عند التحرك لليمين أو اليسار، و«لا تدور» (don't rotate) فلا يدور الكائن إطلاقًا.", "page": 201}], "terms": [{"ar": "كرر باستمرار", "en": "Forever", "def": "تكرار الأوامر دون نهاية", "page": 193}, {"ar": "ارتد إذا كنت عند الحافة", "en": "If on edge, bounce", "def": "ارتداد الكائن عن حافة المنصة", "page": 195}, {"ar": "اتجه نحو الاتجاه", "en": "Point in direction", "def": "تحديد زاوية اتجاه الكائن", "page": 196}, {"ar": "مفتاح مضغوط؟", "en": "Key pressed?", "def": "تحقق من الضغط على مفتاح", "page": 198}, {"ar": "نمط الدوران", "en": "Rotation style", "def": "طريقة دوران الكائن", "page": 201}, {"ar": "التحكم", "en": "Control", "def": "فئة البنات البرتقالية للتكرار والشروط", "page": 193}], "match": {"title": "طابق الزاوية بالاتجاه", "page": 196, "pairs": [["0", "لأعلى"], ["90", "لليمين"], ["180", "لأسفل"], ["-90", "لليسار"]]}, "order": {"title": "رتب لبنات حركة الكائن يمينًا", "page": 199, "steps": ["عند نقر العلم الأخضر", "كرر باستمرار", "إذا مفتاح السهم الأيمن مضغوط", "اتجه نحو الاتجاه 90 ثم تحرك 10 خطوات"]}, "qs": [{"t": "mc", "q": "ماذا تفعل لبنة كرر باستمرار؟", "o": ["تكرر الأوامر بلا نهاية", "تنفذ الأوامر مرة", "تحذف الكائن"], "a": 0, "why": "ص193.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تجعل الكائن يرتد عند حافة المنصة؟", "o": ["ارتد إذا كنت عند الحافة", "انتظر", "قل"], "a": 0, "why": "ص195.", "lvl": 1}, {"t": "mc", "q": "ما الزاوية التي تجعل الكائن يتجه لأعلى؟", "o": ["0", "90", "180"], "a": 0, "why": "ص196.", "lvl": 1}, {"t": "mc", "q": "ما الزاوية الافتراضية للبنة اتجه؟", "o": ["90", "0", "180"], "a": 0, "why": "ص196.", "lvl": 1}, {"t": "mc", "q": "من أي فئة لبنة مفتاح مضغوط؟", "o": ["الاستشعار", "الصوت", "الهيئة"], "a": 0, "why": "ص198.", "lvl": 1}, {"t": "mc", "q": "أي نمط دوران لا يجعل الكائن يدور إطلاقًا؟", "o": ["لا تدور", "في جميع الاتجاهات", "يسار - يمين"], "a": 0, "why": "ص201.", "lvl": 2}, {"t": "mc", "q": "كيف نوقف لبنة كرر باستمرار؟", "o": ["علامة التوقف الحمراء", "الحفظ", "الحذف"], "a": 0, "why": "ص193.", "lvl": 2}, {"t": "tf", "q": "لبنة كرر باستمرار لا تحتوي على نتوء في الأسفل.", "a": true, "why": "ص193.", "lvl": 1}, {"t": "tf", "q": "لبنة ارتد إذا كنت عند الحافة من فئة التحكم.", "a": false, "why": "من فئة الحركة (ص195).", "lvl": 1}, {"t": "tf", "q": "لبنة مفتاح مضغوط تعطي صحيحًا إذا ضغط المفتاح.", "a": true, "why": "ص198.", "lvl": 1}, {"t": "fill", "q": "الزاوية ___ تجعل الكائن يتجه لأسفل.", "a": ["180"], "why": "ص196.", "lvl": 2}, {"t": "fill", "q": "نمط الدوران «يسار - يمين» بالإنجليزية left-___.", "a": ["right", "Right"], "why": "ص201.", "lvl": 2}], "summary": ["كرر باستمرار تكرر الأوامر بلا نهاية", "ارتد عند الحافة من فئة الحركة", "الاتجاه بالدرجات: 0 أعلى، 90 يمين، 180 أسفل، -90 يسار", "مفتاح مضغوط للتحكم باللوحة", "نمط الدوران: جميع الاتجاهات، يسار-يمين، لا تدور"], "challenge": {"text": "تحدي الدرس: اجعل الكرة تتحرك بمفاتيح الأسهم.", "q": {"t": "mc", "q": "تريد تحريك الكائن لأعلى بالسهم. أي اتجاه تستخدم؟", "o": ["0", "90", "180"], "a": 0, "why": "ص196.", "lvl": 1}}}, "g5-u4-l5": {"id": "g5-u4-l5", "grade": 5, "pages": "207-216", "lab": "scratch", "intro": {"question": "كيف يتحدث كائنان مع بعضهما في الرسوم المتحركة؟", "goals": ["أفهم الأحداث في سكراتش", "أستخدم لبنتي بث وعندما أتلقى", "أعرف الرسم المتحرك وإرشاداته", "أنشئ حوارًا بين كائنين برسالة بث"]}, "cards": [{"title": "الأحداث في سكراتش", "text": "يتلقى الحاسب إشارة عند تحريك الفأرة أو الضغط على أحد مفاتيح لوحة المفاتيح، ويسمى هذا بالحدث. ويمكن لبرامج سكراتش توجيه الحاسب للقيام بعمل معين بناءً على أي حدث، ومن الأحداث المهمة رسائل البث والاستقبال من خلال لبنات البث (Broadcast).", "page": 207}, {"title": "رسائل البث والاستقبال", "text": "البث هو رسالة يتم إرسالها من خلال برنامج سكراتش لتنشيط المقاطع البرمجية عبر لبنة الأحداث (Event) المطابقة. يتم إرسال رسائل البث من خلال لبنات «بث» (Broadcast)، ويتم تلقيها عبر لبنة «عندما أتلقى ( )» (when I receive).", "page": 207}, {"title": "لبنات البث الثلاث", "text": "«عندما أتلقى»: يتم تفعيل اللبنة وتنفيذ باقي المقطع البرمجي بمجرد استلام الرسالة. «بث»: ترسل رسالة إلى المقاطع البرمجية الأخرى ليتم تنفيذ الأمر. «بث وانتظر»: ترسل الرسالة وتوقف مقطعها مؤقتًا حتى تكتمل المقاطع الخاصة بلبنة عندما أتلقى.", "page": 207}, {"title": "ما هو الرسم المتحرك؟", "text": "الرسم المتحرك هو وسيط ديناميكي يعالج الصور أو الكائنات لتظهر كصور متحركة، وعادة يتحقق عبر سلسلة سريعة من الصور المتسلسلة التي تختلف قليلًا. تعتبر عمليات البث مفيدة في الألعاب والرسوم المتحركة.", "page": 208}, {"title": "إرشادات الرسوم المتحركة", "text": "1) تعكس الخلفية والكائنات مفهوم الرسوم المتحركة. 2) تعكس مظاهر الكائنات مشاعرها وسلوكها. 3) يكون الحوار واقعيًا وممتعًا. 4) تنقل الرسائل بدقة. 5) تخصيص وقت كافٍ لفاعلية كلام الكائنات حتى يتمكن الجمهور من قراءتها. 6) تعتبر الحركة الطبيعية جزءًا مهمًا من الرسوم المتحركة.", "page": 208}, {"title": "مشروع رسوم متحركة في الفضاء", "text": "أنشئ مشروعًا جديدًا وأطلق عليه «رسوم متحركة في الفضاء»، واحذف كائن القطة وأضف خلفية Space City 1 والكائنين Pico Walking وNano. اختر Pico Walking لأنه يتضمن مظاهر تحاكي المشي، وNano لأن مظاهره تعكس مجموعة متنوعة من المشاعر.", "page": 209}, {"title": "بدء الحوار بين كائنين", "text": "لإنشاء حوار نستخدم لبنة «اسأل ( ) وانتظر». لكن هنا يتحاور كائنان عن طريق بث الرسائل. الكائن Pico Walking يبدأ بالمشي ثم يقول «السلام عليكم، لماذا أراك حزينًا؟» ويستخدم لبنة «بث رسالة 1 وانتظر».", "page": 210}, {"title": "رد الكائن Nano", "text": "للكائن Nano: من فئة الأحداث أضف «عندما أتلقى الرسالة 1» ثم من الهيئة لبنة «قل ( ) لمدة ( ) ثانية» واكتب «أريد الذهاب في رحلة لاستكشاف الفضاء لكن لا أحد يريد أن يرافقني». ويمكنك إنشاء رسالة جديدة بالضغط على «رسالة جديدة» وكتابة اسمها.", "page": 211}], "terms": [{"ar": "الحدث", "en": "Event", "def": "إشارة يتلقاها الحاسب مثل نقر الفأرة", "page": 207}, {"ar": "بث", "en": "Broadcast", "def": "إرسال رسالة إلى المقاطع البرمجية", "page": 207}, {"ar": "عندما أتلقى", "en": "When I receive", "def": "لبنة تبدأ مقطعًا عند استقبال رسالة", "page": 207}, {"ar": "بث وانتظر", "en": "Broadcast and wait", "def": "يرسل الرسالة وينتظر انتهاء المقاطع", "page": 207}, {"ar": "الرسم المتحرك", "en": "Animation", "def": "صور متتالية تظهر كأنها تتحرك", "page": 208}], "match": {"title": "طابق اللبنة بوظيفتها", "page": 207, "pairs": [["بث", "إرسال رسالة"], ["عندما أتلقى", "بدء مقطع عند الاستقبال"], ["بث وانتظر", "إرسال ثم انتظار الانتهاء"], ["عند نقر العلم الأخضر" : 5, "pages": "217-224", "lab": "scratch", "intro": {"question": "كيف يعرف الكائن أنه لمس لونًا أو لمس مؤشر الفأرة؟", "goals": ["أتعرف لبنات الاستشعار", "أستخدم لبنة ملامس لـ", "أستخدم لبنة ملامس للون", "أتحقق من ملامسة مؤشر الفأرة"]}, "cards": [{"title": "لبنات الاستشعار", "text": "يوفر سكراتش لبنات استشعار يمكنك التحقق بها: هل الكائن يلامس شيئًا ما في المنصة؟ مثل الكائنات الأخرى أو مؤشر الفأرة أو حافة الشاشة أو لونًا محددًا. إذا كان الكائن يلامس الكائن المحدد فإن اللبنة تعود بالنتيجة صحيحة وإلا فإنها ترجع خطأ. ويمكن العثور عليها في فئة الاستشعار (Sensing).", "page": 217}, {"title": "لبنة ملامس لـ", "text": "لبنة «ملامس لـ ( )؟» (touching) تتحقق مما إذا كان الكائن يلامس مؤشر الفأرة أو حافة الشاشة أو كائنًا آخر.", "page": 217}, {"title": "لبنة ملامس للون", "text": "لبنة «ملامس للون ( )؟» (touching color) تتحقق مما إذا كان الكائن يلامس لونًا محددًا. ولبنة «اللون ( ) ملامس للون ( )؟» (color is touching) تتحقق مما إذا كان لون الكائن يلامس لونًا آخر.", "page": 217}, {"title": "ملامسة اللون: مقطع القطة والبالون", "text": "لإنشاء مقطع باستخدام لبنات الملامسة: «عند نقر العلم الأخضر» ثم «كرر باستمرار» ثم «تحرك 5 خطوات» ثم «إذا» من التحكم، ثم «ملامس لـ Balloon1؟» من الاستشعار، ثم «قل لمسته لمدة 2 ثانية» من الهيئة.", "page": 218}, {"title": "طرق متعددة للحصول على النتيجة نفسها", "text": "في البرمجة يمكنك الحصول على نفس النتيجة بطرق مختلفة. فالقطة تتحرك وعندما تلمس البالون تقول «لقد لمسته». والمقاطع البرمجية السابقة لها نفس النتيجة بطرق مختلفة.", "page": 220}, {"title": "التحقق من ملامسة مؤشر الفأرة", "text": "يمكن استخدام لبنات الملامسة لتتحقق من ملامسة الكائن لمؤشر الفأرة. ستنشئ لعبة تحاول فيها لمس كائن Gobo بمؤشر الفأرة؛ وفي كل مرة يلامس فيها مؤشر الفأرة الكائن Gobo ينتقل إلى موضع مختلف. تحتاج أولًا إلى إنشاء مشروع جديد وإضافة خلفية.", "page": 221}, {"title": "لبنة اذهب إلى", "text": "لبنة «اذهب إلى ( )» (go to) من لبنات الحركة، تعين للكائن موضع الكائن المحدد، ويمكن أن يكون الموضع هو موضع مؤشر الفأرة، أو موضعًا عشوائيًا أو كائنًا آخر موجودًا بالمنصة. كل مرة يلامس فيها المؤشر الكائن، ينتقل الكائن إلى موضع عشوائي.", "page": 222}, {"title": "Gobo يتكلم ويتبع الحركة", "text": "في بداية المقطع سيقول Gobo عبارة «استخدم الفأرة للإمساك بي» لمدة 2 ثانية. ثم نغيّر مظاهر الكائن بلبنة «غيّر المظهر إلى». ولجعل Gobo يتبع مؤشر الفأرة نضع «اذهب إلى مؤشر الفأرة» داخل إذا ملامس لمؤشر الفأرة.", "page": 222}], "terms": [{"ar": "الاستشعار", "en": "Sensing", "def": "فئة لبنات الاستشعار", "page": 217}, {"ar": "ملامس لـ", "en": "Touching", "def": "هل يلامس الكائن شيئًا؟", "page": 217}, {"ar": "ملامس للون", "en": "Touching color", "def": "هل يلامس الكائن لونًا محددًا؟", "page": 217}, {"ar": "اذهب إلى", "en": "Go to", "def": "ينقل الكائن إلى موضع محدد", "page": 222}, {"ar": "مؤشر الفأرة", "en": "Mouse pointer", "def": "سهم الفأرة على الشاشة", "page": 221}], "match": {"title": "طابق اللبنة بوظيفتها", "page": 217, "pairs": [["ملامس لـ", "هل يلامس الكائن الفأرة أو الحافة أو كائنًا؟"], ["ملامس للون", "هل يلامس الكائن لونًا محددًا؟"], ["اذهب إلى", "نقل الكائن إلى موضع"], ["إذا ثم", "تنفيذ الأوامر عند تحقق الشرط"]]}, "order": {"title": "رتب لبنات مقطع ملامسة البالون", "page": 218, "steps": ["عند نقر العلم الأخضر", "كرر باستمرار", "تحرك 5 خطوات", "إذا ملامس لـ Balloon1 فقل لمسته"]}, "qs": [{"t": "mc", "q": "من أي فئة لبنات الملامسة؟", "o": ["الاستشعار", "الصوت", "الحركة"], "a": 0, "why": "ص217.", "lvl": 1}, {"t": "mc", "q": "ماذا تتحقق لبنة ملامس لـ؟", "o": ["ملامسة الكائن لشيء ما", "لون الخلفية فقط", "اسم الكائن"], "a": 0, "why": "ص217.", "lvl": 1}, {"t": "mc", "q": "ماذا تتحقق لبنة ملامس للون؟", "o": ["ملامسة لون محدد", "حجم الكائن", "الصوت"], "a": 0, "why": "ص217.", "lvl": 1}, {"t": "mc", "q": "ماذا تعيد لبنة الاستشعار إذا لم تتحقق الملامسة؟", "o": ["خطأ", "صحيحة", "كلاهما"], "a": 0, "why": "ص217.", "lvl": 1}, {"t": "mc", "q": "أي لبنة تنقل Gobo إلى موضع عشوائي؟", "o": ["اذهب إلى", "قل", "انتظر"], "a": 0, "why": "ص222.", "lvl": 1}, {"t": "mc", "q": "لبنة اذهب إلى من أي فئة؟", "o": ["الحركة", "الصوت", "الأحداث"], "a": 0, "why": "ص222.", "lvl": 2}, {"t": "tf", "q": function checkBadges(){const n=Object.keys(P.done).length;if(n>=1)badge('first');if(n>=3)badge('three');if(streak()>=3)badge('streak3');if(P.games>=5)badge('games');if(Object.keys(P.labs).length)badge('lab')}
function addXP(key,pts){const o=P.best[key]||0;const gain=Math.max(0,pts-o);if(gain>0){P.best[key]=pts;P.xp+=gain}return gain}
/* ---------- question bank ---------- */
function bank(f){const r=[];for(const l of Object.values(LES)){if(f&&!f(l))continue;l.qs.forEach((q,i)=>r.push(Object.assign({id:l.id+':'+i,lesson:l.id},q)));if(l.challenge&&l.challenge.q)r.push(Object.assign({id:l.id+':c',lesson:l.id},l.challenge.q))}return r}
function prep(q){const c=Object.assign({},q);if(q.t==='mc')c.opts=sh(q.o.map((t,i)=>({t,ok:i===q.a})));return c}
function isRight(q,a){if(a===undefined||a===null||a==='')return false;if(q.t==='mc')return q.opts[a]&&q.opts[a].ok;if(q.t==='tf')return a===q.a;return q.a.some(x=>norm(x)===norm(a))}
function ansText(q){return q.t==='mc'?q.opts.find(o=>o.ok).t:q.t==='tf'?(q.a?'صح':'خطأ'):q.a[0]}
function qHTML(q,i,st){const a=st.ans[i],shown=st.mode==='practice'?st.chk[i]:st.done,r=shown&&isRight(q,a);let h=`<div class="qcard ${shown?(r?'qok':'qno'):''}"><b>${i+1}.</b> ${esc(q.q)}`;
if(q.t==='mc')h+=q.opts.map((o,k)=>`<button class="opt ${a===k?'sel':''} ${shown&&o.ok?'right':''} ${shown&&a===k&&!o.ok?'wrong':''}" ${shown?'disabled':''} data-a="ans" data-p="${i},${k}">${esc(o.t)}</button>`).join('');
if(q.t==='tf')h+=[true,false].map(v=>`<button class="opt ${a===v?'sel':''} ${shown&&q.a===v?'right':''} ${shown&&a===v&&q.a!==v?'wrong':''}" ${shown?'disabled':''} data-a="ans" data-p="${i},${v}">${v?'صح':'خطأ'}</button>`).join('');
if(q.t==='fill')h+=`<div><input class="fin" data-c="fill" data-p="${i}" value="${esc(a||'')}" ${shown?'disabled':''} placeholder="اكتب الإجابة"></div>`;
if(st.mode==='practice'&&!st.chk[i])h+=`<button class="cta sm" data-a="chk" data-p="${i}">تحقق</button>`;
if(shown)h+=`<p class="why">${r?'✅ أحسنت! ':'❌ الإجابة الصحيحة: <b>'+esc(ansText(q))+'</b>. '}${esc(q.why||'')}</p>`;return h+'</div>'}
function startQuiz(title,qs,o){o=o||{};X={title,key:o.key||title,qs:qs.map(prep),ans:[],chk:[],done:false,mode:o.mode||'exam',limit:o.limit||0,t0:Date.now(),back:o.back||{t:'home'},res:null};V={t:'quiz'};render();scrollTo(0,0);if(X.limit)tick()}
let TM=null;function tick(){clearInterval(TM);TM=setInterval(()=>{const e=$('#qt');if(!X||X.done||V.t!=='quiz'){clearInterval(TM);return}const left=X.limit-Math.floor((Date.now()-X.t0)/1000);if(left<=0){clearInterval(TM);submitQuiz()}else if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')},500)}
function submitQuiz(){if(!X||X.done)return;X.done=true;clearInterval(TM);let ok=0;const weak={};X.qs.forEach((q,i)=>{const r=isRight(q,X.ans[i]);if(r)ok++;const a=P.acc[q.lesson]||{r:0,t:0};a.t++;if(r)a.r++;P.acc[q.lesson]=a;if(!r)weak[q.lesson]=1});const pct=Math.round(ok/X.qs.length*100);
const gain=addXP('q:'+X.key,Math.round(pct/5));P.attempts.push({d:today(),title:X.title,key:X.key,ok,n:X.qs.length,pct});P.attempts=P.attempts.slice(-100);if(/^daily/.test(X.key))P.daily[today()]=pct;touch();if(pct===100)badge('perfect');if(/شامل|الصف|الوحدة/.test(X.title)&&pct>=70)badge('exam');checkBadges();save();X.res={ok,pct,gain,weak:Object.keys(weak)};if(pct>=80){confetti();beep(880,.2)}render();scrollTo(0,0)}
function quizHTML(){const st=X;let h=`<button class="back" data-a="go" data-p='${JSON.stringify(st.back)}'>← رجوع</button><div class="pagehead" style="--c:#3D7EB9"><span class="ic">📝</span><h1>${esc(st.title)}</h1></div>`;
if(st.limit&&!st.done)h+=`<p class="note">⏱️ الوقت المتبقي: <b id="qt">--</b></p>`;
if(st.mode==='exam'&&!st.done)h+=`<p class="note">وضع التقويم: لن تظهر الإجابات الصحيحة قبل تسليم الاختبار.</p>`;
if(st.done&&st.res){const r=st.res;h+=`<div class="panel res"><h2>نتيجتك: ${r.ok} من ${st.qs.length} (${r.pct}%)</h2><p>${r.pct>=90?'🌟 ممتاز!':r.pct>=70?'👏 جيد جدًا':'💪 حاول مرة أخرى، أنت تتحسن'}${r.gain?` — حصلت على +${r.gain} XP`:''}</p>`;
const strong=[...new Set(st.qs.filter((q,i)=>isRight(q,st.ans[i])).map(q=>q.lesson))].filter(x=>!r.weak.includes(x));
if(strong.length)h+=`<p>✅ نقاط القوة: ${strong.map(x=>esc(info(x).l.title)).join('، ')}</p>`;
if(r.weak.length)h+=`<p>📌 يحتاج مراجعة: ${r.weak.map(x=>`<button class="chip" data-a="go" data-p='{"t":"lesson","id":"${x}"}'>${esc(info(x).l.title)} (ص${LES[x].pages})</button>`).join(' ')}</p>`;
h+=`<div class="acts"><button data-a="retake">إعادة الاختبار بأسئلة جديدة</button></div></div>`}
h+=st.qs.map((q,i)=>qHTML(q,i,st)).join('');
if(st.mode==='exam'&&!st.done)h+=`<button class="cta" data-a="submit">تسليم الاختبار</button>`;
if(st.mode==='practice'&&!st.done)h+=`<button class="cta" data-a="submit">إنهاء وعرض النتيجة</button>`;return h}
function retake(){const k=X.key,t=X.title,m=X.mode,lim=X.limit,b=X.back,ls=[...new Set(X.qs.map(q=>q.lesson))];const pool=bank(l=>ls.includes(l.id));startQuiz(t,sh(pool).slice(0,X.qs.length),{key:k,mode:m,limit:lim,back:b})}
/* ---------- lessons ---------- */
function openLesson(id){const d=LES[id];L={d,step:0,cs:{},score:0,ci:0,mi:{},right:sh(d.match.pairs.map(x=>x[1])),sel:null,found:{},oi:0,qs:sh(d.qs).slice(0,6).map(prep),ans:[],chk:[]};V={t:'lesson',id};P.last=id;save();render();scrollTo(0,0)}

const ST=['التهيئة','تعلّم','شاهد واكتشف','جرّب بنفسك','اختبر فهمك','الملخص','تحدي الدرس'];
function lessonHTML(){const d=L.d,inf=info(d.id);let h=`<button class="back" data-a="go" data-p='{"t":"grade","g":${d.grade}}'>← الدروس</button><div class="pagehead" style="--c:${G[d.grade][0]}"><span class="ic">${G[d.grade][1]}</span><div><h1>${esc(inf.l.title)}</h1><small>${esc(inf.u.title)} — ص${d.pages}</small></div></div><div class="lprog"><i style="width:${(L.step+1)/ST.length*100}%"></i></div><div class="steps">${ST.map((s,i)=>`<span class="${i===L.step?'on':i<L.step?'ok':''}">${s}</span>`).join('')}</div>`;
if(L.step===0)h+=`<section class="panel"><h2>${esc(d.intro.question)}</h2><h3>أهداف الدرس</h3><ul>${d.intro.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></section>`;
if(L.step===1)h+='<section>'+d.cards.map((c,i)=>`<article class="tile"><h3>${esc(c.title)} <small>(ص${c.page})</small></h3><p>${esc(c.text)}</p><button data-a="speak" data-p="${i}">🔊 اقرأ</button></article>`).join('')+'</section>';
if(L.step===2){h+=`<section class="panel"><h2>اضغط على المصطلحات واكتشفها</h2><div>${d.terms.map((t,i)=>`<button class="chip ${L.found[i]?'on':''}" data-a="term" data-p="${i}">${esc(t.ar)}</button>`).join('')}</div>`;const f=L.lastTerm;if(f!==undefined){const t=d.terms[f];h+=`<div class="tile"><h3>${esc(t.ar)} <small dir="ltr">${esc(t.en)}</small></h3><p>${esc(t.def)} <small>(ص${t.page})</small></p></div>`}h+=`<p class="note">اكتشفت ${Object.values(L.found).filter(Boolean).length} من ${d.terms.length} مصطلحًا</p>`;
if(d.order){h+=`<h3>${esc(d.order.title.replace('رتب خطوات','خطوات'))} <small>(ص${d.order.page})</small></h3><ol>${d.order.steps.slice(0,L.oi+1).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${L.oi<d.order.steps.length-1?'<button class="cta sm" data-a="nextstep">الخطوة التالية ▶</button>':'<p class="good">انتهت الخطوات 🎉</p>'}`}h+='</section>'}
if(L.step===3){const ok=d.match.pairs.filter(([a,b])=>L.mi[a]===b).length;h+=`<section class="panel"><h2>${esc(d.match.title)} <small>(ص${d.match.page})</small></h2>`+d.match.pairs.map(([a,b],i)=>`<div class="pair"><b>${esc(a)}</b><select data-c="mi" data-p="${i}"><option value="">اختر</option>${L.right.map(r=>`<option ${L.mi[a]===r?'selected':''}>${esc(r)}</option>`).join('')}</select> ${L.mi[a]?(L.mi[a]===b?'✅':'❌ حاول مرة أخرى'):''}</div>`).join('')+(ok===d.match.pairs.length?'<p class="good">أحسنت! أتممت المطابقة 🎉</p>':'');if(d.lab)h+=`<p><button class="cta" data-a="go" data-p='{"t":"lab","id":"${d.lab}"}'>🧪 جرّب في مختبر المهارات</button></p>`;h+='</section>'}
if(L.step===4){h+='<section>';L.qs.forEach((q,i)=>h+=qHTML(q,i,{ans:L.ans,chk:L.chk,mode:'practice'}));h+=`<p class="note">أجبت عن ${L.chk.filter(Boolean).length} من ${L.qs.length}</p></section>`}
if(L.step===5)h+=`<section class="panel"><h2>ملخص الدرس</h2><ul>${d.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><h3>خريطة ذهنية</h3>${mind(d)}<p><button data-a="go" data-p='{"t":"lib","lb":"flash","l":"${d.id}"}'>🗂️ بطاقات المراجعة</button> <button data-a="lessonTest">📝 اختبار الدرس</button></p></section>`;
if(L.step===6){const c=d.challenge,q=L.ch||(L.ch=prep(c.q));L.chs=L.chs||{ans:[],chk:[],mode:'practice'};h+=`<section class="panel"><h2>${esc(c.text)}</h2>${qHTML(q,0,L.chs)}<button class="cta" data-a="finish">إنهاء الدرس وحفظ التقدم</button></section>`}
h+=`<div class="acts"><button ${L.step===0?'disabled':''} data-a="lstep" data-p="-1">السابق</button><button ${L.step===6?'disabled':''} data-a="lstep" data-p="1">التالي</button></div>`;return h}
function mind(d){return `<div class="mind"><div class="mc">${esc(info(d.id).l.title)}</div><div class="mb">${d.cards.map(c=>`<span>${esc(c.title)}</span>`).join('')}</div></div>`}
function finishLesson(){const d=L.d,n=L.chk.filter(Boolean).length;let ok=0;L.qs.forEach((q,i)=>{if(L.chk[i]&&isRight(q,L.ans[i]))ok++;const a=P.acc[d.id]||{r:0,t:0};if(L.chk[i]){a.t++;if(isRight(q,L.ans[i]))a.r++}P.acc[d.id]=a});const cok=L.chs&&L.chs.chk[0]&&isRight(L.ch,L.chs.ans[0]);if(n<L.qs.length){toast('أكمل أسئلة «اختبر فهمك» أولًا (الخطوة 5)');L.step=4;render();return}
const pct=Math.round((ok+(cok?1:0))/(L.qs.length+1)*100);const g=addXP('l:'+d.id,10+Math.round(pct/10)*2);P.done[d.id]=Math.max(P.done[d.id]||0,pct);touch();checkBadges();if(pct===100)badge('perfect');save();confetti();beep(880,.25);toast(`أحسنت! أنجزت الدرس (${pct}%)${g?' +'+g+' XP':''}`);go({t:'grade',g:d.grade})}

else if(c==='imp'){Promise.all([...t.files].map(f=>f.text().then(x=>{try{const d=JSON.parse(x);return typeof d.xp==='number'&&d.done?d:null}catch(e){return null}}))).then(r=>{TS_=r.filter(Boolean);render()})}});

let SIM={x:0,y:0,dir:90,size:100,cos:0,say:''};const RUN={id:0,t0:0},KEYS=new Set();
const SBALL={x:150,y:30};
const SCAT={ev:['الأحداث','#E0A800'],mo:['الحركة','#4C97FF'],lo:['الهيئة','#9966FF'],co:['التحكم','#F29A1E']};
const SB={flag:['ev','عند نقر 🏁 العلم الأخضر',[],'h'],click:['ev','عند نقر هذا الكائن',[],'h'],recv:['ev','عندما أتلقى {m}',['m1'],'h'],bcast:['ev','بث {m}',['m1']],
move:['mo','تحرك {n} خطوة',[10]],turn:['mo','استدر ↻ {n} درجة',[15]],point:['mo','اتجه نحو الاتجاه {n}',[90]],goto:['mo','اذهب إلى x: {n} y: {n}',[0,0]],bounce:['mo','ارتد إذا كنت عند الحافة',[]],
say:['lo','قل {t} لمدة {n} ثانية',['مرحبًا',2]],next:['lo','المظهر التالي',[]],size:['lo','اجعل الحجم {n}%',[100]],
wait:['co','انتظر {n} ثانية',[1]],repeat:['co','كرر {n} مرة',[10],'c'],forever:['co','كرر باستمرار',[],'c'],if:['co','إذا {q} ثم',['edge'],'c'],stopall:['co','أوقف الكل',[]]};
const SMSG={m1:'الرسالة 1',m2:'الرسالة 2'},SQ={edge:'ملامس للحافة؟',ball:'ملامس للبالون 🎈؟',k_right:'مفتاح السهم الأيمن مضغوط؟',k_left:'مفتاح السهم الأيسر مضغوط؟',k_up:'مفتاح السهم الأعلى مضغوط؟',k_down:'مفتاح السهم الأسفل مضغوط؟'};
const SCT=[['أنشئ «عند نقر العلم الأخضر» ثم «تحرك» وشغّل البرنامج بالعلم 🏁',s=>s.flags.move],
['استخدم «كرر باستمرار» مع «تحرك» و«ارتد إذا كنت عند الحافة» حتى ترتد القطة',s=>s.flags.bounce],
['استخدم «المظهر التالي» داخل تكرار لتغيير مظهر القطة',s=>s.flags.costume],
['اجعل القطة تقول عبارة بلبنة «قل ... لمدة ... ثانية»',s=>s.flags.say],
['استخدم «إذا مفتاح ... مضغوط؟» ثم اضغط مفتاح السهم أثناء التشغيل لتتحرك القطة',s=>s.flags.keyif],
['استخدم «بث الرسالة 1» و«عندما أتلقى الرسالة 1» ليبدأ مقطع آخر',s=>s.flags.recv],
['استخدم «إذا ملامس للبالون؟» ثم «قل» عندما تلمس القطة البالون 🎈',s=>s.flags.touch]];
const slist=p=>{let l=LAB.script;if(p==='')return l;for(const i of p.split('.').map(Number))l=l[i].c;return l};
const sblk=p=>{const a=p.split('.').map(Number),i=a.pop();let l=LAB.script;for(const k of a)l=l[k].c;return l[i]};
const sctx=p=>{const a=p.split('.').map(Number),i=a.pop();let l=LAB.script;for(const k of a)l=l[k].c;return [l,i]};
function sLabel(b,path){let n=0;const d=SB[b.t];return d[1].replace(/\{(\w)\}/g,(_,k)=>{const i=n++,v=b.a[i],at=`data-c="sarg" data-p="${path}|${i}"`;
if(k==='n')return `<input type="number" class="bi" ${at} value="${esc(String(v))}">`;
if(k==='t')return `<input type="text" class="bi bt" ${at} maxlength="20" value="${esc(String(v))}">`;
if(k==='m')return `<select class="bi" ${at}>${Object.entries(SMSG).map(([a,t])=>`<option value="${a}" ${a===v?'selected':''}>${t}</option>`).join('')}</select>`;
return `<select class="bi" ${at}>${Object.entries(SQ).map(([a,t])=>`<option value="${a}" ${a===v?'selected':''}>${t}</option>`).join('')}</select>`})}
function sStack(list,pre){return list.map((b,i)=>{const p=pre===''?''+i:pre+'.'+i,d=SB[b.t],c=SCAT[d[0]][1],ctl=`<span class="sctl"><button type="button" data-a="sup" data-p="${p}" aria-label="أعلى">▲</button><button type="button" data-a="sdn" data-p="${p}" aria-label="أسفل">▼</button><button type="button" data-a="sdel" data-p="${p}" aria-label="حذف">✕</button></span>`;
if(d[3]==='c')return `<div class="sbc ${LAB.act===p?'act':''}" style="--bc:${c}"><div class="sb" style="background:${c}"><span>${sLabel(b,p)}</span><button type="button" class="sin" data-a="sact" data-p="${p}">${LAB.act===p?'✔ الإضافة هنا':'➕ أضف هنا'}</button>${ctl}</div><div class="sbody">${sStack(b.c,p)||'<small class="note">فارغ</small>'}</div></div>`;
return `<div class="sb ${d[3]==='h'?'hat':''}" style="background:${c}"><span>${sLabel(b,p)}</span>${ctl}</div>`}).join('')}
function sSpriteStyle(){const f=(SIM.dir>180||SIM.dir<0)?-1:1;return `left:${(SIM.x+240)/480*100}%;top:${(180-SIM.y)/360*100}%;font-size:${12*SIM.size/100}cqw;transform:translate(-50%,-50%) scaleX(${f})`}
function scratchHTML(){return `<div class="sstagew"><div class="sstage" id="sstage"><span class="sball" style="left:${(SBALL.x+240)/480*100}%;top:${(180-SBALL.y)/360*100}%">🎈</span><span class="ssp" id="ssprite" style="${sSpriteStyle()}">${SIM.cos?'😺':'🐱'}</span><span class="ssay" id="ssay" ${SIM.say?'':'hidden'}>${esc(SIM.say)}</span></div>
<div class="sctrl"><button type="button" class="cta sm" data-a="srun">🏁 تشغيل</button><button type="button" class="sm" data-a="sstop">⏹ إيقاف</button><button type="button" class="sm" data-a="sclr">🧹 مسح البرنامج</button><button type="button" class="sm" data-a="sex">📋 مثال جاهز</button></div>
<div class="skeys" aria-label="أسهم التحكم"><button type="button" data-sk="k_up">▲</button><button type="button" data-sk="k_left">◀</button><button type="button" data-sk="k_down">▼</button><button type="button" data-sk="k_right">▶</button></div><small class="note" id="spos"></small></div>
<div class="spal"><div class="stabs">${Object.entries(SCAT).map(([k,[n,c]])=>`<button type="button" class="chip ${LAB.cat===k?'on':''}" style="--cc:${c}" data-a="scat" data-p="${k}">${n}</button>`).join('')}</div><div class="spl">${Object.entries(SB).filter(([k,d])=>d[0]===LAB.cat).map(([k,d])=>`<button type="button" class="sb sbp" style="background:${SCAT[d[0]][1]}" data-a="sadd" data-p="${k}">${d[1].replace(/\{\w\}/g,'…')}</button>`).join('')}</div>
<h4>برنامجك ${LAB.act!==''?'<small>(الإضافة داخل لبنة التكرار/الشرط المحددة)</small>':''}</h4>${LAB.act!==''?'<button type="button" class="sm" data-a="sact" data-p="">⬆ أضف في البرنامج الرئيسي</button>':''}<div class="sscript ${LAB.act===''?'act':''}">${LAB.script.length?sStack(LAB.script,''):'<p class="note">اضغط لبنة من القائمة لتضيفها هنا. ابدأ بلبنة من «الأحداث».</p>'}</div></div>`}
function sdraw(){const sp=$('#ssprite');if(!sp)return;sp.setAttribute('style',sSpriteStyle());sp.textContent=SIM.cos?'😺':'🐱';const b=$('#ssay');if(b){b.hidden=!SIM.say;b.textContent=SIM.say;b.style.left=(SIM.x+240)/480*100+'%';b.style.top=((180-SIM.y)/360*100-14)+'%'}const ps=$('#spos');if(ps)ps.textContent=`x: ${Math.round(SIM.x)}   y: ${Math.round(SIM.y)}   الاتجاه: ${Math.round(SIM.dir)}°`}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function sflag(k){if(!LAB.flags[k]){LAB.flags[k]=true;labCheck();wtasks()}}
function sclamp(){SIM.x=Math.max(-210,Math.min(210,SIM.x));SIM.y=Math.max(-152,Math.min(152,SIM.y))}
function scond(q){if(q==='edge')return Math.abs(SIM.x)>=209||Math.abs(SIM.y)>=151;if(q==='ball')return Math.hypot(SIM.x-SBALL.x,SIM.y-SBALL.y)<42;return KEYS.has(q)}
async function sexec(b,id){const a=b.a,n=+a[0]||0;switch(b.t){
case 'move':{const r=SIM.dir*Math.PI/180;SIM.x+=n*Math.sin(r);SIM.y+=n*Math.cos(r);sclamp();sdraw();sflag('move');await sleep(16);break}
case 'turn':SIM.dir+=n;sdraw();await sleep(16);break;
case 'point':SIM.dir=n;sdraw();break;
case 'goto':SIM.x=n;SIM.y=+a[1]||0;sclamp();sdraw();break;
case 'bounce':if(Math.abs(SIM.x)>=209){SIM.dir=-SIM.dir;SIM.x=Math.sign(SIM.x)*208;sflag('bounce')}if(Math.abs(SIM.y)>=151){SIM.dir=180-SIM.dir;SIM.y=Math.sign(SIM.y)*150;sflag('bounce')}SIM.dir=((SIM.dir+180)%360+360)%360-180;sdraw();break;
case 'say':SIM.say=String(a[0]||'');sdraw();if(SIM.say)sflag('say');await sleep(Math.max(0,+a[1]||0)*1000);if(RUN.id===id){SIM.say='';sdraw()}break;
case 'next':SIM.cos=SIM.cos?0:1;sdraw();sflag('costume');await sleep(16);break;
case 'size':SIM.size=Math.max(20,Math.min(300,n||100));sdraw();break;
case 'wait':await sleep(Math.max(0,n)*1000);break;
case 'repeat':for(let i=0;i<Math.min(n,500)&&RUN.id===id;i++){await srunList(b.c,id);await sleep(16)}break;
case 'forever':while(RUN.id===id){await srunList(b.c,id);await sleep(24)}break;
case 'if':if(scond(a[0])){if(a[0].startsWith('k_'))sflag('keyif');if(a[0]==='ball')sflag('touch');await srunList(b.c,id)}break;
case 'bcast':for(const st of sstacks('recv',a[0])){sflag('recv');srunList(st,id)}break;
case 'stopall':RUN.id++;break}}
async function srunList(l,id){for(const b of l){if(RUN.id!==id)return;if(SB[b.t][3]==='h')continue;await sexec(b,id)}}
function sstacks(hat,m){const out=[];let cur=null;for(const b of LAB.script){if(SB[b.t][3]==='h'){cur=(b.t===hat&&(hat!=='recv'||b.a[0]===m))?[]:null;if(cur)out.push(cur)}else if(cur)cur.push(b)}return out}
function srun(hat){const id=++RUN.id;RUN.t0=Date.now();const st=sstacks(hat);if(!st.length){LAB.msg='ابدأ برنامجك بلبنة «عند نقر العلم الأخضر» من فئة الأحداث.';const m=$('.lab2 .why');if(m)m.textContent=LAB.msg;else toast(LAB.msg);return}SIM.say='';st.forEach(s=>srunList(s,id));setTimeout(()=>{if(RUN.id===id&&Date.now()-RUN.t0>=29000)RUN.id++},30000)}
Object.assign(A,{srun:()=>srun('flag'),sstop:()=>{RUN.id++;SIM.say='';sdraw()},sclr:()=>{RUN.id++;LAB.script=[];LAB.act='';SIM.x=0;SIM.y=0;SIM.dir=90;SIM.say='';render()},
sex:()=>{RUN.id++;LAB.script=[{t:'flag',a:[]},{t:'forever',a:[],c:[{t:'move',a:[6]},{t:'bounce',a:[]}]}];LAB.act='';render()},
scat:p=>{LAB.cat=p;render()},sact:p=>{if(p!==undefined&&!(p===''&&0)){LAB.act=p;render()}},
sadd:p=>{RUN.id++;const d=SB[p],b={t:p,a:d[2].slice()};if(d[3]==='c')b.c=[];const l=d[3]==='h'?LAB.script:slist(LAB.act);l.push(b);if(d[3]==='c'&&d[3]!=='h'){}render()},
sdel:p=>{RUN.id++;const [l,i]=sctx(p);l.splice(i,1);if(LAB.act!==''&&!(()=>{try{return !!sblk(LAB.act)}catch(e){return false}})())LAB.act='';render()},
sup:p=>{RUN.id++;const [l,i]=sctx(p);if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];LAB.act=''}render()},sdn:p=>{RUN.id++;const [l,i]=sctx(p);if(i<l.length-1){[l[i+1],l[i]]=[l[i],l[i+1]];LAB.act=''}render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.c==='sarg'&&LAB&&LAB.id==='scratch'){const [p,i]=t.dataset.p.split('|');const b=sblk(p),d=SB[b.t][1];let k=0,type;d.replace(/\{(\w)\}/g,(_,c)=>{if(k++===+i)type=c});b.a[+i]=type==='n'?(t.value===''?0:+t.value):t.value}});
document.addEventListener('keydown',e=>{if(!(V.t==='lab'&&LAB&&LAB.id==='scratch'))return;const m={ArrowRight:'k_right',ArrowLeft:'k_left',ArrowUp:'k_up',ArrowDown:'k_down'}[e.key];if(m&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();KEYS.add(m)}});
